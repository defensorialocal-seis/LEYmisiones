imonio u otro delito","s":"Si las declaraciones ofrecen indicios graves de falso testimonio u otro delito, el Juez puede decretar la detención de los presuntos culpables, remitiéndolos a disposición del Juez competente, a quien se envía también testimonio de lo actuado."},{"n":430,"p":["Cuando no pueden examinarse todos los testigos el día señalado, el Juez puede suspender el acto para continuarlo en los siguientes sin necesidad de nueva citación, expresándolo así en el acta que se extiende."],"t":"Suspensión de la audiencia","s":"Cuando no pueden examinarse todos los testigos el día señalado, el Juez puede suspender el acto para continuarlo en los siguientes sin necesidad de nueva citación, expresándolo así en el acta que se extiende."},{"n":431,"p":["Si el reconocimiento de algún sitio contribuye a la eficacia del testimonio, puede hacerse en él el examen de los testigos."],"t":"Reconocimiento de lugares","s":"Si el reconocimiento de algún sitio contribuye a la eficacia del testimonio, puede hacerse en él el examen de los testigos."},{"n":432,"p":["El Juez puede disponer de oficio la declaración en el carácter de testigos, de personas mencionadas por las partes en los escritos de constitución del proceso o cuando, según resulta de otras pruebas producidas, tienen conocimiento de hechos que pueden gravitar en la decisión de la causa.","Asimismo, puede ordenar que sean examinados nuevamente los ya interrogados, para aclarar sus declaraciones o proceder al careo."],"t":"Prueba de oficio","s":"El Juez puede disponer de oficio la declaración en el carácter de testigos, de personas mencionadas por las partes en los escritos de constitución del proceso o cuando, según resulta de otras pruebas producidas, tienen conocimiento de hechos que pueden gravita"},{"n":433,"p":["En el escrito de ofrecimiento de prueba, la parte que presenta testigos que deben declarar fuera del lugar del juicio, debe acompañar el interrogatorio e indicar los nombres de las personas autorizadas para el trámite del exhorto u oficio, quienes deben ser abogados o procuradores de la matrícula de la jurisdicción del tribunal requerido, excepto cuando por las leyes locales están autorizadas otras personas. Los comisionados pueden sustituir la autorización.","No se debe admitir la prueba si en el escrito no se cumplen dichos requisitos."],"t":"Testigos domiciliados fuera de la jurisdicción del Juzgado","s":"En el escrito de ofrecimiento de prueba, la parte que presenta testigos que deben declarar fuera del lugar del juicio, debe acompañar el interrogatorio e indicar los nombres de las personas autorizadas para el trámite del exhorto u oficio, quienes deben ser ab"},{"n":434,"p":["En el caso del Artículo 433 el interrogatorio queda a disposición de la parte contraria, quien en la oportunidad de contestar la demanda o reconvención puede proponer preguntas. El Juez debe examinar los interrogatorios, pudiendo eliminar las preguntas superfluas y agregar las que considera pertinentes. Asimismo, fijar el plazo dentro del cual la parte que ofrece la prueba debe informar acerca del Juzgado en que queda radicado el exhorto y la fecha de la audiencia, bajo apercibimiento de tenerlo por desistido."],"t":"Depósito y examen de los interrogatorios","s":"En el caso del Artículo 433 el interrogatorio queda a disposición de la parte contraria, quien en la oportunidad de contestar la demanda o reconvención puede proponer preguntas."},{"n":435,"p":["Exceptúase de la obligación de comparecer a prestar declaración a los funcionarios que determina la Reglamentación del Superior Tribunal de Justicia.","Dichos testigos deben declarar por escrito, con la manifestación de que lo hacen bajo juramento o promesa de decir verdad, dentro del plazo que fija el Juzgado, debiendo entenderse que no excede de diez (10) días si no se lo indica especialmente.","La parte contraria a la que ofrece el testigo puede presentar un pliego de preguntas a incluir en el interrogatorio."],"t":"Excepciones a la obligación de comparecer","s":"Exceptúase de la obligación de comparecer a prestar declaración a los funcionarios que determina la Reglamentación del Superior Tribunal de Justicia."},{"n":436,"p":["Dentro del plazo de prueba las partes pueden alegar y probar acerca de la idoneidad de los testigos. El Juez debe apreciar, según las reglas de la sana crítica, en oportunidad de dictar sentencia definitiva, las circunstancias y motivos que corroboran o disminuyen la fuerza de las declaraciones.","SECCIÓN 5.a PRUEBA DE PERITOS"],"t":"Idoneidad de los testigos","s":"Dentro del plazo de prueba las partes pueden alegar y probar acerca de la idoneidad de los testigos."},{"n":437,"p":["Es admisible la prueba pericial cuando la apreciación de los hechos controvertidos requiere conocimientos especiales en alguna ciencia, arte, industria o actividad técnica especializada."],"t":"Procedencia","s":"Es admisible la prueba pericial cuando la apreciación de los hechos controvertidos requiere conocimientos especiales en alguna ciencia, arte, industria o actividad técnica especializada."},{"n":438,"p":["La prueba pericial está a cargo de un perito único designado de oficio por el Juez, salvo cuando una ley especial establece un régimen distinto.","En el juicio por nulidad de testamento, el Juez puede nombrar de oficio tres (3) peritos cuando por la importancia y complejidad del asunto lo considera conveniente.","Si los peritos son tres (3), el Juez les imparte las directivas sobre el modo de proceder para realizar las operaciones tendientes a la producción y presentación del dictamen.","Cada parte tiene la facultad de designar un consultor técnico."],"t":"Perito. Consultores técnicos","s":"La prueba pericial está a cargo de un perito único designado de oficio por el Juez, salvo cuando una ley especial establece un régimen distinto."},{"n":439,"p":["Al ofrecer la prueba pericial se debe indicar la especialización que ha de tener el perito y se proponen los puntos de pericia; si la parte ejerce la facultad de designar consultor técnico, debe indicar su nombre, profesión y domicilio.","La otra parte, al contestar la demanda o la reconvención, puede formular la manifestación a que se refiere el Artículo 458 o, en su caso, proponer otros puntos que a su juicio deben constituir también objeto de la prueba, y observar la procedencia de los mencionados por quien la ofrece; si ejerce la facultad de designar consultor técnico, debe indicar su nombre, profesión y domicilio.","Si se presentan otros puntos de pericia u observa la procedencia de los propuestos por la parte que ofreció la prueba, se debe otorgar traslado a ésta.","Cuando los litisconsortes no concuerdan en la designación del consultor técnico de su parte, el Juzgado debe desinsacular a uno de los propuestos."],"t":"Designación. Puntos de pericia","s":"Al ofrecer la prueba pericial se debe indicar la especialización que ha de tener el perito y se proponen los puntos de pericia; si la parte ejerce la facultad de designar consultor técnico, debe indicar su nombre, profesión y domicilio."},{"n":440,"p":["Contestado el traslado que corresponda según el Artículo 439 o vencido el plazo para hacerlo, en la audiencia prevista en el Artículo 362 el Juez designa el perito y fija los puntos de pericia, pudiendo agregar otros o eliminar los que considera improcedentes o superfluos, y señala el plazo dentro del cual el perito debe cumplir su cometido. Si la resolución no fija dicho plazo se entiende que es de quince (15) días."],"t":"Determinación de los puntos de pericia. Plazo","s":"Contestado el traslado que corresponda según el Artículo 439 o vencido el plazo para hacerlo, en la audiencia prevista en el Artículo 362 el Juez designa el perito y fija los puntos de pericia, pudiendo agregar otros o eliminar los que considera improcedentes "},{"n":441,"p":["El consultor técnico puede ser remplazado por la parte que lo designa; el reemplazante no puede pretender una intervención que importe retrogradar la práctica de la pericia.","Los honorarios del consultor técnico integran la condena en costas."],"t":"Reemplazo del consultor técnico. Honorarios","s":"El consultor técnico puede ser remplazado por la parte que lo designa; el reemplazante no puede pretender una intervención que importe retrogradar la práctica de la pericia. Los honorarios del consultor técnico integran la condena en costas."},{"n":442,"p":["Antes de que el Juez ejerza la facultad que le confiere el Artículo 440, las partes, de común acuerdo, pueden presentar un escrito proponiendo perito y puntos de pericia.","Pueden, asimismo, designar consultores técnicos."],"t":"Acuerdo de partes","s":"Antes de que el Juez ejerza la facultad que le confiere el Artículo 440, las partes, de común acuerdo, pueden presentar un escrito proponiendo perito y puntos de pericia. Pueden, asimismo, designar consultores técnicos."},{"n":443,"p":["Si el perito lo solicita dentro del tercer día de haber aceptado el cargo, y si corresponde por la índole de la pericia, la o las partes que ofrecen la prueba deben depositar la suma que el Juzgado fija para gastos de las diligencias.","Dicho importe debe ser depositado dentro del quinto día, plazo que comienza a correr a partir de la notificación personal o por cédula de la providencia que lo ordena; se entrega al perito, sin perjuicio de lo que en definitiva se resuelve respecto de las costas y del pago de honorarios. La resolución sólo es susceptible de recurso de reposición.","La falta de depósito dentro del plazo importa el desistimiento de la prueba."],"t":"Anticipo de gastos","s":"Si el perito lo solicita dentro del tercer día de haber aceptado el cargo, y si corresponde por la índole de la pericia, la o las partes que ofrecen la prueba deben depositar la suma que el Juzgado fija para gastos de las diligencias."},{"n":444,"p":["Si la profesión está reglamentada, el perito debe tener título habilitante en la ciencia, arte, industria o actividad técnica especializada a que pertenecen las cuestiones acerca de las cuales debe expedirse.","En caso contrario, o cuando no hay en el lugar del proceso perito con título habilitante, puede ser nombrada cualquier persona con conocimientos en la materia."],"t":"Idoneidad","s":"Si la profesión está reglamentada, el perito debe tener título habilitante en la ciencia, arte, industria o actividad técnica especializada a que pertenecen las cuestiones acerca de las cuales debe expedirse."},{"n":445,"p":["El perito puede ser recusado por justa causa, dentro del quinto día de la audiencia preliminar."],"t":"Recusación","s":"El perito puede ser recusado por justa causa, dentro del quinto día de la audiencia preliminar."},{"n":446,"p":["Son causas de recusación del perito las previstas respecto de los jueces; también, la falta de título o incompetencia en la materia de que se trata, en el supuesto del Artículo 444, segundo párrafo."],"t":"Causales","s":"Son causas de recusación del perito las previstas respecto de los jueces; también, la falta de título o incompetencia en la materia de que se trata, en el supuesto del Artículo 444, segundo párrafo."},{"n":447,"p":["Deducida la recusación se hace saber al perito para que en el acto de la notificación o dentro del tercer día manifieste si es o no cierta la causal. Reconocido el hecho o guardado silencio, debe ser remplazado; si se lo niega, el incidente tramita por separado, sin interrumpir el curso del proceso.","De la resolución no hay recurso pero esta circunstancia puede ser considerada por la alzada al resolver sobre lo principal."],"t":"Trámite. Resolución","s":"Deducida la recusación se hace saber al perito para que en el acto de la notificación o dentro del tercer día manifieste si es o no cierta la causal."},{"n":448,"p":["En caso de ser admitida la recusación, el Juez, de oficio, debe remplazar al perito recusado, sin otra sustanciación."],"t":"Reemplazo","s":"En caso de ser admitida la recusación, el Juez, de oficio, debe remplazar al perito recusado, sin otra sustanciación."},{"n":449,"p":["El perito acepta el cargo ante el Oficial Primero, dentro del tercer día de notificado de su designación; en el caso de no tener título habilitante, bajo juramento o promesa de desempeñar fielmente el cargo. Se lo cita por cédula u otro medio autorizado por este Código.","Si el perito no acepta, o no concurre dentro del plazo fijado, el Juez debe nombrar otro en su remplazo, de oficio y sin otro trámite.","La Cámara determina el plazo durante el cual quedan excluidos de la lista los peritos que reiterada o injustificadamente se niegan a aceptar el cargo, o incurran en la situación prevista por el Artículo 450.","El Superior Tribunal de Justicia puede arbitrar medios alternativos para llevar adelantes las pericias."],"t":"Aceptación del cargo","s":"El perito acepta el cargo ante el Oficial Primero, dentro del tercer día de notificado de su designación; en el caso de no tener título habilitante, bajo juramento o promesa de desempeñar fielmente el cargo."},{"n":450,"p":["Debe ser removido el perito que, después de haber aceptado el cargo, renuncia sin motivo atendible, rehúsa dar su dictamen o no lo presenta oportunamente. El Juez, de oficio, debe nombrar otro en su lugar y lo condena a pagar los gastos de las diligencias frustradas y los daños y perjuicios ocasionados a las partes, si éstas los reclaman. El remplazado pierde el derecho a cobrar honorarios."],"t":"Remoción","s":"Debe ser removido el perito que, después de haber aceptado el cargo, renuncia sin motivo atendible, rehúsa dar su dictamen o no lo presenta oportunamente."},{"n":451,"p":["La pericia está cargo del perito designado por el Juez.","Los consultores técnicos, las partes y sus letrados pueden presenciar las operaciones técnicas que se realiza y formular las observaciones que consideran pertinentes."],"t":"Práctica de la pericia","s":"La pericia está cargo del perito designado por el Juez. Los consultores técnicos, las partes y sus letrados pueden presenciar las operaciones técnicas que se realiza y formular las observaciones que consideran pertinentes."},{"n":452,"p":["El perito debe presentar su dictamen por escrito, con copias para las partes. Debe contener la explicación detallada de las operaciones técnicas realizadas y de los principios científicos en que se funda.","Los consultores técnicos de las partes dentro del plazo fijado al perito pueden presentar por separado sus respectivos informes, cumpliendo los mismos requisitos."],"t":"Presentación del dictamen","s":"El perito debe presentar su dictamen por escrito, con copias para las partes. Debe contener la explicación detallada de las operaciones técnicas realizadas y de los principios científicos en que se funda."},{"n":453,"p":["Nueva pericia. Del dictamen del perito se debe dar traslado a las partes, que se notifica por cédula. De oficio o a instancia de cualquiera de ellas, el Juez puede ordenar que el perito dé las explicaciones que se consideran convenientes, en audiencia o por escrito, atendiendo a las circunstancias del caso.","Si el acto se cumple en audiencia y los consultores técnicos están presentes, con autorización del Juez, pueden observar lo que sea pertinente; si no comparecen esa facultad puede ser ejercida por los letrados.","Si las explicaciones deben presentarse por escrito, las observaciones a las dadas por el perito pueden ser formuladas por los consultores técnicos o, en su defecto, por las partes dentro de quinto día de notificadas por ministerio de la ley. La falta de impugnaciones o pedidos de explicaciones u observaciones a las explicaciones que dé el perito, no es óbice para que la eficacia probatoria del dictamen pueda ser cuestionada por los letrados hasta la oportunidad de alegar con arreglo a lo dispuesto por el Artículo 457.","Cuando el Juez lo estima necesario puede disponer que se practique otra pericia, o se perfeccione o amplíe la anterior, por el mismo perito u otro de su elección.","El perito que no concurre a la audiencia o no presenta el informe ampliatorio o complementario dentro del plazo, pierde su derecho a cobrar honorarios, total o parcialmente."],"t":"Traslado. Explicaciones","s":"Nueva pericia. Del dictamen del perito se debe dar traslado a las partes, que se notifica por cédula."},{"n":454,"p":["Cuando el objeto de la diligencia pericial es de tal naturaleza que permite al perito dictaminar inmediatamente, puede dar su informe por escrito o en audiencia; en el mismo acto los consultores técnicos pueden formular las observaciones pertinentes."],"t":"Dictamen inmediato","s":"Cuando el objeto de la diligencia pericial es de tal naturaleza que permite al perito dictaminar inmediatamente, puede dar su informe por escrito o en audiencia; en el mismo acto los consultores técnicos pueden formular las observaciones pertinentes."},{"n":455,"p":["Reconstrucción de los hechos. De oficio o a pedido de parte, el Juez puede ordenar:","1) ejecución de planos, relevamientos, reproducciones fotográficas, cinematográficas, o de otra especie, de objetos, documentos o lugares, con empleo de medios o instrumentos técnicos;","2) exámenes científicos necesarios para el mejor esclarecimiento de los hechos controvertidos;","3) reconstrucción de hechos, para comprobar si se produjeron o pudieron realizarse de una manera determinada.","A estos efectos puede disponer que comparezcan el perito y los testigos y hacer saber a las partes que pueden designar consultores técnicos o hacer comparecer a los ya designados para que participen en las tareas, en los términos de los Artículos 451 y, en su caso, 453."],"t":"Planos. Exámenes científicos","s":"Reconstrucción de los hechos. De oficio o a pedido de parte, el Juez puede ordenar:"},{"n":456,"p":["A petición de parte o de oficio, el Juez puede requerir opinión a universidades, academias, corporaciones, institutos y entidades públicas o privadas de carácter científico o técnico, cuando el dictamen pericial requiere operaciones o conocimientos de alta especialización."],"t":"Consultas científicas o técnicas","s":"A petición de parte o de oficio, el Juez puede requerir opinión a universidades, academias, corporaciones, institutos y entidades públicas o privadas de carácter científico o técnico, cuando el dictamen pericial requiere operaciones o conocimientos de alta esp"},{"n":457,"p":["La fuerza probatoria del dictamen pericial es estimada por el Juez teniendo en cuenta la competencia del perito, los principios científicos o técnicos en que se funda, la concordancia de su aplicación con las reglas de la sana crítica, las observaciones formuladas por los consultores técnicos o los letrados, conforme a los Artículos 453 y 454 y los demás elementos de convicción que la causa ofrece."],"t":"Eficacia probatoria del dictamen","s":"La fuerza probatoria del dictamen pericial es estimada por el Juez teniendo en cuenta la competencia del perito, los principios científicos o técnicos en que se funda, la concordancia de su aplicación con las reglas de la sana crítica, las observaciones formul"},{"n":458,"p":["Cargo de los gastos y honorarios. Al contestar el traslado a que se refiere el Artículo 439, segundo párrafo, la parte contraria a la que ofrece la prueba pericial puede:","1) impugnar su procedencia por no corresponder conforme a lo dispuesto en el Artículo 437; si no obstante haber sido declarada procedente, de la sentencia resulta que no constituyó uno de los elementos de convicción coadyuvante para la decisión, los gastos y honorarios del perito y consultores técnicos son a cargo de la parte que propuso la pericia;","2) manifestar que no tiene interés en la pericia, y que se abstiene, por tal razón, de participar en ella; en este caso, los gastos y honorarios del perito y consultor técnico son siempre a cargo de quien la solicita, excepto cuando para resolver a su favor se hace mérito de aquélla.","Los jueces deben regular los honorarios de los peritos y demás auxiliares de la justicia, conforme a los respectivos aranceles, debiendo adecuarlos, por debajo de sus topes mínimos inclusive, a las regulaciones que se practican en favor de los restantes profesionales intervinientes, ponderando la naturaleza, complejidad, calidad y extensión en el tiempo de los respectivos trabajos.","SECCIÓN 6.a RECONOCIMIENTO JUDICIAL"],"t":"Impugnación. Desinterés","s":"Cargo de los gastos y honorarios. Al contestar el traslado a que se refiere el Artículo 439, segundo párrafo, la parte contraria a la que ofrece la prueba pericial puede:"},{"n":459,"p":["El Juez o Tribunal puede ordenar, de oficio o a pedido de parte:","1) el reconocimiento judicial de lugares o de cosas;","2) la concurrencia de peritos y testigos a dicho acto;","3) las medidas previstas en el Artículo 455.","Al decretar el examen se debe individualizar lo que debe constituir su objeto y determinar el lugar, fecha y hora en que se realizará. Si hay urgencia, la notificación se debe hacer de oficio y con un día de anticipación."],"t":"Medidas admisibles","s":"El Juez o Tribunal puede ordenar, de oficio o a pedido de parte: 1) el reconocimiento judicial de lugares o de cosas; 2) la concurrencia de peritos y testigos a dicho acto; 3) las medidas previstas en el Artículo 455."},{"n":460,"p":["A la diligencia debe asistir el Juez o los miembros del tribunal que éste determina. Las partes pueden concurrir con sus representantes y letrados y formular las observaciones pertinentes, de las que se debe dejar constancia en acta.","SECCIÓN 7.a CONCLUSIÓN DE LA CAUSA PARA DEFINITIVA"],"t":"Forma de la diligencia","s":"A la diligencia debe asistir el Juez o los miembros del tribunal que éste determina. Las partes pueden concurrir con sus representantes y letrados y formular las observaciones pertinentes, de las que se debe dejar constancia en acta."},{"n":461,"p":["Cuando no hay mérito para recibir la causa a prueba, debe procederse con arreglo a lo establecido en el Artículo 361."],"t":"Alternativa","s":"Cuando no hay mérito para recibir la causa a prueba, debe procederse con arreglo a lo establecido en el Artículo 361."},{"n":462,"p":["Producida la prueba, el Oficial Primero, sin necesidad de gestión alguna de los interesados, o sin sustanciarla si se hace, debe ordenar que se agregue al expediente.","Cumplido este trámite, el Oficial Primero pone los autos en Secretaría para alegar; esta providencia se notifica personalmente o por cédula y una vez firme se debe entregar el expediente a los letrados por su orden y por el plazo de seis (6) días a cada uno, sin necesidad de petición escrita y bajo su responsabilidad, para que presenten, si lo creen conveniente, el escrito alegando sobre el mérito de la prueba.","Se considera como una sola parte a quienes actúan bajo representación común.","Transcurrido el plazo sin que el expediente sea devuelto, la parte que lo retiene pierde el derecho de alegar sin que se requiera intimación.","El plazo para presentar el alegato es común."],"t":"Agregación de las pruebas. Alegatos","s":"Producida la prueba, el Oficial Primero, sin necesidad de gestión alguna de los interesados, o sin sustanciarla si se hace, debe ordenar que se agregue al expediente."},{"n":463,"p":["Firme que quede la resolución que decide la cuestión como de puro derecho o transcurrido el plazo fijado en el Artículo 462, el Secretario, sin petición de parte, debe poner el expediente a despacho agregando los alegatos si se presentaron. El Juez, acto continuo, debe llamar autos para sentencia."],"t":"Llamamiento de autos","s":"Firme que quede la resolución que decide la cuestión como de puro derecho o transcurrido el plazo fijado en el Artículo 462, el Secretario, sin petición de parte, debe poner el expediente a despacho agregando los alegatos si se presentaron."},{"n":464,"p":["Desde el llamamiento de autos queda cerrada toda discusión y no pueden presentarse más escritos ni producirse más pruebas, salvo las que el Juez disponga en los términos del Artículo 36, inciso 4). Estas deben ser ordenadas en un solo acto."],"t":"Efectos del llamamiento de autos","s":"Desde el llamamiento de autos queda cerrada toda discusión y no pueden presentarse más escritos ni producirse más pruebas, salvo las que el Juez disponga en los términos del Artículo 36, inciso 4). Estas deben ser ordenadas en un solo acto."},{"n":465,"p":["La sentencia debe ser notificada de oficio, dentro del tercer día. En la cédula se transcribe la parte dispositiva. Al litigante que lo pide, se le entrega una (1) copia simple de la sentencia, firmada por el Secretario o por el Oficial Primero."],"t":"Notificación de la sentencia","s":"La sentencia debe ser notificada de oficio, dentro del tercer día. En la cédula se transcribe la parte dispositiva. Al litigante que lo pide, se le entrega una (1) copia simple de la sentencia, firmada por el Secretario o por el Oficial Primero."},{"n":466,"p":["En los casos en que se promueve juicio sumarísimo, presentada la demanda, el Juez, teniendo en cuenta la naturaleza de la cuestión y la prueba ofrecida, debe resolver de oficio y como primera providencia si corresponde que la controversia se sustancie por esta clase de proceso. Si así lo decide, el trámite se debe ajustar a lo establecido para el proceso ordinario, con estas modificaciones:","1) no son admisibles excepciones de previo y especial pronunciamiento, ni reconvención;","2) todos los plazos son de tres (3) días, con excepción del de contestación de la demanda, y el otorgado para fundar la apelación y contestar el traslado del memorial, que son de cinco (5) días;","3) cumplidos los actos contemplados en el Artículo 360, se procede según corresponda conforme lo establecido en el primer o segundo párrafo del Artículo 361. La audiencia prevista en el Artículo 362 debe ser señalada dentro de los diez (10) días de cumplidos con los actos contemplados en el Artículo 360;","4) no procede la presentación de alegatos;","5) sólo son apelables la sentencia definitiva y las providencias que decretan o deniegan medidas precautorias. La apelación se concede en relación, en efecto devolutivo, salvo cuando el cumplimiento de la sentencia pueda ocasionar un perjuicio irreparable en cuyo caso se debe otorgar en efecto suspensivo;","6) en el supuesto del Artículo 323; inciso 2), la demanda rechazada, únicamente puede reproducirse si tiene lugar un nuevo acto, cuya reparación no puede obtenerse por vía de ejecución de sentencia."],"t":"Trámite","s":"En los casos en que se promueve juicio sumarísimo, presentada la demanda, el Juez, teniendo en cuenta la naturaleza de la cuestión y la prueba ofrecida, debe resolver de oficio y como primera providencia si corresponde que la controversia se sustancie por esta"},{"n":467,"p":["Consentida o ejecutoriada la sentencia de un Tribunal judicial o arbitral y vencido el plazo fijado para su cumplimiento, se procede a ejecutarla, a instancia de parte, de conformidad con las reglas que se establecen en este capítulo.","Puede ejecutarse parcialmente la sentencia aunque se haya interpuesto recurso ordinario o extraordinario contra ella, por los importes correspondientes a la parte de la condena que quedó firme. El título ejecutorio consiste, en este caso, en un testimonio que debe expresar que recayó sentencia firme respecto del rubro que se pretende ejecutar por haber sido consentido.","Si existe duda acerca de la existencia de ese requisito se debe denegar el testimonio; la resolución del Juez que lo acuerda o, en su caso, lo deniega, es irrecurrible."],"t":"Resoluciones ejecutables","s":"Consentida o ejecutoriada la sentencia de un Tribunal judicial o arbitral y vencido el plazo fijado para su cumplimiento, se procede a ejecutarla, a instancia de parte, de conformidad con las reglas que se establecen en este capítulo."},{"n":468,"p":["Las disposiciones de este título son asimismo aplicables:","1) a la ejecución de transacciones o acuerdos homologados;","2) a la ejecución de multas procesales;","3) al cobro de honorarios regulados en concepto de costas."],"t":"Aplicación a otros títulos ejecutables","s":"Las disposiciones de este título son asimismo aplicables: 1) a la ejecución de transacciones o acuerdos homologados; 2) a la ejecución de multas procesales; 3) al cobro de honorarios regulados en concepto de costas."},{"n":469,"p":["Es Juez competente para la ejecución:","1) el que pronunció la sentencia;","2) el de otra competencia territorial si así lo impone el objeto de la ejecución, total o parcialmente;","3) el que intervino en el proceso principal si media conexión directa entre causas sucesivas."],"t":"Competencia","s":"Es Juez competente para la ejecución: 1) el que pronunció la sentencia; 2) el de otra competencia territorial si así lo impone el objeto de la ejecución, total o parcialmente;"},{"n":470,"p":["Si la sentencia contiene condena al pago de cantidad líquida y determinada o hay liquidación aprobada, a instancia de parte se procede al embargo de bienes, de conformidad con las normas establecidas para el juicio ejecutivo.","Se entiende que hay condena al pago de cantidad líquida siempre que de la sentencia se infiera el monto de la liquidación, aún cuando aquél no esté expresado numéricamente.","Si la sentencia condena a una misma parte al pago de una cantidad líquida y de otra ilíquida, puede procederse a la ejecución de la primera sin esperar a que se liquide la segunda."],"t":"Suma líquida. Embargo","s":"Si la sentencia contiene condena al pago de cantidad líquida y determinada o hay liquidación aprobada, a instancia de parte se procede al embargo de bienes, de conformidad con las normas establecidas para el juicio ejecutivo."},{"n":471,"p":["Cuando la sentencia condena al pago de cantidad ilíquida y el vencedor no presenta la liquidación, dentro de diez (10) días contados desde que aquélla es ejecutable, puede hacerlo el vencido. En ambos casos se procede de conformidad con las bases que en la sentencia se fijan.","Presentada la liquidación se da traslado a la otra parte por cinco (5) días."],"t":"Liquidación","s":"Cuando la sentencia condena al pago de cantidad ilíquida y el vencedor no presenta la liquidación, dentro de diez (10) días contados desde que aquélla es ejecutable, puede hacerlo el vencido."},{"n":472,"p":["Expresada la conformidad por el deudor, o transcurrido el plazo sin que se conteste el traslado, se procede a la ejecución por la suma que resulta, en la forma prescripta por el Artículo 470.","Si media impugnación se aplican las normas establecidas para los incidentes en los Artículos 179 y siguientes.","Sin perjuicio de lo dispuesto en este artículo y en los Artículos 470 y 471, el acreedor puede solicitar se intime por cédula al ejecutado el pago de lo adeudado, cuando se trate de cantidad líquida y determinada o hay liquidación aprobada."],"t":"Conformidad. Objeciones","s":"Expresada la conformidad por el deudor, o transcurrido el plazo sin que se conteste el traslado, se procede a la ejecución por la suma que resulta, en la forma prescripta por el Artículo 470."},{"n":473,"p":["Trabado el embargo se cita al deudor para la venta de los bienes embargados. Las excepciones deben oponerlas y probarlas dentro del quinto día."],"t":"Citación de venta","s":"Trabado el embargo se cita al deudor para la venta de los bienes embargados. Las excepciones deben oponerlas y probarlas dentro del quinto día."},{"n":474,"p":["Sólo se consideran legítimas las siguientes excepciones:","1) falsedad de la ejecutoria;","2) prescripción de la ejecutoria;","3) pago;","4) quita, espera o remisión."],"t":"Excepciones","s":"Sólo se consideran legítimas las siguientes excepciones: 1) falsedad de la ejecutoria; 2) prescripción de la ejecutoria; 3) pago; 4) quita, espera o remisión."},{"n":475,"p":["Las excepciones deben fundarse en hechos posteriores a la sentencia o laudo. Se prueban por las constancias del juicio o por documentos emanados del ejecutante que se deben acompañar al deducirlas, con exclusión de todo otro medio probatorio.","Si no se acompañan los documentos, el Juez debe rechazar la excepción sin sustanciarla. La resolución es irrecurrible."],"t":"Prueba","s":"Las excepciones deben fundarse en hechos posteriores a la sentencia o laudo. Se prueban por las constancias del juicio o por documentos emanados del ejecutante que se deben acompañar al deducirlas, con exclusión de todo otro medio probatorio."},{"n":476,"p":["Vencidos los cinco (5) días sin que se deduzca oposición, se manda continuar la ejecución sin recurso alguno.","Si se dedujo oposición, el Juez, previo traslado al ejecutante por cinco (5) días, debe mandar continuar la ejecución, o si declara procedente la excepción opuesta, debe levantar el embargo."],"t":"Resolución","s":"Vencidos los cinco (5) días sin que se deduzca oposición, se manda continuar la ejecución sin recurso alguno."},{"n":477,"p":["La resolución que desestima las excepciones es apelable en efecto devolutivo, siempre que el ejecutante dé fianza o caución suficiente.","Todas las apelaciones que son admisibles en las diligencias para la ejecución de la sentencia, se conceden en efecto diferido."],"t":"Recursos","s":"La resolución que desestima las excepciones es apelable en efecto devolutivo, siempre que el ejecutante dé fianza o caución suficiente."},{"n":478,"p":["Consentida o ejecutoriada la resolución que manda llevar adelante la ejecución, se procede según las reglas establecidas para el cumplimiento de la sentencia de remate, hasta hacerse pago al acreedor."],"t":"Cumplimiento","s":"Consentida o ejecutoriada la resolución que manda llevar adelante la ejecución, se procede según las reglas establecidas para el cumplimiento de la sentencia de remate, hasta hacerse pago al acreedor."},{"n":479,"p":["A pedido de parte el Juez debe establecer las modalidades de la ejecución o ampliar o adecuar las que contiene la sentencia, dentro de los límites de ésta."],"t":"Adecuación de la ejecución","s":"A pedido de parte el Juez debe establecer las modalidades de la ejecución o ampliar o adecuar las que contiene la sentencia, dentro de los límites de ésta."},{"n":480,"p":["La sentencia que condena al otorgamiento de escritura pública, debe contener el apercibimiento de que si el obligado no cumple dentro del plazo fijado, el Juez la suscribe por él y a su costa.","La escritura se otorga ante el registro del escribano que propone el ejecutante, si aquél no está designado en el contrato.","El Juez debe ordenar las medidas complementarias que corresponden."],"t":"Condena a escriturar","s":"La sentencia que condena al otorgamiento de escritura pública, debe contener el apercibimiento de que si el obligado no cumple dentro del plazo fijado, el Juez la suscribe por él y a su costa."},{"n":481,"p":["En caso de que la sentencia contenga condena a hacer alguna cosa, si la parte no cumple con lo que se le ordena para su ejecución dentro del plazo señalado por el Juez, se hace a su costa o se le obliga a resarcir los daños y perjuicios provenientes de la inejecución, a elección del acreedor.","Pueden imponerse las sanciones conminatorias que autoriza el Artículo 37.","La obligación se debe resolver también en la forma que establece este artículo, cuando no sea posible el cumplimiento por el deudor.","Para hacer efectiva la indemnización se aplican las reglas establecidas según que la sentencia fije o no su monto para el caso de inejecución.","La determinación del monto de los daños tramita ante el mismo Juez por las normas de los Artículos 471 y 472, o por el tipo de juicio que según aquél lo establece. La resolución es irrecurrible."],"t":"Condena a hacer","s":"En caso de que la sentencia contenga condena a hacer alguna cosa, si la parte no cumple con lo que se le ordena para su ejecución dentro del plazo señalado por el Juez, se hace a su costa o se le obliga a resarcir los daños y perjuicios provenientes de la inej"},{"n":482,"p":["Si la sentencia condena a no hacer alguna cosa, y el obligado la quebranta, el acreedor tiene opción para pedir que se repongan las cosas al estado en que se hallaban, si es posible, y a costa del deudor, o que se le indemnicen los daños y perjuicios, conforme a lo prescripto en el Artículo 481."],"t":"Condena a no hacer","s":"Si la sentencia condena a no hacer alguna cosa, y el obligado la quebranta, el acreedor tiene opción para pedir que se repongan las cosas al estado en que se hallaban, si es posible, y a costa del deudor, o que se le indemnicen los daños y perjuicios, conforme"},{"n":483,"p":["Cuando la condena es de entregar alguna cosa, se debe librar mandamiento para desapoderar de ella al vencido, quien puede oponer las excepciones a que se refiere el Artículo 474, en lo pertinente. Si la condena no puede cumplirse, se le obliga a la entrega del equivalente de su valor, previa determinación si es necesaria, con los daños y perjuicios a que haya lugar. La fijación de su monto se hace ante el mismo Juez, por las normas de los Artículos 471 o 472 o por el tipo de juicio, según aquél lo establece. La resolución es irrecurrible."],"t":"Condena a entregar cosas","s":"Cuando la condena es de entregar alguna cosa, se debe librar mandamiento para desapoderar de ella al vencido, quien puede oponer las excepciones a que se refiere el Artículo 474, en lo pertinente."},{"n":484,"p":["Siempre que las liquidaciones o cuentas sean muy complicadas y de lenta y difícil justificación o requieran conocimientos especiales, deben ser sometidas a la decisión de peritos árbitros o, si hay conformidad de partes, a la de amigables componedores.","La liquidación de sociedades, incluida la determinación del carácter propio o ganancial de los bienes de la sociedad conyugal, impuesta por sentencia, se sustancia por juicio ordinario o incidente, según lo establece el Juez de acuerdo con las modalidades de la causa."],"t":"Liquidación en casos especiales","s":"Siempre que las liquidaciones o cuentas sean muy complicadas y de lenta y difícil justificación o requieran conocimientos especiales, deben ser sometidas a la decisión de peritos árbitros o, si hay conformidad de partes, a la de amigables componedores."},{"n":485,"p":["Las sentencias de tribunales extranjeros tienen fuerza ejecutoria en los términos de los tratados celebrados con el país de que provienen.","Cuando no haya tratados, son ejecutables si concurren los siguientes requisitos:","1) que la sentencia, con autoridad de cosa juzgada en el Estado en que se pronunció, emane de Tribunal competente según las normas argentinas de jurisdicción internacional y sea consecuencia del ejercicio de una acción personal o de una acción real sobre un bien mueble, si éste fue trasladado a la República durante o después del juicio tramitado en el extranjero;","2) que la parte demandada contra la que se pretende ejecutar la sentencia sea personalmente citada y se garantice su defensa;","3) que la sentencia reúna los requisitos necesarios para ser considerada como tal en el lugar en que fue dictada y las condiciones de autenticidad exigidas por la ley nacional;","4) que la sentencia no afecte los principios de orden público del derecho argentino;","5) que la sentencia no sea incompatible con otra pronunciada, con anterioridad o simultáneamente, por un tribunal argentino."],"t":"Conversión en título ejecutorio","s":"Las sentencias de tribunales extranjeros tienen fuerza ejecutoria en los términos de los tratados celebrados con el país de que provienen. Cuando no haya tratados, son ejecutables si concurren los siguientes requisitos:"},{"n":486,"p":["Sustanciación. La ejecución de la sentencia dictada por un tribunal extranjero se pide ante el Juez de primera instancia que corresponde, acompañando su testimonio legalizado y traducido y de las actuaciones que acreditan que quedó ejecutoriada y que se cumplieron los demás requisitos, si no resultan de la sentencia misma.","Para el trámite del exequátur se aplican las normas de los incidentes.","Si se dispone la ejecución, se procede en la forma establecida para las sentencias pronunciadas por tribunales argentinos."],"t":"Competencia. Recaudos","s":"Sustanciación."},{"n":487,"p":["Cuando en juicio se invoca la autoridad de una sentencia extranjera, ésta sólo tiene eficacia si reúne los requisitos del Artículo 485."],"t":"Eficacia de sentencia extranjera","s":"Cuando en juicio se invoca la autoridad de una sentencia extranjera, ésta sólo tiene eficacia si reúne los requisitos del Artículo 485."},{"n":488,"p":["Los laudos pronunciados por tribunales arbitrales extranjeros pueden ser ejecutados por el procedimiento establecido en los Artículos anteriores, siempre que:","1) se cumplan los recaudos del Artículo 485, en lo pertinente y, en su caso, la prórroga de jurisdicción sea admisible en los términos del Artículo 1;","2) las cuestiones que constituyeron el objeto del compromiso no se encuentren excluidas del arbitraje conforme a lo establecido por el Artículo 784."],"t":"Laudos de tribunales arbitrales extranjeros","s":"Los laudos pronunciados por tribunales arbitrales extranjeros pueden ser ejecutados por el procedimiento establecido en los Artículos anteriores, siempre que:"},{"n":489,"p":["Se procede ejecutivamente siempre que en virtud de un título que trae aparejada ejecución, se demanda por obligación exigible de dar cantidades líquidas de dinero, o fácilmente liquidables.","Si la obligación está subordinada a condición o prestación, la vía ejecutiva procede si del título o de otro instrumento público o privado reconocido que se presenta junto con aquél, o de la diligencia prevista en el Artículo 494, inciso 4), resulta que se cumplió la condición o prestación.","Si la obligación es en moneda extranjera, la ejecución debe promoverse por el equivalente en moneda nacional, según la cotización del banco oficial que corresponde al día de la iniciación o la que las partes convinieron, sin perjuicio del reajuste que puede corresponder al día del pago."],"t":"Procedencia","s":"Se procede ejecutivamente siempre que en virtud de un título que trae aparejada ejecución, se demanda por obligación exigible de dar cantidades líquidas de dinero, o fácilmente liquidables."},{"n":490,"p":["Si, en los casos en que por este Código, corresponde un proceso de ejecución, el actor opta por uno de conocimiento y hay oposición del demandado, el Juez, atendiendo a las circunstancias del caso, debe resolver cuál es la clase de proceso aplicable."],"t":"Opción por proceso de conocimiento","s":"Si, en los casos en que por este Código, corresponde un proceso de ejecución, el actor opta por uno de conocimiento y hay oposición del demandado, el Juez, atendiendo a las circunstancias del caso, debe resolver cuál es la clase de proceso aplicable."},{"n":491,"p":["Si del título ejecutivo resulta una deuda de cantidad líquida y otra que es ilíquida, puede procederse ejecutivamente respecto de la primera."],"t":"Deuda parcialmente líquida","s":"Si del título ejecutivo resulta una deuda de cantidad líquida y otra que es ilíquida, puede procederse ejecutivamente respecto de la primera."},{"n":492,"p":["Los títulos que traen aparejada ejecución son los siguientes:","1) el instrumento público presentado en forma;","2) el instrumento privado suscrito por el obligado reconocido judicialmente o cuya firma está certificada por notario con intervención del obligado;","3) la confesión de deuda líquida y exigible prestada ante el Juez competente para conocer en la ejecución;","4) la cuenta aprobada o reconocida como consecuencia del procedimiento establecido en el Artículo 494; la letra de cambio, factura de crédito, vale o pagaré, el cheque y la constancia del saldo deudor de cuenta corriente bancaria, cuando tienen fuerza ejecutiva de conformidad con las disposiciones del Código Civil y Comercial de la Nación o ley especial;","5) el crédito por alquileres o arrendamientos de inmuebles;","6) los demás títulos que tienen fuerza ejecutiva por ley y no están sujetos a un procedimiento especial."],"t":"Títulos ejecutivos","s":"Los títulos que traen aparejada ejecución son los siguientes: 1) el instrumento público presentado en forma; 2) el instrumento privado suscrito por el obligado reconocido judicialmente o cuya firma está certificada por notario con intervención del obligado;"},{"n":493,"p":["Constituye título ejecutivo el crédito por expensas comunes de edificios sujetos al régimen de propiedad horizontal.","Con el escrito de promoción de la ejecución deben acompañarse certificados de deuda que reúnan los requisitos exigidos por el reglamento de copropiedad. Si éste no los previó debe agregarse constancia de la deuda líquida y exigible y del plazo concedido a los copropietarios para abonarla, expedida por el administrador o quien haga sus veces."],"t":"Crédito por expensas comunes","s":"Constituye título ejecutivo el crédito por expensas comunes de edificios sujetos al régimen de propiedad horizontal."},{"n":494,"p":["Puede prepararse la acción ejecutiva, pidiendo previamente:","1) que sean reconocidos los documentos que por sí solos no traen aparejada ejecución;","2) que en la ejecución por alquileres o arrendamientos, el demandado manifieste previamente si es locatario o arrendatario y, en caso afirmativo, exhiba el último recibo. Si el requerido niega categóricamente ser inquilino y su condición de tal no puede probarse sumariamente en forma indubitada, no procede la vía ejecutiva y el pago del crédito debe ser reclamado por juicio ordinario. Si durante la sustanciación de éste se prueba el carácter de inquilino, en la sentencia se le debe imponer una multa a favor de la otra parte equivalente al treinta por ciento (30%) del monto de la deuda;","3) que el Juez señale el plazo dentro del cual debe hacerse el pago, si el acto constitutivo de la obligación no lo designa o si autoriza al deudor para realizarlo cuando pueda o tenga medios para hacerlo. El Juez debe dar traslado y resolver sin más trámite ni recurso alguno;","4) que el deudor reconozca el cumplimiento de la condición, si la deuda es condicional."],"t":"Preparación de la vía ejecutiva","s":"Puede prepararse la acción ejecutiva, pidiendo previamente: 1) que sean reconocidos los documentos que por sí solos no traen aparejada ejecución;"},{"n":495,"p":["La citación al demandado para que efectúe el reconocimiento de su firma se hace en la forma prescripta en los Artículos 340 y 341, bajo apercibimiento de que si no comparece o no contesta categóricamente, se tiene por reconocido el documento, o por confesados los hechos en los demás casos.","El citado debe comparecer personalmente y formular la manifestación ante el Juez. Dicha manifestación no puede ser reemplazada por un escrito; tampoco puede formularse por medio de gestor.","Si el citado no comparece, o no prueba justa causa de inasistencia, se hace efectivo inexcusablemente el apercibimiento y se procede como si el documento fue reconocido por el deudor personalmente, o confesó los hechos, en los demás casos.","El desconocimiento de la firma por alguno de los coejecutados no impide que se cumpla con lo dispuesto por los Artículos 500 y 511 respecto de los deudores que la reconocieron, o a quienes se los tuvo por reconocida."],"t":"Citación del deudor","s":"La citación al demandado para que efectúe el reconocimiento de su firma se hace en la forma prescripta en los Artículos 340 y 341, bajo apercibimiento de que si no comparece o no contesta categóricamente, se tiene por reconocido el documento, o por confesados "},{"n":496,"p":["Reconocida la firma del instrumento queda preparada la acción ejecutiva, aunque se niegue su contenido."],"t":"Efectos del reconocimiento de la firma","s":"Reconocida la firma del instrumento queda preparada la acción ejecutiva, aunque se niegue su contenido."},{"n":497,"p":["Si el documento no es reconocido, el Juez, a pedido del ejecutante, previo dictamen de un perito designado de oficio, debe declarar si la firma es auténtica. Si lo es, se procede según lo establece el Artículo 500, se impone al ejecutado las costas y una multa equivalente al treinta por ciento (30%) del monto de la deuda, que aquél debe dar a embargo como requisito de admisibilidad de las excepciones. Si no las opone, el importe de la multa integra el capital a los efectos del cumplimiento de la sentencia de remate.","La resolución que declara la autenticidad de la firma e impone la multa es apelable en efecto diferido."],"t":"Desconocimiento de la firma","s":"Si el documento no es reconocido, el Juez, a pedido del ejecutante, previo dictamen de un perito designado de oficio, debe declarar si la firma es auténtica."},{"n":498,"p":["Se produce la caducidad de las medidas preparatorias del juicio ejecutivo, sin necesidad de declaración judicial, si no se deduce la demanda dentro de los quince (15) días de su realización. Si el reconocimiento es ficto, el plazo corre desde que la resolución que lo declara queda firme."],"t":"Caducidad de las medidas preparatorias","s":"Se produce la caducidad de las medidas preparatorias del juicio ejecutivo, sin necesidad de declaración judicial, si no se deduce la demanda dentro de los quince (15) días de su realización."},{"n":499,"p":["Si el instrumento privado fue firmado por autorización o a ruego del obligado, queda preparada la vía ejecutiva si, citado éste, declara que otorgó la autorización o que es cierta la deuda que el documento expresa.","Si la autorización resulta de un instrumento público, basta citar al autorizado para que reconozca la firma."],"t":"Firma por autorización o a ruego","s":"Si el instrumento privado fue firmado por autorización o a ruego del obligado, queda preparada la vía ejecutiva si, citado éste, declara que otorgó la autorización o que es cierta la deuda que el documento expresa."},{"n":500,"p":["El Juez debe examinar cuidadosamente el instrumento con que se deduce la ejecución, y si halla que es de los comprendidos en los Artículos 492 y 493, o en otra disposición legal, y que se encuentran cumplidos los presupuestos procesales, debe librar mandamiento de embargo, observándose el siguiente procedimiento:","1) con el mandamiento, el Oficial de Justicia debe requerir el pago al deudor. Si no se paga en el acto el importe del capital reclamado, del estimado por el Juez en concepto de intereses y costas, y de la multa establecida por el Artículo 497, en su caso, dicho funcionario debe proceder a embargar bienes suficientes, a su juicio, para cubrir la cantidad fijada en el mandamiento. El dinero debe ser depositado dentro del primer día hábil siguiente en el banco de depósitos judiciales;","2) el embargo se practica aún cuando el deudor no está presente, de lo que se debe dejar constancia. En este caso, se le hace saber dentro de los tres (3) días siguientes al de la traba. Si se ignora su domicilio, se debe nombrar al Defensor Oficial, previa citación por edictos que se publican por una sola vez;","3) el Oficial de Justicia debe requerir al propietario de los bienes para que manifieste si se encuentran embargados o afectados por prenda u otro gravamen y, en su caso, por orden de qué Juez y en qué expediente, y el nombre y domicilio de los acreedores, bajo apercibimiento de lo dispuesto en las leyes sobre la materia. Si el dueño de los bienes no está presente, en la misma diligencia se le notifica que debe formular esta manifestación dentro del plazo para oponer excepciones.","Aunque no se trabe embargo, la ejecución continúa, pudiendo solicitar el ejecutante la medida cautelar que autoriza el Artículo 503."],"t":"Intimación de pago y procedimiento para el embargo","s":"El Juez debe examinar cuidadosamente el instrumento con que se deduce la ejecución, y si halla que es de los comprendidos en los Artículos 492 y 493, o en otra disposición legal, y que se encuentran cumplidos los presupuestos procesales, debe librar mandamient"},{"n":501,"p":["Es apelable la resolución que deniega la ejecución."],"t":"Denegación de la ejecución","s":"Es apelable la resolución que deniega la ejecución."},{"n":502,"p":["Si los bienes embargados se encuentran en poder de un tercero, se debe notificar a éste en el día, personalmente o por cédula.","En el caso del Artículo 877 del Código Civil y Comercial de la Nación, si el notificado del embargo paga indebidamente al deudor embargado, el Juez debe hacer efectiva su responsabilidad en el mismo expediente por el trámite de los incidentes o del juicio ordinario, según corresponda atendiendo a las circunstancias del caso."],"t":"Bienes en poder de un tercero","s":"Si los bienes embargados se encuentran en poder de un tercero, se debe notificar a éste en el día, personalmente o por cédula."},{"n":503,"p":["Si no se conocen bienes del deudor o si los embargados resultan presuntivamente insuficientes para cubrir el crédito del ejecutante, puede solicitarse contra el ejecutado inhibición general de vender o gravar sus bienes. La medida queda sin efecto si el deudor presenta bienes a embargo o de caución bastante."],"t":"Inhibición general","s":"Si no se conocen bienes del deudor o si los embargados resultan presuntivamente insuficientes para cubrir el crédito del ejecutante, puede solicitarse contra el ejecutado inhibición general de vender o gravar sus bienes."},{"n":504,"p":["El acreedor no puede exigir que el embargo recaiga sobre determinados bienes con perjuicio grave para el deudor, si existen otros disponibles.","Son aplicables, además, las normas establecidas en el capítulo relativo a las medidas cautelares en cuanto son pertinentes.","Si los bienes muebles embargados forman parte de un establecimiento comercial o industrial, o son los de uso de la casa habitación del deudor, éste puede exonerarlos del embargo presentando otros bienes no gravados, o que, aun cuando lo estén, basten manifiestamente para cubrir el crédito reclamado."],"t":"Orden de la traba. Perjuicios","s":"El acreedor no puede exigir que el embargo recaiga sobre determinados bienes con perjuicio grave para el deudor, si existen otros disponibles."},{"n":505,"p":["El Oficial de Justicia debe dejar los bienes embargados en poder de un depositario provisional que puede ser el deudor si resulta conveniente, salvo que aquéllos se encuentren en poder de un tercero y éste requiere nombramiento a su favor."],"t":"Depositario","s":"El Oficial de Justicia debe dejar los bienes embargados en poder de un depositario provisional que puede ser el deudor si resulta conveniente, salvo que aquéllos se encuentren en poder de un tercero y éste requiere nombramiento a su favor."},{"n":506,"p":["Cuando las cosas embargadas son de difícil o costosa conservación o hay peligro de pérdida o desvalorización, el depositario debe poner el hecho oportunamente en conocimiento del Juez, si no lo expresó ante el Oficial de Justicia, lo que se debe hacer saber a las partes a los fines del Artículo 208."],"t":"Deber de informar","s":"Cuando las cosas embargadas son de difícil o costosa conservación o hay peligro de pérdida o desvalorización, el depositario debe poner el hecho oportunamente en conocimiento del Juez, si no lo expresó ante el Oficial de Justicia, lo que se debe hacer saber a "},{"n":507,"p":["Si el embargo debe de hacerse efectivo en bienes inmuebles o en muebles registrables, basta su anotación en el registro, en la forma y con los efectos que resultan de la ley.","Los oficios o exhortos son librados dentro de las cuarenta y ocho (48) horas de la providencia que ordena el embargo."],"t":"Embargo de inmuebles o muebles registrables","s":"Si el embargo debe de hacerse efectivo en bienes inmuebles o en muebles registrables, basta su anotación en el registro, en la forma y con los efectos que resultan de la ley."},{"n":508,"p":["Practicada la intimación, las costas del juicio son a cargo del deudor moroso, aunque pague en el acto de realizarse aquélla."],"t":"Costas","s":"Practicada la intimación, las costas del juicio son a cargo del deudor moroso, aunque pague en el acto de realizarse aquélla."},{"n":509,"p":["Cuando durante el juicio ejecutivo y antes de pronunciarse sentencia, vence algún nuevo plazo de la obligación en cuya virtud se procede, a pedido del actor puede ampliarse la ejecución por su importe, sin que el procedimiento retrotraiga, y considerándose comunes a la ampliación los trámites que la precedieron.","En cada caso de ampliación debe cumplirse con la intimación de pago."],"t":"Ampliación anterior a la sentencia","s":"Cuando durante el juicio ejecutivo y antes de pronunciarse sentencia, vence algún nuevo plazo de la obligación en cuya virtud se procede, a pedido del actor puede ampliarse la ejecución por su importe, sin que el procedimiento retrotraiga, y considerándose com"},{"n":510,"p":["Si durante el juicio, pero con posterioridad a la sentencia, vencen nuevos plazos o cuotas de la obligación en cuya virtud se procede, la ejecución puede ser ampliada pidiéndose que el deudor exhiba dentro del quinto día los recibos correspondientes o documentos que acreditan la extinción de la obligación, bajo apercibimiento de hacerse extensiva la sentencia a los nuevos plazos y cuotas vencidas. Si el deudor no exhibe recibos o documentos que son reconocidos por el ejecutante, o no se comprueba sumariamente su autenticidad, se hace efectivo el apercibimiento sin recurso alguno.","En cada caso de ampliación debe cumplirse con la intimación de pago.","Lo dispuesto en este artículo y en el Artículo 509 rige también en las ejecuciones por cobro de alquileres y expensas comunes.","La facultad que otorga este artículo no puede ser ejercida una vez terminada la tramitación del juicio."],"t":"Ampliación posterior a la sentencia","s":"Si durante el juicio, pero con posterioridad a la sentencia, vencen nuevos plazos o cuotas de la obligación en cuya virtud se procede, la ejecución puede ser ampliada pidiéndose que el deudor exhiba dentro del quinto día los recibos correspondientes o document"},{"n":511,"p":["La intimación de pago importa la citación para oponer excepciones, debiendo dejarse al ejecutado copia de la diligencia, del escrito de iniciación y de los documentos acompañados.","Las excepciones se proponen, dentro de cinco (5) días, en un solo escrito, conjuntamente con el ofrecimiento de prueba.","Deben cumplirse, en lo pertinente, los requisitos establecidos en los Artículos 332 y 358 determinándose con exactitud cuáles son las excepciones que se oponen.","La intimación de pago importa, asimismo, el requerimiento para que el deudor dentro del plazo establecido en el segundo párrafo del presente artículo, constituya domicilio, bajo apercibimiento de lo dispuesto por el Artículo 41.","No habiéndose opuesto excepciones dentro del plazo, el Juez, sin otra sustanciación, debe pronunciar sentencia de remate."],"t":"Intimación de pago. Oposición de excepciones","s":"La intimación de pago importa la citación para oponer excepciones, debiendo dejarse al ejecutado copia de la diligencia, del escrito de iniciación y de los documentos acompañados."},{"n":512,"p":["Son irrenunciables la intimación de pago, la citación para oponer excepciones y la sentencia."],"t":"Trámites irrenunciables","s":"Son irrenunciables la intimación de pago, la citación para oponer excepciones y la sentencia."},{"n":513,"p":["Las únicas excepciones admisibles en el juicio ejecutivo son:","1) incompetencia;","2) falta de personería en el ejecutante, en el ejecutado o en sus representantes, por carecer de capacidad civil para estar en juicio o de representación suficiente;","3) litispendencia en otro Juzgado o Tribunal competente;","4) falsedad o inhabilidad de título con que se pide la ejecución. La primera puede fundarse únicamente en la adulteración del documento; la segunda se limita a las formas extrínsecas del título, sin que pueda discutirse la legitimidad de la causa. El reconocimiento expreso de la firma no impide la admisibilidad de la excepción de falsedad fundada en la adulteración del documento. Estas excepciones son inadmisibles si no se negó la existencia de la deuda;","5) prescripción;","6) pago documentado, total o parcial;","7) compensación de crédito líquido que resulta de documento que trae aparejada ejecución;","8)     quita,   espera,   remisión,   novación,   transacción,   conciliación   o   compromiso documentados;","9) cosa juzgada."],"t":"Excepciones","s":"Las únicas excepciones admisibles en el juicio ejecutivo son: 1) incompetencia; 2) falta de personería en el ejecutante, en el ejecutado o en sus representantes, por carecer de capacidad civil para estar en juicio o de representación suficiente;"},{"n":514,"p":["El ejecutado puede solicitar, dentro del plazo fijado en el Artículo 511, por vía de excepción o de incidente, que se declare la nulidad de la ejecución. Puede fundarse únicamente en:","1) no haberse hecho legalmente la intimación de pago, siempre que en el acto de pedir la declaración de nulidad, el ejecutado deposite la suma fijada en el mandamiento u oponga excepciones;","2) incumplimiento de las normas establecidas para la preparación de la vía ejecutiva, siempre que el ejecutado desconozca la obligación, niegue la autenticidad de la firma, el carácter de locatario, o el cumplimiento de la condición o de la prestación.","Es inadmisible el pedido de nulidad si el ejecutado no menciona las excepciones que no pudo deducir, en términos que demuestren la seriedad de su petición."],"t":"Nulidad de la ejecución","s":"El ejecutado puede solicitar, dentro del plazo fijado en el Artículo 511, por vía de excepción o de incidente, que se declare la nulidad de la ejecución. Puede fundarse únicamente en:"},{"n":515,"p":["Si se anula el procedimiento ejecutivo o se declara la incompetencia, el embargo trabado se mantiene, con carácter preventivo, durante quince (15) días contados desde que la resolución queda firme. Se produce la caducidad automática si dentro de ese plazo no se reinicia la ejecución."],"t":"Subsistencia del embargo","s":"Si se anula el procedimiento ejecutivo o se declara la incompetencia, el embargo trabado se mantiene, con carácter preventivo, durante quince (15) días contados desde que la resolución queda firme."},{"n":516,"p":["El Juez debe desestimar sin sustanciación alguna las excepciones que no son de las autorizadas por la ley, o que no se oponen en forma clara y concreta, cualquiera sea el nombre que el ejecutado les dio. En ese mismo acto debe dictar sentencia de remate.","Si se hallan cumplidos los requisitos pertinentes, debe dar traslado de las excepciones al ejecutante por cinco (5) días quien al contestarlo debe ofrecer la prueba de que intente valerse.","No se hace declaración especial previa acerca de la admisibilidad o inadmisibilidad de las excepciones."],"t":"Trámite","s":"El Juez debe desestimar sin sustanciación alguna las excepciones que no son de las autorizadas por la ley, o que no se oponen en forma clara y concreta, cualquiera sea el nombre que el ejecutado les dio. En ese mismo acto debe dictar sentencia de remate."},{"n":517,"p":["Si las excepciones son de puro derecho o se fundan exclusivamente en constancias del expediente, o no se ofreció prueba, el Juez debe pronunciar sentencia dentro de diez (10) días de contestado el traslado; si no se lo contestó, el plazo se cuenta desde que se requiere la resolución."],"t":"Excepciones de puro derecho. Falta de prueba","s":"Si las excepciones son de puro derecho o se fundan exclusivamente en constancias del expediente, o no se ofreció prueba, el Juez debe pronunciar sentencia dentro de diez (10) días de contestado el traslado; si no se lo contestó, el plazo se cuenta desde que se"},{"n":518,"p":["Cuando se ofrece prueba que no consiste en constancias del expediente, el Juez debe acordar un plazo común para producirla, tomando en consideración las circunstancias y el lugar donde debe diligenciarse.","Corresponde al ejecutado la carga de la prueba de los hechos en que funda las excepciones.","El Juez, por resolución fundada, debe desestimar la prueba manifiestamente inadmisible, meramente dilatoria o carente de utilidad.","Se aplican las normas que rigen el juicio sumarísimo supletoriamente en lo pertinente."],"t":"Prueba","s":"Cuando se ofrece prueba que no consiste en constancias del expediente, el Juez debe acordar un plazo común para producirla, tomando en consideración las circunstancias y el lugar donde debe diligenciarse."},{"n":519,"p":["Producida la prueba se declara clausurado el período correspondiente; el Juez debe pronunciar sentencia dentro de los diez (10) días."],"t":"Sentencia","s":"Producida la prueba se declara clausurado el período correspondiente; el Juez debe pronunciar sentencia dentro de los diez (10) días."},{"n":520,"p":["La sentencia de remate sólo puede determinar que se lleve adelante la ejecución, en todo o en parte, o su rechazo.","En el primer caso, al ejecutado que litigó sin razón valedera u obstruyó el curso normal del proceso con articulaciones manifiestamente improcedentes, o que de cualquier manera demoró injustificadamente el trámite, se le impone una multa a favor del ejecutante, cuyo monto es fijado entre el cinco por ciento (5%) y el treinta por ciento (30%) del importe de la deuda, según la incidencia de su inconducta procesal sobre la demora del procedimiento."],"t":"Sentencia de remate","s":"La sentencia de remate sólo puede determinar que se lleve adelante la ejecución, en todo o en parte, o su rechazo."},{"n":521,"p":["Si el deudor con domicilio desconocido no se presentó, la sentencia se notifica al Defensor Oficial."],"t":"Notificación al Defensor Oficial","s":"Si el deudor con domicilio desconocido no se presentó, la sentencia se notifica al Defensor Oficial."},{"n":522,"p":["Cualquiera sea la sentencia que recae en el juicio ejecutivo, el ejecutante o el ejecutado pueden promover el ordinario, una vez cumplidas las condenas impuestas.","Toda defensa o excepción que por la ley no es admisible en el juicio ejecutivo puede hacerse valer en el ordinario.","No corresponde el nuevo proceso para el ejecutado que no opuso excepciones, respecto de las que legalmente pudo deducir, ni para el ejecutante, en cuanto a las que se allanó.","Tampoco se puede discutir nuevamente las cuestiones de hecho debatidas y resueltas en el juicio ejecutivo, cuya defensa o prueba no tiene limitaciones establecidas por la ley, ni las interpretaciones legales formuladas en la sentencia, ni la validez o nulidad del procedimiento de la ejecución.","La falta de cumplimiento de las condenas impuestas puede ser opuesta como excepción de previo y especial pronunciamiento.","El juicio ordinario promovido mientras se sustancia el ejecutivo no produce la paralización de este último."],"t":"Juicio ordinario posterior","s":"Cualquiera sea la sentencia que recae en el juicio ejecutivo, el ejecutante o el ejecutado pueden promover el ordinario, una vez cumplidas las condenas impuestas."},{"n":523,"p":["La sentencia de remate es apelable:","1) cuando se trate del caso previsto en el Artículo 516 primer párrafo;","2) cuando las excepciones tramitaron como de puro derecho;","3) cuando se produjo prueba respecto de las opuestas;","4) cuando verse sobre puntos ajenos al ámbito natural del proceso o causa gravamen irreparable en el juicio ordinario posterior.","Son apelables las regulaciones de honorarios que contiene la sentencia de remate o son su consecuencia, aunque ella, en el caso, no lo sea."],"t":"Apelación","s":"La sentencia de remate es apelable: 1) cuando se trate del caso previsto en el Artículo 516 primer párrafo; 2) cuando las excepciones tramitaron como de puro derecho; 3) cuando se produjo prueba respecto de las opuestas;"},{"n":524,"p":["Cuando el ejecutante da fianza de responder de lo que percibe si la sentencia es revocada, el recurso se concede en efecto devolutivo.","El Juez establece la clase y el monto de la fianza. Si no se presta dentro de los cinco (5) días de haber sido concedido el recurso, se debe elevar el expediente a la Cámara. Si se da fianza se remite también el expediente dejándose, en primera instancia, testimonio de las piezas necesarias para que prosiga la ejecución."],"t":"Efecto. Fianza","s":"Cuando el ejecutante da fianza de responder de lo que percibe si la sentencia es revocada, el recurso se concede en efecto devolutivo. El Juez establece la clase y el monto de la fianza."},{"n":525,"p":["La fianza sólo se hace extensiva al resultado del juicio ordinario, cuando así lo requiere el ejecutado en los casos en que, conforme al Artículo 522 tenga la facultad de promover el juicio ordinario posterior.","Queda cancelada:","1) si el ejecutado no promueve el juicio dentro de los quince (15) días de haber sido otorgada;","2) si habiéndolo deducido dentro de dicho plazo, la sentencia es confirmada."],"t":"Fianza requerida por el ejecutado","s":"La fianza sólo se hace extensiva al resultado del juicio ordinario, cuando así lo requiere el ejecutado en los casos en que, conforme al Artículo 522 tenga la facultad de promover el juicio ordinario posterior. Queda cancelada:"},{"n":526,"p":["Las apelaciones en el juicio ejecutivo se conceden en efecto diferido con excepción de las que proceden contra la sentencia de remate y la providencia que deniega la ejecución."],"t":"Carácter. Plazo de las apelaciones","s":"Las apelaciones en el juicio ejecutivo se conceden en efecto diferido con excepción de las que proceden contra la sentencia de remate y la providencia que deniega la ejecución."},{"n":527,"p":["Las costas del juicio ejecutivo son a cargo de la parte vencida, con excepción de las correspondientes a las pretensiones de la otra parte que fueron desestimadas.","Si se declaró procedente la excepción de pago parcial, al ejecutado se le imponen sólo las costas correspondientes al monto admitido en la sentencia."],"t":"Costas","s":"Las costas del juicio ejecutivo son a cargo de la parte vencida, con excepción de las correspondientes a las pretensiones de la otra parte que fueron desestimadas."},{"n":528,"p":["Durante el curso del proceso de ejecución, el Juez puede de oficio o a pedido de parte, y si las circunstancias así lo aconsejan, fijar una audiencia para que comparezcan ejecutante y ejecutado con el objeto de establecer la forma más rápida y eficaz de satisfacer el crédito, procurando evitar perjuicios innecesarios.","A esta audiencia deben comparecer las partes personalmente, y se celebra con la que concurre. No puede señalarse una nueva con el mismo objeto, ni tampoco puede el ejecutado promover posteriormente incidentes por causas anteriores que no fueron invocadas en dicha audiencia."],"t":"Límites. Modalidades de la ejecución","s":"Durante el curso del proceso de ejecución, el Juez puede de oficio o a pedido de parte, y si las circunstancias así lo aconsejan, fijar una audiencia para que comparezcan ejecutante y ejecutado con el objeto de establecer la forma más rápida y eficaz de satisf"},{"n":529,"p":["Si la subasta se dispone a requerimiento de propietario o de condómino y no en cumplimiento de una sentencia de condena, la operación se rige por las normas del derecho sustancial; en este caso, las que se establecen en este Código sólo son aplicables en lo que son conciliables con aquéllas."],"t":"Ámbito","s":"Si la subasta se dispone a requerimiento de propietario o de condómino y no en cumplimiento de una sentencia de condena, la operación se rige por las normas del derecho sustancial; en este caso, las que se establecen en este Código sólo son aplicables en lo qu"},{"n":530,"p":["Son inapelables, por el ejecutado, las resoluciones que se dictan durante el trámite de cumplimiento de la sentencia de remate, salvo las que se refieren a cuestiones que:","1) no pueden constituir objeto del juicio ordinario posterior;","2) debiendo ser objeto del juicio ordinario posterior, con arreglo al Artículo 522 no obstante, fueron debatidas en la etapa de cumplimiento de la sentencia por asentir el ejecutante;","3) se relacionen con el reconocimiento del carácter de parte;","4) en los casos de los Artículos 523, inciso 4) y 561, primer y segundo párrafos."],"t":"Recursos","s":"Son inapelables, por el ejecutado, las resoluciones que se dictan durante el trámite de cumplimiento de la sentencia de remate, salvo las que se refieren a cuestiones que: 1) no pueden constituir objeto del juicio ordinario posterior;"},{"n":531,"p":["Liquidación. Pago inmediato. Es requisito del trámite de cumplimiento de la sentencia de remate, la traba de embargo.","Cuando lo embargado es dinero, una vez firme la sentencia o dada la fianza a que se refiere el Artículo 524, el acreedor debe practicar liquidación de capital, intereses y costas, de la que se da traslado al ejecutado, aplicándose, en lo pertinente, las reglas de los Artículos 471 y 472. Aprobada la liquidación, se debe hacer pago inmediato al acreedor del importe que de ella resulta."],"t":"Embargo. Sumas de dinero","s":"Liquidación. Pago inmediato. Es requisito del trámite de cumplimiento de la sentencia de remate, la traba de embargo."},{"n":532,"p":["Si se embargaron títulos o acciones que se cotizan oficialmente en los mercados de valores, el ejecutante puede pedir que se le den en pago al precio que tienen, a la fecha de la resolución que así lo dispone; si no se cotizan, se observa lo establecido por el Artículo 543.","SECCIÓN 2.a DISPOSICIONES COMUNES A LA SUBASTA DE MUEBLES. SEMOVIENTES O INMUEBLES"],"t":"Adjudicación de títulos o acciones","s":"Si se embargaron títulos o acciones que se cotizan oficialmente en los mercados de valores, el ejecutante puede pedir que se le den en pago al precio que tienen, a la fecha de la resolución que así lo dispone; si no se cotizan, se observa lo establecido por el"},{"n":533,"p":["Carácter de su actuación. Remoción. Las cámaras provinciales de apelaciones deben abrir, cada año, un registro en el que pueden inscribirse los martilleros con más de dos (2) años de antigüedad en la matrícula y que reúnan los demás requisitos de idoneidad que reglamente el Tribunal. De dicha lista se sortea el o los profesionales a designar, quienes deben aceptar el cargo dentro del tercer día de notificados.","El martillero es nombrado de oficio, en la forma establecida en el párrafo precedente, salvo si existe acuerdo de las partes para proponerlo y el propuesto reúne los requisitos a que se refiere el párrafo primero. No puede ser recusado; sin embargo, cuando circunstancias graves lo aconsejan, el Juez, dentro del quinto día de hecho el nombramiento, puede dejarlo sin efecto.","Debe ajustar su cometido a las instrucciones que le imparte el Juez; si no cumple con este deber puede ser removido; en su caso, se le da por perdido total o parcialmente el derecho a comisión o se aplica en lo pertinente la sanción que establece el tercer párrafo del Artículo 535.","No puede delegar sus funciones, salvo autorización expresa del Juez.","El martillero no es parte en los trámites del cumplimiento de la sentencia de remate; sólo puede tener intervención en lo que se refiere a su actuación, en los términos establecidos en este Código o en otra ley."],"t":"Martillero. Designación","s":"Carácter de su actuación. Remoción."},{"n":534,"p":["El martillero debe depositar las sumas recibidas y rendir cuentas del remate al Juzgado, dentro de los tres (3) días de realizado. Si no lo hace oportunamente, sin justa causa, carece de derecho a cobrar comisión."],"t":"Depósito de los importes percibidos por el martillero. Rendición de cuentas","s":"El martillero debe depositar las sumas recibidas y rendir cuentas del remate al Juzgado, dentro de los tres (3) días de realizado. Si no lo hace oportunamente, sin justa causa, carece de derecho a cobrar comisión."},{"n":535,"p":["El martillero percibe la comisión que corresponde conforme al bien subastado, establecida por la ley o, en su caso, la costumbre.","Si el remate se suspende o fracasa sin culpa del martillero, el monto de la comisión debe ser fijado por el Juez, de acuerdo con la importancia del trabajo realizado; si se anula, también sin su culpa, tiene derecho a la comisión que corresponde. Si el mismo martillero vende el bien en un remate posterior, su retribución debe ser determinada atendiendo al efectivo trabajo que le demandó esa tarea.","Si el remate se anula por culpa del martillero, éste debe reintegrar el importe de la comisión que percibió, dentro del tercer día de notificado por cédula de la resolución que decreta la nulidad.","Cuando el martillero lo solicita y el Juez lo considera procedente, las partes deben adelantar los fondos que se estiman necesarios para la realización de la subasta."],"t":"Comisión. Anticipo de fondos","s":"El martillero percibe la comisión que corresponde conforme al bien subastado, establecida por la ley o, en su caso, la costumbre."},{"n":536,"p":["El remate se anuncia por edictos, que se publican por dos (2) días en el Boletín Oficial y en otro diario, en la forma indicada en los Artículos 147, 148 y 149. Si se trata de bienes de escaso valor, solo se publican en el Boletín Oficial, por un (1) día y puede prescindirse de la publicación si el costo de la misma no guarda relación con el valor de los bienes.","Si se trata de inmuebles, puede, asimismo, anunciarse en diarios del lugar donde están situados.","En los edictos se indica el Juzgado y Secretaría donde tramita el proceso, el número del expediente y el nombre de las partes si éstas no se oponen; el lugar, día, mes, año y hora de la subasta; no tratándose de bienes de escaso valor, se individualizan las cantidades, el estado y el lugar donde pueden ser revisados por los interesados; se debe mencionar, asimismo, la obligación de depositar el importe de la seña y de la comisión en el acto de remate y, en su caso, las modalidades especiales del mismo.","Si la subasta es de inmuebles, debe indicarse, además, la base, condiciones de venta, estado de ocupación y horario de visitas; si están sujetos al régimen de propiedad horizontal, en las publicaciones y en el acto del remate debe determinarse el monto de las expensas comunes correspondientes al último mes, y la deuda por este concepto, si es posible.","En todos los casos, la última publicación debe realizarse cuando menos cuarenta y ocho (48) horas antes del remate.","No pueden denunciarse defectos de publicidad de la subasta vencidos cinco (5) días contados desde la última publicación."],"t":"Edictos","s":"El remate se anuncia por edictos, que se publican por dos (2) días en el Boletín Oficial y en otro diario, en la forma indicada en los Artículos 147, 148 y 149."},{"n":537,"p":["La propaganda adicional es a cargo del ejecutante, salvo si el ejecutado de conformidad, o si su costo no excede del dos por ciento (2%) de la base.","No se puede mencionar en la propaganda, ni subastar en el mismo remate, bajo pena de perder el martillero su comisión, bienes distintos de aquéllos cuya venta fue ordenada judicialmente.","Si la propaganda adicional se realiza a través de diarios, es aplicable lo dispuesto en el último párrafo del Artículo 536."],"t":"Propaganda. Inclusión indebida de otros bienes","s":"La propaganda adicional es a cargo del ejecutante, salvo si el ejecutado de conformidad, o si su costo no excede del dos por ciento (2%) de la base."},{"n":538,"p":["Si el bien está embargado en diversos procesos seguidos contra el ejecutado, salvo disposición específica de otra ley que regule ejecuciones especiales, la subasta se debe realizar en el que está más adelantado en su trámite, con prescindencia de la naturaleza o garantías que tienen los créditos.","La preferencia que se acuerda para la realización del remate importa reconocer al acreedor que promovió el juicio donde se ordena, la facultad de proponer martillero, si en el acto constitutivo de la obligación se le otorgó esa prerrogativa."],"t":"Preferencia para el remate","s":"Si el bien está embargado en diversos procesos seguidos contra el ejecutado, salvo disposición específica de otra ley que regule ejecuciones especiales, la subasta se debe realizar en el que está más adelantado en su trámite, con prescindenc
