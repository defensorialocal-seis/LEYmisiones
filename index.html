312, pero antes de que cualquiera de las partes impulse el procedimiento.","El rechazo de la caducidad de la instancia que opera como consecuencia de la realización de acto útil al avance del proceso con posterioridad a la intimación en tal sentido, no genera costas para el peticionario."],"t":"Modo de operarse","s":"La caducidad debe ser declarada de oficio o a pedido de parte, previa intimación a la que se refiere el Artículo 317 o con posterioridad a la misma, sin otro trámite que la comprobación del vencimiento de los plazos señalados en el Artículo 312, pero antes de "},{"n":319,"p":["La resolución sobre caducidad es apelable. En segunda o ulterior instancia sólo es susceptible de reposición si es dictada de oficio."],"t":"Resolución","s":"La resolución sobre caducidad es apelable. En segunda o ulterior instancia sólo es susceptible de reposición si es dictada de oficio."},{"n":320,"p":["La caducidad operada en primera o única instancia no extingue la acción, la que puede ejercitarse en un nuevo juicio, ni perjudica las pruebas producidas, las que pueden hacerse valer en aquél. La caducidad operada en instancias ulteriores acuerda fuerza de cosa juzgada a la resolución recurrida. La caducidad de la instancia principal comprende la reconvención y los incidentes; pero la de éstos no afecta la instancia principal."],"t":"Efectos de la caducidad","s":"La caducidad operada en primera o única instancia no extingue la acción, la que puede ejercitarse en un nuevo juicio, ni perjudica las pruebas producidas, las que pueden hacerse valer en aquél."},{"n":321,"p":["Todas las contiendas judiciales que no tienen señalada una tramitación especial, deben ser ventiladas en juicio ordinario, salvo cuando este Código autoriza al Juez a determinar la clase de proceso aplicable. En estos casos, la resolución del Juez que fija la clase de proceso es irrecurrible."],"t":"Principio General","s":"Todas las contiendas judiciales que no tienen señalada una tramitación especial, deben ser ventiladas en juicio ordinario, salvo cuando este Código autoriza al Juez a determinar la clase de proceso aplicable."},{"n":322,"p":["Cuando la controversia versa sobre derechos que no son apreciables en dinero, o existen dudas sobre el valor reclamado y no corresponde atribuirle el trámite sumarísimo o un proceso especial, el Juez debe determinar el tipo de proceso aplicable, de oficio o a petición del actor formulada en la demanda o del demandado en el escrito de contestación del traslado de la demanda. La resolución debe otorgar un plazo razonable al actor o ambas partes, en su caso, para adaptar sus pretensiones al tipo de trámite otorgado al proceso. La decisión del Juez es irrecurrible."],"t":"","s":"Cuando la controversia versa sobre derechos que no son apreciables en dinero, o existen dudas sobre el valor reclamado y no corresponde atribuirle el trámite sumarísimo o un proceso especial, el Juez debe determinar el tipo de proceso aplicable, de oficio o a "},{"n":323,"p":["Es aplicable el procedimiento establecido en el Artículo 466:","1) a los procesos de conocimiento en los que el valor cuestionado no excede de la suma de Pesos Cien ($100);","2) cuando se reclama contra un acto u omisión de un particular que, en forma actual o inminente, lesiona, restringe, altere o amenaza con arbitrariedad o ilegalidad manifiesta algún derecho o garantía explícita o implícitamente reconocidos por la Constitución Nacional, siempre que sea necesaria la reparación urgente del perjuicio o la cesación inmediata de los efectos del acto, y la cuestión, por su naturaleza, no deba sustanciarse por alguno de los procesos establecidos por este Código u otras leyes;","3) en los demás casos previstos por este Código u otras leyes.","Si de conformidad con las pretensiones deducidas por el actor no procede el trámite del juicio sumarísimo, el Juez debe resolver cuál es la clase de proceso que corresponde."],"t":"Proceso Sumarísimo","s":"Es aplicable el procedimiento establecido en el Artículo 466: 1) a los procesos de conocimiento en los que el valor cuestionado no excede de la suma de Pesos Cien ($100);"},{"n":324,"p":["Puede deducirse la acción que tienda a obtener una sentencia meramente declarativa, para hacer cesar un estado de incertidumbre sobre la existencia, alcance o modalidades de una relación jurídica, siempre que esa falta de certeza pueda producir un perjuicio o lesión actual al actor y éste no disponga de otro medio legal para ponerle término inmediatamente.","El Juez debe resolver de oficio y como primera providencia, si corresponde el trámite pretendido por el actor, teniendo en cuenta la naturaleza de la cuestión y la prueba ofrecida.","Se entiende que la acción meramente declarativa legislada en el presente artículo, no es comprensiva de la materia prevista en el Artículo 808, respecto de la cual debe estarse al párrafo primero del Artículo 809."],"t":"Acción meramente declarativa","s":"Puede deducirse la acción que tienda a obtener una sentencia meramente declarativa, para hacer cesar un estado de incertidumbre sobre la existencia, alcance o modalidades de una relación jurídica, siempre que esa falta de certeza pueda producir un perjuicio o "},{"n":325,"p":["El proceso de conocimiento puede prepararse pidiendo el que pretende demandar, o quien, con fundamento prevé que será demandado:","1) que la persona contra quien se propone dirigir la demanda preste declaración jurada, por escrito y dentro del plazo que fija el Juez, sobre algún hecho relativo a su personalidad, sin cuya comprobación no puede entrarse en juicio;","2) que se exhiba la cosa mueble que ha de pedirse por acción real, sin perjuicio de su depósito o de la medida precautoria que corresponda;","3) que se exhiba un testamento cuando el solicitante se cree heredero, coheredero o legatario, si no puede obtenerlo sin recurrir a la justicia;","4) que en caso de evicción, el enajenante o adquirente exhiba los títulos u otros instrumentos referentes a la cosa vendida;","5) que el socio o comunero o quien tiene en su poder los documentos de la sociedad o comunidad, los presente o exhiba;","6) que la persona que ha de ser demandada por reivindicación u otra acción que exige conocer el carácter en cuya virtud ocupa la cosa objeto del juicio a promover, exprese a qué título la tiene;","7) que se nombre tutor o curador para el juicio de que se trata;","8) que si el eventual demandado tiene que ausentarse del país, constituya domicilio dentro de los cinco (5) días de notificado, bajo apercibimiento de lo dispuesto en el Artículo 41;","9) que se practique una mensura judicial;","10) que se cite para el reconocimiento de la obligación de rendir cuentas;","11) que se practique reconocimiento de mercaderías, en los términos del Artículo 805.","Salvo en los casos de los incisos 9), 10) y 11) del presente artículo, y del Artículo 328 no se pueden invocar las diligencias decretadas a pedido de quien pretende demandar, si no se deduce la demanda dentro de los treinta (30) días de su realización. Si el reconocimiento a que se refieren el inciso 1) del presente artículo y el Artículo 326 es ficto, el plazo corre desde que la resolución que lo declara queda firme."],"t":"Enumeración. Caducidad","s":"El proceso de conocimiento puede prepararse pidiendo el que pretende demandar, o quien, con fundamento prevé que será demandado:"},{"n":326,"p":["En el caso del inciso 1) del Artículo 325, la providencia se debe notificar por cédula, con entrega del interrogatorio. Si el requerido no responde dentro del plazo, se tienen por ciertos los hechos consignados en forma asertiva, sin perjuicio de la prueba en contrario que se produce una vez iniciado el juicio."],"t":"Trámite de la Declaración Jurada","s":"En el caso del inciso 1) del Artículo 325, la providencia se debe notificar por cédula, con entrega del interrogatorio."},{"n":327,"p":["La exhibición o presentación de cosas o instrumentos se debe hacer en el tiempo, modo y lugar que determina el Juez, atendiendo a las circunstancias. Cuando el requerido no los tiene en su poder debe indicar, si lo conoce, el lugar en que se encuentran o quién los tiene."],"t":"Trámite de la exhibición de cosas e instrumentos","s":"La exhibición o presentación de cosas o instrumentos se debe hacer en el tiempo, modo y lugar que determina el Juez, atendiendo a las circunstancias."},{"n":328,"p":["Los que son o vayan a ser parte en un proceso de conocimiento y tienen motivos justificados para temer que la producción de sus pruebas pueda resultar imposible o muy dificultosa en el período de prueba, pueden solicitar que se produzcan anticipadamente las siguientes:","1) declaración de algún testigo de muy avanzada edad, o que está gravemente enfermo o próximo a ausentarse del país;","2) reconocimiento judicial o dictamen pericial para hacer constar la existencia de documentos, o el estado, calidad o condición de cosas o de lugares;","3) pedido de informes."],"t":"Prueba anticipada","s":"Los que son o vayan a ser parte en un proceso de conocimiento y tienen motivos justificados para temer que la producción de sus pruebas pueda resultar imposible o muy dificultosa en el período de prueba, pueden solicitar que se produzcan anticipadamente las si"},{"n":329,"p":["En el escrito en que se solicitan medidas preliminares se debe indicar el nombre de la futura parte contraria, su domicilio si es conocido y los fundamentos de la petición.","El Juez debe acceder a las pretensiones si estima justas las causas en que se fundan, repeliéndolas de oficio en caso contrario.","La resolución es apelable únicamente cuando deniega la diligencia.","Si ha de practicarse la prueba se debe citar a la contraria, salvo cuando resulta imposible por razón de urgencia, en cuyo caso debe intervenir el Defensor Oficial. El diligenciamiento se debe hacer en la forma establecida para cada clase de prueba, salvo en el caso de la pericial, que debe estar a cargo de un perito único, nombrado de oficio."],"t":"Pedido de medidas preliminares. Resolución y diligenciamiento","s":"En el escrito en que se solicitan medidas preliminares se debe indicar el nombre de la futura parte contraria, su domicilio si es conocido y los fundamentos de la petición."},{"n":330,"p":["Después de trabada la litis, la producción anticipada de prueba sólo tiene lugar por las razones de urgencia indicadas en el Artículo 328, salvo la atribución conferida al Juez por el Artículo 36, inciso 4)."],"t":"Producción de prueba anticipada después de trabada la litis","s":"Después de trabada la litis, la producción anticipada de prueba sólo tiene lugar por las razones de urgencia indicadas en el Artículo 328, salvo la atribución conferida al Juez por el Artículo 36, inciso 4)."},{"n":331,"p":["Cuando sin justa causa el interpelado no cumple la orden del Juez en el plazo fijado, o dá informaciones falsas o que pueden inducir a error o destruye u oculta los instrumentos o cosas cuya exhibición o presentación se requieren, se le aplica una multa que no puede ser menor a la cuarta parte de un (1) Salario Mínimo, Vital y Móvil ni mayor a cuatro (4) Salarios Mínimos, Vitales y Móviles, debiendo graduarse en atención a las circunstancias personales del incumplidor, sin perjuicio de las demás responsabilidades en que incurra.","La orden de exhibición o presentación de instrumento o cosa mueble, que no es cumplida, se hace efectiva mediante secuestro y allanamiento de lugares, si resulta necesario.","Cuando la diligencia preliminar consiste en la citación para el reconocimiento de la obligación de rendir cuentas y el citado no comparece, se tiene por admitida dicha obligación y la cuestión debe tramitar por el procedimiento de los incidentes. Si comparece y niega que debe rendir cuentas, pero en el juicio a que se refiere el Artículo 596 se declara que la rendición corresponde, el Juez impone al demandado una multa que no puede ser menor a la cuarta parte de un salario Mínimo Vital y Móvil ni mayor a un (1) Salario Mínimo Vital y Móvil cuando la negativa es maliciosa.","Si corresponde por la naturaleza de la medida preparatoria y la conducta observada por el requerido, los jueces y los tribunales pueden imponer sanciones conminatorias, en los términos del Artículo 37."],"t":"Responsabilidad por incumplimiento","s":"Cuando sin justa causa el interpelado no cumple la orden del Juez en el plazo fijado, o dá informaciones falsas o que pueden inducir a error o destruye u oculta los instrumentos o cosas cuya exhibición o presentación se requieren, se le aplica una multa que no"},{"n":332,"p":["La demanda debe ser deducida por escrito y contener:","1) el nombre y domicilio del demandante;","2) el nombre y domicilio del demandado;","3) la cosa demandada, designándola con toda exactitud;","4) los hechos en que se funda, explicados claramente;","5) el derecho expuesto sucintamente, evitando repeticiones innecesarias;","6) la petición en términos claros y positivos.","La demanda debe precisar el monto reclamado, salvo cuando al actor no le es posible determinarlo al promoverla, por las circunstancias del caso, o porque la estimación depende de elementos aún no definitivamente fijados y la promoción de la demanda es imprescindible para evitar la prescripción de la acción. En estos supuestos, no procede la excepción de defecto legal.","La sentencia debe fijar el monto que resulta de las pruebas producidas."],"t":"Forma de la demanda","s":"La demanda debe ser deducida por escrito y contener: 1) el nombre y domicilio del demandante; 2) el nombre y domicilio del demandado; 3) la cosa demandada, designándola con toda exactitud; 4) los hechos en que se funda, explicados claramente;"},{"n":333,"p":["El actor puede modificar la demanda antes de que ésta sea notificada. Puede, asimismo, ampliar la cuantía de lo reclamado si antes de la sentencia vencen nuevos plazos o cuotas de la misma obligación. Se consideran comunes a la ampliación los trámites que la preceden y se sustancia únicamente con un traslado a la otra parte.","Si la ampliación, expresa o implícitamente, se funda en hechos nuevos, se aplican las reglas establecidas en el Artículo 367."],"t":"Transformación y ampliación de la demanda","s":"El actor puede modificar la demanda antes de que ésta sea notificada. Puede, asimismo, ampliar la cuantía de lo reclamado si antes de la sentencia vencen nuevos plazos o cuotas de la misma obligación."},{"n":334,"p":["Con la demanda, reconvención y contestación de ambas en toda clase de juicios, debe acompañarse la prueba documental que está en poder de las partes y ofrecerse todas las demás pruebas de que las partes intentan valerse.","Si las partes no tienen a su disposición la prueba documental, la individualizan indicando su contenido, el lugar, archivo, oficina pública y persona en cuyo poder se encuentra.","Si se trata de prueba documental oportunamente ofrecida, los letrados patrocinantes, una vez interpuesta la demanda, pueden requerir directamente a entidades privadas, sin necesidad de previa petición judicial, y mediante oficio en el que se debe transcribir este artículo, el envío de la pertinente documentación o de su copia auténtica, la que debe ser remitida directamente a la Secretaría, con trascripción o copia del oficio.","Si se ofrece prueba testimonial se debe indicar qué extremos quieren probarse con la declaración de cada testigo. Tratándose de prueba pericial la parte interesada debe proponer los puntos de pericia."],"t":"Agregación de la prueba documental. Ofrecimiento de las demás Pruebas","s":"Con la demanda, reconvención y contestación de ambas en toda clase de juicios, debe acompañarse la prueba documental que está en poder de las partes y ofrecerse todas las demás pruebas de que las partes intentan valerse."},{"n":335,"p":["Cuando en el responde de la demanda o de la reconvención se alegan hechos no invocados en la demanda o contrademanda, los demandantes o reconvinientes, según el caso, pueden agregar, dentro de los cinco (5) días de notificada la providencia respectiva, la prueba documental referente a esos hechos y ofrecer todas las demás pruebas de que intentan valerse a su respecto. En tales casos se debe dar traslado a la otra parte quien debe cumplir la carga que prevé el Artículo 358 inciso 1)."],"t":"Hechos no invocados en la demanda o contrademanda","s":"Cuando en el responde de la demanda o de la reconvención se alegan hechos no invocados en la demanda o contrademanda, los demandantes o reconvinientes, según el caso, pueden agregar, dentro de los cinco (5) días de notificada la providencia respectiva, la prue"},{"n":336,"p":["Después de interpuesta la demanda, no se admiten al actor sino documentos de fecha posterior, o anteriores, bajo juramento o afirmación de no haber antes tenido conocimiento de ellos. En tales casos se debe dar traslado a la otra parte, quien debe cumplir la carga que prevé el Artículo 358 inciso 1)."],"t":"Documentos posteriores o desconocidos","s":"Después de interpuesta la demanda, no se admiten al actor sino documentos de fecha posterior, o anteriores, bajo juramento o afirmación de no haber antes tenido conocimiento de ellos."},{"n":337,"p":["El demandante y el demandado, de común acuerdo, pueden presentar al Juez la demanda y contestación en la forma prevista en los Artículos 332 y 358, ofreciendo la prueba en el mismo escrito.","El Juez, sin otro trámite, debe dictar la providencia de autos si la causa es de puro derecho. Si existen hechos controvertidos, se procede conforme al Artículo 362.","Las audiencias que deben tener lugar en los juicios iniciados en la forma mencionada en el párrafo anterior, deben ser fijadas con carácter preferente.","Quedan excluidas de esta disposición las acciones fundadas en el derecho de familia."],"t":"Demanda y contestación conjuntas","s":"El demandante y el demandado, de común acuerdo, pueden presentar al Juez la demanda y contestación en la forma prevista en los Artículos 332 y 358, ofreciendo la prueba en el mismo escrito."},{"n":338,"p":["Los jueces pueden rechazar de oficio las demandas que no se ajustan a las reglas establecidas, expresando el defecto que contienen.","Si no resulta claramente de ellas que son de su competencia, deben mandar que el actor exprese lo necesario a ese respecto."],"t":"Rechazo \"in limine\"","s":"Los jueces pueden rechazar de oficio las demandas que no se ajustan a las reglas establecidas, expresando el defecto que contienen. Si no resulta claramente de ellas que son de su competencia, deben mandar que el actor exprese lo necesario a ese respecto."},{"n":339,"p":["Presentada la demanda en la forma prescripta, el Juez debe dar traslado de ella al demandado para que comparezca y la conteste dentro de quince (15) días.","Cuando la parte demandada es la Nación, una Provincia o una Municipalidad, el plazo para comparecer y contestar la demanda es de sesenta (60) días."],"t":"Traslado de la demanda","s":"Presentada la demanda en la forma prescripta, el Juez debe dar traslado de ella al demandado para que comparezca y la conteste dentro de quince (15) días."},{"n":340,"p":["La citación se hace por medio de cédula que se entrega al demandado en su domicilio real, si aquél es habido, juntamente con las copias a que se refiere el Artículo 121.","Si no se le encuentra, se le debe dejar aviso para que espere al día siguiente y si tampoco entonces se le halla, se debe proceder según se prescribe en el Artículo 143.","Si el domicilio asignado al demandado por el actor es falso, probado el hecho, se anula todo lo actuado a costa del demandante."],"t":"Demandado domiciliado o residente en la jurisdicción del Juzgado","s":"La citación se hace por medio de cédula que se entrega al demandado en su domicilio real, si aquél es habido, juntamente con las copias a que se refiere el Artículo 121."},{"n":341,"p":["Cuando la persona que ha de ser citada no se encuentra en el lugar donde se le demanda, la citación se debe hacer por medio de oficio o exhorto a la autoridad judicial de la localidad en que se halla, sin perjuicio, en su caso, de lo dispuesto en la ley de trámite uniforme sobre exhortos."],"t":"Demandado domiciliado o residente fuera de la jurisdicción","s":"Cuando la persona que ha de ser citada no se encuentra en el lugar donde se le demanda, la citación se debe hacer por medio de oficio o exhorto a la autoridad judicial de la localidad en que se halla, sin perjuicio, en su caso, de lo dispuesto en la ley de trá"},{"n":342,"p":["En las causas en que una provincia es parte, la citación se debe hacer por oficios dirigidos al Gobernador y al Fiscal de Estado o funcionario que tiene sus atribuciones."],"t":"Provincia demandada","s":"En las causas en que una provincia es parte, la citación se debe hacer por oficios dirigidos al Gobernador y al Fiscal de Estado o funcionario que tiene sus atribuciones."},{"n":343,"p":["En los casos del Artículo 341 el plazo de quince (15) días se amplía en la forma prescripta en el Artículo 159.","Si el demandado reside fuera de la República, el Juez debe fijar el plazo en que ha de comparecer atendiendo a las distancias y a la mayor o menor facilidad de las comunicaciones."],"t":"Ampliación y fijación de plazo","s":"En los casos del Artículo 341 el plazo de quince (15) días se amplía en la forma prescripta en el Artículo 159."},{"n":344,"p":["La citación a personas inciertas o cuyo domicilio o residencia se ignora se debe hacer por edictos publicados por dos (2) días en la forma prescripta por los Artículos 147,148 y 149.","Si vencido el plazo de los edictos no comparece el citado, se debe nombrar al Defensor Oficial para que lo represente en el juicio. El Defensor debe tratar de hacer llegar a conocimiento del interesado la existencia del juicio y, en su caso, recurrir de la sentencia."],"t":"Demandado incierto o con domicilio o residencia ignorados","s":"La citación a personas inciertas o cuyo domicilio o residencia se ignora se debe hacer por edictos publicados por dos (2) días en la forma prescripta por los Artículos 147,148 y 149."},{"n":345,"p":["Si los demandados son varios y se hallan en diferentes jurisdicciones, el plazo de la citación es para todos el que resulta mayor, sin atender al orden en que las notificaciones son practicadas."],"t":"Demandados con domicilios o residencias en diferentes jurisdicciones","s":"Si los demandados son varios y se hallan en diferentes jurisdicciones, el plazo de la citación es para todos el que resulta mayor, sin atender al orden en que las notificaciones son practicadas."},{"n":346,"p":["Si la citación se hace en contravención a lo prescripto en los artículos que preceden, es nula y se debe aplicar lo dispuesto en el","Artículo 151."],"t":"Citación defectuosa","s":"Si la citación se hace en contravención a lo prescripto en los artículos que preceden, es nula y se debe aplicar lo dispuesto en el Artículo 151."},{"n":347,"p":["Las excepciones que se mencionan en el Artículo 348 se oponen únicamente como de previo y especial pronunciamiento en un solo escrito juntamente con la contestación la demanda o la reconvención.","El rebelde sólo puede oponer la prescripción con posterioridad siempre que justifique haber incurrido en rebeldía por causas que no estuvo a su alcance superar.","En los casos en que la obligación de comparecer surge con posterioridad al plazo acordado al demandado o reconvenido para contestar, puede oponerla en su primera presentación.","Si se deduce como excepción, se debe resolver como previa si la cuestión es de puro derecho.","La oposición de excepciones sólo suspende el plazo para contestar la demanda o la reconvención, cuando se trata de las de falta de personería, defecto legal o arraigo, la que deben oponerse dentro del plazo de cinco (5) días de notificada la demanda."],"t":"Forma de deducirlas. Plazo y efectos","s":"Las excepciones que se mencionan en el Artículo 348 se oponen únicamente como de previo y especial pronunciamiento en un solo escrito juntamente con la contestación la demanda o la reconvención."},{"n":348,"p":["Sólo se admiten como previas las siguientes excepciones:","1) incompetencia;","2) falta de personería en el demandante, en el demandado o sus representantes, por carecer de capacidad civil para estar en juicio o de representación suficiente;","3) falta de legitimación para obrar en el actor o en el demandado, cuando sea manifiesta, sin perjuicio, en caso de no concurrir esta última circunstancia, de que el Juez la considere en la sentencia definitiva;","4) litispendencia;","5) defecto legal en el modo de proponer la demanda;","6) cosa juzgada. Para que sea procedente esta excepción, el examen integral de las dos (2) contiendas debe demostrar que se trata del mismo asunto sometido a decisión judicial, o que por existir continencia, conexidad, accesoriedad o subsidiariedad, la sentencia firme ya ha resuelto lo que constituye la materia o la pretensión deducida en el nuevo juicio que se promueve;","7) transacción, conciliación y desistimiento del derecho;","8) las defensas temporarias que se consagran en las leyes generales, tales como el beneficio de inventario o el de excusión, o las previstas en los Artículos 2272 y 2289 del Código Civil y Comercial de la Nación;","9) prescripción de la acción cuando sea manifiesta, sin perjuicio de que en caso de no concurrir esta última circunstancia el Juez la considere en la sentencia definitiva.","La existencia de cosa juzgada o de litispendencia puede ser declarada de oficio, en cualquier estado de la causa."],"t":"Excepciones admisibles","s":"Sólo se admiten como previas las siguientes excepciones: 1) incompetencia; 2) falta de personería en el demandante, en el demandado o sus representantes, por carecer de capacidad civil para estar en juicio o de representación suficiente;"},{"n":349,"p":["Si el demandante no tiene domicilio ni bienes inmuebles en la República, es también excepción previa la del arraigo por las responsabilidades inherentes a la demanda."],"t":"Arraigo","s":"Si el demandante no tiene domicilio ni bienes inmuebles en la República, es también excepción previa la del arraigo por las responsabilidades inherentes a la demanda."},{"n":350,"p":["No se debe dar curso a las excepciones:","1) si la de incompetencia lo es por razón de distinta nacionalidad y no se acompaña el documento que acredita la del oponente; si lo es por distinta vecindad y no se presenta la libreta o partida que justifica la ciudadanía argentina del oponente; si lo es por haberse fijado de común acuerdo por las partes el Juez competente, cuando ello es admisible, y no se presenta el documento correspondiente;","2) si la de litispendencia no es acompañada del testimonio del escrito de demanda del juicio pendiente;","3) si la de cosa juzgada no se presenta con el testimonio de la sentencia respectiva;","4) si las de transacción, conciliación y desistimiento del derecho no son acompañadas de los instrumentos o testimonios que las acreditan.","En los supuestos de los incisos 2), 3) y 4) del presente artículo, puede suplirse la presentación del testimonio si se solicita la remisión del expediente con indicación del Juzgado y Secretaría donde tramita."],"t":"Requisito de admisión","s":"No se debe dar curso a las excepciones:"},{"n":351,"p":["Con el escrito en que se proponen las excepciones, se debe agregar toda la prueba instrumental y ofrecer la restante. De todo ello se debe dar traslado al actor, quien debe cumplir con idéntico requisito."],"t":"Planteamiento de las excepciones. Traslado","s":"Con el escrito en que se proponen las excepciones, se debe agregar toda la prueba instrumental y ofrecer la restante. De todo ello se debe dar traslado al actor, quien debe cumplir con idéntico requisito."},{"n":352,"p":["Vencido el plazo con o sin respuesta, el Juez debe designar audiencia dentro de diez (10) días para recibir la prueba ofrecida, si lo estima necesario.","En caso contrario, debe resolver sin más trámite."],"t":"Audiencia de prueba","s":"Vencido el plazo con o sin respuesta, el Juez debe designar audiencia dentro de diez (10) días para recibir la prueba ofrecida, si lo estima necesario. En caso contrario, debe resolver sin más trámite."},{"n":353,"p":["Una vez firme la resolución que desestima la excepción de incompetencia, las partes no pueden argüir la incompetencia en lo sucesivo. Tampoco puede ser declarada de oficio."],"t":"Efectos de la resolución que desestima la excepción de incompetencia","s":"Una vez firme la resolución que desestima la excepción de incompetencia, las partes no pueden argüir la incompetencia en lo sucesivo. Tampoco puede ser declarada de oficio."},{"n":354,"p":["El Juez debe resolver previamente sobre la declinatoria y la litispendencia. En caso de declararse competente, debe resolver al mismo tiempo sobre las demás excepciones previas.","La resolución es apelable en relación, salvo cuando se trata de la excepción prevista en el inciso 3), del Artículo 348, y el Juez resuelve que la falta de legitimación no era manifiesta, en cuyo caso y sin perjuicio de lo establecido en dicho inciso, la decisión es irrecurrible.","Cuando únicamente se opone la excepción de incompetencia por el carácter civil o comercial del asunto, el recurso se debe conceder al solo efecto devolutivo, si la excepción es rechazada. En el supuesto de que la resolución de la Cámara sea revocatoria, los trámites cumplidos hasta ese momento son válidos en la otra jurisdicción."],"t":"Resolución. Recursos","s":"El Juez debe resolver previamente sobre la declinatoria y la litispendencia. En caso de declararse competente, debe resolver al mismo tiempo sobre las demás excepciones previas."},{"n":355,"p":["Una vez firme la resolución que declara procedentes las excepciones previas, se debe proceder a:","1) remitir el expediente al Tribunal considerado competente, si pertenece a la Jurisdicción provincial. En caso contrario, se archiva;","2) ordenar el archivo si se trata de cosa juzgada, falta de legitimación manifiesta, prescripción o de las previstas en el inciso 8) del Artículo 348, salvo, en este último caso, cuando sólo corresponde la suspensión del procedimiento;","3) remitir al Tribunal donde tramita el otro proceso si la litispendencia es por conexidad. Si ambos procesos son idénticos, se debe ordenar el archivo del iniciado con posterioridad;","4) fijar el plazo dentro del cual deben subsanarse los defectos o arraigar, según se trate de las contempladas en los incisos 2) y 5) del Artículo 348, o en el Artículo 349. En este último caso se debe fijar también el monto de la caución. Vencido el plazo sin que el actor cumpla lo resuelto se lo debe tener por desistido del proceso, imponiéndosele las costas."],"t":"Efectos de la admisión de las excepciones","s":"Una vez firme la resolución que declara procedentes las excepciones previas, se debe proceder a: 1) remitir el expediente al Tribunal considerado competente, si pertenece a la Jurisdicción provincial. En caso contrario, se archiva;"},{"n":356,"p":["Consentida o ejecutoriada la resolución que rechaza las excepciones previstas en el Artículo 347 último párrafo o, en su caso, subsanada la falta de personería o prestado el arraigo, se debe declarar reanudado el plazo para contestar la demanda; esta resolución debe notificarse personalmente o por cédula.","Subsanado el defecto legal, se debe correr nuevo traslado, por el plazo establecido en el Artículo 339."],"t":"Efectos del rechazo de las excepciones o de la subsanación de los defectos","s":"Consentida o ejecutoriada la resolución que rechaza las excepciones previstas en el Artículo 347 último párrafo o, en su caso, subsanada la falta de personería o prestado el arraigo, se debe declarar reanudado el plazo para contestar la demanda; esta resolució"},{"n":357,"p":["El demandado debe contestar la demanda dentro del plazo establecido en el Artículo 339, con la ampliación que corresponde en razón de la distancia."],"t":"Plazo","s":"El demandado debe contestar la demanda dentro del plazo establecido en el Artículo 339, con la ampliación que corresponde en razón de la distancia."},{"n":358,"p":["En la contestación debe oponer el demandado todas las excepciones o defensas de que intenta valerse. Debe, además:","1) reconocer o negar categóricamente cada uno de los hechos expuestos en la demanda, la autenticidad de los documentos acompañados que se le atribuyen y la recepción de las cartas y telegramas a él dirigidos cuyas copias se acompañan. Su silencio, sus respuestas evasivas, o la negativa meramente general pueden estimarse como reconocimiento de la verdad de los hechos pertinentes y lícitos a que se refieren. En cuanto a los documentos se los debe tener por reconocidos o recibidos, según el caso. No están sujetos al cumplimiento de la carga mencionada en el párrafo precedente, el Defensor Oficial y el demandado que interviene en el proceso como sucesor a título universal de quien participó en los hechos o suscribió los documentos o recibió las cartas o telegramas, quienes pueden reservar su respuesta definitiva para después de producida la prueba;","2) especificar con claridad los hechos que alega como fundamento de su defensa;","3) cumplir con las cargas establecidas en el Artículo 334;","4) pronunciarse sobre la admisibilidad y pertinencia de las pruebas ofrecidas por el actor en su escrito de demanda;","5) cumplir, en lo pertinente, los recaudos exigidos por el Artículo 332."],"t":"Contenido y requisitos","s":"En la contestación debe oponer el demandado todas las excepciones o defensas de que intenta valerse. Debe, además:"},{"n":359,"p":["En el mismo escrito de contestación debe el demandado deducir reconvención, en la forma prescripta para la demanda, si se cree con derecho a proponerla. No haciéndolo entonces, no puede deducirla después, salvo su derecho para hacer valer su pretensión en otro juicio.","La reconvención es admisible si las pretensiones en ella deducidas derivan de la misma relación jurídica o son conexas con las invocadas en la demanda."],"t":"Reconvención","s":"En el mismo escrito de contestación debe el demandado deducir reconvención, en la forma prescripta para la demanda, si se cree con derecho a proponerla."},{"n":360,"p":["Propuesta la reconvención o presentándose documentos y ofrecimiento de prueba por el demandado, se debe dar traslado al actor quien debe responder dentro de quince (15) o cinco (5) días respectivamente, según se trate de la reconvención o de la documental y ofrecimiento de prueba, observando las normas establecidas para la contestación de la demanda.","Para el demandado rige lo dispuesto en el Artículo 336."],"t":"Traslado de la reconvención, de los documentos y del ofrecimiento de prueba","s":"Propuesta la reconvención o presentándose documentos y ofrecimiento de prueba por el demandado, se debe dar traslado al actor quien debe responder dentro de quince (15) o cinco (5) días respectivamente, según se trate de la reconvención o de la documental y of"},{"n":361,"p":["Contestado el traslado de la demanda o reconvención, en su caso, o vencidos los plazos para hacerlo, resueltas las excepciones previas, si la cuestión pudiera ser resuelta como de puro derecho, así se debe decidir y firme que se encuentre la providencia, se llama autos para sentencia. Si se alegaron hechos conducentes acerca de los cuales no hay conformidad entre las partes, aunque éstas no lo pidan, el Juez recibe la causa a prueba procediendo de acuerdo a lo preceptuado en el Artículo 362."],"t":"Trámite posterior Según la naturaleza de la cuestión","s":"Contestado el traslado de la demanda o reconvención, en su caso, o vencidos los plazos para hacerlo, resueltas las excepciones previas, si la cuestión pudiera ser resuelta como de puro derecho, así se debe decidir y firme que se encuentre la providencia, se ll"},{"n":362,"p":["A los fines del Artículo 361 el Juez debe citar a las partes a una audiencia, que debe celebrarse dentro de los sesenta (60) días de cumplidos con los actos contemplados en el Artículo 360, donde:","1) invita a las partes a una conciliación, o algún otro modo de finalización del proceso, que acuerden en la audiencia, labrándose acta y homologándose por el Juez interviniente. En tal caso, tiene efectos de cosa juzgada material y se ejecuta mediante el procedimiento previsto para la ejecución de sentencias;","2) de no lograrse la finalización del litigio, decide si la cuestión debe ser resuelta como de puro derecho, con lo que la causa queda concluida para sentencia;","3) de no corresponder lo prescripto en el inciso 2), fija por sí los hechos articulados que son conducentes a la decisión del juicio sobre los cuales debe versar la prueba;","4) recibe las manifestaciones de las partes, si las tuvieren, con referencia a lo prescripto en los Artículos 360 y 361, debiendo resolver en el mismo acto;","5) provee en dicha audiencia las pruebas que considera admisibles y conducentes ofrecidas en los respectivos escritos. Concentra de ser posible en una sola audiencia la prueba de testigos, la que se celebra con presencia del Juez en las condiciones establecidas en este capítulo. Esta obligación únicamente puede delegarse en el Secretario;","6) si considera que existen especiales exigencias probatorias para alguna de las partes, así lo hace saber. En tal caso, suspende la audiencia y las partes dentro del quinto día pueden ampliar el ofrecimiento de pruebas.","El procedimiento previsto en el presente artículo, se lleva adelante aún cuando no comparecen una o ambas partes.","Los intervinientes no pueden ser interrogados acerca de lo acontecido en la audiencia.","En los juicios que tramiten por otros procedimientos, se celebra asimismo la audiencia prevista en el presente artículo, observándose los plazos procesales, que se establecen para los mismos."],"t":"Audiencia preliminar","s":"A los fines del Artículo 361 el Juez debe citar a las partes a una audiencia, que debe celebrarse dentro de los sesenta (60) días de cumplidos con los actos contemplados en el Artículo 360, donde:"},{"n":363,"p":["Si alguna de las partes se opone a la apertura a prueba en la audiencia prevista en el Artículo 362, el Juez resuelve lo que sea procedente luego de escuchar a la contraparte.","La resolución sólo es apelable si declara la cuestión de puro derecho."],"t":"Oposición","s":"Si alguna de las partes se opone a la apertura a prueba en la audiencia prevista en el Artículo 362, el Juez resuelve lo que sea procedente luego de escuchar a la contraparte. La resolución sólo es apelable si declara la cuestión de puro derecho."},{"n":364,"p":["Si en la audiencia prevista en el Artículo 362, todas las partes manifiestan que no tienen ninguna prueba a producir, o que ésta consiste únicamente en las constancias del expediente o en la documental ya agregada y no cuestionada, la causa queda conclusa para definitiva y el Juez llama autos para sentencia."],"t":"Prescindencia","s":"Si en la audiencia prevista en el Artículo 362, todas las partes manifiestan que no tienen ninguna prueba a producir, o que ésta consiste únicamente en las constancias del expediente o en la documental ya agregada y no cuestionada, la causa queda conclusa para"},{"n":365,"p":["El período de prueba queda clausurado antes de su vencimiento, sin necesidad de declaración expresa, cuando todas quedan producidas, o las partes renuncian a las pendientes."],"t":"Clausura del período de prueba","s":"El período de prueba queda clausurado antes de su vencimiento, sin necesidad de declaración expresa, cuando todas quedan producidas, o las partes renuncian a las pendientes."},{"n":366,"p":["No pueden producirse pruebas sino sobre hechos que fueron articulados por las partes en sus escritos respectivos.","No son admitidas las que son manifiestamente improcedentes, superfluas o meramente dilatorias."],"t":"Pertinencia y admisibilidad de la prueba","s":"No pueden producirse pruebas sino sobre hechos que fueron articulados por las partes en sus escritos respectivos. No son admitidas las que son manifiestamente improcedentes, superfluas o meramente dilatorias."},{"n":367,"p":["Cuando con posterioridad a la contestación de la demanda o reconvención, ocurra o llega a conocimiento de las partes algún hecho que tiene relación con la cuestión que se ventila, pueden alegarlo hasta cinco (5) días después de notificada la audiencia prevista en el Artículo 362, acompañando la prueba documental y ofreciendo las demás de las que intentan valerse.","Del escrito en que se alega, si lo considera pertinente, se da traslado a la otra parte, quien, dentro del plazo para contestarlo, puede también alegar otros hechos en contraposición a los nuevos alegados.","El Juez decide en la audiencia del Artículo 362 la admisión o el rechazo de los hechos nuevos."],"t":"Hechos nuevos","s":"Cuando con posterioridad a la contestación de la demanda o reconvención, ocurra o llega a conocimiento de las partes algún hecho que tiene relación con la cuestión que se ventila, pueden alegarlo hasta cinco (5) días después de notificada la audiencia prevista"},{"n":368,"p":["La resolución que admite el hecho nuevo es inapelable. La que lo rechaza es apelable en efecto diferido."],"t":"Inapelabilidad","s":"La resolución que admite el hecho nuevo es inapelable. La que lo rechaza es apelable en efecto diferido."},{"n":369,"p":["El plazo de prueba debe ser fijado por el Juez y no debe exceder de cuarenta (40) días. Dicho plazo es común y comienza a correr a partir de la fecha de celebración de la audiencia prevista por el Artículo 362 sin que se formule oposición o una vez resuelta ésta, en su caso."],"t":"Plazo de producción de prueba","s":"El plazo de prueba debe ser fijado por el Juez y no debe exceder de cuarenta (40) días."},{"n":370,"p":["Las audiencias deben señalarse dentro del plazo de prueba y, en lo posible, simultáneamente en ambos cuadernos.","Se deben concentrar en la misma fecha o en días sucesivos, teniendo en cuenta la naturaleza de las pruebas."],"t":"Fijación y concentración de las audiencias","s":"Las audiencias deben señalarse dentro del plazo de prueba y, en lo posible, simultáneamente en ambos cuadernos. Se deben concentrar en la misma fecha o en días sucesivos, teniendo en cuenta la naturaleza de las pruebas."},{"n":371,"p":["La prueba que debe producirse fuera de la República debe ser ofrecida dentro del plazo o en la oportunidad pertinente. En el escrito en que se pide deben indicarse las pruebas que han de ser diligenciadas, expresando a qué hechos controvertidos se vinculan y los demás elementos de juicio que permiten establecer si son esenciales, o no."],"t":"Prueba a producir en el extranjero","s":"La prueba que debe producirse fuera de la República debe ser ofrecida dentro del plazo o en la oportunidad pertinente."},{"n":372,"p":["Si se trata de prueba testimonial, deben expresarse los nombres, profesión y domicilio de los testigos y acompañarse los interrogatorios.","Si se requiere el testimonio de documentos, se deben mencionar los archivos o registros donde se encuentran."],"t":"Especificaciones","s":"Si se trata de prueba testimonial, deben expresarse los nombres, profesión y domicilio de los testigos y acompañarse los interrogatorios. Si se requiere el testimonio de documentos, se deben mencionar los archivos o registros donde se encuentran."},{"n":373,"p":["No se admite la prueba si en el escrito de ofrecimiento no se cumplen los requisitos establecidos en los Artículos 371 y 372."],"t":"Inadmisibilidad","s":"No se admite la prueba si en el escrito de ofrecimiento no se cumplen los requisitos establecidos en los Artículos 371 y 372."},{"n":374,"p":["La parte contraria y el Juez tienen, respectivamente, la facultad y el deber atribuidos por el Artículo 434."],"t":"Facultad de la contraparte. Deber del Juez","s":"La parte contraria y el Juez tienen, respectivamente, la facultad y el deber atribuidos por el Artículo 434."},{"n":375,"p":["Si producidas todas las demás pruebas queda pendiente en todo o en parte únicamente la que debe producirse fuera de la Provincia, y de la ya acumulada resulta que no es esencial, se debe pronunciar sentencia prescindiendo de ella. Puede ser considerada en segunda instancia si es agregada cuando la causa se encuentra en la alzada, salvo si media declaración de caducidad por negligencia."],"t":"Prescindencia de prueba no esencial","s":"Si producidas todas las demás pruebas queda pendiente en todo o en parte únicamente la que debe producirse fuera de la Provincia, y de la ya acumulada resulta que no es esencial, se debe pronunciar sentencia prescindiendo de ella."},{"n":376,"p":["Cuando sólo una de las partes ofrece prueba a producir fuera de la Provincia y no la ejecuta oportunamente, son a su cargo las costas originadas por ese pedido, incluidos los gastos en que incurre la otra para hacerse representar donde deben practicarse las diligencias."],"t":"Costas","s":"Cuando sólo una de las partes ofrece prueba a producir fuera de la Provincia y no la ejecuta oportunamente, son a su cargo las costas originadas por ese pedido, incluidos los gastos en que incurre la otra para hacerse representar donde deben practicarse las di"},{"n":377,"p":["Salvo en los supuestos del Artículo 158, el plazo de prueba no se suspende."],"t":"Continuidad del plazo de prueba","s":"Salvo en los supuestos del Artículo 158, el plazo de prueba no se suspende."},{"n":378,"p":["Cuando la prueba consiste en constancias de otros expedientes judiciales no terminados, la parte debe agregar los testimonios o certificados de las piezas pertinentes, sin perjuicio de la facultad del Juez de requerir dichas constancias o los expedientes, en oportunidad de encontrarse el expediente en estado de dictar sentencia."],"t":"Constancias de expedientes judiciales","s":"Cuando la prueba consiste en constancias de otros expedientes judiciales no terminados, la parte debe agregar los testimonios o certificados de las piezas pertinentes, sin perjuicio de la facultad del Juez de requerir dichas constancias o los expedientes, en o"},{"n":379,"p":["Incumbe la carga de la prueba a la parte que afirma la existencia de un hecho controvertido o de un precepto jurídico que el Juez o el Tribunal no tiene el deber de conocer.","Cada una de las partes debe probar el presupuesto de hecho de la norma o normas que invoca como fundamento de su pretensión, defensa o excepción.","Si la ley extranjera invocada por alguna de las partes no es probada, el Juez puede investigar su existencia, y aplicarla a la relación jurídica materia del litigio.","A los fines de la aplicación de lo dispuesto en los párrafos anteriores, el Juez debe tener en cuenta la disponibilidad probatoria que corresponde a cada parte del litigio, teniendo en cuenta el deber de colaboración en la búsqueda de la verdad objetiva que les resulta inherente."],"t":"Carga de la prueba","s":"Incumbe la carga de la prueba a la parte que afirma la existencia de un hecho controvertido o de un precepto jurídico que el Juez o el Tribunal no tiene el deber de conocer."},{"n":380,"p":["La prueba debe producirse por los medios previstos expresamente por la ley y por los que el Juez dispone, a pedido de parte o de oficio, siempre que no afecten la moral, la libertad personal de los litigantes o de terceros, o no estén expresamente prohibidos para el caso.","Los medios de prueba no previstos se diligencian aplicando por analogía las disposiciones de los que son semejantes o, en su defecto, en la forma que establece el Juez."],"t":"Medios de prueba","s":"La prueba debe producirse por los medios previstos expresamente por la ley y por los que el Juez dispone, a pedido de parte o de oficio, siempre que no afecten la moral, la libertad personal de los litigantes o de terceros, o no estén expresamente prohibidos p"},{"n":381,"p":["Son inapelables las resoluciones del Juez sobre producción, denegación y sustanciación de las pruebas; si se niega alguna medida, la parte interesada puede solicitar a la Cámara que la diligencie cuando el expediente le es remitido para que conozca del recurso contra la sentencia definitiva."],"t":"Inapelabilidad","s":"Son inapelables las resoluciones del Juez sobre producción, denegación y sustanciación de las pruebas; si se niega alguna medida, la parte interesada puede solicitar a la Cámara que la diligencie cuando el expediente le es remitido para que conozca del recurso"},{"n":382,"p":["En la audiencia del Artículo 362 el Juez decide acerca de la conveniencia y/o necesidad de formar cuadernos separados de la prueba de cada parte, la que en su caso se agrega al expediente al vencimiento del plazo probatorio."],"t":"Cuadernos de prueba","s":"En la audiencia del Artículo 362 el Juez decide acerca de la conveniencia y/o necesidad de formar cuadernos separados de la prueba de cada parte, la que en su caso se agrega al expediente al vencimiento del plazo probatorio."},{"n":383,"p":["Los jueces asisten a las actuaciones de prueba que deben practicarse fuera de la sede del Juzgado o Tribunal, pero dentro del radio urbano del lugar."],"t":"Prueba dentro del radio del Juzgado","s":"Los jueces asisten a las actuaciones de prueba que deben practicarse fuera de la sede del Juzgado o Tribunal, pero dentro del radio urbano del lugar."},{"n":384,"p":["Cuando las actuaciones deben practicarse fuera del radio urbano, pero dentro de la Circunscripción Judicial, los jueces pueden trasladarse para recibirlas, o encomendar la diligencia a los de las respectivas localidades.","Si se trata de un reconocimiento judicial, los jueces pueden trasladarse a cualquier lugar de la Provincia donde debe tener lugar la diligencia."],"t":"Prueba fuera del radio del Juzgado","s":"Cuando las actuaciones deben practicarse fuera del radio urbano, pero dentro de la Circunscripción Judicial, los jueces pueden trasladarse para recibirlas, o encomendar la diligencia a los de las respectivas localidades."},{"n":385,"p":["Las partes, oportunamente, deben gestionar el libramiento de los oficios y exhortos, retirarlos para su diligenciamiento y hacer saber, cuando corresponde, en qué Juzgado y Secretaría queda radicado.","En el supuesto de que el requerimiento consista en la designación de audiencias o cualquier otra diligencia respecto de la cual se posibilita el contralor de la otra parte, la fecha designada debe ser informada en el plazo de cinco (5) días contados desde la notificación, por ministerio de la ley, de la providencia que la fija.","Rigen las normas sobre caducidad de pruebas por negligencia."],"t":"Plazo para el libramiento y diligenciamiento de oficios y exhortos","s":"Las partes, oportunamente, deben gestionar el libramiento de los oficios y exhortos, retirarlos para su diligenciamiento y hacer saber, cuando corresponde, en qué Juzgado y Secretaría queda radicado."},{"n":386,"p":["Las medidas de prueba deben ser pedidas, ordenadas y practicadas dentro del plazo. A los interesados incumbe urgir para que sean diligenciadas oportunamente.","Si no lo son por omisión de las autoridades encargadas de recibirlas, pueden los interesados pedir que se practiquen antes de los alegatos siempre que, en tiempo, la parte que ofreció la prueba informe al Juzgado de las dificultades y requiera las medidas necesarias para activar la producción."],"t":"Negligencia","s":"Las medidas de prueba deben ser pedidas, ordenadas y practicadas dentro del plazo. A los interesados incumbe urgir para que sean diligenciadas oportunamente."},{"n":387,"p":["Se debe desestimar el pedido de declaración de negligencia cuando la prueba se produce y agrega antes de vencido el plazo para contestarlo. También, y sin sustanciación alguna, si se acusa negligencia respecto de la prueba de testigos antes de la fecha y hora de celebración de la audiencia, o de peritos, antes de que venza el plazo para presentar la pericia.","En estos casos, la resolución del Juez es irrecurrible. En los demás, queda a salvo el derecho de los interesados para replantear la cuestión en la alzada, en los términos del Artículo 262, inciso 2)."],"t":"Prueba producida y agregada","s":"Se debe desestimar el pedido de declaración de negligencia cuando la prueba se produce y agrega antes de vencido el plazo para contestarlo."},{"n":388,"p":["Salvo disposición legal en contrario, los jueces forman su convicción respecto de la prueba, de conformidad con las reglas de la sana crítica. No tienen el deber de expresar en la sentencia la valoración de todas las pruebas producidas, sino únicamente de las que son esenciales y decisivas para el fallo de la causa.","SECCIÓN 2.a PRUEBA DOCUMENTAL"],"t":"Apreciación de la prueba","s":"Salvo disposición legal en contrario, los jueces forman su convicción respecto de la prueba, de conformidad con las reglas de la sana crítica."},{"n":389,"p":["Las partes y los terceros en cuyo poder se encuentran documentos esenciales para la solución del litigio, están obligados a exhibirlos o a designar el protocolo o archivo en que se hallan los originales. El Juez ordena la exhibición de los documentos, sin sustanciación alguna, dentro del plazo que señala."],"t":"Exhibición de documentos","s":"Las partes y los terceros en cuyo poder se encuentran documentos esenciales para la solución del litigio, están obligados a exhibirlos o a designar el protocolo o archivo en que se hallan los originales."},{"n":390,"p":["Si el documento se encuentra en poder de una de las partes, se le debe intimar su presentación en el plazo que el Juez determina. Cuando por otros elementos de juicio resulta manifiestamente verosímil su existencia y contenido, la negativa a presentarlo, constituye una presunción en su contra."],"t":"Documentos en poder de una de las partes","s":"Si el documento se encuentra en poder de una de las partes, se le debe intimar su presentación en el plazo que el Juez determina."},{"n":391,"p":["Si el documento que debe reconocerse se encuentra en poder de tercero, se le debe intimar para que lo presente. Si lo acompaña, puede solicitar su oportuna devolución dejando testimonio en el expediente.","El requerido puede oponerse a su presentación si el documento es de su exclusiva propiedad y la exhibición puede ocasionarle perjuicio.","Ante la oposición formal del tenedor del documento no se debe insistir en el requerimiento."],"t":"Documentos en poder de tercero","s":"Si el documento que debe reconocerse se encuentra en poder de tercero, se le debe intimar para que lo presente. Si lo acompaña, puede solicitar su oportuna devolución dejando testimonio en el expediente."},{"n":392,"p":["Si el requerido niega la firma que se le atribuye o manifiesta no conocer la que se atribuye a otra persona, debe procederse a la comprobación del documento de acuerdo con lo establecido en los Artículos 438 y siguientes, en lo que corresponde."],"t":"Cotejo","s":"Si el requerido niega la firma que se le atribuye o manifiesta no conocer la que se atribuye a otra persona, debe procederse a la comprobación del documento de acuerdo con lo establecido en los Artículos 438 y siguientes, en lo que corresponde."},{"n":393,"p":["En los escritos a que se refiere el Artículo 439 las partes deben indicar los documentos que han de servir para la pericia."],"t":"Indicación de documentos para el cotejo","s":"En los escritos a que se refiere el Artículo 439 las partes deben indicar los documentos que han de servir para la pericia."},{"n":394,"p":["A pedido de parte, el Secretario debe certificar sobre el estado material del documento de cuya comprobación se trata, indicando las enmiendas, entrerrenglonaduras u otras particularidades que en él se advierten.","Dicho certificado puede ser reemplazado por copia fotográfica a costa de la parte que la pide."],"t":"Estado del documento","s":"A pedido de parte, el Secretario debe certificar sobre el estado material del documento de cuya comprobación se trata, indicando las enmiendas, entrerrenglonaduras u otras particularidades que en él se advierten."},{"n":395,"p":["Si los interesados no se ponen de acuerdo en la elección de documentos para la pericia, el Juez sólo tiene por indubitados:","1) las firmas consignadas en documentos auténticos;","2) los documentos privados reconocidos en juicio por la persona a quien se atribuye el que sea objeto de comprobación;","3) el impugnado, en la parte en que fue reconocido como cierto por el litigante a quien perjudica;","4) las firmas registradas en establecimientos bancarios."],"t":"Documentos indubitados","s":"Si los interesados no se ponen de acuerdo en la elección de documentos para la pericia, el Juez sólo tiene por indubitados: 1) las firmas consignadas en documentos auténticos;"},{"n":396,"p":["A falta de documentos indubitados, o siendo ellos insuficientes, el Juez puede ordenar que la persona a quien se atribuye la letra forme un cuerpo de escritura al dictado y a requerimiento del perito. Esta diligencia se debe cumplir en el lugar que el Juez designa y bajo apercibimiento de que si no comparece o se rehúsa escribir, sin justificar impedimento legítimo, se tiene por reconocido el documento."],"t":"Cuerpo de escritura","s":"A falta de documentos indubitados, o siendo ellos insuficientes, el Juez puede ordenar que la persona a quien se atribuye la letra forme un cuerpo de escritura al dictado y a requerimiento del perito."},{"n":397,"p":["La redargución de falsedad de un instrumento público tramita por incidente que debe promoverse dentro del plazo de diez (10) días de realizada la impugnación, bajo apercibimiento de tenerla por desistida. Es inadmisible si no se indican los elementos y no se ofrecen las pruebas tendientes a demostrar la falsedad.","Admitido el requerimiento, el Juez debe suspender el pronunciamiento de la sentencia, para resolver el incidente juntamente con ésta.","Es parte el oficial público que extendió el instrumento.","SECCIÓN 3.a PRUEBA DE INFORMES. REQUERIMIENTO DE EXPEDIENTES"],"t":"Redargución de falsedad","s":"La redargución de falsedad de un instrumento público tramita por incidente que debe promoverse dentro del plazo de diez (10) días de realizada la impugnación, bajo apercibimiento de tenerla por desistida."},{"n":398,"p":["Los informes que se solicitan a las oficinas públicas, escribanos con registros y entidades privadas deben versar sobre hechos concretos, claramente individualizados, controvertidos en el proceso. Proceden únicamente respecto de actos o hechos que resultan de la documentación, archivo o registros contables del informante.","Asimismo, puede requerirse a las oficinas públicas la remisión de expedientes, testimonios o certificados, relacionados con el juicio."],"t":"Procedencia","s":"Los informes que se solicitan a las oficinas públicas, escribanos con registros y entidades privadas deben versar sobre hechos concretos, claramente individualizados, controvertidos en el proceso."},{"n":399,"p":["No es admisible el pedido de informes que manifiestamente tiende a sustituir o a ampliar otro medio de prueba que específicamente corresponde por ley o por la naturaleza de los hechos controvertidos.","Cuando el requerimiento es procedente, el informe o remisión del expediente sólo puede ser negado si existe justa causa de reserva o de secreto, circunstancia que debe ponerse en conocimiento del Juzgado dentro de quinto día de recibido el oficio."],"t":"Sustitución o ampliación de otros medios probatorios","s":"No es admisible el pedido de informes que manifiestamente tiende a sustituir o a ampliar otro medio de prueba que específicamente corresponde por ley o por la naturaleza de los hechos controvertidos."},{"n":400,"p":["Las oficinas públicas no pueden establecer recaudos o requisitos para los oficios sin previa aprobación por el Poder Ejecutivo, ni otros aranceles que los que determinan las leyes, decretos u ordenanzas.","Deben contestar el pedido de informes o remitir el expediente dentro de veinte (20) días hábiles y las entidades privadas dentro de diez (10), salvo que la providencia que lo ordena, fije otro plazo en razón de la naturaleza del juicio o de circunstancias especiales.","Cuando se trata de la inscripción de la transferencia de dominio en el Registro de la Propiedad, los oficios que se libran a la Administración Provincial de Obras Sanitarias y a la Municipalidad, deben contener el apercibimiento de que, si no son contestados dentro del plazo de veinte (20) días, el bien se inscribirá como si estuviese libre de deuda."],"t":"Recaudos y plazos para la contestación","s":"Las oficinas públicas no pueden establecer recaudos o requisitos para los oficios sin previa aprobación por el Poder Ejecutivo, ni otros aranceles que los que determinan las leyes, decretos u ordenanzas."},{"n":401,"p":["Si por circunstancias atendibles el requerimiento no puede ser cumplido en el plazo, se debe informar al Juzgado, antes del vencimiento de aquel, sobre las causas y la fecha en que se cumplirá.","Cuando el Juez advierte que determinada repartición pública, sin causa justificada, no cumple reiteradamente el deber de contestar oportunamente los informes, debe poner el hecho en conocimiento del Ministerio de Gobierno, a los efectos que corresponda, sin perjuicio de las otras medidas a que haya lugar.","A las entidades privadas que sin causa justificada no contestan oportunamente, se les impone una multa de hasta Pesos Cien ($100) por cada día de retardo. La apelación que se deduce contra la respectiva resolución tramita en expediente separado."],"t":"Retardo","s":"Si por circunstancias atendibles el requerimiento no puede ser cumplido en el plazo, se debe informar al Juzgado, antes del vencimiento de aquel, sobre las causas y la fecha en que se cumplirá."},{"n":402,"p":["Los pedidos de informes, testimonios y certificados, así como los de remisión de expedientes ordenados en el juicio, deben ser requeridos por medio de oficios firmados, sellados y diligenciados por el letrado patrocinante con transcripción de la resolución que los ordena y que fija el plazo en que deben remitirse. Debe, asimismo, consignarse la prevención que corresponde según el Artículo 401.","Los oficios dirigidos a bancos, oficinas públicas o entidades privadas que tienen por único objeto acreditar el haber del juicio sucesorio, son presentados directamente por el abogado patrocinante, sin necesidad de previa petición judicial.","Debe otorgarse recibo del pedido de informe y remitirse las contestaciones directamente a la Secretaría con transcripción o copia del oficio.","Cuando en la redacción de los oficios los profesionales se apartan de lo establecido en la providencia que los ordena, o de las formas legales, su responsabilidad disciplinaria se hace efectiva de oficio o a petición de parte."],"t":"Atribuciones de los letrados patrocinantes","s":"Los pedidos de informes, testimonios y certificados, así como los de remisión de expedientes ordenados en el juicio, deben ser requeridos por medio de oficios firmados, sellados y diligenciados por el letrado patrocinante con transcripción de la resolución que"},{"n":403,"p":["Las entidades privadas que no son parte en el proceso, al presentar el informe y si los trabajos que deben efectuar para contestarlo implican gastos extraordinarios, pueden solicitar una compensación, que es fijada por el Juez, previo traslado a las partes. En este caso el informe debe presentarse por duplicado. La apelación que se deduce contra la respectiva resolución tramita en expediente por separado."],"t":"Compensación","s":"Las entidades privadas que no son parte en el proceso, al presentar el informe y si los trabajos que deben efectuar para contestarlo implican gastos extraordinarios, pueden solicitar una compensación, que es fijada por el Juez, previo traslado a las partes."},{"n":404,"p":["Si vencido el plazo fijado para contestar el informe, la oficina pública o entidad privada no lo remite, se tendrá por desistida de esa prueba a la parte que la pidió, sin sustanciación alguna, si dentro de quinto día no solicita al Juez la reiteración del oficio."],"t":"Caducidad","s":"Si vencido el plazo fijado para contestar el informe, la oficina pública o entidad privada no lo remite, se tendrá por desistida de esa prueba a la parte que la pidió, sin sustanciación alguna, si dentro de quinto día no solicita al Juez la reiteración del ofi"},{"n":405,"p":["Sin perjuicio de la facultad de la otra parte de formular las peticiones tendientes a que los informes sean completos y ajustados a los hechos a que han de referirse, en caso de impugnación por falsedad, se debe requerir la exhibición de los asientos contables o de los documentos y antecedentes en que se funda la contestación.","La impugnación sólo puede ser formulada dentro de quinto día de notificada por ministerio de la ley la providencia que ordena la agregación del informe.","Cuando, sin causa justificada, la entidad privada no cumple el requerimiento, los jueces y tribunales pueden imponer sanciones conminatorias, en los términos del Artículo 37 y a favor de la parte que ofrece la prueba.","SECCIÓN 4.a PRUEBA DE TESTIGOS"],"t":"Impugnación por falsedad","s":"Sin perjuicio de la facultad de la otra parte de formular las peticiones tendientes a que los informes sean completos y ajustados a los hechos a que han de referirse, en caso de impugnación por falsedad, se debe requerir la exhibición de los asientos contables"},{"n":406,"p":["Toda persona mayor de catorce (14) años puede ser propuesta como testigo y tiene el deber de comparecer y declarar, salvo las excepciones establecidas por ley.","Los testigos que tienen su domicilio fuera del lugar del asiento del Tribunal pero dentro de un radio de setenta (70) kilómetros, están obligados a comparecer para prestar declaración ante el Tribunal de la causa, si lo solicita la parte que los propone y el testigo no justifica imposibilidad de concurrir ante dicho tribunal."],"t":"Procedencia","s":"Toda persona mayor de catorce (14) años puede ser propuesta como testigo y tiene el deber de comparecer y declarar, salvo las excepciones establecidas por ley."},{"n":407,"p":["No pueden ser ofrecidos como testigos los consanguíneos o afines en línea directa de las partes, ni el cónyuge, aunque esté separado legalmente, salvo si se trata de reconocimiento de firmas."],"t":"Testigos excluidos","s":"No pueden ser ofrecidos como testigos los consanguíneos o afines en línea directa de las partes, ni el cónyuge, aunque esté separado legalmente, salvo si se trata de reconocimiento de firmas."},{"n":408,"p":["Sin perjuicio de la facultad del Juez de desestimar de oficio y sin sustanciación alguna el ofrecimiento de prueba testimonial que no sea admisible, o de testigos cuya declaración no procede por disposición de la ley, las partes pueden formular oposición si indebidamente se la ordena."],"t":"Oposición","s":"Sin perjuicio de la facultad del Juez de desestimar de oficio y sin sustanciación alguna el ofrecimiento de prueba testimonial que no sea admisible, o de testigos cuya declaración no procede por disposición de la ley, las partes pueden formular oposición si in"},{"n":409,"p":["Cuando las partes pretenden producir prueba de testigos, deben presentar una lista de ellos con expresión de sus nombres, profesión y domicilio.","Si por las circunstancias del caso a la parte le es imposible conocer alguno de esos datos, basta que indique los necesarios para que el testigo pueda ser individualizado sin dilaciones y sea posible su citación.","El interrogatorio puede reservarse por las partes hasta la audiencia en que deben presentarse los testigos."],"t":"Ofrecimiento","s":"Cuando las partes pretenden producir prueba de testigos, deben presentar una lista de ellos con expresión de sus nombres, profesión y domicilio."},{"n":410,"p":["Los testigos no pueden exceder de ocho (8) por cada parte. Si se propone mayor número, se debe citar los ocho (8) primeros, y luego de examinados, el Juez, de oficio o a petición de parte, puede disponer la recepción de otros testimonios entre los propuestos, si es estrictamente necesario y, en su caso, ejercer la facultad que le otorga el Artículo 432."],"t":"Número de testigos","s":"Los testigos no pueden exceder de ocho (8) por cada parte."},{"n":411,"p":["Si la prueba testimonial es admisible en el caso, el Juez manda recibirla en la audiencia que señala, en las condiciones previstas en el Artículo 362.","Cuando el número de los ofrecidos por las partes permite suponer la imposibilidad de que todos declaren en la misma fecha, se deben señalar tantas audiencias como sean necesarias en días seguidos, determinando cuales testigos deben deponer en cada una de ellas, de conformidad con la regla establecida en el Artículo 419.","El Juzgado debe prever una audiencia supletoria con carácter de segunda citación, en fecha próxima, para que declaren los testigos que faltan a las audiencias preindicadas.","Al citar al testigo se le deben notificar ambas audiencias con la advertencia de que si falta a la primera, sin causa justificada, se lo hace comparecer a la segunda por medio de la fuerza pública y se le impone una multa de hasta un Salario Mínimo, Vital y Móvil."],"t":"Audiencia","s":"Si la prueba testimonial es admisible en el caso, el Juez manda recibirla en la audiencia que señala, en las condiciones previstas en el Artículo 362."},{"n":412,"p":["A pedido de parte y sin sustanciación alguna, se debe tener por desistida del testigo a la parte que lo propuso si:","1) no activó la citación del testigo y éste no compareció por esa razón;","2) no habiendo comparecido aquél a la primera audiencia, sin invocar causa justificada, no requiere oportunamente las medidas de compulsión necesarias;","3) fracasada la segunda audiencia por motivos no imputables a la parte, ésta no solicita nueva audiencia dentro del quinto día."],"t":"Caducidad de la prueba","s":"A pedido de parte y sin sustanciación alguna, se debe tener por desistida del testigo a la parte que lo propuso si: 1) no activó la citación del testigo y éste no compareció por esa razón;"},{"n":413,"p":["La citación a los testigos debe ser efectuada por cédula. Esta debe diligenciarse con tres (3) días de anticipación por lo menos, y en ella se transcribe la parte del Artículo 411 que se refiere a la obligación de comparecer y a su sanción."],"t":"Forma de la citación","s":"La citación a los testigos debe ser efectuada por cédula. Esta debe diligenciarse con tres (3) días de anticipación por lo menos, y en ella se transcribe la parte del Artículo 411 que se refiere a la obligación de comparecer y a su sanción."},{"n":414,"p":["El testigo es citado por el Juzgado, salvo cuando la parte que lo propone asume la carga de hacerlo comparecer a la audiencia; en este caso, si el testigo no concurre sin justa causa, de oficio o a pedido de parte y sin sustanciación alguna se lo tiene por desistido."],"t":"Carga de la citación","s":"El testigo es citado por el Juzgado, salvo cuando la parte que lo propone asume la carga de hacerlo comparecer a la audiencia; en este caso, si el testigo no concurre sin justa causa, de oficio o a pedido de parte y sin sustanciación alguna se lo tiene por des"},{"n":415,"p":["Además de las causas de justificación de la inasistencia librada a la apreciación judicial, lo son las siguientes:","1) si la citación es nula;","2) si el testigo es citado con intervalo menor al prescripto en el Artículo 413, salvo que la audiencia se anticipó por razones de urgencia, y consta en el texto de la cédula esa circunstancia."],"t":"Inasistencia justificada","s":"Además de las causas de justificación de la inasistencia librada a la apreciación judicial, lo son las siguientes: 1) si la citación es nula;"},{"n":416,"p":["Si alguno de los testigos se halla imposibilitado de comparecer al Juzgado o tiene alguna otra razón atendible a juicio del Juez para no hacerlo, es examinado en su casa, ante el Secretario, presentes o no las partes, según las circunstancias.","La enfermedad debe justificarse con anticipación suficiente a la audiencia mediante certificado médico. Si se comprueba que puede comparecer, se le impone multa de hasta un (1) Salario Mínimo, Vital y Móvil y, ante el informe del Secretario, se debe fijar audiencia de inmediato, que debe realizarse dentro del quinto día, notificándose a las partes con habilitación de días y horas y disponiendo la comparencia del testigo por medio de la fuerza pública."],"t":"Testigo imposibilitado de comparecer","s":"Si alguno de los testigos se halla imposibilitado de comparecer al Juzgado o tiene alguna otra razón atendible a juicio del Juez para no hacerlo, es examinado en su casa, ante el Secretario, presentes o no las partes, según las circunstancias."},{"n":417,"p":["Si la parte que ofrece testigo no concurre a la audiencia por sí o por apoderado y no deja interrogatorio, se la tendrá por desistida de aquél, sin sustanciación alguna."],"t":"Incomparecencia y falta de interrogatorio","s":"Si la parte que ofrece testigo no concurre a la audiencia por sí o por apoderado y no deja interrogatorio, se la tendrá por desistida de aquél, sin sustanciación alguna."},{"n":418,"p":["Si las partes están presentes, el Juez o el Secretario, en su caso, puede pedirles las explicaciones que estima necesarias sobre los hechos. Asimismo, las partes pueden formularse recíprocamente las preguntas que estiman convenientes."],"t":"Pedido de explicaciones a las partes","s":"Si las partes están presentes, el Juez o el Secretario, en su caso, puede pedirles las explicaciones que estima necesarias sobre los hechos. Asimismo, las partes pueden formularse recíprocamente las preguntas que estiman convenientes."},{"n":419,"p":["Los testigos deben estar en lugar desde donde no puedan oír las declaraciones de los otros. Son llamados sucesiva y separadamente, alternándose, en lo posible, los del actor con los del demandado, a menos que el Juzgado establezca otro orden por razones especiales."],"t":"Orden de las declaraciones","s":"Los testigos deben estar en lugar desde donde no puedan oír las declaraciones de los otros."},{"n":420,"p":["Antes de declarar, los testigos deben prestar juramento o formular promesa de decir verdad, a su elección, y deben ser informados de las consecuencias penales a que pueden dar lugar las declaraciones falsas o reticentes."],"t":"Juramento o promesa de decir verdad","s":"Antes de declarar, los testigos deben prestar juramento o formular promesa de decir verdad, a su elección, y deben ser informados de las consecuencias penales a que pueden dar lugar las declaraciones falsas o reticentes."},{"n":421,"p":["Aunque las partes no lo pidan, los testigos son siempre preguntados:","1) por su nombre, edad, estado, profesión y domicilio;","2) si es pariente por consanguinidad o afinidad de alguna de las partes, y en qué grado;","3) si tiene interés directo o indirecto en el pleito;","4) si es amigo íntimo o enemigo;","5) si es dependiente, acreedor o deudor de alguno de los litigantes, o si tiene algún otro género de relación con ellos.","Aunque las circunstancias individuales declaradas por el testigo no coinciden totalmente con los datos que la parte indica al proponerlo, se recibe su declaración si indudablemente es la misma persona y, por las circunstancias del caso, la contraria no pudo ser inducida en error."],"t":"Interrogatorio preliminar","s":"Aunque las partes no lo pidan, los testigos son siempre preguntados: 1) por su nombre, edad, estado, profesión y domicilio; 2) si es pariente por consanguinidad o afinidad de alguna de las partes, y en qué grado;"},{"n":422,"p":["Los testigos deben ser libremente interrogados, por el Juez o por quien lo reemplaza legalmente, acerca de lo que saben sobre los hechos controvertidos, respetando la sustancia de los interrogatorios propuestos.","La parte contraria a la que ofrece el testigo, puede solicitar que se formulan las preguntas que son pertinentes, aunque no tengan estricta relación con las indicadas por quien lo propuso.","El Juez puede modificar de oficio y sin recurso alguno el orden y los términos de los interrogatorios propuestos. Puede asimismo eliminar los que son manifiestamente inútiles.","Se puede prescindir de continuar interrogando al testigo cuando las preguntas que se proponen, o las respuestas dadas, demuestran que es ineficaz proseguir la declaración.","Las declaraciones son extendidas por el Secretario, en un acta a medida que se prestan, conservando, en cuanto es posible, el lenguaje de los que declaran. Terminado el acto el Juez hace leer y pregunta a las partes si tienen algo que agregar o rectificar. Lo que agreguen o rectifiquen se expresa a continuación, firmando las partes con el Juez y el","Secretario."],"t":"Forma del examen. Acta","s":"Los testigos deben ser libremente interrogados, por el Juez o por quien lo reemplaza legalmente, acerca de lo que saben sobre los hechos controvertidos, respetando la sustancia de los interrogatorios propuestos."},{"n":423,"p":["Las preguntas no deben contener más de un hecho; deben ser claras y concretas; no se formulan las que están concebidas en términos afirmativos, sugieren la respuesta o son ofensivas o vejatorias. No pueden contener referencia de carácter técnico, salvo si son dirigidas a personas especializadas."],"t":"Forma de las preguntas","s":"Las preguntas no deben contener más de un hecho; deben ser claras y concretas; no se formulan las que están concebidas en términos afirmativos, sugieren la respuesta o son ofensivas o vejatorias."},{"n":424,"p":["El testigo puede rehusarse a contestar las preguntas:","1) si la respuesta lo expone a enjuiciamiento penal o compromete su honor;","2) si no puede responder sin revelar un secreto profesional, militar, científico, artístico o industrial."],"t":"Negativa a responder","s":"El testigo puede rehusarse a contestar las preguntas: 1) si la respuesta lo expone a enjuiciamiento penal o compromete su honor; 2) si no puede responder sin revelar un secreto profesional, militar, científico, artístico o industrial."},{"n":425,"p":["El testigo debe contestar sin poder leer notas o apuntes, a menos que por la índole de la pregunta, se le autorice. En este caso, se debe dejar constancia en el acta de las respuestas dadas mediante lectura.","Debe siempre dar la razón de su dicho; si no lo hace, el Juez la debe exigir."],"t":"Forma de las respuestas","s":"El testigo debe contestar sin poder leer notas o apuntes, a menos que por la índole de la pregunta, se le autorice. En este caso, se debe dejar constancia en el acta de las respuestas dadas mediante lectura."},{"n":426,"p":["Al que interrumpe al testigo en su declaración puede imponérsele una multa de hasta el veinticinco por ciento (25%) de un (1) Salario Mínimo, Vital y Móvil.","En caso de reiteración incurre en el doble de la multa sin perjuicio de las demás sanciones que corresponden."],"t":"Interrupción de la declaración","s":"Al que interrumpe al testigo en su declaración puede imponérsele una multa de hasta el veinticinco por ciento (25%) de un (1) Salario Mínimo, Vital y Móvil."},{"n":427,"p":["Después que prestan su declaración, los testigos deben permanecer en la sala del Juzgado hasta que concluya la audiencia, a no ser que el Juez disponga lo contrario."],"t":"Permanencia","s":"Después que prestan su declaración, los testigos deben permanecer en la sala del Juzgado hasta que concluya la audiencia, a no ser que el Juez disponga lo contrario."},{"n":428,"p":["Se puede decretar el careo entre testigos o entre éstos y las partes.","Si por residir los testigos o las partes en diferentes lugares el careo es dificultoso o imposible, el Juez puede disponer nuevas declaraciones por separado, de acuerdo con el interrogatorio que él formula."],"t":"Careo","s":"Se puede decretar el careo entre testigos o entre éstos y las partes."},{"n":429,"p":["Si las declaraciones ofrecen indicios graves de falso testimonio u otro delito, el Juez puede decretar la detención de los presuntos culpables, remitiéndolos a disposición del Juez competente, a quien se envía también testimonio de lo actuado."],"t":"Falso test
