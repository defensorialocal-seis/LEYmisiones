ebe proveer por la parte que incurre en ella, en los términos del Artículo 768.","Si la oposición a la constitución del tribunal arbitral es fundada, el Juez así lo declara, con costas, previa sustanciación por el trámite de los incidentes, si es necesario.","Si las partes concuerdan en la celebración del compromiso, pero no sobre los puntos que contiene, el Juez debe resolver lo que corresponde."],"t":"Demanda","s":"Puede demandarse la constitución de tribunal arbitral, cuando una o más cuestiones deben ser decididas por árbitros."},{"n":771,"p":["Los árbitros son nombrados por las partes, pudiendo el tercero ser designado por ellas, o por los mismos árbitros, si están facultados. Si no hay acuerdo, el nombramiento debe ser hecho por el Juez competente.","La designación sólo puede recaer en personas mayores de edad y que estén en el pleno ejercicio de los derechos civiles."],"t":"Nombramiento","s":"Los árbitros son nombrados por las partes, pudiendo el tercero ser designado por ellas, o por los mismos árbitros, si están facultados. Si no hay acuerdo, el nombramiento debe ser hecho por el Juez competente."},{"n":772,"p":["Otorgado el compromiso, se hace saber a los árbitros para la aceptación del cargo ante el Secretario del Juzgado, con juramento o promesa de fiel desempeño.","Si alguno de los árbitros renuncia, admite la recusación, se incapacita o fallece, se lo debe reemplazar en la forma acordada en el compromiso. Si nada se previó, lo designa el Juez."],"t":"Aceptación del cargo","s":"Otorgado el compromiso, se hace saber a los árbitros para la aceptación del cargo ante el Secretario del Juzgado, con juramento o promesa de fiel desempeño."},{"n":773,"p":["La aceptación de los árbitros da derecho a las partes para compelerlos a que cumplan con su cometido, bajo pena de responder por daños y perjuicios."],"t":"Desempeño de los árbitros","s":"La aceptación de los árbitros da derecho a las partes para compelerlos a que cumplan con su cometido, bajo pena de responder por daños y perjuicios."},{"n":774,"p":["Los árbitros designados por el Juzgado pueden ser recusados por las mismas causas que los jueces. Los nombrados de común acuerdo por las partes, únicamente por causas posteriores al nombramiento.","Los árbitros no pueden ser recusados sin causa. Sólo son removidos por consentimiento de las partes y decisión del Juez."],"t":"Recusación","s":"Los árbitros designados por el Juzgado pueden ser recusados por las mismas causas que los jueces. Los nombrados de común acuerdo por las partes, únicamente por causas posteriores al nombramiento. Los árbitros no pueden ser recusados sin causa."},{"n":775,"p":["La recusación debe deducirse ante los mismos árbitros, dentro de los cinco (5) días de conocido el nombramiento.","Si el recusado no la admite, debe conocer de la recusación el Juez ante quien se otorgó el compromiso o el que debió conocer si aquél no se celebró.","Se aplican las normas de los Artículos 17 y siguientes, en lo pertinente.","La resolución del Juez es irrecurrible.","El procedimiento queda suspendido mientras no se decida sobre la recusación."],"t":"Trámite de la recusación","s":"La recusación debe deducirse ante los mismos árbitros, dentro de los cinco (5) días de conocido el nombramiento. Si el recusado no la admite, debe conocer de la recusación el Juez ante quien se otorgó el compromiso o el que debió conocer si aquél no se celebró."},{"n":776,"p":["El compromiso cesa en sus efectos:","1) por decisión unánime de los que lo contrajeron;","2) por el transcurso del plazo señalado en el compromiso, o del legal en su defecto, sin perjuicio de la responsabilidad de los árbitros por daños e intereses, si por su culpa transcurrió inútilmente el plazo que corresponde, o del pago de la multa mencionada en el Artículo 768, inciso 4), si la culpa es de alguna de las partes;","3) si durante tres (3) meses las partes o los árbitros no realizaron ningún acto tendiente a impulsar el procedimiento."],"t":"Extinción del compromiso","s":"El compromiso cesa en sus efectos: 1) por decisión unánime de los que lo contrajeron;"},{"n":777,"p":["Toda la sustanciación del juicio arbitral se hace ante un Secretario, quien debe ser persona capaz, en el pleno ejercicio de sus derechos civiles, e idóneo para el desempeño del cargo.","Es nombrado por las partes o por el Juez, en su caso, a menos que en el compromiso se encomendó su designación a los árbitros. Presta juramento o promesa de desempeñar fielmente el cargo ante el tribunal arbitral."],"t":"Secretario","s":"Toda la sustanciación del juicio arbitral se hace ante un Secretario, quien debe ser persona capaz, en el pleno ejercicio de sus derechos civiles, e idóneo para el desempeño del cargo."},{"n":778,"p":["Los árbitros designan a uno de ellos como presidente. Este dirige el procedimiento y dicta, por sí solo, las providencias de mero trámite.","Sólo las diligencias de prueba pueden ser delegadas en uno de los árbitros; en lo demás, actúan siempre formando tribunal."],"t":"Actuación del tribunal","s":"Los árbitros designan a uno de ellos como presidente. Este dirige el procedimiento y dicta, por sí solo, las providencias de mero trámite. Sólo las diligencias de prueba pueden ser delegadas en uno de los árbitros; en lo demás, actúan siempre formando tribunal."},{"n":779,"p":["Si en la cláusula compromisoria, en el compromiso, o en un acto posterior de las partes no se fijó el procedimiento, los árbitros deben observar el del juicio ordinario o sumarísimo, según lo establezcan, teniendo en cuenta la naturaleza e importancia económica de la causa. Esta resolución es irrecurrible."],"t":"Procedimiento","s":"Si en la cláusula compromisoria, en el compromiso, o en un acto posterior de las partes no se fijó el procedimiento, los árbitros deben observar el del juicio ordinario o sumarísimo, según lo establezcan, teniendo en cuenta la naturaleza e importancia económic"},{"n":780,"p":["Si a los árbitros les resulta imposible pronunciarse antes de que la autoridad judicial decida alguna de las cuestiones que por el Artículo 765 no pueden ser objeto de compromiso, u otras que deban tener prioridad y no les fueron sometidas, el plazo para laudar queda suspendido hasta el día en que una de las partes entrega a los árbitros un testimonio de la sentencia ejecutoriada que resolvió dichas cuestiones."],"t":"Cuestiones previas","s":"Si a los árbitros les resulta imposible pronunciarse antes de que la autoridad judicial decida alguna de las cuestiones que por el Artículo 765 no pueden ser objeto de compromiso, u otras que deban tener prioridad y no les fueron sometidas, el plazo para lauda"},{"n":781,"p":["Los árbitros no pueden decretar medidas compulsorias, ni de ejecución. Deben requerirlas al Juez y éste debe prestar el auxilio de su jurisdicción para la más rápida y eficaz sustanciación del proceso arbitral."],"t":"Medida de ejecución","s":"Los árbitros no pueden decretar medidas compulsorias, ni de ejecución. Deben requerirlas al Juez y éste debe prestar el auxilio de su jurisdicción para la más rápida y eficaz sustanciación del proceso arbitral."},{"n":782,"p":["Los árbitros pronuncian su fallo sobre todas las pretensiones sometidas a su decisión, dentro del plazo fijado en el compromiso, con las prórrogas convenidas por los interesados, en su caso.","Se entiende que quedan también comprometidas las cuestiones meramente accesorias y aquéllas cuya sustanciación ante los árbitros quedaron consentidas."],"t":"Contenido del laudo","s":"Los árbitros pronuncian su fallo sobre todas las pretensiones sometidas a su decisión, dentro del plazo fijado en el compromiso, con las prórrogas convenidas por los interesados, en su caso."},{"n":783,"p":["Si las partes no establecieron el plazo dentro del cual debe pronunciarse el laudo, lo fija el Juez atendiendo a las circunstancias del caso.","El plazo para laudar es continuo y sólo se interrumpe cuando deba procederse a sustituir árbitros.","Si una de las partes fallece, se considera prorrogado por treinta (30) días.","A petición de los árbitros, el Juez puede prorrogar el plazo, si la demora no les es imputable."],"t":"Plazo","s":"Si las partes no establecieron el plazo dentro del cual debe pronunciarse el laudo, lo fija el Juez atendiendo a las circunstancias del caso. El plazo para laudar es continuo y sólo se interrumpe cuando deba procederse a sustituir árbitros."},{"n":784,"p":["Los árbitros que, sin causa justificada, no pronuncian el laudo dentro del plazo, carecen de derecho a honorarios. Son asimismo responsables por los daños y perjuicios."],"t":"Responsabilidad de los árbitros","s":"Los árbitros que, sin causa justificada, no pronuncian el laudo dentro del plazo, carecen de derecho a honorarios. Son asimismo responsables por los daños y perjuicios."},{"n":785,"p":["Es válido el laudo firmado por la mayoría si alguno de los árbitros se resistió a reunirse para deliberar o para pronunciarlo.","Si no puede formarse mayoría porque las opiniones o votos contienen soluciones inconciliables en la totalidad de los puntos comprometidos, se nombra otro árbitro para que dirima.","Si existe mayoría respecto de alguna de las cuestiones, se lauda sobre ellas. Las partes o el Juez, en su caso, deben designar un nuevo integrante del tribunal para que dirima sobre las demás y fijan el plazo para que se pronuncie."],"t":"Mayoría","s":"Es válido el laudo firmado por la mayoría si alguno de los árbitros se resistió a reunirse para deliberar o para pronunciarlo."},{"n":786,"p":["Contra la sentencia arbitral pueden interponerse los recursos admisibles respecto de las sentencias de los jueces, si no fueron renunciados en el compromiso."],"t":"Recursos","s":"Contra la sentencia arbitral pueden interponerse los recursos admisibles respecto de las sentencias de los jueces, si no fueron renunciados en el compromiso."},{"n":787,"p":["Los recursos deben deducirse ante el tribunal arbitral, dentro de los cinco (5) días, por escrito fundado.","Si son denegados, son aplicables los Artículos 283 y 284, en lo pertinente."],"t":"Interposición","s":"Los recursos deben deducirse ante el tribunal arbitral, dentro de los cinco (5) días, por escrito fundado. Si son denegados, son aplicables los Artículos 283 y 284, en lo pertinente."},{"n":788,"p":["Nulidad. Si los recursos fueron renunciados, se deniegan sin sustanciación alguna.","La renuncia de los recursos no obsta, sin embargo, a la admisibilidad del de aclaratoria y de nulidad, fundada en falta esencial del procedimiento, en haber fallado los árbitros fuera del plazo, o sobre puntos no comprometidos. En este último caso, la nulidad es parcial si el pronunciamiento es divisible.","Este recurso se resuelve sin sustanciación alguna, con la sola vista del expediente."],"t":"Renuncia de recursos. Aclaratoria","s":"Nulidad. Si los recursos fueron renunciados, se deniegan sin sustanciación alguna."},{"n":789,"p":["Es nulo el laudo que contiene en la parte dispositiva decisiones incompatibles entre sí.","Se aplican subsidiariamente las disposiciones sobre nulidades establecidas por este Código.","Si el proceso se sustanció regularmente y la nulidad es únicamente del laudo, a petición de parte, el Juez debe pronunciar sentencia, que es recurrible por aplicación de las normas comunes."],"t":"Laudo nulo","s":"Es nulo el laudo que contiene en la parte dispositiva decisiones incompatibles entre sí. Se aplican subsidiariamente las disposiciones sobre nulidades establecidas por este Código."},{"n":790,"p":["Si se estipuló la multa indicada en el Artículo 769, inciso 4), no se admite recurso alguno, si quien lo interpone no satisface su importe.","Si el recurso deducido es el de nulidad por las causales expresadas en los Artículos 788 y 789 el importe de la multa debe ser depositado hasta la decisión del recurso. Si se declara la nulidad, debe ser devuelto al recurrente. En caso contrario, se entrega a la otra parte."],"t":"Pago de la multa","s":"Si se estipuló la multa indicada en el Artículo 769, inciso 4), no se admite recurso alguno, si quien lo interpone no satisface su importe."},{"n":791,"p":["Conoce de los recursos el tribunal jerárquicamente superior al Juez a quien habría correspondido conocer si la cuestión no se hubiere sometido a árbitros, salvo que el compromiso establezca la competencia de otros árbitros para entender en dichos recursos."],"t":"Recursos","s":"Conoce de los recursos el tribunal jerárquicamente superior al Juez a quien habría correspondido conocer si la cuestión no se hubiere sometido a árbitros, salvo que el compromiso establezca la competencia de otros árbitros para entender en dichos recursos."},{"n":792,"p":["Si el compromiso se celebró respecto de un juicio pendiente en última instancia, el fallo de los árbitros causa ejecutoria."],"t":"Pleito pendiente","s":"Si el compromiso se celebró respecto de un juicio pendiente en última instancia, el fallo de los árbitros causa ejecutoria."},{"n":793,"p":["A los jueces y funcionarios del Poder Judicial les está prohibido, bajo pena de nulidad, aceptar el nombramiento de árbitros o amigables componedores, salvo si en el juicio es parte la Nación o una Provincia."],"t":"Jueces y funcionarios","s":"A los jueces y funcionarios del Poder Judicial les está prohibido, bajo pena de nulidad, aceptar el nombramiento de árbitros o amigables componedores, salvo si en el juicio es parte la Nación o una Provincia."},{"n":794,"p":["Pueden someterse a la decisión de arbitradores o amigables componedores, las cuestiones que puedan ser objeto del juicio de árbitros.","Si nada se estipuló en el compromiso acerca de si el arbitraje es de derecho o de amigables componedores, o si se autorizó a los árbitros a decidir la controversia según equidad, se entiende que es de amigables componedores."],"t":"Objeto. Clase de arbitraje","s":"Pueden someterse a la decisión de arbitradores o amigables componedores, las cuestiones que puedan ser objeto del juicio de árbitros."},{"n":795,"p":["Se aplica al juicio de amigables componedores lo prescripto para los árbitros respecto de:","1) la capacidad de los contrayentes;","2) el contenido y forma del compromiso;","3) la calidad que deben tener los arbitradores y forma de nombramiento;","4) la aceptación del cargo y responsabilidad de los arbitradores;","5) el modo de reemplazarlos;","6) la forma de acordar y pronunciar el laudo."],"t":"Normas comunes","s":"Se aplica al juicio de amigables componedores lo prescripto para los árbitros respecto de: 1) la capacidad de los contrayentes; 2) el contenido y forma del compromiso; 3) la calidad que deben tener los arbitradores y forma de nombramiento;"},{"n":796,"p":["Los amigables componedores pueden ser recusados únicamente por causas posteriores al nombramiento. Sólo son causas legales de recusación:","1) interés directo o indirecto en el asunto;","2) parentesco dentro del cuarto grado de consanguinidad, o segundo de afinidad con alguna de las partes;","3) enemistad manifiesta con aquéllas, por hechos determinados.","En el incidente de recusación se procede según lo prescripto para la de los árbitros."],"t":"Recusaciones","s":"Los amigables componedores pueden ser recusados únicamente por causas posteriores al nombramiento. Sólo son causas legales de recusación: 1) interés directo o indirecto en el asunto;"},{"n":797,"p":["Los amigables componedores proceden sin sujeción a formas legales, limitándose a recibir los antecedentes o documentos que las partes les presentan, a pedirles las explicaciones que creen convenientes, y a dictar sentencia según su saber y entender."],"t":"Procedimiento. Carácter de la actuación","s":"Los amigables componedores proceden sin sujeción a formas legales, limitándose a recibir los antecedentes o documentos que las partes les presentan, a pedirles las explicaciones que creen convenientes, y a dictar sentencia según su saber y entender."},{"n":798,"p":["Si las partes no fijaron plazo, los amigables componedores deben pronunciar el laudo dentro de los tres (3) meses de la última aceptación."],"t":"Plazo","s":"Si las partes no fijaron plazo, los amigables componedores deben pronunciar el laudo dentro de los tres (3) meses de la última aceptación."},{"n":799,"p":["El laudo de los amigables componedores no es recurrible, pero si se pronunció fuera del plazo o sobre puntos no comprometidos, las partes pueden demandar su nulidad dentro de cinco (5) días de notificado.","Presentada la demanda, el Juez da traslado a la otra parte por cinco (5) días. Vencido este plazo, contestado o no el traslado, el Juez debe resolver acerca de la validez o nulidad del laudo, sin recurso alguno."],"t":"Nulidad","s":"El laudo de los amigables componedores no es recurrible, pero si se pronunció fuera del plazo o sobre puntos no comprometidos, las partes pueden demandar su nulidad dentro de cinco (5) días de notificado."},{"n":800,"p":["Los árbitros y amigables componedores se deben pronunciar acerca de la imposición de las costas, en la forma prescripta en los Artículos 68 y siguientes.","La parte que no realiza los actos indispensables para la realización del compromiso, además de la multa prevista en el Artículo 768, inciso 4), si fue estipulado, debe pagar las costas.","Los honorarios de los árbitros, Secretario del Tribunal, abogados, procuradores y demás profesionales, son regulados por el Juez.","Los árbitros pueden solicitar al Juez que ordene el depósito o embargo de la suma que puede corresponderles por honorarios, si los bienes objeto del juicio no constituyen garantía suficiente."],"t":"Costas. Honorarios","s":"Los árbitros y amigables componedores se deben pronunciar acerca de la imposición de las costas, en la forma prescripta en los Artículos 68 y siguientes."},{"n":801,"p":["La pericia arbitral procede en el caso del Artículo 484 y cuando las leyes establecen ese procedimiento con el nombre de juicio de árbitros, arbitradores, peritos o peritos árbitros para que resuelvan exclusivamente cuestiones de hecho concretadas expresamente.","Son de aplicación las reglas del juicio de amigables componedores, debiendo tener los peritos árbitros especialidad en la materia; basta que el compromiso exprese la fecha, los nombres de los otorgantes y del o de los árbitros, así como los hechos sobre los que han de laudar, pero es innecesario cuando la materia del pronunciamiento y la individualización de las partes resultan determinados por la resolución judicial que dispone la pericia arbitral o determinables por los antecedentes que lo provocaron.","Si no existe plazo fijado, deben pronunciarse dentro de un (1) mes a partir de la última aceptación.","Si no media acuerdo de las partes, el Juez debe determinar la imposición de costas y regular los honorarios.","La decisión judicial que, en su caso, debe pronunciarse en todo juicio relacionado con las cuestiones de hecho laudadas, se debe ajustar a lo establecido en la pericia arbitral."],"t":"Régimen","s":"La pericia arbitral procede en el caso del Artículo 484 y cuando las leyes establecen ese procedimiento con el nombre de juicio de árbitros, arbitradores, peritos o peritos árbitros para que resuelvan exclusivamente cuestiones de hecho concretadas expresamente"},{"n":802,"p":["La segunda copia de una escritura pública, cuando su otorgamiento requiere autorización judicial, se otorga previa citación de quienes participaron en aquélla, o del Ministerio Público en su defecto.","Si se deduce oposición, se sigue el trámite del juicio sumarísimo.","La segunda copia se expide previo certificado del registro inmobiliario, acerca de la inscripción del título y estado del dominio, en su caso."],"t":"Segunda copia de escritura pública","s":"La segunda copia de una escritura pública, cuando su otorgamiento requiere autorización judicial, se otorga previa citación de quienes participaron en aquélla, o del Ministerio Público en su defecto."},{"n":803,"p":["La renovación de títulos mediante prueba sobre su contenido, en los casos en que no es posible obtener segunda copia, se sustancia en la forma establecida en el Artículo 802.","El título supletorio debe protocolizarse en el registro nacional del lugar del tribunal, que designe el interesado."],"t":"Renovación de títulos","s":"La renovación de títulos mediante prueba sobre su contenido, en los casos en que no es posible obtener segunda copia, se sustancia en la forma establecida en el Artículo 802."},{"n":804,"p":["El derecho del socio para examinar los libros de la sociedad se hace efectivo, sin sustanciación, con la sola presentación del contrato, decretándose las medidas necesarias si corresponde. El Juez puede requerir el cumplimiento de los recaudos necesarios para establecer la vigencia de aquél. La resolución es irrecurrible."],"t":"Trámite","s":"El derecho del socio para examinar los libros de la sociedad se hace efectivo, sin sustanciación, con la sola presentación del contrato, decretándose las medidas necesarias si corresponde."},{"n":805,"p":["Cuando el comprador se resiste a recibir las mercaderías compradas, sosteniendo que su calidad no es la estipulada, si no se opta por el procedimiento establecido en el Artículo 801, el Juez debe decretar, sin otra sustanciación, a solicitud del vendedor o de aquél, su reconocimiento por uno (1) o tres (3) peritos, según el caso, que designa de oficio. Para el acto de reconocimiento y al solo efecto de controlarlo y formular las protestas escritas que considera pertinentes, debe citar a la otra parte, si se encuentra en el lugar, o al defensor de ausentes, en su caso, con la habilitación de día y hora.","Igual procedimiento se sigue siempre que la persona que debe entregar o recibir mercaderías, quiera hacer constar su calidad o el estado en que se encuentren."],"t":"Reconocimiento de mercaderías","s":"Cuando el comprador se resiste a recibir las mercaderías compradas, sosteniendo que su calidad no es la estipulada, si no se opta por el procedimiento establecido en el Artículo 801, el Juez debe decretar, sin otra sustanciación, a solicitud del vendedor o de "},{"n":806,"p":["Cuando la ley faculta al comprador para adquirir mercaderías por cuenta del vendedor, la autorización se concede con citación de éste, quien puede alegar sus defensas dentro de tres (3) días.","Si el vendedor no comparece o no se opone, el tribunal debe acordar la autorización. Formulada oposición el tribunal resuelve previa información verbal.","La resolución es irrecurrible y no causa instancia."],"t":"Adquisición de mercaderías por cuenta del vendedor","s":"Cuando la ley faculta al comprador para adquirir mercaderías por cuenta del vendedor, la autorización se concede con citación de éste, quien puede alegar sus defensas dentro de tres (3) días."},{"n":807,"p":["Cuando la ley autoriza al vendedor a efectuar la venta de mercaderías por cuenta del comprador, el Tribunal decreta el remate público con citación de aquél, si se encuentra en el lugar, o del defensor de ausentes, en su caso, sin determinar si la venta es o no por cuenta del comprador."],"t":"Venta de mercaderías por cuenta del comprador","s":"Cuando la ley autoriza al vendedor a efectuar la venta de mercaderías por cuenta del comprador, el Tribunal decreta el remate público con citación de aquél, si se encuentra en el lugar, o del defensor de ausentes, en su caso, sin determinar si la venta es o no"},{"n":808,"p":["De acuerdo a lo dispuesto por la Constitución de la Provincia, se puede demandar la declaración de inconstitucionalidad de ley, decreto, ordenanza, resolución o reglamento que estatuye sobre materia regida por aquélla, debiendo observarse el siguiente procedimiento."],"t":"Objeto del juicio","s":"De acuerdo a lo dispuesto por la Constitución de la Provincia, se puede demandar la declaración de inconstitucionalidad de ley, decreto, ordenanza, resolución o reglamento que estatuye sobre materia regida por aquélla, debiendo observarse el siguiente procedim"},{"n":809,"p":["La demanda se interpone ante el Superior Tribunal de Justicia dentro del plazo de treinta (30) días computados desde que el precepto impugnado afecte concretamente los derechos patrimoniales del actor.","Después de vencido ese plazo, se considera extinguida la competencia originaria del Superior Tribunal sin perjuicio de la facultad del interesado para ocurrir a la jurisdicción ordinaria en defensa de los derechos patrimoniales que estima afectados.","Se entiende que el segundo párrafo del presente artículo, no es comprensivo de la materia prevista en el Artículo 808, respecto de la cual debe estarse a lo previsto en el párrafo primero de la presente norma."],"t":"Plazo para demandar","s":"La demanda se interpone ante el Superior Tribunal de Justicia dentro del plazo de treinta (30) días computados desde que el precepto impugnado afecte concretamente los derechos patrimoniales del actor."},{"n":810,"p":["No rige dicho plazo, cuando se trata de leyes, decretos, ordenanzas, resoluciones o reglamentos, de carácter institucional o que afectan derechos de la personalidad no patrimoniales.","Tampoco rige, cualquiera sea la naturaleza de los preceptos impugnados, cuando éstos no fueron aún aplicados al demandante y la acción se ejercita con finalidad preventiva."],"t":"Excepciones","s":"No rige dicho plazo, cuando se trata de leyes, decretos, ordenanzas, resoluciones o reglamentos, de carácter institucional o que afectan derechos de la personalidad no patrimoniales."},{"n":811,"p":["El Presidente del Tribunal da traslado de la demanda por quince (15) días:","1) al Fiscal de Estado, asesor de gobierno o funcionario que hace sus veces, según el caso, cuando el acto impugnado es dictado por los poderes legislativo o ejecutivo;","2) a los representantes legales de las Municipalidades, o a los funcionarios que ejercen la titularidad de los organismos involucrados, cuando los preceptos emanan de dichas entidades."],"t":"Traslado. Funcionarios competentes","s":"El Presidente del Tribunal da traslado de la demanda por quince (15) días: 1) al Fiscal de Estado, asesor de gobierno o funcionario que hace sus veces, según el caso, cuando el acto impugnado es dictado por los poderes legislativo o ejecutivo;"},{"n":812,"p":["Contestado el traslado o vencido el plazo, el Presidente debe ordenar las medidas probatorias que considera convenientes, fijando el término para su diligenciamiento. Concluida la causa para definitiva, se debe oír al Procurador General y se dicta la providencia de autos."],"t":"Medidas probatorias. Conclusión para definitiva","s":"Contestado el traslado o vencido el plazo, el Presidente debe ordenar las medidas probatorias que considera convenientes, fijando el término para su diligenciamiento."},{"n":813,"p":["Si el Superior Tribunal estima que la ley, decreto, ordenanza, resolución o reglamento cuestionados, son contrarios a la cláusula o cláusulas de la Constitución que se citaron, debe hacer la correspondiente declaración sobre los puntos discutidos.","Si por el contrario no halla infracción constitucional, debe desechar la demanda."],"t":"Contenido de la decisión","s":"Si el Superior Tribunal estima que la ley, decreto, ordenanza, resolución o reglamento cuestionados, son contrarios a la cláusula o cláusulas de la Constitución que se citaron, debe hacer la correspondiente declaración sobre los puntos discutidos."},{"n":814,"p":["Las causas de competencia entre los poderes públicos de la Provincia son resueltas por el Superior Tribunal de Justicia a la vista de los antecedentes que le son remitidos y previo dictamen del Procurador General.","Deducida la demanda, el Superior Tribunal de Justicia debe requerir del otro Poder el envío de los antecedentes constitutivos del conflicto, los que deben ser remitidos dentro de los cinco (5) días a más tardar, con prevención de que será resuelto con los presentados por el Poder demandante si no lo fueron."],"t":"Tribunal competente","s":"Las causas de competencia entre los poderes públicos de la Provincia son resueltas por el Superior Tribunal de Justicia a la vista de los antecedentes que le son remitidos y previo dictamen del Procurador General."},{"n":815,"p":["El Procurador General debe expedirse en el plazo de cinco (5) días y el Superior Tribunal resolver de inmediato, comunicando la resolución a quien corresponde."],"t":"Resolución","s":"El Procurador General debe expedirse en el plazo de cinco (5) días y el Superior Tribunal resolver de inmediato, comunicando la resolución a quien corresponde."},{"n":816,"p":["Anualmente el Superior Tribunal de Justicia debe actualizar los montos que se encuentran en sumas fijas."],"t":"Actualización","s":"Anualmente el Superior Tribunal de Justicia debe actualizar los montos que se encuentran en sumas fijas."},{"n":817,"p":["Las disposiciones del presente código entran en vigencia a partir del 1° de marzo de 2014 y se aplican a todos los juicios iniciados a partir de esa fecha, y a los que se encuentran en trámite en todos aquellos actos procesales que no tengan principio de ejecución a ese momento. Aquellos actos procesales que tengan principio de ejecución a esa fecha deben concluir conforme el régimen procesal bajo cuya vigencia tuvieron inicio."],"t":"Vigencia","s":"Las disposiciones del presente código entran en vigencia a partir del 1° de marzo de 2014 y se aplican a todos los juicios iniciados a partir de esa fecha, y a los que se encuentran en trámite en todos aquellos actos procesales que no tengan principio de ejecu"},{"n":818,"p":["Abrógase la Ley XII - N.º 6 (Antes Ley 2335), a partir del 1.° de marzo de 2014, salvo para lo previsto en la parte in fine del Artículo 817."],"t":"Abrogación","s":"Abrógase la Ley XII - N.º 6 (Antes Ley 2335), a partir del 1.° de marzo de 2014, salvo para lo previsto en la parte in fine del Artículo 817."},{"n":819,"p":["Comuníquese al Poder Ejecutivo."],"t":"De forma","s":"Comuníquese al Poder Ejecutivo."}]}</script>

const hit=(tokens,acc)=>{for(const a of acc)for(const t of tokens)if(near(a,t))return true;return false};
let ixd=0;const idx=()=>{if(ixd)return;ixd=1;A.forEach(a=>{a._m=new Set(words(rub(a)+' '+a.s+' '+a.n).map(stem));a._a=new Set([...a._m,...words(a.p.join(' ')).map(stem)])})};
const W=/[A-Za-zÁÉÍÓÚÜáéíóúüÑñ0-9]+/g,mk=(w,accs)=>{const s=stem(norm(w));return accs.some(a=>[...a].some(x=>near(x,s)))};
function hl(t,accs){let o='',p=0;for(const m of t.matchAll(W)){o+=esc(t.slice(p,m.index))+(mk(m[0],accs)?'<mark>'+esc(m[0])+'</mark>':esc(m[0]));p=m.index+m[0].length}return o+esc(t.slice(p))}
let lib='';
function setLib(v){lib=v;document.querySelectorAll('#fc .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.l===v))}
function search(v){const terms=[...new Set(words(v).filter(w=>!STOP.has(w)||/^\d+$/.test(w)))];if(!terms.length)return route();
if(/^\d+$/.test(v.trim())&&byN[+v]){location.hash='/a/'+(+v);return}
idx();main.style.cssText='';const accs=terms.map(accepted),inL=a=>!lib||(nodeOf[a.n]!=null&&root(nodeOf[a.n])==+lib);
const run=need=>A.filter(a=>inL(a)&&accs.filter(x=>hit(a._a,x)).length>=need);
let rs=run(terms.length),partial=false;if(!rs.length&&terms.length>1){partial=true;rs=run(Math.max(1,Math.ceil(terms.length/2)))}
rs=rs.map(a=>({a,s:accs.some(x=>hit(a._m,x))?0:1,k:accs.filter(x=>hit(a._a,x)).length})).sort((x,y)=>y.k-x.k||x.s-y.s||x.a.n-y.a.n);
const snip=a=>{const b=a.p.join(' ');let ix=0;for(const m of b.matchAll(W))if(mk(m[0],accs)){ix=m.index;break}const st=Math.max(0,ix-70);return(st?'…':'')+b.slice(st,st+240)+(b.length>st+240?'…':'')};
main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Búsqueda</span></nav><div class="sec"><h2>Resultados para «${esc(v)}»</h2><span>${rs.length} artículo${rs.length==1?'':'s'}${rs.length>60?' · se muestran 60':''}${lib?' · '+esc(label(N[+lib])):''}</span></div><p class="hint">${partial?'Coincidencia parcial: no hay artículos con todas las palabras, se muestran los que tienen al menos la mitad. ':''}La búsqueda entiende varias palabras en cualquier orden, sinónimos y números (5 = cinco), y también busca dentro del texto completo.</p><div class="res">${rs.slice(0,60).map(({a})=>{const n=N[nodeOf[a.n]];return `<article class="art"><header><div class="num">Art. ${a.n}</div><div><h4>${hl(rub(a),accs)}<small>${n?esc(label(N[root(n.i)])+' › '+label(n)+(n.name?' · '+tc(n.name):'')):''}</small></h4><p class="sum">${hl(snip(a),accs)}</p></div></header><div class="acts"><a class="btn sm" href="#/a/${a.n}">Abrir artículo en su sección</a></div></article>`}).join('')||'<p>Sin coincidencias. Probá con otra palabra o quitá el filtro de Libro.</p>'}</div>`}
function route(){const h=location.hash.slice(1)||'/',m=h.match(/^\/(n|a)\/(\d+)/);side.classList.remove('open');main.style.cssText='';{const ri=m?(m[1]=='n'?+m[2]:nodeOf[+m[2]]):null;setLib(ri!=null&&N[ri]?String(root(ri)):'')}if(h=='/plazos'){plazosView();window.scrollTo(0,0);return}
if(!m){home();window.scrollTo(0,0);side.querySelectorAll('.l.on').forEach(x=>x.classList.remove('on'));return}
if(m[1]=='n'&&N[+m[2]]){nodeView(+m[2]);window.scrollTo(0,0)}
else if(m[1]=='a'&&byN[+m[2]]){const n=+m[2];nodeView(nodeOf[n]);const e=document.getElementById('a'+n);if(e){e.classList.add('hit');e.querySelector('.full').hidden=false;e.querySelector('[data-act=t]').textContent='Ocultar texto completo';setTimeout(()=>e.scrollIntoView({block:'start'}),30)}}
else home()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,art=b.closest('.art');
if(act=='t'){const f=art.querySelector('.full');f.hidden=!f.hidden;b.textContent=f.hidden?'Ver texto completo':'Ocultar texto completo'}
else if(act=='all'||act=='none')document.querySelectorAll('.art').forEach(x=>{x.querySelector('.full').hidden=act=='none';x.querySelector('[data-act=t]').textContent=act=='none'?'Ver texto completo':'Ocultar texto completo'});
else if(act=='c'){const a=byN[+b.dataset.n];navigator.clipboard.writeText(`Artículo ${a.n}.- ${a.t}.\n\n`+(a.p.join('\n')+'\n')).then(()=>toast('Texto copiado'),()=>toast('No se pudo copiar'))}
else if(act=='l'){const u=location.href.split('#')[0]+'#/a/'+b.dataset.n;navigator.clipboard.writeText(u).then(()=>toast('Enlace copiado'),()=>toast('No se pudo copiar'))}});
$('#home').onclick=()=>{$('#q').value='';location.hash='/';route()};
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>search(e.target.value),180)};
$('#menu').onclick=()=>side.classList.toggle('open');

const P=JSON.parse(document.getElementById('pz').textContent);
const PZ=/((?:\(\d+\))(?:(?:\s*,\s*|\s+(?:o|u|y|e)\s+)(?:[a-záéíóúñ]+\s+)?\(\d+\))*)\s+(?:primeras\s+)?(d[ií]as(?:\s+h[aá]biles|\s+corridos)?|d[ií]a|meses|mes|a[ñn]os|a[ñn]o|horas|hora|minutos|semanas)/gi;
const ORD=/\b(segundo|tercer[o]?|cuarto|quinto|sexto|s[eé]ptimo|octavo|noveno|d[eé]cimo)\s+d[ií]a/gi;
const ORDV={segundo:2,tercer:3,tercero:3,cuarto:4,quinto:5,sexto:6,septimo:7,octavo:8,noveno:9,decimo:10};
const UN=u=>/^d/i.test(u)?'dia':/^mes/i.test(u)?'mes':/^a/i.test(u)?'ano':/^hora/i.test(u)?'hora':/^min/i.test(u)?'minuto':'semana';
A.forEach(a=>{const lab=new Set();a.zv=[];a.zp=null;
 a.p.forEach((p,pi)=>{for(const m of p.matchAll(PZ)){const nums=[...m[1].matchAll(/\((\d+)\)/g)].map(x=>+x[1]);nums.forEach(v=>a.zv.push({v,u:UN(m[2])}));lab.add(nums.join(' o ')+' '+m[2].toLowerCase());if(!a.zp)a.zp={pi,i:m.index,l:m[0].length,v:nums,u:UN(m[2])}}
  for(const m of p.matchAll(ORD)){const v=ORDV[norm(m[1])];a.zv.push({v,u:'dia'});lab.add(v+'.º día');if(!a.zp)a.zp={pi,i:m.index,l:m[0].length,v:[v],u:'dia'}}});
 a.z=[...lab]});
const byPz={};P.forEach(r=>(byPz[r.n]=byPz[r.n]||[]).push(r));
const hlpz=s=>s.replace(PZ,'<mark class="pz">$&</mark>').replace(ORD,'<mark class="pz">$&</mark>');
const zchips=a=>a.z.length?`<div class="zs">${a.z.map(z=>`<span class="chip pzc">⏱ ${esc(z)}</span>`).join('')}</div>`:'';
const pzlist=a=>byPz[a.n]?`<ul class="pzl">${byPz[a.n].map(r=>`<li>⏱ ${esc(r.e)} — <b>${esc(r.p)}</b></li>`).join('')}</ul>`:'';
const ST={ok:'✔ Verificado',fix:'✎ Corregido',rev:'⚠ Revisar'};
const UW={dia:'día',mes:'mes',ano:'año',hora:'hora',minuto:'minuto',semana:'semana'};
let ptab='a';
function plazosView(){const c={ok:0,fix:0,rev:0};P.forEach(r=>c[r.s]++);const nz=A.filter(a=>a.z.length).length;
main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Plazos</span></nav>
<header class="nh" style="--ac:var(--burg)"><span class="eyebrow" style="color:var(--burg)">Buscador</span><h1>Plazos procesales</h1><div class="meta"><span>${P.length} plazos del index</span><span>${nz} artículos con plazos en el texto</span></div></header>
<div class="box"><h4>Verificación del index</h4><p>Cada fila del index se contrastó con el texto de la ley: <b>${c.ok}</b> coinciden, <b>${c.fix}</b> fueron corregidas (artículo o plazo distinto del indicado) y <b>${c.rev}</b> quedan para revisión manual.</p></div>
<div class="tabs"><button data-t="a" class="${ptab=='a'?'on':''}">Tabla de plazos (index verificado)</button><button data-t="b" class="${ptab=='b'?'on':''}">Plazos detectados en cada artículo</button><button class="ib" style="margin-left:auto;color:var(--navy)" onclick="window.print()">🖨 Imprimir</button></div>
<div class="ctl"><input type="search" id="pq" placeholder="Buscar por acción, artículo o palabra…"><select id="pu"><option value="">Toda unidad</option><option value="dia">Días</option><option value="mes">Meses</option><option value="ano">Años</option><option value="hora">Horas</option><option value="minuto">Minutos</option></select><input type="number" id="pv" min="1" placeholder="N.º (ej. 5)">${ptab=='a'?'<select id="ps"><option value="">Todo estado</option><option value="ok">Verificados</option><option value="fix">Corregidos</option><option value="rev">A revisar</option></select>':''}</div>
<div id="pb"></div>`;
main.querySelectorAll('.tabs [data-t]').forEach(b=>b.onclick=()=>{ptab=b.dataset.t;plazosView()});
['pq','pu','pv','ps'].forEach(id=>{const e=document.getElementById(id);if(e)e.oninput=drawP});drawP()}
function drawP(){const q=norm($('#pq').value).split(/\s+/).filter(Boolean),u=$('#pu').value,v=$('#pv').value,s=$('#ps')?$('#ps').value:'',pb=$('#pb');
if(ptab=='a'){const rs=P.filter(r=>{const k=norm('art '+r.n+' '+r.e+' '+r.p);if(!q.every(w=>k.includes(w)))return false;if(s&&r.s!=s)return false;if(u&&!norm(r.p).includes(UW[u]))return false;if(v&&!new RegExp('(^|\\D)'+v+'(\\D|$)').test(r.p))return false;return true});
pb.innerHTML=`<p class="cnt">${rs.length} resultado${rs.length==1?'':'s'}</p><table class="tb"><thead><tr><th>Art.</th><th>Acción / evento</th><th>Plazo</th><th>Estado</th></tr></thead><tbody>${rs.map(r=>`<tr><td data-l="Artículo"><a class="chip" href="#/a/${r.n}">${r.n}</a></td><td data-l="Acción / evento">${esc(r.e)}${r.t?`<div class="nt">${esc(r.t)}</div>`:''}</td><td data-l="Plazo"><b>${esc(r.p)}</b></td><td data-l="Estado"><span class="bd ${r.s}">${ST[r.s]}</span></td></tr>`).join('')||'<tr><td colspan="4">Sin resultados.</td></tr>'}</tbody></table>`}
else{const rs=A.filter(a=>{if(!a.z.length)return false;if(!q.every(w=>a.k.includes(w)||String(a.n)==w))return false;if(u||v)return a.zv.some(z=>(!u||z.u==u)&&(!v||z.v==+v));return true});
const sn=a=>{const p=a.p[a.zp.pi],st=Math.max(0,a.zp.i-110);return (st?'…':'')+p.slice(st,a.zp.i+a.zp.l+120)+'…'};
pb.innerHTML=`<p class="cnt">${rs.length} artículo${rs.length==1?'':'s'}${rs.length>120?' · se muestran 120':''}</p>`+rs.slice(0,120).map(a=>`<article class="art"><header><div class="num">Art. ${a.n}</div><div><h4>${esc(rub(a))}</h4>${zchips(a)}<p class="snip">${hlpz(esc(sn(a)))}</p></div></header><div class="acts" style="margin-left:80px"><a class="btn sm" href="#/a/${a.n}">Abrir artículo</a></div></article>`).join('')}}

addEventListener('hashchange',()=>{$('#q').value='';route()});
$('#fc').innerHTML='<button class="chip" data-l="" aria-pressed="true">Todos</button>'+libros.map(l=>`<button class="chip" data-l="${l.i}" aria-pressed="false">${label(l)}</button>`).join('');
$('#fc').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;setLib(b.dataset.l);const v=$('#q').value;if(v.trim())search(v);else if(location.hash=='#/'+(lib?'n/'+lib:'')||(!lib&&(location.hash==''||location.hash=='#/')))route();else location.hash=lib?'/n/'+lib:'/'};
const th=()=>document.documentElement.style.setProperty('--th',$('.top').offsetHeight+'px');addEventListener('resize',th);document.fonts&&document.fonts.ready.then(th);th();
addEventListener('beforeprint',()=>document.querySelectorAll('.full').forEach(f=>f.hidden=false));
nav();route();th();
</script>
</body>
</html>
