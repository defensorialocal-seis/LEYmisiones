ia de la naturaleza"},{"n":539,"p":["Si se dispuso la venta de varios bienes, el Juez a pedido del ejecutado, puede ordenar que la subasta se realice en distintas fechas y que se suspenda cuando el precio obtenido alcanza a cubrir el crédito, intereses y costas reclamados."],"t":"Subasta progresiva","s":"Si se dispuso la venta de varios bienes, el Juez a pedido del ejecutado, puede ordenar que la subasta se realice en distintas fechas y que se suspenda cuando el precio obtenido alcanza a cubrir el crédito, intereses y costas reclamados."},{"n":540,"p":["Cualquiera sea la naturaleza de los bienes a subastar, a pedido de parte o de oficio el Juez puede disponer que se admitan posturas en sobre cerrado, en las condiciones que fije, que deben indicarse en los edictos y, en su caso, en la propaganda.","El Superior Tribunal de Justicia o las cámaras pueden establecer las reglas uniformes de aplicación de la expresada modalidad del remate.","Si se trata de subasta de muebles que se realiza por intermedio de instituciones oficiales que admiten posturas bajo sobre, se aplica esa modalidad en los términos que establecen las respectivas reglamentaciones."],"t":"Posturas bajo sobre","s":"Cualquiera sea la naturaleza de los bienes a subastar, a pedido de parte o de oficio el Juez puede disponer que se admitan posturas en sobre cerrado, en las condiciones que fije, que deben indicarse en los edictos y, en su caso, en la propaganda."},{"n":541,"p":["El comprador debe indicar, dentro del tercer día de realizada la subasta, el nombre de su comitente, en escrito firmado por ambos. En su defecto, se lo tiene por adjudicatario definitivo.","El comitente debe constituir domicilio en esa presentación, bajo apercibimiento de lo dispuesto en el Artículo 41, en lo pertinente."],"t":"Compra en comisión","s":"El comprador debe indicar, dentro del tercer día de realizada la subasta, el nombre de su comitente, en escrito firmado por ambos. En su defecto, se lo tiene por adjudicatario definitivo."},{"n":542,"p":["Si existen motivos fundados y sin perjuicio de la facultad del Juez para disponerlo de oficio, el ejecutante, el ejecutado o el martillero pueden solicitar al Juzgado la adopción de las medidas necesarias para proveer a la regularidad del remate y al mantenimiento del orden que asegure la libre oferta de los interesados.","SECCIÓN 3.a SUBASTA DE MUEBLES O SEMOVIENTES"],"t":"Regularidad del acto","s":"Si existen motivos fundados y sin perjuicio de la facultad del Juez para disponerlo de oficio, el ejecutante, el ejecutado o el martillero pueden solicitar al Juzgado la adopción de las medidas necesarias para proveer a la regularidad del remate y al mantenimi"},{"n":543,"p":["Si el embargo recae en bienes muebles o semovientes, se observan las siguientes reglas:","1) se ordena su venta en remate, sin base, al contado o con las facilidades de pago que por resolución fundada se establece, por un martillero público que se designa observando lo establecido en el Artículo 533;","2) en la resolución que dispone la venta se debe requerir al deudor para que, dentro del plazo de cinco (5) días, manifieste si los bienes están prendados o embargados. En el primer caso, aquél debe indicar el nombre y domicilio de los acreedores y el monto del crédito; en el segundo, el Juzgado, Secretaría y la carátula del expediente;","3) se puede ordenar el secuestro de las cosas, que deben ser entregadas al martillero para su exhibición y venta; al recibirlas éste, las individualiza con indicación de su estado y del lugar y fecha en que se lleva a cabo la entrega;","4) si se trata de muebles registrables, se debe requerir a los registros que corresponde un informe sobre las condiciones de dominio y gravámenes;","5) la providencia que decreta la venta es comunicada a los jueces embargantes; se notifica por cédula a los acreedores prendarios, quienes pueden formular las peticiones que estiman pertinentes, dentro del tercer día de notificados."],"t":"Subasta de muebles o semovientes","s":"Si el embargo recae en bienes muebles o semovientes, se observan las siguientes reglas:"},{"n":544,"p":["Al adjudicatario que plantea cuestiones manifiestamente improcedentes que demoran el pago del saldo del precio, se le impone la multa que prevé el Artículo 551.","Pagado totalmente el precio, el martillero o la parte que, en su caso, corresponde, debe entregar al comprador los bienes que éste adquirió, siempre que el Juzgado no disponga otra cosa.","SECCIÓN 4. a SUBASTA DE INMUEBLES","A) Decreto de la Subasta"],"t":"Articulaciones infundadas. Entrega de los bienes","s":"Al adjudicatario que plantea cuestiones manifiestamente improcedentes que demoran el pago del saldo del precio, se le impone la multa que prevé el Artículo 551."},{"n":545,"p":["Decretada la subasta se debe comunicar a los jueces embargantes e inhibientes.","Se cita a los acreedores hipotecarios para que dentro del tercer día presenten sus títulos. Los de grado preferente, dentro del mismo plazo, pueden solicitar el aumento de la base hasta cubrir el importe de sus créditos."],"t":"Embargos decretados por otros juzgados. Acreedores hipotecarios","s":"Decretada la subasta se debe comunicar a los jueces embargantes e inhibientes. Se cita a los acreedores hipotecarios para que dentro del tercer día presenten sus títulos."},{"n":546,"p":["Antes de ordenar la subasta, el Juez debe requerir informes:","1) sobre la deuda por impuestos, tasas y contribuciones;","2) sobre las deudas por expensas comunes, si se trata de un bien sujeto al régimen de propiedad horizontal;","3) sobre las condiciones de dominio, embargo e inhibición, según las constancias del Registro de Propiedad Inmueble. Los informes tienen una vigencia de noventa (90) días, a cuyo vencimiento deben ser actualizados.","Asimismo, debe intimar al deudor para que dentro del tercer día presente el título de propiedad del inmueble, bajo apercibimiento de obtener testimonio a su costa. No se debe realizar la subasta mientras no se agregue el título o, en su caso, el testimonio. Puede comprobarse judicialmente el estado de ocupación del bien si las circunstancias así lo aconsejan."],"t":"Recaudos","s":"Antes de ordenar la subasta, el Juez debe requerir informes: 1) sobre la deuda por impuestos, tasas y contribuciones; 2) sobre las deudas por expensas comunes, si se trata de un bien sujeto al régimen de propiedad horizontal;"},{"n":547,"p":["Cumplidos los recaudos a que se refiere el Artículo 546, se debe ordenar la subasta, designando martillero en los términos del Artículo 533 y determinar la base. Oportunamente se fija el lugar donde aquélla debe realizarse que debe ser donde tramita la ejecución, o el de ubicación del inmueble, según lo resuelve el Juez de acuerdo con lo que resulta más conveniente; se debe establecer también el día y la hora, que no pueden ser alterados salvo autorización del Juez o acuerdo de partes expresado por escrito.","Se debe especificar la propaganda adicional autorizada, en los términos del Artículo 537."],"t":"Designación del martillero. Lugar del remate","s":"Cumplidos los recaudos a que se refiere el Artículo 546, se debe ordenar la subasta, designando martillero en los términos del Artículo 533 y determinar la base."},{"n":548,"p":["Si no existe acuerdo de partes, se fija como base los dos tercios (2/3) de la valuación fiscal actualizada correspondiente al inmueble.","A falta de valuación, el Juez designa de oficio perito ingeniero, arquitecto o agrimensor para que realice la tasación; la base debe equivaler a las dos terceras (2/3) partes de dicha tasación.","Para la aceptación del cargo, plazo para el cumplimiento de la tarea y, en su caso, remoción, se aplican las reglas de los Artículos 449 y 450.","De la tasación se da traslado a las partes, quienes dentro de cinco (5) días comunes deben expresar su conformidad o disconformidad. Las objeciones deben ser fundadas.","El Juez tiene la facultad de apartarse de la tasación o de lo estipulado por las partes, fijando la base en una suma que impida que los bienes sean mal vendidos.","B) Constitución de Domicilio"],"t":"Base. Tasación","s":"Si no existe acuerdo de partes, se fija como base los dos tercios (2/3) de la valuación fiscal actualizada correspondiente al inmueble."},{"n":549,"p":["El martillero debe requerir al adjudicatario la constitución de domicilio en el lugar que corresponda al asiento del Juzgado. Si el comprador no lo constituye en ese acto y no lo denuncia oportunamente, se aplica la norma del Artículo 41, en lo pertinente.","C) Deberes y Facultades del Comprador"],"t":"Domicilio del comprador","s":"El martillero debe requerir al adjudicatario la constitución de domicilio en el lugar que corresponda al asiento del Juzgado. Si el comprador no lo constituye en ese acto y no lo denuncia oportunamente, se aplica la norma del Artículo 41, en lo pertinente."},{"n":550,"p":["Dentro de los cinco (5) días de aprobado el remate, el comprador debe depositar el importe del precio que corresponda abonar al contado, en el banco de depósitos judiciales; si no lo hace en esa oportunidad y no invoca motivos fundados para obtener la suspensión del plazo, se debe ordenar nueva subasta en los términos del Artículo 554.","La suspensión sólo debe ser concedida cuando median circunstancias totalmente ajenas a la conducta del adquirente y en situaciones que no pueden ser superadas con la sola indisponibilidad de los fondos.","El ejecutante y el ejecutado tienen legitimación para requerir el cumplimiento de las obligaciones del comprador."],"t":"Pago del precio. Suspensión del plazo","s":"Dentro de los cinco (5) días de aprobado el remate, el comprador debe depositar el importe del precio que corresponda abonar al contado, en el banco de depósitos judiciales; si no lo hace en esa oportunidad y no invoca motivos fundados para obtener la suspensi"},{"n":551,"p":["Al adjudicatario que plantea cuestiones manifiestamente improcedentes que demoran el pago del saldo del precio, se le impone una multa que puede ser del cinco por ciento (5%) al diez por ciento (10%) del precio obtenido en el remate."],"t":"Articulaciones infundadas del comprador","s":"Al adjudicatario que plantea cuestiones manifiestamente improcedentes que demoran el pago del saldo del precio, se le impone una multa que puede ser del cinco por ciento (5%) al diez por ciento (10%) del precio obtenido en el remate."},{"n":552,"p":["El comprador que realizó el depósito del importe del precio puede requerir su indisponibilidad hasta tanto se le otorgue la escritura, o se inscriba el bien a su nombre si prescinde de aquélla, salvo cuando la demora en la realización de estos trámites le es imputable.","La indisponibilidad no rige respecto de los gastos de escrituración y pago de impuestos.","D) Sobreseimiento del Juicio"],"t":"Pedido de indisponibilidad de fondos","s":"El comprador que realizó el depósito del importe del precio puede requerir su indisponibilidad hasta tanto se le otorgue la escritura, o se inscriba el bien a su nombre si prescinde de aquélla, salvo cuando la demora en la realización de estos trámites le es i"},{"n":553,"p":["El ejecutado sólo puede liberar los bienes depositando el importe del capital y de lo presupuestado en concepto de intereses y costas, sin perjuicio de la liquidación que ulteriormente corresponda; asimismo, una suma a favor del comprador, integrada por la comisión del martillero, sellado del boleto y el equivalente a una vez y media del monto de la seña.","Los importes deben ser satisfechos aunque el martillero descuente los gastos del remate de la cantidad correspondiente a seña.","La indemnización establecida sobre la base del valor de la seña es sin perjuicio de otras que pueden corresponder en concepto de responsabilidad civil.","La simple promesa de pago no autoriza a pedir el sobreseimiento; tampoco puede supeditarse el pago a la exigencia de una liquidación previa.","El ejecutado no puede requerir el sobreseimiento si el comprador depositó en pago el saldo del precio dentro de los plazos a que se refiere el Artículo 550, o antes. Por saldo de precio se entiende el que debe abonarse al contado.","La facultad de solicitar el sobreseimiento sólo puede ser ejercida por el ejecutado o, en su caso, sus herederos.","Si el adquirente es el acreedor autorizado a compensar, el ejecutado puede requerir el sobreseimiento antes de que se tenga por oblado o compensado el precio de venta con el crédito del adquirente.","En las cuestiones que se plantean acerca de la suficiencia del pago realizado por el ejecutado, el comprador sólo es parte en lo que se refiere a las sumas que pueden corresponderle de conformidad con lo establecido en el párrafo primero.","E) Nuevas Subastas"],"t":"Sobreseimiento del juicio","s":"El ejecutado sólo puede liberar los bienes depositando el importe del capital y de lo presupuestado en concepto de intereses y costas, sin perjuicio de la liquidación que ulteriormente corresponda; asimismo, una suma a favor del comprador, integrada por la com"},{"n":554,"p":["Cuando por culpa del postor, cuya oferta fue aceptada como definitiva en el acto de remate la venta no se formaliza, se debe ordenar nuevo remate. Dicho postor es responsable de la disminución real del precio que se obtiene en la nueva subasta, de los intereses acrecidos, de los gastos ocasionados y de las costas causadas con ese motivo.","El cobro del importe que resulta, previa liquidación, tramita por el procedimiento de ejecución de sentencia, quedando embargadas a ese efecto las sumas que el postor entregó."],"t":"Nueva subasta por incumplimiento del comprador","s":"Cuando por culpa del postor, cuya oferta fue aceptada como definitiva en el acto de remate la venta no se formaliza, se debe ordenar nuevo remate."},{"n":555,"p":["Si fracasa el remate por falta de postores, se debe disponer otro, reduciendo la base en un veinticinco por ciento (25%). Si tampoco existen postores, se ordena la venta sin limitación de precio.","F) Perfeccionamiento de la Venta. Trámites Posteriores. Desocupación del Inmueble."],"t":"Falta de postores","s":"Si fracasa el remate por falta de postores, se debe disponer otro, reduciendo la base en un veinticinco por ciento (25%). Si tampoco existen postores, se ordena la venta sin limitación de precio. F) Perfeccionamiento de la Venta. Trámites Posteriores."},{"n":556,"p":["La venta judicial sólo queda perfeccionada una vez aprobado el remate, pagado el precio o la parte que corresponde, si se otorgaron facilidades, y luego de realizada la tradición del inmueble a favor del comprador."],"t":"Perfeccionamiento de la venta","s":"La venta judicial sólo queda perfeccionada una vez aprobado el remate, pagado el precio o la parte que corresponde, si se otorgaron facilidades, y luego de realizada la tradición del inmueble a favor del comprador."},{"n":557,"p":["La escritura de protocolización de las actuaciones es extendida por escribano sin que sea necesaria la comparecencia del ejecutado.","El adquirente que solicita la escrituración toma a su cargo la realización de las diligencias tendientes a ella, pero no está obligado a soportar los gastos que corresponden a la otra parte."],"t":"Escrituración","s":"La escritura de protocolización de las actuaciones es extendida por escribano sin que sea necesaria la comparecencia del ejecutado."},{"n":558,"p":["Los embargos e inhibiciones se levantan al solo efecto de escriturar, con citación de los jueces que los decretaron.","Una vez escriturado el bien, sin otro trámite, esas medidas cautelares se deben levantar definitivamente, si es procedente, con la presentación del testimonio para la inscripción en el Registro de la Propiedad.","Los embargos quedan transferidos al importe del precio."],"t":"Levantamiento de medidas precautorias","s":"Los embargos e inhibiciones se levantan al solo efecto de escriturar, con citación de los jueces que los decretaron."},{"n":559,"p":["No procede el desahucio de los ocupantes del inmueble subastado hasta tanto no se pague el saldo del precio y hecho la tradición.","Las cuestiones que se suscitan con motivo de la desocupación del inmueble se sustancian por el trámite de los incidentes, cuando la ilegitimidad de la ocupación aparece manifiesta, o no requiere la dilucidación de controversias que por su naturaleza y complejidad deben, a criterio del Juez, ser sometidas a otra clase de proceso.","SECCIÓN 5.a PREFERENCIAS LIQUIDACIÓN PAGO. FIANZA"],"t":"Desocupación del inmueble","s":"No procede el desahucio de los ocupantes del inmueble subastado hasta tanto no se pague el saldo del precio y hecho la tradición."},{"n":560,"p":["Mientras el ejecutante no esté totalmente desinteresado, las sumas depositadas no pueden aplicarse a otro destino, salvo que se trate de las costas de la ejecución, o del pago de otro acreedor preferente o privilegiado.","Los gastos causados por el deudor para su defensa no tienen, en ningún caso, prelación, salvo cuando corresponda por aplicación de la ley sustancial.","El defensor de ausentes no puede cobrar honorarios al ejecutado por su intervención."],"t":"Preferencias","s":"Mientras el ejecutante no esté totalmente desinteresado, las sumas depositadas no pueden aplicarse a otro destino, salvo que se trate de las costas de la ejecución, o del pago de otro acreedor preferente o privilegiado."},{"n":561,"p":["Fianza. Dentro de los cinco (5) días contados desde que se pagó el precio o desde la aprobación del remate, en su caso, el ejecutante debe presentar la liquidación del capital, intereses y costas; de ella se da traslado al ejecutado.","Si el ejecutante no presenta oportunamente liquidación, puede hacerlo el ejecutado, en cuyo caso se debe conferir traslado a aquél. Contestado dicho traslado o vencido el plazo para hacerlo, el Juez debe resolver.","La falta de impugnación no obliga a aprobar la liquidación en cuanto ésta no se ajuste a derecho.","Si el ejecutado lo pide, el ejecutante debe prestar fianza para percibir el capital y sus intereses. Dicha fianza queda cancelada sin que se requiera declaración expresa, si el deudor no promueve el proceso ordinario dentro del plazo de quince (15) días desde que aquella se constituyó. En este caso se impondrá al ejecutado una multa que no puede exceder del veinticinco por ciento (25%) del importe de la fianza, y que es a favor del ejecutante.","SECCIÓN 6.a NULIDAD DE LA SUBASTA"],"t":"Liquidación. Pago","s":"Fianza. Dentro de los cinco (5) días contados desde que se pagó el precio o desde la aprobación del remate, en su caso, el ejecutante debe presentar la liquidación del capital, intereses y costas; de ella se da traslado al ejecutado."},{"n":562,"p":["La nulidad del remate, a pedido de parte, sólo puede plantearse hasta dentro del quinto día del realizado.","El pedido debe ser desestimado in límine si las causas invocadas son manifiestamente inatendibles o no se indica con fundamento verosímil el perjuicio sufrido. Esta resolución es apelable; si la Cámara confirma, se impone al peticionario una multa que puede ser del cinco (5%) al diez (10%) por ciento del precio obtenido en el remate.","Si el pedido de nulidad es admisible, se confiere traslado por cinco (5) días a las partes, al martillero y al adjudicatario; dicho traslado se notifica personalmente o por cédula."],"t":"Nulidad de la subasta a pedido de parte","s":"La nulidad del remate, a pedido de parte, sólo puede plantearse hasta dentro del quinto día del realizado."},{"n":563,"p":["El Juez debe decretar de oficio la nulidad de la subasta cuando las irregularidades de que ella adolece comprometen gravemente la actividad jurisdiccional; no puede hacerlo si decretó medidas que importan considerar válido el remate.","SECCIÓN 7.a TEMERIDAD"],"t":"Nulidad de oficio","s":"El Juez debe decretar de oficio la nulidad de la subasta cuando las irregularidades de que ella adolece comprometen gravemente la actividad jurisdiccional; no puede hacerlo si decretó medidas que importan considerar válido el remate. SECCIÓN 7.a TEMERIDAD"},{"n":564,"p":["Si el ejecutado provocó dilación innecesaria en el cumplimiento de la sentencia de remate, el Juez le impone una multa, en los términos del Artículo 520, sobre la base del importe de la liquidación aprobada."],"t":"Temeridad","s":"Si el ejecutado provocó dilación innecesaria en el cumplimiento de la sentencia de remate, el Juez le impone una multa, en los términos del Artículo 520, sobre la base del importe de la liquidación aprobada."},{"n":565,"p":["Los títulos que autorizan las ejecuciones especiales sólo son aquellos que se mencionan expresamente en este Código o en otras leyes."],"t":"Títulos que las autorizan","s":"Los títulos que autorizan las ejecuciones especiales sólo son aquellos que se mencionan expresamente en este Código o en otras leyes."},{"n":566,"p":["En las ejecuciones especiales se observa el procedimiento establecido para el juicio ejecutivo, con las siguientes modificaciones:","1) sólo proceden las excepciones previstas en el capítulo siguiente o en la ley que crea el título;","2) sólo se admite prueba que deba rendirse fuera de la circunscripción territorial del Juzgado cuando el Juez, de acuerdo con las circunstancias, lo considera imprescindible, en cuyo caso fija el plazo dentro del cual debe producirse."],"t":"Reglas aplicables","s":"En las ejecuciones especiales se observa el procedimiento establecido para el juicio ejecutivo, con las siguientes modificaciones: 1) sólo proceden las excepciones previstas en el capítulo siguiente o en la ley que crea el título;"},{"n":567,"p":["Además de las excepciones procesales autorizadas por el Artículo 513 incisos 1), 2), 3), 4) y 9) y en el Artículo 514, el deudor puede oponer, únicamente, las de prescripción, pago total o parcial, quita, espera y remisión. Las cuatro (4) últimas sólo pueden probarse por instrumentos públicos o privados o actuaciones judiciales que deben presentarse en sus originales, o testimoniadas, al oponerlas.","Dentro del plazo para oponer excepciones puede invocarse también la caducidad de la inscripción hipotecaria, con los efectos que determina el Código Civil y Comercial de la Nación."],"t":"Excepciones admisibles","s":"Además de las excepciones procesales autorizadas por el Artículo 513 incisos 1), 2), 3), 4) y 9) y en el Artículo 514, el deudor puede oponer, únicamente, las de prescripción, pago total o parcial, quita, espera y remisión."},{"n":568,"p":["En la providencia que ordena la intimación de pago y la citación de remate, se debe disponer la anotación del embargo sobre el inmueble hipotecado y el libramiento de oficio al Registro de la Propiedad para que informe:","1) sobre las medidas cautelares y gravámenes que afectan al inmueble hipotecado, con indicación del importe de los créditos, sus titulares y domicilios;","2) sobre las transferencias que de aquél se realizaron desde la fecha de constitución de la hipoteca, y nombre y domicilio de los adquirentes.","Sin perjuicio de ello, el deudor debe, durante el plazo para oponer excepciones, denunciar el nombre y domicilio de los acreedores privilegiados, embargantes y terceros poseedores del inmueble hipotecado."],"t":"Informe sobre condiciones del inmueble hipotecado","s":"En la providencia que ordena la intimación de pago y la citación de remate, se debe disponer la anotación del embargo sobre el inmueble hipotecado y el libramiento de oficio al Registro de la Propiedad para que informe:"},{"n":569,"p":["Si del informe o de la denuncia a que se refiere el Artículo 568, resulta que el deudor transfirió el inmueble hipotecado, dictada la sentencia de remate contra aquél, se debe intimar al tercer poseedor para que dentro del plazo de cinco (5) días pague la deuda o haga abandono del inmueble, bajo apercibimiento de que la ejecución se seguirá también contra él.","En este último supuesto, se observan las reglas establecidas en los Artículos 2199 y siguientes del Código Civil y Comercial de la Nación.","SECCIÓN 2.a EJECUCIÓN PRENDARIA"],"t":"Tercer poseedor","s":"Si del informe o de la denuncia a que se refiere el Artículo 568, resulta que el deudor transfirió el inmueble hipotecado, dictada la sentencia de remate contra aquél, se debe intimar al tercer poseedor para que dentro del plazo de cinco (5) días pague la deud"},{"n":570,"p":["En la ejecución de prenda con registro sólo proceden las excepciones enumeradas en el Artículo 513 incisos 1), 2), 3), 4), 6) y 9) y en el Artículo 514 y las sustanciales autorizadas por la ley de la materia."],"t":"Prenda con registro","s":"En la ejecución de prenda con registro sólo proceden las excepciones enumeradas en el Artículo 513 incisos 1), 2), 3), 4), 6) y 9) y en el Artículo 514 y las sustanciales autorizadas por la ley de la materia."},{"n":571,"p":["En la ejecución de la prenda civil sólo son oponibles las excepciones que se mencionan en el Artículo 567 primer párrafo.","Son aplicables, en lo pertinente, las disposiciones que rigen la ejecución hipotecaria y la ejecución de prenda con registro.","SECCIÓN 3.a EJECUCIÓN COMERCIAL"],"t":"Prenda civil","s":"En la ejecución de la prenda civil sólo son oponibles las excepciones que se mencionan en el Artículo 567 primer párrafo. Son aplicables, en lo pertinente, las disposiciones que rigen la ejecución hipotecaria y la ejecución de prenda con registro."},{"n":572,"p":["Procede la ejecución comercial para el cobro de:","1) fletes de los transportes marítimos, terrestres y aéreos, acreditados con la póliza de fletamento o conocimiento o carta de porte o documento análogo, en su original, y en su caso, el recibo de las mercaderías;","2) crédito por las vituallas suministradas para la provisión de los buques, justificado con las respectivas facturas valoradas, aprobadas por el capitán, consignatario o cargador por cuya orden las entregó el acreedor."],"t":"Procedencia","s":"Procede la ejecución comercial para el cobro de:"},{"n":573,"p":["Sólo son admisibles las excepciones previstas en el Artículo 513 incisos 1), 2), 3), 4) y 9) y en el Artículo 514 y las de prescripción, pago total o parcial, quita, espera y remisión. Las cuatro (4) últimas sólo pueden probarse por instrumentos públicos o privados o actuaciones judiciales que deben presentarse en sus originales o testimoniadas.","SECCIÓN 4.a EJECUCIÓN FISCAL"],"t":"Excepciones admisibles","s":"Sólo son admisibles las excepciones previstas en el Artículo 513 incisos 1), 2), 3), 4) y 9) y en el Artículo 514 y las de prescripción, pago total o parcial, quita, espera y remisión."},{"n":574,"p":["Procede la ejecución fiscal cuando se persigue el cobro de impuestos, patentes, tasas, retribuciones de servicios o mejoras, multas adeudadas a la administración pública, aportes y contribuciones al sistema provincial de previsión social y en los demás casos que las leyes establecen.","La forma del título y su fuerza ejecutiva son las determinadas por la legislación fiscal."],"t":"Procedencia","s":"Procede la ejecución fiscal cuando se persigue el cobro de impuestos, patentes, tasas, retribuciones de servicios o mejoras, multas adeudadas a la administración pública, aportes y contribuciones al sistema provincial de previsión social y en los demás casos q"},{"n":575,"p":["La ejecución fiscal tramita conforme a las reglas que establece la ley que específicamente regula la materia impositiva u otro título al que también por ley se atribuye fuerza ejecutiva. A falta de tales disposiciones o en lo que ellas no prevean proceden las excepciones autorizadas en el Artículo 513 incisos 1), 2), 3) y 9) y en el Artículo 514 y las de falsedad material o inhabilidad extrínseca del título, falta de legitimación para obrar pasiva en el ejecutado, pago total o parcial, espera y prescripción. Las excepciones de pago y espera sólo pueden probarse con documentos.","Las disposiciones procesales de las leyes que regulan la materia impositiva prevalecen sobre las contenidas en el presente Código."],"t":"Procedimiento","s":"La ejecución fiscal tramita conforme a las reglas que establece la ley que específicamente regula la materia impositiva u otro título al que también por ley se atribuye fuerza ejecutiva."},{"n":576,"p":["Los interdictos sólo pueden intentarse:","1) para adquirir la posesión o la tenencia;","2) para retener la posesión o la tenencia;","3) para recobrar la posesión o la tenencia;","4) para impedir una obra nueva."],"t":"Clases","s":"Los interdictos sólo pueden intentarse: 1) para adquirir la posesión o la tenencia; 2) para retener la posesión o la tenencia; 3) para recobrar la posesión o la tenencia; 4) para impedir una obra nueva."},{"n":577,"p":["Para que proceda el interdicto de adquirir se requiere:","1) que quien lo intenta presente título suficiente para adquirir la posesión o la tenencia con arreglo a derecho;","2) que nadie tenga título de dueño o usufructuario de la cosa que constituye el objeto del interdicto;","3) que nadie sea poseedor o tenedor de la misma cosa."],"t":"Procedencia","s":"Para que proceda el interdicto de adquirir se requiere: 1) que quien lo intenta presente título suficiente para adquirir la posesión o la tenencia con arreglo a derecho;"},{"n":578,"p":["Promovido el interdicto, el Juez debe examinar el título y requerir informe sobre las condiciones de dominio. Si lo halla suficiente, debe otorgar la posesión o la tenencia, sin perjuicio de mejor derecho, y disponer la inscripción del título, si corresponde.","Si otra persona también tiene título o posee el bien, la cuestión debe sustanciarse en juicio ordinario.","Cuando alguien ejerce la tenencia de la cosa, la demanda contra él, se sustancia por el trámite del juicio sumarísimo.","Si el título que presenta el actor para adquirir la posesión o la tenencia deriva del que invoca el oponente para resistirla, el Juez debe disponer que la controversia tramite por juicio ordinario o sumarísimo, atendiendo a las circunstancias del caso."],"t":"Procedimiento","s":"Promovido el interdicto, el Juez debe examinar el título y requerir informe sobre las condiciones de dominio. Si lo halla suficiente, debe otorgar la posesión o la tenencia, sin perjuicio de mejor derecho, y disponer la inscripción del título, si corresponde."},{"n":579,"p":["Presentada la demanda, puede decretarse la anotación de litis en el Registro de la Propiedad, si los títulos acompañados y los antecedentes aportados justifican esa medida precautoria."],"t":"Anotación de litis","s":"Presentada la demanda, puede decretarse la anotación de litis en el Registro de la Propiedad, si los títulos acompañados y los antecedentes aportados justifican esa medida precautoria."},{"n":580,"p":["Para que proceda el interdicto de retener se requiere:","1) que quien lo intenta se encuentre en la actual posesión o tenencia de una cosa, mueble o inmueble;","2) que alguien amenace perturbarlo o lo perturbe en ellas mediante actos materiales."],"t":"Procedencia","s":"Para que proceda el interdicto de retener se requiere: 1) que quien lo intenta se encuentre en la actual posesión o tenencia de una cosa, mueble o inmueble; 2) que alguien amenace perturbarlo o lo perturbe en ellas mediante actos materiales."},{"n":581,"p":["La demanda se dirige contra quien el actor denuncia que lo perturba en la posesión o tenencia, sus sucesores o copartícipes, y tramita por las reglas del proceso sumarísimo."],"t":"Procedimiento","s":"La demanda se dirige contra quien el actor denuncia que lo perturba en la posesión o tenencia, sus sucesores o copartícipes, y tramita por las reglas del proceso sumarísimo."},{"n":582,"p":["La prueba sólo puede versar sobre el hecho de la posesión o tenencia invocada por el actor, la verdad o falsedad de los actos de perturbación atribuidos al demandado, y la fecha en que éstos se produjeron."],"t":"Objeto de la prueba","s":"La prueba sólo puede versar sobre el hecho de la posesión o tenencia invocada por el actor, la verdad o falsedad de los actos de perturbación atribuidos al demandado, y la fecha en que éstos se produjeron."},{"n":583,"p":["Si la perturbación es inminente, el Juez puede disponer la medida de no innovar, bajo apercibimiento de aplicar las sanciones a que se refiere el Artículo 37."],"t":"Medidas precautorias","s":"Si la perturbación es inminente, el Juez puede disponer la medida de no innovar, bajo apercibimiento de aplicar las sanciones a que se refiere el Artículo 37."},{"n":584,"p":["Para que proceda el interdicto de recobrar se requiere:","1) que quien lo intenta, o su causante, haya tenido la posesión actual o la tenencia de una cosa mueble o inmueble;","2) que haya sido despojado total o parcialmente de la cosa, con violencia o clandestinidad."],"t":"Procedencia","s":"Para que proceda el interdicto de recobrar se requiere: 1) que quien lo intenta, o su causante, haya tenido la posesión actual o la tenencia de una cosa mueble o inmueble;"},{"n":585,"p":["La demanda se dirige contra el autor denunciado, sus sucesores, o copartícipes o beneficiarios del despojo y tramita por juicio sumarísimo.","Sólo se admiten pruebas que tengan por objeto demostrar el hecho de la posesión o tenencia invocadas, así como el despojo y la fecha en que éste se produjo."],"t":"Procedimiento","s":"La demanda se dirige contra el autor denunciado, sus sucesores, o copartícipes o beneficiarios del despojo y tramita por juicio sumarísimo."},{"n":586,"p":["Cuando el derecho invocado es verosímil y pueden derivar perjuicios si no se decreta la restitución inmediata del bien, el Juez puede ordenarla previa fianza que debe prestar el reclamante para responder por los daños que puede irrogar la medida."],"t":"Restitución del bien","s":"Cuando el derecho invocado es verosímil y pueden derivar perjuicios si no se decreta la restitución inmediata del bien, el Juez puede ordenarla previa fianza que debe prestar el reclamante para responder por los daños que puede irrogar la medida."},{"n":587,"p":["Si durante el curso del interdicto de retener se produce el despojo del demandante, la acción prosigue como interdicto de recobrar, sin retrotraer el procedimiento, en cuanto es posible.","Cuando llega a conocimiento del demandante la existencia de otros sucesores, copartícipes o beneficiarios, puede ampliar la acción contra ellos en cualquier estado del juicio."],"t":"Modificación. Ampliación de la demanda","s":"Si durante el curso del interdicto de retener se produce el despojo del demandante, la acción prosigue como interdicto de recobrar, sin retrotraer el procedimiento, en cuanto es posible."},{"n":588,"p":["El Juez dicta sentencia, desestimando el interdicto o mandando restituir la posesión o la tenencia del bien al despojado."],"t":"Sentencia","s":"El Juez dicta sentencia, desestimando el interdicto o mandando restituir la posesión o la tenencia del bien al despojado."},{"n":589,"p":["Cuando se comienza una obra que afecta a un inmueble, su poseedor o tenedor puede promover el interdicto de obra nueva. Es inadmisible si aquélla está concluida o próxima a su terminación. La acción se dirige contra el dueño de la obra y, si es desconocido, contra el director o encargado de ella. Tramita por el juicio sumarísimo. El Juez puede ordenar preventivamente la suspensión de la obra."],"t":"Procedencia","s":"Cuando se comienza una obra que afecta a un inmueble, su poseedor o tenedor puede promover el interdicto de obra nueva. Es inadmisible si aquélla está concluida o próxima a su terminación."},{"n":590,"p":["La sentencia que admite la demanda debe disponer la suspensión definitiva de la obra o, en su caso, su destrucción y la restitución de las cosas al estado anterior, a costa del vencido."],"t":"Sentencia","s":"La sentencia que admite la demanda debe disponer la suspensión definitiva de la obra o, en su caso, su destrucción y la restitución de las cosas al estado anterior, a costa del vencido."},{"n":591,"p":["Los interdictos de retener, de recobrar y de obra nueva no pueden promoverse después de transcurrido un (1) año de producidos los hechos en que se fundan."],"t":"Caducidad","s":"Los interdictos de retener, de recobrar y de obra nueva no pueden promoverse después de transcurrido un (1) año de producidos los hechos en que se fundan."},{"n":592,"p":["Las sentencias que se dictan en los interdictos de adquirir, retener y recobrar no impiden el ejercicio de las acciones reales que pueden corresponder a las partes."],"t":"Juicio posterior","s":"Las sentencias que se dictan en los interdictos de adquirir, retener y recobrar no impiden el ejercicio de las acciones reales que pueden corresponder a las partes."},{"n":593,"p":["Las acciones posesorias del Capítulo 1, Título XIII, Libro Cuarto del Código Civil y Comercial de la Nación, tramitan por juicio ordinario.","Deducida la acción posesoria o el interdicto, posteriormente sólo puede promoverse acción real."],"t":"Trámite","s":"Las acciones posesorias del Capítulo 1, Título XIII, Libro Cuarto del Código Civil y Comercial de la Nación, tramitan por juicio ordinario. Deducida la acción posesoria o el interdicto, posteriormente sólo puede promoverse acción real."},{"n":594,"p":["Quien teme que de un edificio o de otra cosa derive un daño grave e inminente a sus bienes, puede solicitar al Juez las medidas de seguridad adecuadas, si no media anterior intervención de autoridad administrativa por el mismo motivo.","Recibida la denuncia el Juez se debe constituir en el lugar y si comprueba la existencia de grave riesgo, urgencia en removerlo y temor de daño serio e inminente, puede disponer las medidas encaminadas a hacer cesar el peligro. Si la urgencia no es manifiesta debe requerir la sumaria información que permita verificar, con citación de las partes y designación de perito, la procedencia del pedido.","La intervención simultánea o ulterior de la autoridad administrativa determina la clausura del procedimiento y el archivo del expediente.","Las resoluciones que se dictan son inapelables.","En su caso, pueden imponerse sanciones conminatorias."],"t":"Denuncia de daño temido. Medidas de seguridad","s":"Quien teme que de un edificio o de otra cosa derive un daño grave e inminente a sus bienes, puede solicitar al Juez las medidas de seguridad adecuadas, si no media anterior intervención de autoridad administrativa por el mismo motivo."},{"n":595,"p":["Cuando deterioros o averías producidos en un edificio o unidad ocasionan grave daño a otro, y el ocupante del primero se opone a realizar o a permitir que se ejecuten las reparaciones necesarias para hacer cesar la causa del perjuicio, el propietario, copropietario o inquilino directamente afectados o, en su caso, el administrador del consorcio, puede requerir que se adopten las medidas y se lleven a cabo los trabajos que son necesarios, disponiéndose el allanamiento de domicilio, si es indispensable.","La petición tramita sin forma de juicio, con la sola audiencia de los interesados y el informe técnico que debe acompañarse al escrito inicial.","La resolución del Juez es inapelable.","En su caso pueden imponerse sanciones conminatorias."],"t":"Oposición a la ejecución de reparaciones urgentes","s":"Cuando deterioros o averías producidos en un edificio o unidad ocasionan grave daño a otro, y el ocupante del primero se opone a realizar o a permitir que se ejecuten las reparaciones necesarias para hacer cesar la causa del perjuicio, el propietario, copropie"},{"n":596,"p":["La demanda por obligación de rendir cuentas tramita por juicio ordinario.","El traslado de la demanda se hace bajo apercibimiento de que si el demandado no la contesta, o admite la obligación y no las rinde dentro del plazo que el Juez fija al conferir dicho traslado, se tienen por aprobadas las que presenta el actor, en todo aquello que el demandado no prueba que son inexactas."],"t":"Obligación de rendir cuentas","s":"La demanda por obligación de rendir cuentas tramita por juicio ordinario."},{"n":597,"p":["Se aplica el procedimiento de los incidentes siempre que:","1) existe condena judicial a rendir cuentas;","2) la obligación de rendirlas resulta de instrumento público o privado reconocido, o fue admitida por el obligado al ser requerido por diligencia preliminar."],"t":"Trámite por incidente","s":"Se aplica el procedimiento de los incidentes siempre que: 1) existe condena judicial a rendir cuentas; 2) la obligación de rendirlas resulta de instrumento público o privado reconocido, o fue admitida por el obligado al ser requerido por diligencia preliminar."},{"n":598,"p":["En los casos del Artículo 597, si conjuntamente con el pedido, quien promovió el incidente acompaña una cuenta provisional, el Juez debe dar traslado a la otra parte para que la admita u observe, bajo apercibimiento de que si no lo hace se aprobará la presentada.","El Juez fija los plazos para los traslados y producción de prueba, atendiendo a la complejidad de las cuentas y documentos que se acompañaron."],"t":"Facultad judicial","s":"En los casos del Artículo 597, si conjuntamente con el pedido, quien promovió el incidente acompaña una cuenta provisional, el Juez debe dar traslado a la otra parte para que la admita u observe, bajo apercibimiento de que si no lo hace se aprobará la presenta"},{"n":599,"p":["Con el escrito de rendición de cuentas debe acompañarse la documentación correspondiente. El Juez puede tener como justificadas las partidas respecto de las cuales no se acostumbra a pedir recibos y son razonables y verosímiles."],"t":"Documentación. Justificación de partidas","s":"Con el escrito de rendición de cuentas debe acompañarse la documentación correspondiente. El Juez puede tener como justificadas las partidas respecto de las cuales no se acostumbra a pedir recibos y son razonables y verosímiles."},{"n":600,"p":["El actor puede reclamar el pago de los saldos reconocidos por el demandado, sin esperar la resolución definitiva sobre las cuentas y sin que por ello se entienda que las aceptó.","El pedido se sustancia por las normas sobre ejecución de sentencias."],"t":"Saldos reconocidos","s":"El actor puede reclamar el pago de los saldos reconocidos por el demandado, sin esperar la resolución definitiva sobre las cuentas y sin que por ello se entienda que las aceptó. El pedido se sustancia por las normas sobre ejecución de sentencias."},{"n":601,"p":["El obligado a rendir cuentas puede pedir la aprobación de las que presenta. De la demanda, a la que debe acompañarse boleta de depósito por el importe del saldo deudor, se da traslado al interesado, por el plazo que fija el Juez, bajo apercibimiento de ser tenido por conforme si no las impugna al contestar. Se aplica en lo pertinente, el procedimiento establecido en los artículos anteriores."],"t":"Demanda por aprobación de cuentas","s":"El obligado a rendir cuentas puede pedir la aprobación de las que presenta."},{"n":602,"p":["Procede la mensura judicial:","1) cuando estando el terreno deslindado, se pretende comprobar su superficie;","2) cuando los límites están confundidos con los de un terreno colindante."],"t":"Procedencia","s":"Procede la mensura judicial: 1) cuando estando el terreno deslindado, se pretende comprobar su superficie; 2) cuando los límites están confundidos con los de un terreno colindante."},{"n":603,"p":["La mensura no afecta los derechos que los propietarios puedan tener al dominio o a la posesión del inmueble."],"t":"Alcance","s":"La mensura no afecta los derechos que los propietarios puedan tener al dominio o a la posesión del inmueble."},{"n":604,"p":["Quien promueve el procedimiento de mensura, debe:","1) expresar su nombre, apellido y domicilio real;","2) constituir domicilio legal, en los términos del Artículo 40;","3) acompañar el título de propiedad del inmueble;","4) indicar el nombre, apellido y domicilio de los colindantes, o manifestar que los ignora;","5) designar el agrimensor que practique la operación.","El Juez desestima de oficio y sin sustanciación previa la solicitud que no contiene los requisitos establecidos."],"t":"Requisitos de la solicitud","s":"Quien promueve el procedimiento de mensura, debe: 1) expresar su nombre, apellido y domicilio real; 2) constituir domicilio legal, en los términos del Artículo 40; 3) acompañar el título de propiedad del inmueble;"},{"n":605,"p":["Presentada la solicitud con los requisitos indicados en el Artículo 604, el Juez debe:","1) disponer que se practique la mensura por el perito designado por el requirente;","2) ordenar se publiquen edictos por tres (3) días, citando a quienes tienen interés en la mensura. La publicación debe hacerse con la anticipación necesaria para que los interesados puedan concurrir a presenciarla, por sí o por medio de sus representantes. En los edictos se debe expresar la situación del inmueble, el nombre del solicitante, el Juzgado y la Secretaría, y el lugar, día y hora en que se dará comienzo a la operación;","3) hacer saber el pedido de mensura a la oficina topográfica."],"t":"Nombramiento del perito. Edictos","s":"Presentada la solicitud con los requisitos indicados en el Artículo 604, el Juez debe: 1) disponer que se practique la mensura por el perito designado por el requirente;"},{"n":606,"p":["Aceptado el cargo, el agrimensor debe:","1) citar por circular a los propietarios de los terrenos colindantes, con la anticipación indicada en el inciso 2) del Artículo 605 y especificando los datos en él mencionados. Los citados deben notificarse firmando la circular. Si se niegan a hacerlo, el agrimensor debe dejar constancia en aquélla ante dos (2) testigos, que la deben suscribir.","Si los propietarios colindantes no pueden ser notificados personalmente, la diligencia se practica con quien los representa, dejándose constancia. Si se niega a firmar, se labra acta ante dos (2) testigos, se expresan en ellas las razones en que funda la negativa y se lo tiene por notificado. Si alguno de los terrenos colindantes es de propiedad fiscal, el agrimensor debe citar a la autoridad administrativa que corresponde y a su representante judicial;","2) cursar aviso al peticionario con las mismas enunciaciones que se especifican en la circular;","3) solicitar instrucciones a la oficina topográfica y cumplir con los requisitos de carácter administrativo correspondientes a la intervención asignada a ese organismo."],"t":"Actuación preliminar del perito","s":"Aceptado el cargo, el agrimensor debe: 1) citar por circular a los propietarios de los terrenos colindantes, con la anticipación indicada en el inciso 2) del Artículo 605 y especificando los datos en él mencionados."},{"n":607,"p":["La oposición que se formula al tiempo de practicarse la mensura no impide su realización, ni la colocación de mojones. Se deja constancia, en el acta, de los fundamentos de la oposición, agregándose la protesta escrita, en su caso."],"t":"Oposiciones","s":"La oposición que se formula al tiempo de practicarse la mensura no impide su realización, ni la colocación de mojones. Se deja constancia, en el acta, de los fundamentos de la oposición, agregándose la protesta escrita, en su caso."},{"n":608,"p":["Cumplidos los requisitos establecidos en los Artículos 604 a 606, el perito hace la mensura en el lugar, día y hora señalados, con la presencia de los interesados o de sus representantes.","Cuando por razones climáticas o mal estado del terreno no es posible comenzar la mensura en el día fijado en las citaciones y edictos, el profesional y los interesados pueden convenir nueva fecha todas las veces que ello es necesario, labrándose siempre acta de cada postergación.","Cuando la operación no puede llevarse a cabo por ausencia del profesional, el Juzgado fija la nueva fecha. Se debe publicar edictos, practicar citaciones a los linderos y cursar avisos con la anticipación y en los términos del Artículo 606."],"t":"Oportunidad de la mensura","s":"Cumplidos los requisitos establecidos en los Artículos 604 a 606, el perito hace la mensura en el lugar, día y hora señalados, con la presencia de los interesados o de sus representantes."},{"n":609,"p":["Cuando la mensura no puede terminar en el día, debe proseguir en el más próximo posible. Se deja constancia de los trabajos realizados y de la fecha en que continúa la operación, en acta que deben firmar los presentes."],"t":"Continuación de la diligencia","s":"Cuando la mensura no puede terminar en el día, debe proseguir en el más próximo posible. Se deja constancia de los trabajos realizados y de la fecha en que continúa la operación, en acta que deben firmar los presentes."},{"n":610,"p":["Si durante la ejecución de la operación se comprueba la existencia de linderos desconocidos al tiempo de comenzarla, se los debe citar, si es posible, por el medio establecido en el Artículo 606, inciso 1). El agrimensor debe solicitar su conformidad respecto de los trabajos ya realizados."],"t":"Citación a otros linderos","s":"Si durante la ejecución de la operación se comprueba la existencia de linderos desconocidos al tiempo de comenzarla, se los debe citar, si es posible, por el medio establecido en el Artículo 606, inciso 1)."},{"n":611,"p":["Los colindantes pueden:","1) concurrir al acto de la mensura acompañados por peritos de su elección, siendo a su cargo los gastos y honorarios que se devengan;","2) formular las reclamaciones a que se creen con derecho, exhibiendo los títulos de propiedad en que las fundan. El agrimensor debe poner en ellos constancia marginal que suscribe.","Los reclamantes que no exhiben sus títulos sin causa justificada, deben satisfacer las costas del juicio que promueven contra la mensura, cualquiera sea el resultado de aquél.","La misma sanción se aplica a los colindantes que, debidamente citados, no intervinieron en la operación de mensura sin causa justificada.","El perito debe expresar, oportunamente, su opinión técnica acerca de las observaciones que se formularon."],"t":"Intervención de los interesados","s":"Los colindantes pueden: 1) concurrir al acto de la mensura acompañados por peritos de su elección, siendo a su cargo los gastos y honorarios que se devengan;"},{"n":612,"p":["El agrimensor no puede remover los mojones que encuentra, a menos que comparezcan todos los colindantes y manifiesten su conformidad por escrito."],"t":"Remoción de mojones","s":"El agrimensor no puede remover los mojones que encuentra, a menos que comparezcan todos los colindantes y manifiesten su conformidad por escrito."},{"n":613,"p":["Terminada la mensura el perito debe:","1) labrar acta en la que debe expresar los detalles de la operación y el nombre de los linderos que la presenciaron. Si se manifestó disconformidad, las razones invocadas;","2) presentar al Juzgado la circular de citación y, a la oficina topográfica, un informe acerca del modo en que cumplió su cometido y, por duplicado, el acta y el plano de la mensura. Es responsable de los daños y perjuicios que ocasiona su demora injustificada."],"t":"Acta. Trámite posterior","s":"Terminada la mensura el perito debe: 1) labrar acta en la que debe expresar los detalles de la operación y el nombre de los linderos que la presenciaron. Si se manifestó disconformidad, las razones invocadas;"},{"n":614,"p":["La oficina topográfica puede solicitar al Juez el expediente con el título de propiedad. Dentro de los treinta (30) días contados desde la recepción del acta y diligencia de mensura o, en su caso, del expediente requerido al Juez, debe remitir a éste uno de los ejemplares del acta, el plano y un informe acerca del valor técnico de la operación efectuada."],"t":"Dictamen técnico administrativo","s":"La oficina topográfica puede solicitar al Juez el expediente con el título de propiedad."},{"n":615,"p":["Cuando la oficina topográfica no observa la mensura y no existe oposición de linderos, el Juez la debe aprobar y mandar expedir los testimonios que los interesados solicitan."],"t":"Efectos","s":"Cuando la oficina topográfica no observa la mensura y no existe oposición de linderos, el Juez la debe aprobar y mandar expedir los testimonios que los interesados solicitan."},{"n":616,"p":["Cuando las observaciones u oposiciones se fundan en cuestiones meramente técnicas, se da traslado a los interesados por el plazo que fija el Juez. Contestados los traslados o vencido el plazo para hacerlo, aquél debe resolver aprobando o no la mensura, según corresponda, u ordenando las rectificaciones pertinentes, si es posible."],"t":"Defectos técnicos","s":"Cuando las observaciones u oposiciones se fundan en cuestiones meramente técnicas, se da traslado a los interesados por el plazo que fija el Juez."},{"n":617,"p":["La escritura pública en que las partes efectuaron el deslinde debe presentarse al Juez, con todos sus antecedentes. Previa intervención de la oficina topográfica se aprueba el deslinde, si corresponde."],"t":"Deslinde por convenio","s":"La escritura pública en que las partes efectuaron el deslinde debe presentarse al Juez, con todos sus antecedentes. Previa intervención de la oficina topográfica se aprueba el deslinde, si corresponde."},{"n":618,"p":["La acción de deslinde tramita por las normas establecidas para el juicio ordinario.","Si el o los demandados no se oponen a que se efectúe el deslinde, el Juez designa de oficio perito agrimensor para que realice la mensura. Se aplican, en lo pertinente, las normas establecidas en el Capítulo I de este Título, con intervención de la oficina topográfica.","Presentada la mensura, se da traslado a las partes por diez (10) días, y si expresan su conformidad, el Juez la aprueba estableciendo el deslinde. Si media oposición a la mensura, el Juez, previo traslado y producción de prueba por los plazos que fija, debe dictar sentencia."],"t":"Deslinde judicial","s":"La acción de deslinde tramita por las normas establecidas para el juicio ordinario. Si el o los demandados no se oponen a que se efectúe el deslinde, el Juez designa de oficio perito agrimensor para que realice la mensura."},{"n":619,"p":["La ejecución de la sentencia que declara procedente el deslinde se lleva a cabo de conformidad con las normas establecidas en el artículo anterior. Si corresponde, se debe efectuar el amojonamiento."],"t":"Ejecución de la sentencia que dispone el deslinde","s":"La ejecución de la sentencia que declara procedente el deslinde se lleva a cabo de conformidad con las normas establecidas en el artículo anterior. Si corresponde, se debe efectuar el amojonamiento."},{"n":620,"p":["La demanda por división de cosas comunes se sustancia y resuelve por el procedimiento del juicio ordinario.","La sentencia debe contener, además de los requisitos generales, la decisión expresa, cuando es posible, sobre la forma de la división, de acuerdo con la naturaleza de la cosa."],"t":"Trámite","s":"La demanda por división de cosas comunes se sustancia y resuelve por el procedimiento del juicio ordinario."},{"n":621,"p":["Ejecutoriada la sentencia, se cita a las partes a una audiencia para el nombramiento de un perito tasador, partidor o martillero, según corresponda, y para que convengan la forma de la división, si no se estableció en la sentencia. Para su designación y procedimientos ulteriores, se aplican las disposiciones relativas a la división de herencia, en el primer caso, o las del juicio ejecutivo en el segundo."],"t":"Peritos","s":"Ejecutoriada la sentencia, se cita a las partes a una audiencia para el nombramiento de un perito tasador, partidor o martillero, según corresponda, y para que convengan la forma de la división, si no se estableció en la sentencia."},{"n":622,"p":["Si se pide la aprobación de una división de bienes hecha extrajudicialmente, el Juez, previas las ratificaciones que corresponden, y las citaciones necesarias en su caso, debe resolver aprobándola o rechazándola, sin recurso alguno."],"t":"División extrajudicial","s":"Si se pide la aprobación de una división de bienes hecha extrajudicialmente, el Juez, previas las ratificaciones que corresponden, y las citaciones necesarias en su caso, debe resolver aprobándola o rechazándola, sin recurso alguno."},{"n":623,"p":["La acción de desalojo de inmuebles urbanos y rurales se sustancia por el procedimiento establecido por este Código para el juicio ordinario, con las modalidades que se establecen en los artículos siguientes."],"t":"Procedimiento","s":"La acción de desalojo de inmuebles urbanos y rurales se sustancia por el procedimiento establecido por este Código para el juicio ordinario, con las modalidades que se establecen en los artículos siguientes."},{"n":624,"p":["La acción de desalojo procede contra locatarios sublocatarios, tenedores precarios, intrusos y cualesquiera otros ocupantes cuyo deber de restituir es exigible."],"t":"Procedencia","s":"La acción de desalojo procede contra locatarios sublocatarios, tenedores precarios, intrusos y cualesquiera otros ocupantes cuyo deber de restituir es exigible."},{"n":625,"p":["En los casos que la acción de desalojo se dirige contra intruso, en cualquier estado del juicio después de trabada la litis y a pedido del actor, el Juez puede disponer la inmediata entrega del inmueble si el derecho invocado es verosímil y previa caución por los eventuales daños y perjuicios que se puedan irrogar."],"t":"Entrega de inmueble al accionante","s":"En los casos que la acción de desalojo se dirige contra intruso, en cualquier estado del juicio después de trabada la litis y a pedido del actor, el Juez puede disponer la inmediata entrega del inmueble si el derecho invocado es verosímil y previa caución por "},{"n":626,"p":["Cuando el desalojo se funda en las causales de: cambio de destino, deterioro del inmueble, intrusión, obras nocivas o uso abusivo o deshonesto, el Juez debe realizar antes del traslado de la demanda un reconocimiento judicial dentro de los cinco (5) días de dictada la primera providencia, con asistencia del Defensor Oficial. Igual previsión debe tomarse cuando se da la causal prevista en los Artículos 1206 y 1219 inciso b) del Código Civil y Comercial de la Nación.","No es necesaria la diligencia judicial, cuando la causal invocada consta en escritura pública celebrada con arreglo a la ley, y ésta se acompaña en la oportunidad prevista en el Artículo 334."],"t":"Reconocimiento judicial","s":"Cuando el desalojo se funda en las causales de: cambio de destino, deterioro del inmueble, intrusión, obras nocivas o uso abusivo o deshonesto, el Juez debe realizar antes del traslado de la demanda un reconocimiento judicial dentro de los cinco (5) días de di"},{"n":627,"p":["En los supuestos en que la causal invocada para el desalojo sea la falta de pago, vencimiento del contrato o abandono, el actor puede también, bajo caución real, obtener la desocupación inmediata de acuerdo al procedimiento previsto en el Artículo 625. Para el supuesto que se pruebe que el actor obtuvo esa medida ocultando hechos o documentos que configuran la relación locativa o el pago de alquileres, además de la inmediata ejecución de la caución, se le impone una multa de hasta siete (7) salarios mínimos, vitales y móviles a favor de la parte perjudicada.","En caso que existan en el inmueble bienes muebles que no son de propiedad del locador, debe confeccionarse inventario de los mismos, y quedan depositados judicialmente a cargo del locatario."],"t":"Desocupación inmediata","s":"En los supuestos en que la causal invocada para el desalojo sea la falta de pago, vencimiento del contrato o abandono, el actor puede también, bajo caución real, obtener la desocupación inmediata de acuerdo al procedimiento previsto en el Artículo 625."},{"n":628,"p":["En la demanda y en la contestación las partes deben expresar si existen o no sublocatarios u ocupantes terceros. El actor, si lo ignora, puede remitirse a lo que resulta de la diligencia de notificación, de la contestación a la demanda, o de ambas."],"t":"Denuncia de la existencia de sublocatarios u ocupantes","s":"En la demanda y en la contestación las partes deben expresar si existen o no sublocatarios u ocupantes terceros. El actor, si lo ignora, puede remitirse a lo que resulta de la diligencia de notificación, de la contestación a la demanda, o de ambas."},{"n":629,"p":["Si en el contrato no se constituyó domicilio especial y el demandado no tiene su domicilio real dentro de la jurisdicción, la notificación de la demanda puede practicarse en el inmueble cuyo desalojo se requiere, siempre que en él haya algún edificio habitado."],"t":"Notificaciones","s":"Si en el contrato no se constituyó domicilio especial y el demandado no tiene su domicilio real dentro de la jurisdicción, la notificación de la demanda puede practicarse en el inmueble cuyo desalojo se requiere, siempre que en él haya algún edificio habitado."},{"n":630,"p":["Si falta la chapa indicadora del número del inmueble donde debe practicarse la notificación, el notificador debe procurar localizarlo inquiriendo a los vecinos. Si obtiene indicios suficientes, requiere en el inmueble la identificación de los ocupantes, pidiéndoles razón de su relación con el demandado.","Si la notificación debe hacerse en una casa de departamentos y en la cédula no se especificó la unidad, o se la designa por el número y en el edificio esta designada por letras, o viceversa, el notificador inquiere al encargado y vecinos si el demandado vive en el edificio; lo notifica si lo halla, identificándolo. En caso contrario debe devolver la cédula informando el resultado de la diligencia."],"t":"Localización del inmueble","s":"Si falta la chapa indicadora del número del inmueble donde debe practicarse la notificación, el notificador debe procurar localizarlo inquiriendo a los vecinos."},{"n":631,"p":["Cuando la notificación se cumple en el inmueble reclamado, el notificador:","1) debe hacer saber la existencia del juicio a cada uno de los sublocatarios u ocupantes presentes en el acto, aunque no hayan sido denunciados, previniéndoles que la sentencia que se pronuncie producirá efectos contra todos ellos y que, dentro del plazo fijado para contestar la demanda, podrán ejercer los derechos que estimen corresponderles;","2) debe identificar a los presentes e informar al Juez sobre el carácter que invocan y acerca de otros sublocatarios u ocupantes cuya presunta existencia surge de las manifestaciones de aquéllos. Aunque existan sublocatarios u ocupantes ausentes en el acto de la notificación, no se suspenden los trámites y la sentencia de desalojo produce efectos también respecto de ellos;","3) puede requerir el auxilio de la fuerza pública, allanar domicilios y exigir la exhibición de documentos de identidad u otros que son necesarios.","El incumplimiento de lo dispuesto en este artículo y en el anterior constituye falta grave del notificador."],"t":"Deberes y facultades del notificador","s":"Cuando la notificación se cumple en el inmueble reclamado, el notificador:"},{"n":632,"p":["En los juicios fundados en las causales de falta de pago o por vencimiento del plazo sólo se admite la prueba documental y la pericial."],"t":"Prueba","s":"En los juicios fundados en las causales de falta de pago o por vencimiento del plazo sólo se admite la prueba documental y la pericial."},{"n":633,"p":["El lanzamiento se ordena:","1) tratándose de quienes entraron en la tenencia u ocupación del inmueble con título legítimo, a los diez (10) días de la notificación de la sentencia si la condena de desalojo se funda en vencimiento del plazo, falta de pago de los alquileres o resolución del contrato por uso abusivo u otra causa imputable al locatario; en los casos de condena de futuro, a los diez (10) días del vencimiento del plazo. En los demás supuestos, a los noventa (90) días de la notificación de la sentencia, a menos que una ley especial establezca plazos diferentes;","2) respecto de quienes no tienen título legítimo para la ocupación del inmueble, el plazo es de cinco (5) días."],"t":"Lanzamiento","s":"El lanzamiento se ordena:"},{"n":634,"p":["La sentencia se hace efectiva contra todos los que ocupan el inmueble, aunque no hayan sido mencionados en la diligencia de la notificación o no se presentaron en el juicio."],"t":"Alcance de la sentencia","s":"La sentencia se hace efectiva contra todos los que ocupan el inmueble, aunque no hayan sido mencionados en la diligencia de la notificación o no se presentaron en el juicio."},{"n":635,"p":["La demanda de desalojo puede interponerse antes del vencimiento del plazo convenido para la restitución del bien, en cuyo caso la sentencia que ordena la desocupación debe cumplirse una vez vencido aquél.","Las costas son a cargo del actor cuando el demandado, además de allanarse a la demanda, cumple su obligación de desocupar oportunamente el inmueble o de devolverlo en la forma convenida."],"t":"Condena de futuro","s":"La demanda de desalojo puede interponerse antes del vencimiento del plazo convenido para la restitución del bien, en cuyo caso la sentencia que ordena la desocupación debe cumplirse una vez vencido aquél."},{"n":636,"p":["Ante solicitud fundada de parte, precisando con claridad en qué consisten sus derechos y su urgencia, aportando todos los elementos probatorios que fundamentan la petición y que es impostergable prestar tutela judicial inmediata, los jueces, aun cuando el actor no lo solicita formalmente bajo esa denominación, pueden despachar excepcionalmente medidas autosatisfactivas cuando se encuentren reunidos los siguientes recaudos:","1) sea necesaria la cesación inmediata de conductas o vías de hecho producidas o inminentes, contrarias a derecho según la legislación de fondo o procesal y siempre que no exista otra vía procesal para tutelar el derecho;","2) el interés del postulante se circunscriba, de manera evidente, a obtener la solución de urgencia no cautelar requerida, no requiriendo una declaración judicial adicional vinculada a un proceso principal.","Según sean las circunstancias del caso, valoradas motivadamente, el Juez puede exigir la prestación de caución real o personal determinando en estos casos la vigencia."],"t":"Procedencia","s":"Ante solicitud fundada de parte, precisando con claridad en qué consisten sus derechos y su urgencia, aportando todos los elementos probatorios que fundamentan la petición y que es impostergable prestar tutela judicial inmediata, los jueces, aun cuando el acto"},{"n":637,"p":["Los Jueces pueden decretar directamente la medida autosatisfactiva peticionada.","Excepcionalmente según las circunstancias del caso y la materia de la medida, pueden someterla a una previa y reducida sustanciación, que no excederá de conceder a quien corresponde la posibilidad de ser oído.","La citación a la audiencia o, en su caso, el traslado correspondiente y la sentencia se notifican por cédula, carta documento o acta notarial, que se diligencia en el día, con habilitación de días y horas inhábiles. Las demás notificaciones se efectúan por ministerio de ley."],"t":"Trámite","s":"Los Jueces pueden decretar directamente la medida autosatisfactiva peticionada."},{"n":638,"p":["Para impugnar la medida autosatisfactiva ordenada, el legitimado puede optar entre la interposición directa del recurso de apelación o en subsidio al de revocatoria, que debe ser concedido con efecto devolutivo, o promover el proceso de conocimiento que corresponda. Elegida una vía, se pierde la posibilidad de hacer valer la otra.","Rechazada la medida autosatisfactiva, el actor puede interponer recurso de apelación o promover el proceso de conocimiento que corresponda."],"t":"Recursos","s":"Para impugnar la medida autosatisfactiva ordenada, el legitimado puede optar entre la interposición directa del recurso de apelación o en subsidio al de revocatoria, que debe ser concedido con efecto devolutivo, o promover el proceso de conocimiento que corres"},{"n":639,"p":["Ninguna de las vías indicadas en el artículo precedente impide el cumplimiento inmediato de la decisión judicial impugnada.","Los jueces pueden ordenar discrecional y fundadamente la suspensión provisoria de la medida autosatisfactiva otorgada, en el supuesto que el legitimado acredite prima facie la posibilidad de sufrir un perjuicio de difícil o imposible reparación, previo ofrecimiento y prestación de contracautela suficiente."],"t":"Suspensión provisoria","s":"Ninguna de las vías indicadas en el artículo precedente impide el cumplimiento inmediato de la decisión judicial impugnada."},{"n":640,"p":["Son aplicables los principios procesales de tutela judicial efectiva, protección, inmediación, intervención inmediata y oportuna, temporalidad, impulsión oficiosa, oralidad, sencillez, razonabilidad y proporcionalidad, celeridad, economía procesal, reserva, favor probationem, para la protección de la familia y el bienestar de todos sus miembros, en particular de los niños, niñas y adolescentes. Estos principios son meramente enunciativos."],"t":"Principios. Enunciación","s":"Son aplicables los principios procesales de tutela judicial efectiva, protección, inmediación, intervención inmediata y oportuna, temporalidad, impulsión oficiosa, oralidad, sencillez, razonabilidad y proporcionalidad, celeridad, economía procesal, reserva, fa"},{"n":641,"p":["Los Juzgados de Familia y Violencia Familiar tienen competencia para entender en las siguientes causas:","1) autorización supletoria para contraer matrimonio o por dispensa de edad y dispensa supletoria del Artículo 458 del Código Civil y Comercial de la Nación. Oposición a la celebración de matrimonio;","2) inexistencia, ineficacia y nulidad de matrimonio;","3) divorcio, exclusión de la vivienda familiar y régimen de comunicación y contacto;","4) liquidación y partición del régimen de comunidad de ganancias, con excepción de la que se produce por causa de muerte;","5) separación judicial de bienes;","6) acciones de estado relativas a la filiación;","7) adopción, su nulidad y revocación;","8) suspensión, privación, rehabilitación de la responsabilidad parental y toda cuestión relativa a su ejercicio;","9) cuidado personal y guarda de niños, niñas y adolescentes y régimen de comunicación de los mismos con su familia;","10) acciones relativas a la asistencia alimentaria;","11) designación, suspensión y remoción del tutor y toda cuestión referente a la tutela;","12) decisiones relativas a la situación jurídica de niños, niñas y adolescentes y a su grupo familiar, en los casos que sea necesaria la intervención judicial para la adopción de las medidas de protección especial de derechos establecidos en la Ley II – N.° 16;","13) autorización para gravar y disponer de bienes de niños, niñas y adolescentes;","14) cuestiones relativas a inscripciones de nacimiento, nombre, estado civil y sus registraciones;","15) declaración de incapacidad, inhabilitación, rehabilitación, internaciones previstas en la legislación civil y toda cuestión referente a la curatela;","16) homologación de actas sobre cuestiones familiares;","17) requerimientos interjurisdiccionales relacionados con la competencia del Juzgado;","18) toda cuestión patrimonial derivada de los asuntos de su competencia;","19) litisexpensas y toda causa conexa, incidentes, trámites auxiliares, preparatorios, cautelares y sus cancelaciones, tercerías, juicios accesorios y ejecutorios en relación a las materias enumeradas en el presente artículo;","20) restitución de menores;","21) los procesos tramitados por las causas establecidas en la Ley XIV - N.º 6 (Antes Ley 3325), sus complementarias o modificatorias, en los que pueden disponer o requerir la aplicación de programas o la intervención de las instituciones y centros destinados a la asistencia y atención de las víctimas de violencia familiar, a los fines de su contención, resguardo y recuperación.","Los juzgados con competencia exclusiva en asuntos de Familia entienden en las causas determinadas en el presente artículo con excepción del inciso 21)."],"t":"Competencia","s":"Los Juzgados de Familia y Violencia Familiar tienen competencia para entender en las siguientes causas: 1) autorización supletoria para contraer matrimonio o por dispensa de edad y dispensa supletoria del Artículo 458 del Código Civil y Comercial de la Nación."},{"n":642,"p":["A falta de otras disposiciones y sin perjuicio de las reglas especiales contenidas en este Código o en otras leyes, en materia de competencia se debe estar a lo dispuesto en el Libro Primero, Título I, Capítulos I, II y III."],"t":"Principio de subsidiariedad","s":"A falta de otras disposiciones y sin perjuicio de las reglas especiales contenidas en este Código o en otras leyes, en materia de competencia se debe estar a lo dispuesto en el Libro Primero, Título I, Capítulos I, II y III."},{"n":643,"p":["Los jueces con competencia en materia de Familia y Violencia Familiar no pueden ser recusados sin expresión de causa."],"t":"Recusación","s":"Los jueces con competencia en materia de Familia y Violencia Familiar no pueden ser recusados sin expresión de causa."},{"n":644,"p":["En los juicios que se entablan en razón de la competencia establecida en el Artículo 641, a excepción de procedimientos especiales determinados en el presente Libro, se deben observar las disposiciones del presente Código, que sean de aplicación.","El niño, niña o adolescente y los miembros de la familia directamente vinculados deben ser oídos personalmente por el Juez."],"t":"Normas generales","s":"En los juicios que se entablan en razón de la competencia establecida en el Artículo 641, a excepción de procedimientos especiales determinados en el presente Libro, se deben observar las disposiciones del presente Código, que sean de aplicación."},{"n":645,"p":["En todas las actuaciones ante la Justicia de Familia, se debe preservar la intimidad del niño, niña o adolescente, en cuanto a la no difusión de su identificación ni circunstancias de la causa, a excepción de los casos en que el niño, niña o adolescente y su defensa técnica lo autoricen expresamente, en cuyo caso debe primar el principio de publicidad. Las actuaciones son secretas para cualquier persona que no sea el niño, niña o adolescente, las partes, la defensa y los funcionarios judiciales intervinientes.","Esta garantía rige aun cuando el niño, niña o adolescente cumpla dieciocho (18) años de edad."],"t":"Carácter de las actuaciones","s":"En todas las actuaciones ante la Justicia de Familia, se debe preservar la intimidad del niño, niña o adolescente, en cuanto a la no difusión de su identificación ni circunstancias de la causa, a excepción de los casos en que el niño, niña o adolescente y su d"},{"n":646,"p":["En caso de formarse una causa judicial, toda la documental, informes, diagnósticos, pericias, evaluaciones y demás actividades extrajudiciales que realizan los equipos técnicos interdisciplinarios, deben ser agregados a dicha causa como prueba preconstituida, a los efectos del mérito y valoración de la misma por el Juez, con el objeto de evitar reiteraciones innecesarias. Ello, sin perjuicio de la facultad de la autoridad judicial competente para solicitar cualesquiera otras medidas."],"t":"Prueba preconstituida","s":"En caso de formarse una causa judicial, toda la documental, informes, diagnósticos, pericias, evaluaciones y demás actividades extrajudiciales que realizan los equipos técnicos interdisciplinarios, deben ser agregados a dicha causa como prueba preconstituida, "},{"n":647,"p":["En los juicios relativos al estado y capacidad de las personas, cuando debe practicarse la notificación por cédula, las copias de los escritos de demanda, contestación, reconvención y contestación de ambas, así como la de otros escritos cuyo contenido puede afectar el decoro de quien ha de recibirlas, deben ser entregadas bajo sobre cerrado. Igual requisito se debe observar respecto de las copias de los documentos agregados a dichos escritos.","El sobre debe ser cerrado, con constancia de su contenido, el que debe ajustarse a lo dispuesto en el último párrafo del Artículo 139."],"t":"Copias de contenido reservado","s":"En los juicios relativos al estado y capacidad de las personas, cuando debe practicarse la notificación por cédula, las copias de los escritos de demanda, contestación, reconvención y contestación de ambas, así como la de otros escritos cuyo contenido puede af"},{"n":648,"p":["1) Proceso ordinario:","a) inexistencia y nulidad de matrimonio;","b) divorcio;","c) acciones de estado relativas a la filiación;","d) cuidado personal;","e) régimen de comunicación y contacto;","f) autorización para gravar y disponer de bienes de niños, niñas y adolescentes;","g) inscripción de nacimiento, nombre, estado civil y sus registraciones;","h) liquidación y partición del régimen de comunidad de ganancias, con excepción de la que se produce por causa de muerte;","i) separación judicial de bienes;","j) suspensión del ejercicio de la responsabilidad parental y suspensión y remoción de tutores y curadores.","2) Proceso Sumarísimo:","a) autorización supletoria para contraer matrimonio o por dispensa de edad y dispensa supletoria del Artículo 458 del Código Civil y Comercial de la Nación. Oposición a la celebración de matrimonio;","b) guarda tutelar o judicial de niños, niñas y adolescentes y régimen de comunicación de los mismos con su familia;","c) tutela;","d) homologación de actas sobre cuestiones familiares;","3) Proceso Especial:","a) declaración de estado de adoptabilidad, guarda con fines de adopción, juicio de adopción, su nulidad y revocación;","b) decisiones relativas a la situación jurídica de niños, niñas y adolescentes y a su grupo familiar;","c) declaración de incapacidad, inhabilitación, rehabilitación y curatela;","d) acciones relativas a la violencia familiar;","e) acciones relativas a la asistencia alimentaria;","f) restitución de menores."],"t":"Tipos de procesos","s":"1) Proceso ordinario: a) inexistencia y nulidad de matrimonio; b) divorcio; c) acciones de estado relativas a la filiación; d) cuidado personal; e) régimen de comunicación y contacto; f) autorización para gravar y disponer de bienes de niños, niñas y adolescen"},{"n":649,"p":["Proponer a las partes fórmulas para simplificar y disminuir las cuestiones litigiosas surgidas en el proceso o respecto de la actividad probatoria. En todos los casos la mera proposición de fórmulas conciliatorias no importa prejuzgamiento."],"t":"Deberes de los jueces","s":"Proponer a las partes fórmulas para simplificar y disminuir las cuestiones litigiosas surgidas en el proceso o respecto de la actividad probatoria. En todos los casos la mera proposición de fórmulas conciliatorias no importa prejuzgamiento."},{"n":650,"p":["El Juez puede solicitar el auxilio de la fuerza pública a fin de hacer comparecer a las partes."],"t":"Facultades","s":"El Juez puede solicitar el auxilio de la fuerza pública a fin de hacer comparecer a las partes."},{"n":651,"p":["Las audiencias previstas en el presente Libro, a criterio del Juez, pueden ser registradas por medios técnicos."],"t":"Audiencias","s":"Las audiencias previstas en el presente Libro, a criterio del Juez, pueden ser registradas por medios técnicos."},{"n":652,"p":["Cuando la persona interesada, o el Ministerio Pupilar a su instancia, solicita autorización para comparecer en juicio y ejercer actos jurídicos, se debe citar inmediatamente a aquélla, a quien debe otorgarla y al representante del Ministerio Pupilar, a una audiencia que tiene lugar dentro del tercer día y en la que se recibe toda la prueba.","En la resolución en que se concede autorización a un menor para estar en juicio, se le debe nombrar tutor especial.","En la autorización para comparecer en juicio queda comprendida la facultad de pedir litisexpensas."],"t":"Autorización para comparecer en juicio y ejercer actos jurídicos. Trámite","s":"Cuando la persona interesada, o el Ministerio Pupilar a su instancia, solicita autorización para comparecer en juicio y ejercer actos jurídicos, se debe citar inmediatamente a aquélla, a quien debe otorgarla y al representante del Ministerio Pupilar, a una aud"},{"n":653,"p":["En forma previa a la interposición de las acciones previstas en el Artículo 641 incisos 1), 9), 10) y 12) y cuestiones
