zación de los bienes afectados o si su conservación es gravosa o difícil, a pedido de parte y previo traslado a la otra por un plazo breve que se fija según la urgencia del caso, el Juez puede ordenar la venta en la forma m"},{"n":209,"p":["Cuando la medida se traba sobre bienes muebles, mercaderías o materias primas, pertenecientes a establecimientos comerciales, fabriles o afines, que los necesitan para su funcionamiento, o afectadas a la prestación de servicios públicos, el Juez puede autorizar la realización de los actos necesarios para no comprometer el proceso de fabricación, comercialización o prestación del servicio público."],"t":"Establecimientos industriales o comerciales. Servicios públicos","s":"Cuando la medida se traba sobre bienes muebles, mercaderías o materias primas, pertenecientes a establecimientos comerciales, fabriles o afines, que los necesitan para su funcionamiento, o afectadas a la prestación de servicios públicos, el Juez puede autoriza"},{"n":210,"p":["Se produce la caducidad de pleno derecho de las medidas cautelares que se ordenan y hacen efectivas antes del proceso, si tratándose de obligación exigible no se interpone la demanda dentro de los diez (10) días siguientes al de su traba, aunque la otra parte deduzca recurso. Las costas y los daños y perjuicios causados son a cargo de quien obtuvo la medida, y ésta no puede proponerse nuevamente por la misma causa y como previa a la promoción del proceso; una vez iniciado éste, puede ser nuevamente requerida si concurren los requisitos de su procedencia.","Las inhibiciones y embargos se extinguen a los cinco (5) años de la fecha de su anotación en el registro que corresponda, salvo que a petición de parte se reinscriban antes del vencimiento del plazo, por orden del Juez que entiende en el proceso."],"t":"Caducidad","s":"Se produce la caducidad de pleno derecho de las medidas cautelares que se ordenan y hacen efectivas antes del proceso, si tratándose de obligación exigible no se interpone la demanda dentro de los diez (10) días siguientes al de su traba, aunque la otra parte "},{"n":211,"p":["Salvo en el caso de los Artículos 212 inciso 1) y 215 cuando se disponga levantar una medida cautelar por cualquier motivo que demuestre que el requirente abusó o se excedió en el derecho que la ley otorga para obtenerla, la resolución lo debe condenar a pagar los daños y perjuicios si la otra parte lo solicitó.","La determinación del monto se sustancia por el trámite de los incidentes o por juicio ordinario, según que las circunstancias hagan preferible uno u otro procedimiento a criterio del Juez, cuya decisión sobre este punto es irrecurrible.","SECCIÓN 2.a EMBARGO PREVENTIVO"],"t":"Responsabilidad","s":"Salvo en el caso de los Artículos 212 inciso 1) y 215 cuando se disponga levantar una medida cautelar por cualquier motivo que demuestre que el requirente abusó o se excedió en el derecho que la ley otorga para obtenerla, la resolución lo debe condenar a pagar"},{"n":212,"p":["Puede pedir embargo preventivo el acreedor de deuda en dinero o en especie que se halla en alguna de las condiciones siguientes:","1) que el deudor no tenga domicilio en la República;","2) que la existencia del crédito esté demostrada con instrumento público o privado atribuido al deudor, abonada la firma por información sumaria de dos (2) testigos;","3) que fundándose la acción en un contrato bilateral, se justifique su existencia en la misma forma del inciso 2), debiendo en este caso probarse además sumariamente el cumplimiento del contrato por parte del actor, salvo que éste ofrezca cumplirlo, o que su obligación sea a plazo;","4) que la deuda esté justificada por libros de comercio llevados en debida forma por el actor, o resulte de boleto de corredor de acuerdo con sus libros, en los casos en que éstos pueden servir de prueba, o surja de la certificación realizada por contador público nacional en el supuesto de factura conformada;","5) que aún estando la deuda sujeta a condición o plazo, se acredite sumariamente que el deudor trata de enajenar, ocultar o transportar sus bienes, comprometiendo la garantía, o siempre que se justifique del mismo modo que por cualquier causa disminuyó apreciablemente la solvencia del deudor, después de contraída la obligación."],"t":"Procedencia","s":"Puede pedir embargo preventivo el acreedor de deuda en dinero o en especie que se halla en alguna de las condiciones siguientes: 1) que el deudor no tenga domicilio en la República;"},{"n":213,"p":["Pueden igualmente pedir el embargo preventivo:","1) el coheredero, el condómino o el socio, sobre los bienes de la herencia, del condominio o de la sociedad, si acreditan la verosimilitud del derecho y el peligro de la demora;","2) el propietario o locatario principal de predios urbanos o rústicos, haya o no contrato de arrendamiento, respecto de las cosas afectadas a los privilegios que le reconoce la ley. Debe acompañar a su petición el título de propiedad o el contrato de locación o intimar al locatario para que formule previamente las manifestaciones necesarias;","3) la persona a quien la ley reconoce privilegios sobre ciertos bienes muebles o inmuebles, siempre que el crédito se justifique en la forma establecida en el Artículo 212 inciso 2);","4) la persona que haya de demandar por acción reivindicatoria, petición de herencia, nulidad de testamento o simulación, respecto de la cosa demandada, mientras dure el juicio y siempre que se presenten documentos que hagan verosímil la pretensión deducida;","5) la persona que haya de demandar por daños y perjuicios ocasionados por accidente de tránsito, cuando el vehículo involucrado carece de cobertura de seguro contra terceros, sean transportados o no."],"t":"Otros casos","s":"Pueden igualmente pedir el embargo preventivo: 1) el coheredero, el condómino o el socio, sobre los bienes de la herencia, del condominio o de la sociedad, si acreditan la verosimilitud del derecho y el peligro de la demora;"},{"n":214,"p":["Cuando se demanda el cumplimiento de un contrato de compraventa, si el derecho es verosímil el adquirente puede solicitar el embargo del bien objeto de aquél."],"t":"Demanda por escrituración","s":"Cuando se demanda el cumplimiento de un contrato de compraventa, si el derecho es verosímil el adquirente puede solicitar el embargo del bien objeto de aquél."},{"n":215,"p":["Además de los supuestos contemplados en los artículos anteriores, durante el proceso puede decretarse el embargo preventivo:","1) en el caso del Artículo 63;","2) en el caso del Artículo 358 inciso 1), cuando resulte verosímil el derecho alegado;","3) si quien lo solicita obtuvo sentencia favorable, aunque esté recurrida."],"t":"Situaciones derivadas del proceso","s":"Además de los supuestos contemplados en los artículos anteriores, durante el proceso puede decretarse el embargo preventivo: 1) en el caso del Artículo 63; 2) en el caso del Artículo 358 inciso 1), cuando resulte verosímil el derecho alegado;"},{"n":216,"p":["En los casos en que debe efectuarse el embargo, se traba en la forma prescripta para el juicio ejecutivo. Se limita a los bienes necesarios para cubrir el crédito que se reclama y las costas.","Mientras no se disponga el secuestro o la administración judicial de lo embargado, el deudor puede continuar en el uso normal de la cosa."],"t":"Forma de la traba","s":"En los casos en que debe efectuarse el embargo, se traba en la forma prescripta para el juicio ejecutivo. Se limita a los bienes necesarios para cubrir el crédito que se reclama y las costas."},{"n":217,"p":["En el mandamiento se incluye siempre la autorización para que los funcionarios encargados de ejecutarlo soliciten el auxilio de la fuerza pública y el allanamiento de domicilio en caso de resistencia, y se deja constancia de la habilitación de día y hora y del lugar.","Contiene, asimismo, la prevención de que el embargado debe abstenerse de cualquier acto respecto de los bienes objeto de la medida, que pueda causar la disminución de la garantía del crédito, bajo apercibimiento de las sanciones penales que corresponden."],"t":"Mandamiento","s":"En el mandamiento se incluye siempre la autorización para que los funcionarios encargados de ejecutarlo soliciten el auxilio de la fuerza pública y el allanamiento de domicilio en caso de resistencia, y se deja constancia de la habilitación de día y hora y del"},{"n":218,"p":["Los funcionarios encargados de la ejecución del embargo sólo pueden suspenderlo cuando el deudor entrega la suma expresada en el mandamiento."],"t":"Suspensión","s":"Los funcionarios encargados de la ejecución del embargo sólo pueden suspenderlo cuando el deudor entrega la suma expresada en el mandamiento."},{"n":219,"p":["Si los bienes embargados son muebles, deben ser depositados a la orden judicial; pero si se trata de los de la casa en que vive el embargado y son susceptibles de embargo, aquél debe ser constituido en depositario de ellos, salvo que, por circunstancias especiales, no sea posible."],"t":"Depósito","s":"Si los bienes embargados son muebles, deben ser depositados a la orden judicial; pero si se trata de los de la casa en que vive el embargado y son susceptibles de embargo, aquél debe ser constituido en depositario de ellos, salvo que, por circunstancias especi"},{"n":220,"p":["El depositario de objetos embargados a la orden judicial debe presentarlos dentro del día siguiente al de la intimación judicial. No puede eludir la entrega invocando el derecho de retención.","Si no lo hace, el Juez debe remitir los antecedentes al Tribunal Penal competente, y puede asimismo ordenar la detención del depositario hasta el momento en que dicho Tribunal comience a actuar."],"t":"Obligación del depositario","s":"El depositario de objetos embargados a la orden judicial debe presentarlos dentro del día siguiente al de la intimación judicial. No puede eludir la entrega invocando el derecho de retención."},{"n":221,"p":["El acreedor que obtiene el embargo de bienes de su deudor, no afectados a créditos privilegiados, tiene derecho a cobrar íntegramente su crédito, intereses y costas, con preferencia a otros acreedores, salvo en el caso de concurso.","Los embargos posteriores afectan únicamente el sobrante que queda después de pagados los créditos que obtuvieron embargos anteriores."],"t":"Prioridad del primer embargante","s":"El acreedor que obtiene el embargo de bienes de su deudor, no afectados a créditos privilegiados, tiene derecho a cobrar íntegramente su crédito, intereses y costas, con preferencia a otros acreedores, salvo en el caso de concurso."},{"n":222,"p":["No se traba nunca embargo:","1) en el lecho cotidiano del deudor, de su mujer e hijos, en las ropas y muebles de su indispensable uso, ni en los instrumentos necesarios para la profesión, arte u oficio que ejerza;","2) sobre los sepulcros, salvo que el crédito corresponda a su precio de venta, construcción o suministro de materiales;","3) en los demás bienes exceptuados de embargo por ley.","Ningún otro bien queda exceptuado."],"t":"Bienes inembargables","s":"No se traba nunca embargo: 1) en el lecho cotidiano del deudor, de su mujer e hijos, en las ropas y muebles de su indispensable uso, ni en los instrumentos necesarios para la profesión, arte u oficio que ejerza;"},{"n":223,"p":["El embargo indebidamente trabado sobre alguno de los bienes enumerados en el Artículo 222 es levantado de oficio o a pedido del deudor o de su cónyuge o hijos, dentro de las cuarenta y ocho (48) horas, aunque la resolución que lo decretó se halle consentida. El magistrado interviniente responde personalmente cuando excede del plazo establecido.","SECCIÓN 3.a SECUESTRO"],"t":"Levantamiento de oficio y en todo tiempo","s":"El embargo indebidamente trabado sobre alguno de los bienes enumerados en el Artículo 222 es levantado de oficio o a pedido del deudor o de su cónyuge o hijos, dentro de las cuarenta y ocho (48) horas, aunque la resolución que lo decretó se halle consentida."},{"n":224,"p":["Procede el secuestro de los bienes muebles o semovientes objeto del juicio, cuando el embargo no asegura por sí solo el derecho invocado por el solicitante, siempre que se presenten instrumentos que hagan verosímil el derecho cuya efectividad se quiere garantizar. Procede, asimismo, con igual condición, toda vez que sea indispensable proveer a la guarda o conservación de cosas para asegurar el resultado de la sentencia definitiva.","Procede el secuestro de bienes muebles registrables cuando la inscripción del embargo que se ordena debe realizarse fuera del país. En este último supuesto, el Juez ordena la comunicación de la medida a la Administración Federal de Ingresos Públicos-Dirección General de Aduanas.","El Juez designa depositario a la institución oficial o persona que mejor convenga, fija su remuneración y ordena el inventario, si es indispensable.","SECCIÓN 4.a INTERVENCIÓN JUDICIAL"],"t":"Procedencia","s":"Procede el secuestro de los bienes muebles o semovientes objeto del juicio, cuando el embargo no asegura por sí solo el derecho invocado por el solicitante, siempre que se presenten instrumentos que hagan verosímil el derecho cuya efectividad se quiere garanti"},{"n":225,"p":["Además de las medidas cautelares de intervención o administración judiciales autorizadas por las leyes sustanciales, que quedan sujetas al régimen establecido por ellas, pueden disponerse las que se regulan en los artículos siguientes."],"t":"Ámbito","s":"Además de las medidas cautelares de intervención o administración judiciales autorizadas por las leyes sustanciales, que quedan sujetas al régimen establecido por ellas, pueden disponerse las que se regulan en los artículos siguientes."},{"n":226,"p":["A pedido del acreedor y a falta de otra medida cautelar eficaz o como complemento de la dispuesta, puede designarse a un interventor recaudador, si aquélla debe recaer sobre bienes productores de rentas o frutos.","Su función se limita exclusivamente a la recaudación de la parte embargada, sin injerencia alguna en la administración.","El Juez determina el monto de la recaudación, que no puede exceder del cincuenta por ciento (50%) de las entradas brutas; su importe debe ser depositado a la orden del Juzgado dentro del plazo que éste determina."],"t":"Interventor recaudador","s":"A pedido del acreedor y a falta de otra medida cautelar eficaz o como complemento de la dispuesta, puede designarse a un interventor recaudador, si aquélla debe recaer sobre bienes productores de rentas o frutos."},{"n":227,"p":["De oficio o a petición de parte, el Juez puede designar un interventor informante para que dé noticia acerca del estado de los bienes objeto del juicio o de las operaciones o actividades, con la periodicidad que se establece en la providencia que lo designa."],"t":"Interventor informante","s":"De oficio o a petición de parte, el Juez puede designar un interventor informante para que dé noticia acerca del estado de los bienes objeto del juicio o de las operaciones o actividades, con la periodicidad que se establece en la providencia que lo designa."},{"n":228,"p":["Cualquiera sea la fuente legal de la intervención judicial y en cuanto sea compatible con la respectiva regulación:","1) el Juez debe apreciar su procedencia con criterio restrictivo; la resolución es dictada en la forma prescripta en el Artículo 162;","2) la designación debe recaer en persona que posee los conocimientos necesarios para desempeñarse atendiendo a la naturaleza de los bienes o actividades en que interviene; es, en su caso, persona ajena a la sociedad o asociación intervenida;","3) la providencia que designa al interventor determina la misión que debe cumplir y el plazo de duración, que sólo puede prorrogarse por resolución fundada;","4) la contracautela se fija teniendo en consideración la clase de intervención, los perjuicios que puede irrogar y las costas;","5) los gastos extraordinarios son autorizados por el Juez previo traslado a las partes, salvo cuando la demora puede ocasionar perjuicios; en este caso, el interventor debe informar al Juzgado dentro del tercer día de realizados.","El nombramiento de auxiliares requiere siempre autorización previa del Juzgado."],"t":"Disposiciones comunes a toda clase de intervención","s":"Cualquiera sea la fuente legal de la intervención judicial y en cuanto sea compatible con la respectiva regulación: 1) el Juez debe apreciar su procedencia con criterio restrictivo; la resolución es dictada en la forma prescripta en el Artículo 162;"},{"n":229,"p":["El interventor debe:","1) desempeñar personalmente el cargo con arreglo a las directivas que le imparte el Juez;","2) presentar los informes periódicos que dispone el Juzgado y uno final, al concluir su cometido;","3) evitar la adopción de medidas que no son estrictamente necesarias para el cumplimiento de su función o que comprometen su imparcialidad respecto de las partes interesadas o pueden producirles daño o menoscabo.","El interventor que no cumple eficazmente su cometido puede ser removido de oficio; si media pedido de parte, se da traslado a las demás y al interventor."],"t":"Deberes del interventor. Remoción","s":"El interventor debe: 1) desempeñar personalmente el cargo con arreglo a las directivas que le imparte el Juez; 2) presentar los informes periódicos que dispone el Juzgado y uno final, al concluir su cometido;"},{"n":230,"p":["El interventor sólo percibe los honorarios a que tiene derecho, una vez aprobado judicialmente el informe final de su gestión. Si su actuación debe prolongarse durante un plazo que a criterio del Juez justifica el pago de anticipos, previo traslado a las partes, se fijan éstos en adecuada proporción al eventual importe total de sus honorarios.","Para la regulación del honorario definitivo se atiende a la naturaleza y modalidades de la intervención, al monto de las utilidades realizadas, a la importancia y eficacia de la gestión, a la responsabilidad en ella comprometida, al lapso de la actuación y a las demás circunstancias del caso.","Carece de derecho a cobrar honorarios el interventor removido del cargo por ejercicio abusivo; si la remoción se debe a negligencia, aquel derecho a honorarios o la proporción que corresponda es determinada por el Juez.","El pacto de honorarios celebrado por el interventor es nulo e importa ejercicio abusivo del cargo.","SECCIÓN 5.a INHIBICIÓN GENERAL DE BIENES Y ANOTACIÓN DE LITIS"],"t":"Honorarios","s":"El interventor sólo percibe los honorarios a que tiene derecho, una vez aprobado judicialmente el informe final de su gestión."},{"n":231,"p":["En todos los casos en que habiendo lugar a embargo éste no puede hacerse efectivo por no conocerse bienes del deudor, o por no cubrir éstos el importe del crédito reclamado, puede solicitarse contra aquél la inhibición general de vender o gravar sus bienes, la que se debe dejar sin efecto siempre que presente a embargo bienes suficientes o dé caución bastante.","El que solicite la inhibición debe expresar el nombre, apellido y domicilio del deudor, así como todo otro dato que pueda individualizar al inhibido, sin perjuicio de los demás requisitos que imponen las leyes.","La inhibición sólo surte efecto desde la fecha de su anotación salvo para los casos en que el dominio se transmitió con anterioridad, de acuerdo con lo dispuesto en la legislación general.","No concede preferencia sobre las anotadas con posterioridad."],"t":"Inhibición general de bienes","s":"En todos los casos en que habiendo lugar a embargo éste no puede hacerse efectivo por no conocerse bienes del deudor, o por no cubrir éstos el importe del crédito reclamado, puede solicitarse contra aquél la inhibición general de vender o gravar sus bienes, la"},{"n":232,"p":["Procede la anotación de litis cuando se deduce una pretensión que puede tener como consecuencia la modificación de una inscripción en el registro correspondiente y el derecho es verosímil.","La anotación de litis se extingue a los cinco (5) años de la fecha de su inscripción en el registro que corresponda, salvo que a petición de parte se reinscriba antes del vencimiento del plazo, por orden del Juez que entiende en el proceso.","SECCIÓN 6.a PROHIBICIÓN DE INNOVAR. PROHIBICIÓN DE CONTRATAR."],"t":"Anotación de litis","s":"Procede la anotación de litis cuando se deduce una pretensión que puede tener como consecuencia la modificación de una inscripción en el registro correspondiente y el derecho es verosímil."},{"n":233,"p":["Puede decretarse la prohibición de innovar en toda clase de juicio siempre que:","1) el derecho sea verosímil;","2) exista el peligro de que si se mantiene o altera en su caso, la situación de hecho o de derecho, la modificación pueda influir en la sentencia o convierta su ejecución en ineficaz o imposible;","3) la cautela no pueda obtenerse por medio de otra medida precautoria."],"t":"Prohibición de Innovar","s":"Puede decretarse la prohibición de innovar en toda clase de juicio siempre que: 1) el derecho sea verosímil;"},{"n":234,"p":["Cuando por ley o contrato o para asegurar la ejecución forzada de los bienes objeto del juicio, procede la prohibición de contratar sobre determinados bienes, el Juez ordena la medida. Individualiza lo que es objeto de la prohibición, disponiendo se inscriba en los registros correspondientes y se notifique a los interesados y a los terceros que mencione el solicitante.","La medida queda sin efecto si quien la obtiene no deduce la demanda dentro del plazo de cinco (5) días de haber sido dispuesta, y en cualquier momento en que se demuestre su improcedencia.","SECCIÓN 7.a MEDIDAS CAUTELARES GENÉRICAS Y NORMAS SUBSIDIARIAS"],"t":"Prohibición de contratar","s":"Cuando por ley o contrato o para asegurar la ejecución forzada de los bienes objeto del juicio, procede la prohibición de contratar sobre determinados bienes, el Juez ordena la medida."},{"n":235,"p":["Fuera de los casos previstos en los artículos precedentes, quien tiene fundado motivo para temer que durante el tiempo anterior al reconocimiento judicial de su derecho, éste pueda sufrir un perjuicio inminente o irreparable, puede solicitar las medidas urgentes que, según las circunstancias, sean más aptas para asegurar provisionalmente el cumplimiento de la sentencia."],"t":"Medidas cautelares genéricas","s":"Fuera de los casos previstos en los artículos precedentes, quien tiene fundado motivo para temer que durante el tiempo anterior al reconocimiento judicial de su derecho, éste pueda sufrir un perjuicio inminente o irreparable, puede solicitar las medidas urgent"},{"n":236,"p":["Lo dispuesto en este capítulo respecto del embargo preventivo es aplicable al embargo ejecutivo, al ejecutorio, y a las demás medidas cautelares, en lo pertinente.","SECCIÓN 8.a PROTECCIÓN DE PERSONAS"],"t":"Normas subsidiarias","s":"Lo dispuesto en este capítulo respecto del embargo preventivo es aplicable al embargo ejecutivo, al ejecutorio, y a las demás medidas cautelares, en lo pertinente. SECCIÓN 8.a PROTECCIÓN DE PERSONAS"},{"n":237,"p":["Puede decretarse la guarda:","1) de personas mayores de 18 años en condición de vulnerabilidad, que son maltratados, abandonados o inducidos por otras personas a actos ilícitos o deshonestos o expuestos a graves riesgos físicos o morales;","2) de los incapaces mayores de dieciocho (18) años que son maltratados, abandonados o inducidos por sus curadores a actos ilícitos o deshonestos o expuestos a graves riesgos físicos o morales. Asimismo cuando los curadores están impedidos de ejercer sus funciones;","3) de los incapaces mayores de dieciocho (18) años que están en pleito con su curador y en el que se controvierte la curatela o sus efectos."],"t":"Procedencia","s":"Puede decretarse la guarda: 1) de personas mayores de 18 años en condición de vulnerabilidad, que son maltratados, abandonados o inducidos por otras personas a actos ilícitos o deshonestos o expuestos a graves riesgos físicos o morales;"},{"n":238,"p":["La guarda es decretada por el Juez del domicilio de la persona que ha de ser amparada, con intervención del Asesor de Menores e Incapaces.","Cuando existe urgencia o circunstancias graves, se resuelve provisionalmente sin más trámite."],"t":"Juez competente","s":"La guarda es decretada por el Juez del domicilio de la persona que ha de ser amparada, con intervención del Asesor de Menores e Incapaces. Cuando existe urgencia o circunstancias graves, se resuelve provisionalmente sin más trámite."},{"n":239,"p":["En los casos previstos en el Artículo 237 la petición puede ser deducida por cualquier persona, y formulada verbalmente ante el Asesor de Menores e Incapaces, en cuyo caso se labra acta con las menciones pertinentes, la que es remitida al Juzgado que corresponde."],"t":"Procedimiento","s":"En los casos previstos en el Artículo 237 la petición puede ser deducida por cualquier persona, y formulada verbalmente ante el Asesor de Menores e Incapaces, en cuyo caso se labra acta con las menciones pertinentes, la que es remitida al Juzgado que correspon"},{"n":240,"p":["Al disponer la medida, el Juez ordena que se entreguen a la persona a favor de quien es ordenada, las ropas, útiles y muebles de su uso y profesión. Ordena, asimismo, que se le provea de alimentos por el plazo de treinta (30) días, a cuyo vencimiento quedan sin efecto si no se inicia el juicio correspondiente. La suma es fijada prudencialmente por el Juez, previa vista a quien debe pagarlos y sin otro trámite.","SECCIÓN 9.a TUTELA ANTICIPADA"],"t":"Medidas complementarias","s":"Al disponer la medida, el Juez ordena que se entreguen a la persona a favor de quien es ordenada, las ropas, útiles y muebles de su uso y profesión."},{"n":241,"p":["Sin que configure prejuzgamiento, el Juez puede, a requerimiento fundado de quien tiene un interés legítimo y de manera excepcional, anticipar parcial o totalmente los efectos de la tutela pretendida en la demanda o en la reconvención, cuando concurren los siguientes extremos:","1) convicción suficiente sobre la probabilidad cierta del derecho que la sustenta;","2) urgencia de la medida en tal grado que de no ser adoptada de inmediato cause al peticionario la frustración del derecho a la salud o a la vida, o un daño irreparable equivalente;","3) otorgamiento de contracautela real suficiente, salvo en los casos en que el peticionario se encuentre legalmente exento de darla."],"t":"Procedencia","s":"Sin que configure prejuzgamiento, el Juez puede, a requerimiento fundado de quien tiene un interés legítimo y de manera excepcional, anticipar parcial o totalmente los efectos de la tutela pretendida en la demanda o en la reconvención, cuando concurren los sig"},{"n":242,"p":["Solicitada la tutela, el Juez debe fijar una audiencia con carácter urgente, a la que deben ser citadas las partes interesadas notificándolas personalmente o por cédula, carta documento o acta notarial y se celebra con quienes comparecen.","Concluida la audiencia, resuelve sin otra sustanciación. La resolución se notifica a las partes no comparecientes personalmente o por cédula.","Si el solicitante o quien lo represente no comparece a la audiencia, la tutela debe ser rechazada y no puede ser solicitada con igual carácter en lo sucesivo."],"t":"Procedimiento. Efectos","s":"Solicitada la tutela, el Juez debe fijar una audiencia con carácter urgente, a la que deben ser citadas las partes interesadas notificándolas personalmente o por cédula, carta documento o acta notarial y se celebra con quienes comparecen."},{"n":243,"p":["La tutela anticipada puede ser revocada o modificada al tiempo de la sentencia, o por vía de incidente durante la secuela del proceso si cambian las condiciones tenidas en cuenta para disponerla. Se consideran también al efecto las actitudes procesales de las partes, en cuanto de ellas surjan indicios de abuso del derecho de defensa o manifiesto propósito dilatorio.","Si a pedido de parte, el Juez considera que la medida es obtenida sin derecho o con abuso de derecho, debe declarar la responsabilidad del requirente, condenándolo a los daños y perjuicios.","El régimen de cumplimiento y de recursos es el establecido para las medidas cautelares. Concedida o no la tutela el proceso prosigue hasta su finalización."],"t":"Modificación. Recursos","s":"La tutela anticipada puede ser revocada o modificada al tiempo de la sentencia, o por vía de incidente durante la secuela del proceso si cambian las condiciones tenidas en cuenta para disponerla."},{"n":244,"p":["El recurso de reposición procede únicamente contra las providencias simples, causen o no gravamen irreparable, a fin de que el Juez o Tribunal que las dictó las revoque por contrario imperio."],"t":"Procedencia","s":"El recurso de reposición procede únicamente contra las providencias simples, causen o no gravamen irreparable, a fin de que el Juez o Tribunal que las dictó las revoque por contrario imperio."},{"n":245,"p":["El recurso se interpone y funda por escrito dentro de los tres (3) días siguientes al de la notificación de la resolución; pero cuando ésta se dicta en una audiencia, debe interponerse verbalmente en el mismo acto.","Si el recurso es manifiestamente inadmisible, el Juez o Tribunal puede rechazarlo sin ningún otro trámite."],"t":"Plazo y forma","s":"El recurso se interpone y funda por escrito dentro de los tres (3) días siguientes al de la notificación de la resolución; pero cuando ésta se dicta en una audiencia, debe interponerse verbalmente en el mismo acto."},{"n":246,"p":["El Juez dicta resolución, previo traslado al solicitante de la providencia recurrida, quien debe contestarlo dentro del plazo de tres (3) días si el recurso se interpuso por escrito, y en el mismo acto si lo fue en una audiencia.","La reposición de providencias dictadas de oficio o a pedido de la misma parte que recurre, es resuelta sin sustanciación.","Cuando la resolución depende de hechos controvertidos, el Juez puede imprimir al recurso de reposición el trámite de los incidentes.","Cuando el error de hecho o de derecho contenido en la providencia resulta evidente, de oficio o a pedido de parte, el Juez puede revocarla sin previa sustanciación, fundando los motivos."],"t":"Trámite","s":"El Juez dicta resolución, previo traslado al solicitante de la providencia recurrida, quien debe contestarlo dentro del plazo de tres (3) días si el recurso se interpuso por escrito, y en el mismo acto si lo fue en una audiencia."},{"n":247,"p":["La resolución que recae hace ejecutoria, a menos que:","1) el recurso de reposición sea acompañado del de apelación subsidiaria y la providencia impugnada reúna las condiciones establecidas en el Artículo 249, para que sea apelable;","2) haga lugar a la revocatoria, en cuyo caso puede apelar la parte contraria, si corresponde."],"t":"Resolución","s":"La resolución que recae hace ejecutoria, a menos que: 1) el recurso de reposición sea acompañado del de apelación subsidiaria y la providencia impugnada reúna las condiciones establecidas en el Artículo 249, para que sea apelable;"},{"n":248,"p":["De oficio o a pedido de parte procede la revocatoria in extremis de resoluciones interlocutorias y definitivas en las que se haya incurrido en evidente error material o de hecho capaz de generar una injusticia notoria no susceptible de ser subsanada por otra vía.","Cuando es a pedido de parte, el recurso se interpone y funda por escrito dentro de los cinco (5) días siguientes al de la notificación de la resolución que se recurre y procede cuando la parte no dio motivo al error.","El Juez dicta resolución previo traslado a la contraria, el que se notifica personalmente o por cédula, quien debe contestar dentro del plazo de cinco (5) días.","SECCIÓN 2.a RECURSO DE APELACIÓN. RECURSO DE NULIDAD"],"t":"Revocatoria “in extremis”","s":"De oficio o a pedido de parte procede la revocatoria in extremis de resoluciones interlocutorias y definitivas en las que se haya incurrido en evidente error material o de hecho capaz de generar una injusticia notoria no susceptible de ser subsanada por otra v"},{"n":249,"p":["El recurso de apelación, salvo disposición en contrario, procede solamente respecto de:","1) las sentencias definitivas;","2) las sentencias interlocutorias;","3) las providencias simples que causan un gravamen que no puede ser reparado por la sentencia definitiva.","Son inapelables las sentencias definitivas y las demás resoluciones cualquiera sea su naturaleza, que se dictan en procesos en los que el valor cuestionado no excede de la suma de Pesos Doscientos Cincuenta ($250). Dicho monto se debe determinar atendiendo exclusivamente al capital reclamado en la demanda, actualizado si corresponde a la fecha de la resolución, de acuerdo con los índices oficiales de variación de precios mayoristas no agropecuarios. Esta disposición no es aplicable a los procesos en que se pretende el desalojo de inmuebles, de alimentos o en aquellos que se discuten sanciones procesales."],"t":"Procedencia","s":"El recurso de apelación, salvo disposición en contrario, procede solamente respecto de: 1) las sentencias definitivas; 2) las sentencias interlocutorias; 3) las providencias simples que causan un gravamen que no puede ser reparado por la sentencia definitiva."},{"n":250,"p":["El recurso de apelación es concedido libremente o en relación; y en uno u otro caso, en efecto suspensivo o devolutivo.","El recurso contra la sentencia definitiva en el juicio ordinario es concedido libremente. En los demás casos, sólo en relación.","Procede siempre en efecto suspensivo, a menos que la ley disponga que lo sea en el devolutivo.","Los recursos concedidos en relación lo son, asimismo, en efecto diferido, cuando la ley así lo dispone."],"t":"Formas y efectos","s":"El recurso de apelación es concedido libremente o en relación; y en uno u otro caso, en efecto suspensivo o devolutivo. El recurso contra la sentencia definitiva en el juicio ordinario es concedido libremente. En los demás casos, sólo en relación."},{"n":251,"p":["Si no existen disposiciones en contrario, el plazo para apelar es de cinco (5) días.","Toda regulación de honorarios es apelable. El recurso de apelación debe interponerse y puede fundarse dentro de los cinco (5) días de la notificación."],"t":"Plazo","s":"Si no existen disposiciones en contrario, el plazo para apelar es de cinco (5) días. Toda regulación de honorarios es apelable. El recurso de apelación debe interponerse y puede fundarse dentro de los cinco (5) días de la notificación."},{"n":252,"p":["El recurso de apelación se interpone por escrito. Solo se admite su interposición verbal cuando se plantea en el curso de una audiencia. Cuando corresponde la concesión del recurso en relación sin efecto diferido el apelante debe fundar el recurso en el mismo escrito de interposición. En los demás casos el apelante debe limitarse a la mera interposición del recurso y si esta regla es infringida se manda devolver el escrito, previa anotación que el Secretario o el Oficial Primero debe poner en el expediente con indicación de la fecha de interposición del recurso y del domicilio constituido en su caso. La fundamentación debe observar lo establecido en el Artículo 267 en lo pertinente."],"t":"Formas de interposición del recurso","s":"El recurso de apelación se interpone por escrito. Solo se admite su interposición verbal cuando se plantea en el curso de una audiencia."},{"n":253,"p":["Objeción sobre la forma de concesión del recurso. Cuando procede la apelación en relación, sin efecto diferido, el apelante debe fundar el recurso en el escrito de interposición. Concedido el recurso se da traslado a la otra parte por el plazo de cinco (5) días, notificándosele personalmente o por cédula. Si se interpone sin fundamentación, el Juez debe declarar desierto el recurso.","Si cualquiera de las partes pretende que el recurso debió otorgarse libremente, puede solicitar, dentro de tres (3) días, que el Juez rectifique el error. Igual pedido pueden las partes formular si pretenden que el recurso concedido libremente debió otorgarse en relación.","Estas normas rigen sin perjuicio de lo dispuesto en el Artículo 278."],"t":"Apelación en relación sin efecto diferido","s":"Objeción sobre la forma de concesión del recurso. Cuando procede la apelación en relación, sin efecto diferido, el apelante debe fundar el recurso en el escrito de interposición."},{"n":254,"p":["La apelación en efecto diferido se funda, en el juicio ordinario, en la oportunidad del Artículo 262, y en los procesos de ejecución juntamente con la interposición del recurso contra la sentencia.","En los procesos de ejecución de sentencia, si la resolución recurrida es posterior a la mencionada en el Artículo 476, el recurso se funda en la forma establecida en el párrafo primero del Artículo 253.","En el proceso ordinario la Cámara resuelve con anterioridad a la sentencia definitiva."],"t":"Efecto diferido","s":"La apelación en efecto diferido se funda, en el juicio ordinario, en la oportunidad del Artículo 262, y en los procesos de ejecución juntamente con la interposición del recurso contra la sentencia."},{"n":255,"p":["Cuando el recurso de apelación se interpone subsidiariamente con el de reposición, no se admite ningún escrito para fundar la apelación."],"t":"Apelación subsidiaria","s":"Cuando el recurso de apelación se interpone subsidiariamente con el de reposición, no se admite ningún escrito para fundar la apelación."},{"n":256,"p":["Cuando el tribunal que ha de conocer del recurso tiene su asiento en distinta localidad, y aquél proceda libremente, en el escrito a que se refiere el Artículo 252 el apelante, y el apelado dentro de los cinco (5) días de concedido el recurso, deben constituir domicilio en dicha localidad.","Si el recurso procede en relación, las partes deben constituir domicilio en los escritos mencionados en el Artículo 253.","En ambos casos, la parte que no cumple el requisito impuesto por este artículo queda notificada por ministerio de la ley."],"t":"Constitución de domicilio","s":"Cuando el tribunal que ha de conocer del recurso tiene su asiento en distinta localidad, y aquél proceda libremente, en el escrito a que se refiere el Artículo 252 el apelante, y el apelado dentro de los cinco (5) días de concedido el recurso, deben constituir"},{"n":257,"p":["Si procede el recurso en efecto devolutivo, se observan las siguientes reglas:","1) si la sentencia es definitiva, se remite el expediente a la Cámara y queda en el Juzgado copia de lo pertinente, la que debe ser presentada por el apelante. La providencia que concede el recurso señala las piezas que han de copiarse;","2) si la sentencia es interlocutoria, el apelante debe presentar copia de lo que señala del expediente y de lo que el Juez estima necesario. Igual derecho asiste al apelado. Dichas copias y los memoriales son remitidos a la Cámara, salvo que el Juez considere más expeditivo retenerlos para la prosecución del juicio y remitir el expediente original;","3) se declara desierto el recurso si dentro del quinto día de concedido, el apelante no presenta las copias que se indican en este Artículo, y que están a su cargo. Si no lo hace el apelado, se prescinde de ellas."],"t":"Efecto devolutivo","s":"Si procede el recurso en efecto devolutivo, se observan las siguientes reglas: 1) si la sentencia es definitiva, se remite el expediente a la Cámara y queda en el Juzgado copia de lo pertinente, la que debe ser presentada por el apelante."},{"n":258,"p":["En los casos de los Artículo 252 y 257, el expediente o las actuaciones se remiten a la Cámara dentro del quinto día de concedido el recurso o de formada la pieza separada, en su caso, mediante constancia y bajo la responsabilidad del Oficial Primero. En el caso del Artículo 253 dicho plazo se cuenta desde la contestación del traslado, o desde que vence el plazo para hacerlo.","Si la Cámara tiene su asiento en distinta localidad, la remisión se efectúa por correo y dentro del mismo plazo, contado desde la presentación del apelado en la que constituye domicilio o contesta el traslado, o desde que vence el plazo para cumplir tales actos.","La remisión por correo se hace a costa del recurrente."],"t":"Remisión del expediente o actuación","s":"En los casos de los Artículo 252 y 257, el expediente o las actuaciones se remiten a la Cámara dentro del quinto día de concedido el recurso o de formada la pieza separada, en su caso, mediante constancia y bajo la responsabilidad del Oficial Primero."},{"n":259,"p":["La falta de pago del impuesto o sellado de justicia no impide en ningún caso la concesión o trámite del recurso."],"t":"Pago del impuesto","s":"La falta de pago del impuesto o sellado de justicia no impide en ningún caso la concesión o trámite del recurso."},{"n":260,"p":["El recurso de apelación comprende el de nulidad por defectos de la sentencia.","Si el procedimiento está ajustado a derecho y el tribunal de alzada declara la nulidad de la sentencia por cualquier otra causa, resuelve también sobre el fondo del litigio.","SECCIÓN 3.a PROCEDIMIENTO ORDINARIO EN SEGUNDA INSTANCIA"],"t":"Nulidad","s":"El recurso de apelación comprende el de nulidad por defectos de la sentencia. Si el procedimiento está ajustado a derecho y el tribunal de alzada declara la nulidad de la sentencia por cualquier otra causa, resuelve también sobre el fondo del litigio."},{"n":261,"p":["Cuando el recurso se concede respecto de sentencia definitiva dictada en proceso ordinario, en el día en que el expediente llegue a la cámara, el Secretario debe dar cuenta y se ordena que sea puesto en la oficina. Esta providencia se notifica a las partes personalmente o por cédula. El apelante debe expresar agravios dentro del plazo de diez (10) días."],"t":"Trámite previo. Expresión de agravios","s":"Cuando el recurso se concede respecto de sentencia definitiva dictada en proceso ordinario, en el día en que el expediente llegue a la cámara, el Secretario debe dar cuenta y se ordena que sea puesto en la oficina."},{"n":262,"p":["Pedido de apertura a prueba. Dentro del quinto día de notificada la providencia a que se refiere el Artículo 261 y en un solo escrito, las partes deben:","1) fundar los recursos que se concedieron en efecto diferido. Si no lo hacen, quedan firmes las respectivas resoluciones;","2) indicar las medidas probatorias denegadas en primera instancia o respecto de las cuales medió declaración de negligencia, que tengan interés en replantear en los términos de los","Artículos 381 y 387 último párrafo. La petición es fundada, y resuelta sin sustanciación alguna;","3) presentar los documentos de que intentan valerse, de fecha posterior a la providencia de autos para sentencia de primera instancia, o anteriores, si afirman no haber tenido antes conocimiento de ellos;","4) pedir que se abra la causa a prueba cuando:","a) se alega un hecho nuevo posterior a la oportunidad prevista en el Artículo 367, o se trata del caso a que se refiere el segundo párrafo del Artículo 368.","b) se formula el pedido a que se refiere el inciso 2) del presente artículo."],"t":"Fundamentos de las apelaciones diferidas. Actualización de cuestiones","s":"Pedido de apertura a prueba. Dentro del quinto día de notificada la providencia a que se refiere el Artículo 261 y en un solo escrito, las partes deben: 1) fundar los recursos que se concedieron en efecto diferido."},{"n":263,"p":["De las presentaciones y peticiones a que se refieren los incisos 1), 3) y 4) subinciso a) del Artículo 262, se corre traslado a la parte contraria, quien debe contestarlo dentro del quinto día."],"t":"Traslado","s":"De las presentaciones y peticiones a que se refieren los incisos 1), 3) y 4) subinciso a) del Artículo 262, se corre traslado a la parte contraria, quien debe contestarlo dentro del quinto día."},{"n":264,"p":["Las pruebas que deben producirse ante la Cámara se rigen, en cuanto sea compatible, por las disposiciones establecidas para la primera instancia.","Para alegar sobre su mérito, las partes no pueden retirar el expediente.","El plazo para presentar el alegato es de seis (6) días."],"t":"Prueba y alegatos","s":"Las pruebas que deben producirse ante la Cámara se rigen, en cuanto sea compatible, por las disposiciones establecidas para la primera instancia. Para alegar sobre su mérito, las partes no pueden retirar el expediente."},{"n":265,"p":["Los miembros del Tribunal asisten a todos los actos de prueba en los supuestos que la ley establece o cuando así lo solicita oportunamente alguna de las partes en los términos del Artículo 34, inciso 1). En ellos lleva la palabra el presidente. Los demás jueces, con su autorización, pueden preguntar lo que estiman oportuno."],"t":"Producción de la prueba","s":"Los miembros del Tribunal asisten a todos los actos de prueba en los supuestos que la ley establece o cuando así lo solicita oportunamente alguna de las partes en los términos del Artículo 34, inciso 1). En ellos lleva la palabra el presidente."},{"n":266,"p":["Si se pretende producir prueba en segunda instancia, dentro del quinto día de notificada la providencia a que se refiere el Artículo 261 las partes deben manifestar si van a informar in voce. Si no hacen esa manifestación o no informan, se resuelve sin dichos informes."],"t":"Informe \"in voce\"","s":"Si se pretende producir prueba en segunda instancia, dentro del quinto día de notificada la providencia a que se refiere el Artículo 261 las partes deben manifestar si van a informar in voce."},{"n":267,"p":["El escrito de expresión de agravios debe contener la crítica concreta y razonada de las partes del fallo que el apelante considera equivocadas. No basta remitirse a presentaciones anteriores.","Del escrito se da traslado por diez (10) días al apelado. Esta providencia se notifica personalmente o por cédula."],"t":"Contenido de la expresión de agravios. Traslado","s":"El escrito de expresión de agravios debe contener la crítica concreta y razonada de las partes del fallo que el apelante considera equivocadas. No basta remitirse a presentaciones anteriores. Del escrito se da traslado por diez (10) días al apelado."},{"n":268,"p":["Si el apelante no expresa agravios dentro del plazo o no lo hace en la forma prescripta en el Artículo 267, el tribunal debe declarar desierto el recurso, y señalar, en su caso, cuáles son las motivaciones esenciales del pronunciamiento recurrido que no fueron eficazmente rebatidas.","Declarada la deserción del recurso la sentencia queda firme para el recurrente."],"t":"Deserción del recurso","s":"Si el apelante no expresa agravios dentro del plazo o no lo hace en la forma prescripta en el Artículo 267, el tribunal debe declarar desierto el recurso, y señalar, en su caso, cuáles son las motivaciones esenciales del pronunciamiento recurrido que no fueron"},{"n":269,"p":["Si el apelado no contesta el escrito de expresión de agravios dentro del plazo fijado en el Artículo 267, no puede hacerlo en adelante y la instancia sigue su curso."],"t":"Falta de contestación de la expresión de agravios","s":"Si el apelado no contesta el escrito de expresión de agravios dentro del plazo fijado en el Artículo 267, no puede hacerlo en adelante y la instancia sigue su curso."},{"n":270,"p":["Con la expresión de agravios y su contestación, o vencido el plazo para la presentación de ésta y, en su caso, sustanciadas y resueltas las cuestiones a que se refieren los Artículos 262 y siguientes, se llama a autos y, consentida esta providencia, el expediente pasa al acuerdo sin más trámite. El orden para el estudio y votación de las causas es determinado por sorteo, el que se realiza al menos dos (2) veces en cada mes."],"t":"Llamamiento de autos. Sorteo de la causa","s":"Con la expresión de agravios y su contestación, o vencido el plazo para la presentación de ésta y, en su caso, sustanciadas y resueltas las cuestiones a que se refieren los Artículos 262 y siguientes, se llama a autos y, consentida esta providencia, el expedie"},{"n":271,"p":["La Secretaría debe llevar un libro que puede ser examinado por las partes, sus mandatarios o abogados, en el cual se hace constar la fecha del sorteo de las causas, la de remisión de los expedientes a los jueces y la de su devolución."],"t":"Libro de sorteos","s":"La Secretaría debe llevar un libro que puede ser examinado por las partes, sus mandatarios o abogados, en el cual se hace constar la fecha del sorteo de las causas, la de remisión de los expedientes a los jueces y la de su devolución."},{"n":272,"p":["Los miembros de la Cámara se deben instruir cada uno personalmente de los expedientes antes de celebrar los acuerdos para pronunciar sentencia."],"t":"Estudios del expediente","s":"Los miembros de la Cámara se deben instruir cada uno personalmente de los expedientes antes de celebrar los acuerdos para pronunciar sentencia."},{"n":273,"p":["El acuerdo se realiza con la presencia de todos los miembros del Tribunal y del Secretario. La votación se hace en el orden en que los jueces fueron sorteados. Cada miembro funda su voto o adhiere al de otro. La sentencia se dicta por mayoría, y en ella se examinan las cuestiones de hecho y de derecho sometidas a la decisión del Juez de primera instancia que fueron materia de agravios."],"t":"Acuerdo","s":"El acuerdo se realiza con la presencia de todos los miembros del Tribunal y del Secretario. La votación se hace en el orden en que los jueces fueron sorteados. Cada miembro funda su voto o adhiere al de otro."},{"n":274,"p":["Concluido el acuerdo, es redactado en el libro correspondiente suscripto por los jueces del Tribunal y autorizado por el Secretario.","Inmediatamente se pronuncia la sentencia en el expediente, precedida de copia íntegra del acuerdo, autorizada también por el Secretario.","Puede pedirse aclaratoria en el plazo de cinco (5) días."],"t":"Sentencia","s":"Concluido el acuerdo, es redactado en el libro correspondiente suscripto por los jueces del Tribunal y autorizado por el Secretario."},{"n":275,"p":["Las providencias simples son dictadas por el Presidente. Si se pide revocatoria, decide el Tribunal sin lugar a recurso alguno."],"t":"Providencias de trámite","s":"Las providencias simples son dictadas por el Presidente. Si se pide revocatoria, decide el Tribunal sin lugar a recurso alguno."},{"n":276,"p":["Cuando el recurso se haya interpuesto contra la sentencia definitiva de un juicio desarrollado bajo el anterior trámite sumario, se concederá libremente."],"t":"Recurso bajo trámite anterior. Concesión","s":"Cuando el recurso se haya interpuesto contra la sentencia definitiva de un juicio desarrollado bajo el anterior trámite sumario, se concederá libremente."},{"n":277,"p":["Si el recurso se concede en relación, recibido el expediente con sus memoriales, la Cámara, si el expediente tiene radicación de Sala, resuelve inmediatamente. En caso contrario dicta la providencia de autos.","No se admite la apertura a prueba ni la alegación de hechos nuevos.","Cuando la apelación se concede en efecto diferido, se procede en la forma establecida en el Artículo 262 inciso 1)."],"t":"Apelación en relación","s":"Si el recurso se concede en relación, recibido el expediente con sus memoriales, la Cámara, si el expediente tiene radicación de Sala, resuelve inmediatamente. En caso contrario dicta la providencia de autos."},{"n":278,"p":["Si la apelación se concede libremente, debiendo serlo en relación, el Tribunal de oficio o a petición de parte hecha dentro del tercer día, así lo debe declarar, mandando poner el expediente en Secretaría para la presentación de memoriales en los términos del Artículo 253.","Si el recurso se concede en relación, debiendo serlo libremente, la Cámara debe disponer el cumplimiento de lo dispuesto en el Artículo 262."],"t":"Examen de la forma de concesión del recurso","s":"Si la apelación se concede libremente, debiendo serlo en relación, el Tribunal de oficio o a petición de parte hecha dentro del tercer día, así lo debe declarar, mandando poner el expediente en Secretaría para la presentación de memoriales en los términos del "},{"n":279,"p":["El Tribunal no puede fallar sobre capítulos no propuestos a la decisión del Juez de primera instancia. No obstante, debe resolver sobre los intereses y daños y perjuicios, u otras cuestiones derivadas de hechos posteriores a la sentencia de primera instancia."],"t":"Poderes del tribunal","s":"El Tribunal no puede fallar sobre capítulos no propuestos a la decisión del Juez de primera instancia. No obstante, debe resolver sobre los intereses y daños y perjuicios, u otras cuestiones derivadas de hechos posteriores a la sentencia de primera instancia."},{"n":280,"p":["El Tribunal puede decidir sobre los puntos omitidos en la sentencia de primera instancia, aunque no se haya pedido aclaratoria, siempre que se solicite el respectivo pronunciamiento al expresar agravios."],"t":"Omisiones de la sentencia de primera instancia","s":"El Tribunal puede decidir sobre los puntos omitidos en la sentencia de primera instancia, aunque no se haya pedido aclaratoria, siempre que se solicite el respectivo pronunciamiento al expresar agravios."},{"n":281,"p":["Cuando la sentencia o resolución es revocatoria o modificatoria de la de primera instancia, el Tribunal debe adecuar las costas y el monto de los honorarios al contenido de su pronunciamiento, aunque no hayan sido materia de apelación."],"t":"Costas y honorarios","s":"Cuando la sentencia o resolución es revocatoria o modificatoria de la de primera instancia, el Tribunal debe adecuar las costas y el monto de los honorarios al contenido de su pronunciamiento, aunque no hayan sido materia de apelación."},{"n":282,"p":["Cuando una misma cuestión de derecho fue objeto de resoluciones divergentes por parte de distintas Salas de una Cámara de Apelaciones, al presentarse posteriormente un caso similar, debe ser resuelto por la Cámara en pleno, de acuerdo a las reglas previstas en el Artículo 53 de la Ley IV - Nº 15 (Antes Decreto-Ley 1550/82) y lo que por Acuerdo de Cámara se reglamenta. La convocatoria a plenario debe ser dispuesta de oficio y lo así resuelto es de aplicación obligatoria para todos los integrantes de la Cámara y para los jueces inferiores de la circunscripción a que aquella pertenezca.","Dictado un fallo plenario, por Presidencia de la Cámara, debe notificarse con remisión de copia a los jueces inferiores.","Los fallos plenarios únicamente pueden ser revocados por otro fallo plenario dictado con posterioridad o por doctrina legal sentada por el Superior Tribunal de Justicia en ocasión de resolver en el recurso de inaplicabilidad de ley.","Dado este último supuesto, el Superior Tribunal de Justicia, por Secretaría, debe notificar con remisión de copia a los jueces de ambas instancias inferiores. En caso de omisión, debe la Cámara de Apelaciones, en ocasión de tomar conocimiento de la revocación decretada por el Superior Tribunal de Justicia, comunicar del hecho a los jueces inferiores.","SECCIÓN 4.a QUEJA POR RECURSO DENEGADO"],"t":"Fallos plenarios","s":"Cuando una misma cuestión de derecho fue objeto de resoluciones divergentes por parte de distintas Salas de una Cámara de Apelaciones, al presentarse posteriormente un caso similar, debe ser resuelto por la Cámara en pleno, de acuerdo a las reglas previstas en"},{"n":283,"p":["Si el Juez deniega la apelación, la parte que se considera agraviada puede recurrir directamente en queja ante la Cámara, pidiendo que se le otorgue el recurso denegado y se ordene la remisión del expediente.","El plazo para interponer la queja es de cinco (5) días, con la ampliación que corresponde por razón de la distancia, de acuerdo con lo dispuesto en el Artículo 159."],"t":"Denegación de la apelación","s":"Si el Juez deniega la apelación, la parte que se considera agraviada puede recurrir directamente en queja ante la Cámara, pidiendo que se le otorgue el recurso denegado y se ordene la remisión del expediente."},{"n":284,"p":["Son requisitos de admisibilidad de la queja:","1) acompañar copia simple suscripta por el letrado del recurrente:","a) del escrito que dio lugar a la resolución recurrida y de los correspondientes a la sustanciación, si ésta tuvo lugar;","b) de la resolución recurrida;","c) del escrito de interposición del recurso y, en su caso, de la del recurso de revocatoria si la apelación fue interpuesta en forma subsidiaria;","d) de la providencia que denegó la apelación;","2) indicar la fecha en que:","a) quedó notificada la resolución recurrida;","b) se interpuso la apelación;","c) quedó notificada la denegatoria del recurso.","La Cámara puede requerir copia de otras piezas que considera necesarias y, si es indispensable, la remisión del expediente.","Presentada la queja en forma, la Cámara decide, sin sustanciación alguna, si el recurso fue bien o mal denegado; en este último caso, dispone que se tramite.","Mientras la Cámara no concede la apelación no se suspende el curso del proceso."],"t":"Admisibilidad. Trámite","s":"Son requisitos de admisibilidad de la queja:"},{"n":285,"p":["Las mismas reglas se observan cuando se cuestiona el efecto con que se concedió el recurso de apelación."],"t":"Objeción sobre el efecto del recurso","s":"Las mismas reglas se observan cuando se cuestiona el efecto con que se concedió el recurso de apelación."},{"n":286,"p":["Los recursos extraordinarios que este Código regla son los de inaplicabilidad de la ley o doctrina legal, de nulidad extraordinario y de inconstitucionalidad y proceden contra las sentencias definitivas de Cámaras de Apelación y/o Tribunales de instancia única. A estos efectos, se entiende por sentencia definitiva la que aunque recae sobre cuestión incidental, finiquita la litis o hace imposible su continuación.","El recurso de inaplicabilidad de ley, comprende el de nulidad extraordinaria."],"t":"Resoluciones susceptibles de recursos","s":"Los recursos extraordinarios que este Código regla son los de inaplicabilidad de la ley o doctrina legal, de nulidad extraordinario y de inconstitucionalidad y proceden contra las sentencias definitivas de Cámaras de Apelación y/o Tribunales de instancia única"},{"n":287,"p":["Deben proponerse por escrito con copias para traslado ante la Cámara o Tribunal Colegiado que dicta sentencia definitiva y dentro de los diez (10) días siguientes a la notificación.","La parte que no constituyó domicilio en la ciudad de Posadas, o no ratifica el que allí tiene constituido queda notificada de las providencias del Superior Tribunal por ministerio de la ley.","Con el mismo escrito se acompaña un recibo del Banco que actúa como Agente Financiero de la Provincia de Misiones, a la orden del Superior Tribunal de Justicia, del que resulta haberse depositado una cantidad equivalente a un (1) salario mínimo, vital y móvil. Para ser válido el depósito debe presentarse en el escrito de interposición del recurso, y antes del vencimiento del término para ese acto.","No tienen obligación de depositar, cuando recurren, quienes gocen del beneficio de litigar sin gastos, la Nación, provincias y municipios y los trabajadores que son parte de los juicios laborales."],"t":"Plazos y formalidades","s":"Deben proponerse por escrito con copias para traslado ante la Cámara o Tribunal Colegiado que dicta sentencia definitiva y dentro de los diez (10) días siguientes a la notificación."},{"n":288,"p":["De la presentación en que se deduce y fundamenta el recurso se da traslado por diez (10) días a las partes interesadas, notificándolas personalmente o por cédula.","Queda prohibido a las partes el ofrecimiento de prueba y la alegación de hechos nuevos."],"t":"Trámite","s":"De la presentación en que se deduce y fundamenta el recurso se da traslado por diez (10) días a las partes interesadas, notificándolas personalmente o por cédula. Queda prohibido a las partes el ofrecimiento de prueba y la alegación de hechos nuevos."},{"n":289,"p":["Contestado el traslado o vencido el plazo para hacerlo la Cámara o Tribunal, dentro de los cinco (5) días siguientes, eleva los autos al Superior Tribunal de Justicia de la Provincia de Misiones de oficio."],"t":"Remisión","s":"Contestado el traslado o vencido el plazo para hacerlo la Cámara o Tribunal, dentro de los cinco (5) días siguientes, eleva los autos al Superior Tribunal de Justicia de la Provincia de Misiones de oficio."},{"n":290,"p":["Llegado el expediente al Superior Tribunal éste dentro de los quince (15) días examina:","1) si el recurso fue interpuesto en término;","2) si la sentencia es definitiva;","3) si se observó con el depósito y las demás prescripciones legales.","A continuación declara mediante resolución fundada si el recurso es o no admisible.","En el primer caso, corre vista al Procurador General si corresponde; en el segundo se devuelve el expediente con mención de los recaudos incumplidos que dan motivo al rechazo.","Si el depósito a que se refiere el Artículo 287 es inferior a la mitad de un salario mínimo, se tiene por no presentado el recurso. En caso de que el depósito sea insuficiente pero superior a la mitad de un salario mínimo, se intima al recurrente a integrarlo en el término de cinco (5) días bajo apercibimiento de declarar inadmisible el recurso. El auto que así lo dispone se notifica por cédula o personalmente.","Las demás providencias quedan notificadas por ministerio de la ley.","El Tribunal no puede conocer nuevamente sobre las condiciones de admisibilidad."],"t":"Examen preliminar","s":"Llegado el expediente al Superior Tribunal éste dentro de los quince (15) días examina: 1) si el recurso fue interpuesto en término; 2) si la sentencia es definitiva; 3) si se observó con el depósito y las demás prescripciones legales."},{"n":291,"p":["En cualquier momento anterior a la sentencia el recurrente puede desistir del recurso, en cuyo caso se le imponen las costas con la pérdida de cincuenta por ciento (50%) del depósito reglado en el Artículo 287."],"t":"Desistimiento","s":"En cualquier momento anterior a la sentencia el recurrente puede desistir del recurso, en cuyo caso se le imponen las costas con la pérdida de cincuenta por ciento (50%) del depósito reglado en el Artículo 287."},{"n":292,"p":["Las providencias simples o interlocutorias dictadas durante la tramitación del recurso son susceptibles de reposición."],"t":"Reposición","s":"Las providencias simples o interlocutorias dictadas durante la tramitación del recurso son susceptibles de reposición."},{"n":293,"p":["Se debe dictar dentro de los ochenta (80) días desde que el proceso se encuentra en estado. El voto es fundado y se emite por separado sobre cada una de las cuestiones a decidir y en el orden en que fueron propuestas. La votación comienza con el Ministro del Superior Tribunal, que resulta de la desinsaculación que al efecto debe practicarse con arreglo a lo previsto por la Ley Orgánica del Poder Judicial.","La decisión que se acuerda debe reunir mayoría absoluta de votos. Se redacta en el libro de Acuerdos y Sentencias, precedida de la versión íntegra del acuerdo, que asimismo debe transcribirse y firmarse en los autos.","Notificada la sentencia, oportunamente se devuelve el expediente al tribunal de origen sin más trámites."],"t":"La sentencia","s":"Se debe dictar dentro de los ochenta (80) días desde que el proceso se encuentra en estado. El voto es fundado y se emite por separado sobre cada una de las cuestiones a decidir y en el orden en que fueron propuestas."},{"n":294,"p":["Si la sentencia de la Cámara es confirmatoria de la dictada en primera instancia, concedido el recurso el apelado puede solicitar la ejecución de aquélla, dando fianza de responder de lo que perciba si el fallo es revocado por el Superior Tribunal.","El Fisco de la Provincia y las municipalidades están exentos de la fianza a que se refiere esta disposición, la que asimismo queda cancelada en todos los supuestos si el Superior Tribunal de Justicia de la Provincia desestima el recurso.","Sin embargo, teniendo en cuenta la naturaleza de la condena y las consecuencias eventualmente irreparables que pueden originarse en los derechos controvertidos, la","Cámara, fundadamente, puede negar la procedencia de la ejecución. Su decisión es irrecurrible."],"t":"Efecto suspensivo","s":"Si la sentencia de la Cámara es confirmatoria de la dictada en primera instancia, concedido el recurso el apelado puede solicitar la ejecución de aquélla, dando fianza de responder de lo que perciba si el fallo es revocado por el Superior Tribunal."},{"n":295,"p":["Cuando el recurso es declarado inadmisible o es desestimado por improcedente, el depósito a que se refiere el Artículo 287 se pierde y sus importes se aplican al destino que le fija el Alto Tribunal.","Si en cambio, se hace lugar al recurso, se ordena la devolución del referido depósito al recurrente.","SECCIÓN 2.a DISPOSICIONES ESPECÍFICAS AL RECURSO DE INAPLICABILIDAD DE LEY"],"t":"Pérdida del depósito","s":"Cuando el recurso es declarado inadmisible o es desestimado por improcedente, el depósito a que se refiere el Artículo 287 se pierde y sus importes se aplican al destino que le fija el Alto Tribunal."},{"n":296,"p":["El recurso de inaplicabilidad de la ley o doctrina legal procede siempre que el valor del litigio exceda de diez (10) salarios mínimos, vitales y móviles y sin limitación si es indeterminado o no susceptible de apreciación pecuniaria."],"t":"Monto del litigio habilitante del recurso","s":"El recurso de inaplicabilidad de la ley o doctrina legal procede siempre que el valor del litigio exceda de diez (10) salarios mínimos, vitales y móviles y sin limitación si es indeterminado o no susceptible de apreciación pecuniaria."},{"n":297,"p":["El recurso de inaplicabilidad de ley tiene que fundarse en alguna de las siguientes causales:","1) que la sentencia viole la ley o la doctrina legal;","2) que la sentencia aplique erróneamente la ley o la doctrina legal;","3) que la sentencia recurrida conculque derechos esenciales consagrados en la Constitución de la Provincia de Misiones, en la Constitución Nacional y Leyes Nacionales;","4) que la sentencia sea arbitraria por no reunir las condiciones mínimas necesarias para satisfacer adecuadamente el derecho a la jurisdicción."],"t":"Causales","s":"El recurso de inaplicabilidad de ley tiene que fundarse en alguna de las siguientes causales: 1) que la sentencia viole la ley o la doctrina legal; 2) que la sentencia aplique erróneamente la ley o la doctrina legal;"},{"n":298,"p":["El escrito por el que se lo deduce debe ser fundado y autosuficiente e indicar con precisión y claridad la ley o la doctrina legal que se reputa aplicada o interpretada erróneamente o, en su caso de qué forma se configura arbitraria o la gravedad o interés institucional que se denuncia.","Si hay duda razonable acerca del carácter de hecho o derecho de las cuestiones propuestas, el Tribunal debe abrir la instancia extraordinaria y conocer los motivos de la impugnación."],"t":"Requisitos","s":"El escrito por el que se lo deduce debe ser fundado y autosuficiente e indicar con precisión y claridad la ley o la doctrina legal que se reputa aplicada o interpretada erróneamente o, en su caso de qué forma se configura arbitraria o la gravedad o interés ins"},{"n":299,"p":["El Superior Tribunal de Justicia de la Provincia, dicta sentencia que debe contener:","1) declaración que señala la errónea aplicación o interpretación de la ley o de la doctrina legal que sirvió de fundamento al fallo;","2) declaración que señala fundadamente los derechos constitucionales conculcados o la arbitrariedad denunciada, dejando sin efecto el fallo recurrido;","3) a continuación debe dictar la sentencia que corresponde sobre el fondo y respecto a las cuestiones sometidas al decisorio, con arreglo a la ley o doctrina legal declarada aplicable.","Cuando entiende que no han existido motivos, así lo debe declarar, desechando la impugnación y condenando al recurrente al pago de las costas.","SECCIÓN 3.a DISPOSICIONES ESPECÍFICAS DEL RECURSO DE NULIDAD EXTRAORDINARIO"],"t":"Contenido de la sentencia","s":"El Superior Tribunal de Justicia de la Provincia, dicta sentencia que debe contener: 1) declaración que señala la errónea aplicación o interpretación de la ley o de la doctrina legal que sirvió de fundamento al fallo;"},{"n":300,"p":["El recurso de nulidad extraordinario, procede, cuando las sentencias definitivas son dictadas con violación de las exigencias previstas en este Código o en leyes especiales."],"t":"Causales","s":"El recurso de nulidad extraordinario, procede, cuando las sentencias definitivas son dictadas con violación de las exigencias previstas en este Código o en leyes especiales."},{"n":301,"p":["No procede contra vicios de actividad anteriores a la sentencia; ni contra errores subsanables por vía aclaratoria; ni por causa de acción u omisión del recurrente; ni contra errores reparables por el recurso de inaplicabilidad.","Rigen en lo pertinente las normas de los artículos contenidos en las secciones precedentes de este Capítulo."],"t":"Improcedencia. Remisión","s":"No procede contra vicios de actividad anteriores a la sentencia; ni contra errores subsanables por vía aclaratoria; ni por causa de acción u omisión del recurrente; ni contra errores reparables por el recurso de inaplicabilidad."},{"n":302,"p":["Cuando el Superior Tribunal de Justicia de la Provincia lo acoge debe dictar la sentencia dejándola sin efecto y remitir el expediente a la Sala de Cámara o al Tribunal Colegiado que sigue en orden de turno a fin de que lo decida nuevamente, salvo que el propio Superior Tribunal esté en condiciones de dictar fallo sobre el fondo de la cuestión.","Si el Tribunal entiende que no hubo infracción a las precitadas disposiciones de este Código o leyes especiales, así lo debe decidir desestimando la impugnación y condenando al recurrente al pago de las costas.","SECCIÓN 4.a RECURSO DE INCONSTITUCIONALIDAD"],"t":"Contenido de la sentencia","s":"Cuando el Superior Tribunal de Justicia de la Provincia lo acoge debe dictar la sentencia dejándola sin efecto y remitir el expediente a la Sala de Cámara o al Tribunal Colegiado que sigue en orden de turno a fin de que lo decida nuevamente, salvo que el propi"},{"n":303,"p":["Trámites. Remisión. El recurso de inconstitucionalidad procede contra la sentencia definitiva de los jueces o tribunales de última instancia, cuando en el proceso se controvirtió la validez de una ley, decreto, ordenanza, resolución o reglamento, bajo la pretensión de ser contrarios a la Constitución de la Provincia y siempre que la decisión recaiga sobre este tema.","Es aplicable al presente recurso lo dispuesto en las Secciones anteriores de este Capítulo en lo que corresponda. Debe oírse al Procurador General."],"t":"Resoluciones recurribles. Causales","s":"Trámites. Remisión."},{"n":304,"p":["El recurso se interpone en el tiempo y la forma establecidos en el Artículo 287 y debe fundarse en la causal prevista por el Artículo 303."],"t":"Condiciones de admisibilidad","s":"El recurso se interpone en el tiempo y la forma establecidos en el Artículo 287 y debe fundarse en la causal prevista por el Artículo 303."},{"n":305,"p":["En su resolución, el Superior Tribunal de Justicia de la Provincia debe declarar si la disposición impugnada es o no contraria a la Constitución de la Provincia. En el segundo caso debe desestimar el recurso y condenar al recurrente al pago de las costas."],"t":"Contenido de la sentencia","s":"En su resolución, el Superior Tribunal de Justicia de la Provincia debe declarar si la disposición impugnada es o no contraria a la Constitución de la Provincia. En el segundo caso debe desestimar el recurso y condenar al recurrente al pago de las costas."},{"n":306,"p":["En cualquier estado de la causa anterior a la sentencia, las partes, de común acuerdo, pueden desistir del proceso manifestándolo por escrito al Juez, quien, sin más trámite, lo declara extinguido y ordena el archivo de las actuaciones.","Cuando el actor desiste del proceso después de notificada la demanda, se debe requerir la conformidad del demandado, a quien se corre traslado notificándosele personalmente o por cédula, bajo apercibimiento de tenerlo por conforme en caso de silencio. Si media oposición, el desistimiento carece de eficacia y prosigue el trámite de la causa."],"t":"Desistimiento del proceso","s":"En cualquier estado de la causa anterior a la sentencia, las partes, de común acuerdo, pueden desistir del proceso manifestándolo por escrito al Juez, quien, sin más trámite, lo declara extinguido y ordena el archivo de las actuaciones."},{"n":307,"p":["En la misma oportunidad y forma a que se refiere el Artículo 306, el actor puede desistir del derecho en que fundó la acción. No se requiere la conformidad del demandado, debiendo el Juez limitarse a examinar si el acto procede por la naturaleza del derecho en litigio, y a dar por terminado el juicio en caso afirmativo. En lo sucesivo no puede promoverse otro proceso por el mismo objeto y causa."],"t":"Desistimiento del derecho","s":"En la misma oportunidad y forma a que se refiere el Artículo 306, el actor puede desistir del derecho en que fundó la acción."},{"n":308,"p":["El desistimiento no se presume y puede revocarse hasta tanto el Juez se pronuncie, o surja del expediente la conformidad de la contraria."],"t":"Revocación","s":"El desistimiento no se presume y puede revocarse hasta tanto el Juez se pronuncie, o surja del expediente la conformidad de la contraria."},{"n":309,"p":["El demandado puede allanarse a la demanda en cualquier estado de la causa anterior a la sentencia.","El Juez debe dictar sentencia conforme a derecho, pero si está comprometido el orden público, el allanamiento carece de efectos y continúa el proceso según su estado.","Cuando el allanamiento es simultáneo con el cumplimiento de la prestación reclamada, la resolución que lo admite debe ser dictada en la forma prescripta en el Artículo 162."],"t":"Oportunidad y efectos","s":"El demandado puede allanarse a la demanda en cualquier estado de la causa anterior a la sentencia."},{"n":310,"p":["Las partes pueden hacer valer la transacción del derecho en litigio, con la presentación del convenio o suscripción de acta ante el Juez. Este se debe limitar a examinar la concurrencia de los requisitos exigidos por la ley para la validez de la transacción, y la homologa o no. En este último caso, continúan los procedimientos del juicio."],"t":"Forma y trámite","s":"Las partes pueden hacer valer la transacción del derecho en litigio, con la presentación del convenio o suscripción de acta ante el Juez."},{"n":311,"p":["Los acuerdos conciliatorios celebrados por las partes ante el Juez y homologados por éste, tienen autoridad de cosa juzgada."],"t":"Efectos","s":"Los acuerdos conciliatorios celebrados por las partes ante el Juez y homologados por éste, tienen autoridad de cosa juzgada."},{"n":312,"p":["Se produce la caducidad de la instancia cuando no se insta su curso dentro de los siguientes plazos:","1) de seis (6) meses, en primera o única instancia;","2) de tres (3) meses, en segunda o tercera instancia;","3) en el que se opere la prescripción de la acción si es menor a los indicados precedentemente;","4) de un (1) mes, en el incidente de caducidad de instancia y procesos urgentes.","La instancia se abre con la promoción de la demanda siempre que se ordene el traslado de la misma y termina con el dictado de la sentencia."],"t":"Plazos","s":"Se produce la caducidad de la instancia cuando no se insta su curso dentro de los siguientes plazos: 1) de seis (6) meses, en primera o única instancia; 2) de tres (3) meses, en segunda o tercera instancia;"},{"n":313,"p":["Los plazos señalados en el Artículo 312 se computan desde la fecha de la última petición de las partes, o resolución o actuación del Juez, Secretario u Oficial Primero, que tiene por efecto impulsar el procedimiento; corren durante los días inhábiles salvo los que corresponden a las ferias judiciales.","Para el cómputo de los plazos se debe descontar el tiempo en que el proceso estuvo paralizado o suspendido por acuerdo de las partes o por disposición del Juez, siempre que la reanudación del trámite no quede supeditada a actos procesales que deba cumplir la parte a quien incumbe impulsar el proceso."],"t":"Cómputo","s":"Los plazos señalados en el Artículo 312 se computan desde la fecha de la última petición de las partes, o resolución o actuación del Juez, Secretario u Oficial Primero, que tiene por efecto impulsar el procedimiento; corren durante los días inhábiles salvo los"},{"n":314,"p":["El impulso del procedimiento por uno de los litisconsortes beneficia a los restantes."],"t":"Litisconsorcio","s":"El impulso del procedimiento por uno de los litisconsortes beneficia a los restantes."},{"n":315,"p":["No se produce la caducidad:","1) en los procedimientos de ejecución de sentencia, salvo si se trata de incidentes que no guardan relación estricta con la ejecución procesal forzada propiamente dicha;","2) en los procesos sucesorios y, en general, en los voluntarios, salvo en los incidentes y juicios incidentales que en ellos se suscitan;","3) cuando los procesos están pendientes de alguna resolución y la demora en dictarla es imputable al Tribunal, o la prosecución del trámite depende de una actividad que este Código o las reglamentaciones de superintendencia imponen al Secretario o al Oficial Primero;","4) si se llama autos para sentencia, salvo si se dispone prueba de oficio; cuando su producción depende de la actividad de las partes, la carga de impulsar el procedimiento existe desde el momento en que éstas toman conocimiento de las medidas ordenadas."],"t":"Improcedencia","s":"No se produce la caducidad: 1) en los procedimientos de ejecución de sentencia, salvo si se trata de incidentes que no guardan relación estricta con la ejecución procesal forzada propiamente dicha;"},{"n":316,"p":["La caducidad opera también contra el Estado, los establecimientos públicos, los menores y cualquier otra persona que no tiene la libre administración de sus bienes, sin perjuicio de la responsabilidad de sus administradores y representantes. Esta disposición no se aplica a los incapaces o ausentes que carecen de representación legal en el juicio."],"t":"Contra quienes se opera","s":"La caducidad opera también contra el Estado, los establecimientos públicos, los menores y cualquier otra persona que no tiene la libre administración de sus bienes, sin perjuicio de la responsabilidad de sus administradores y representantes."},{"n":317,"p":["Sin perjuicio de lo dispuesto en el artículo siguiente, la declaración de caducidad puede ser pedida en primera instancia, por el demandado; en el incidente, por el contrario de quien lo promueve; en el recurso, por la parte recurrida. La petición debe formularse antes de consentir el solicitante cualquier actuación del Tribunal o de la parte, posterior al vencimiento del plazo legal, y se sustancia, previa intimación por única vez en el curso del proceso a quien incumbe el impulso procesal, para que dentro del término de cinco (5) días produzca actividad procesal útil al avance del trámite, bajo apercibimiento de tenerse por operada la caducidad de instancia.","Dicha intimación no procede en el incidente de caducidad de instancia.","El pedido de caducidad de la segunda instancia importa el desistimiento del recurso interpuesto por el peticionario, en el caso de que aquél prospere."],"t":"Quienes pueden pedir la declaración. Oportunidad","s":"Sin perjuicio de lo dispuesto en el artículo siguiente, la declaración de caducidad puede ser pedida en primera instancia, por el demandado; en el incidente, por el contrario de quien lo promueve; en el recurso, por la parte recurrida."},{"n":318,"p":["La caducidad debe ser declarada de oficio o a pedido de parte, previa intimación a la que se refiere el Artículo 317 o con posterioridad a la misma, sin otro trámite que la comprobación del vencimiento de los plazos señalados en el Artículo
