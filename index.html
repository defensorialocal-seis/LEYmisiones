 relativas a la atribución de la vivienda familiar y derivadas de uniones de hecho, los interesados deben acreditar que se promovió y agotó la etapa prejudicial de avenimiento establecida por la Ley II – N.º 16 (Antes Ley 3820).","Se tiene por cumplimentada la etapa de avenimiento que se refiere en el párrafo anterior con la comparecencia al Centro Judicial de Mediación."],"t":"Comparecencia","s":"En forma previa a la interposición de las acciones previstas en el Artículo 641 incisos 1), 9), 10) y 12) y cuestiones relativas a la atribución de la vivienda familiar y derivadas de uniones de hecho, los interesados deben acreditar que se promovió y agotó la"},{"n":654,"p":["Los procesos con fines de adopción son procesos especiales que se rigen por las disposiciones establecidas en la Ley XII – N.º 20 (Antes Ley 4523) y Ley II - N.º 13 (Antes Ley 3495)."],"t":"Procesos de adopción","s":"Los procesos con fines de adopción son procesos especiales que se rigen por las disposiciones establecidas en la Ley XII – N.º 20 (Antes Ley 4523) y Ley II - N.º 13 (Antes Ley 3495)."},{"n":655,"p":["El Juez con competencia exclusiva en violencia familiar, entiende en los procesos tramitados por las causas establecidas en la Ley XIV – N.º 6 (Antes Ley 3325), sus complementarias o modificatorias, en los que pueden disponer o requerir la aplicación de programas o la intervención de las instituciones y centros destinados a la asistencia y atención de las víctimas de violencia familiar, a los fines de su contención, resguardo y recuperación, como así en las cuestiones relativas a alimentos provisorios, cuidado personal, régimen de comunicación u otra cuestión vinculada a menores víctima de una situación de violencia familiar, tengan o no relación directa con la misma.","En las causas de violencia familiar, durante su tramitación, son hábiles todos los días y horas del año, sin necesidad de habilitación especial. El Superior Tribunal de Justicia debe dictar la norma necesaria a los fines de garantizar la inmediata intervención del Juez de Violencia Familiar en las denuncias que se practican por ante la autoridad competente a los fines del dictado de las medidas pertinentes."],"t":"Violencia familiar","s":"El Juez con competencia exclusiva en violencia familiar, entiende en los procesos tramitados por las causas establecidas en la Ley XIV – N.º 6 (Antes Ley 3325), sus complementarias o modificatorias, en los que pueden disponer o requerir la aplicación de progra"},{"n":656,"p":["Los procedimientos reglados en la Ley XIV – N.º 6 (Antes Ley 3325) son procesos especiales y deben aplicarse con preeminencia a las demás disposiciones del presente Código."],"t":"Procesos especiales","s":"Los procedimientos reglados en la Ley XIV – N.º 6 (Antes Ley 3325) son procesos especiales y deben aplicarse con preeminencia a las demás disposiciones del presente Código."},{"n":657,"p":["En los casos que la denuncia de violencia familiar requiera de medidas cautelares de extrema urgencia para la protección de las personas y siempre que el hecho se produzca fuera del radio del Juzgado de Familia o con competencia en materia de Familia, el Juez de Paz local debe tomar las medidas que dispone la Ley XIV - N.˚6 (Antes Ley 3325), y debe remitir dentro de los dos (2) días las actuaciones al Juez competente."],"t":"Medidas urgentes","s":"En los casos que la denuncia de violencia familiar requiera de medidas cautelares de extrema urgencia para la protección de las personas y siempre que el hecho se produzca fuera del radio del Juzgado de Familia o con competencia en materia de Familia, el Juez "},{"n":658,"p":["En los casos en que prima facie se encuentre acreditado el incumplimiento de las medidas dispuestas en los incisos a), b), c) y h) del Artículo 4 de la Ley XIV - N.˚6 (Antes Ley 3325), el Juez que las haya ordenado puede decretar el arresto del denunciado, poniéndolo a disposición conjuntamente con las actuaciones al Juez Penal en turno, en un plazo no mayor de veinticuatro (24) horas, a sus efectos."],"t":"Medidas excepcionales","s":"En los casos en que prima facie se encuentre acreditado el incumplimiento de las medidas dispuestas en los incisos a), b), c) y h) del Artículo 4 de la Ley XIV - N.˚6 (Antes Ley 3325), el Juez que las haya ordenado puede decretar el arresto del denunciado, pon"},{"n":659,"p":["Las personas que pueden pedir la declaración de incapacidad se deben presentar ante el Juez competente, exponer los hechos y acompañar un (1) certificado médico o historia clínica si la hubiere, relativo al estado de salud mental del presunto incapaz y la existencia de riesgo para sí o para terceros."],"t":"Requisitos","s":"Las personas que pueden pedir la declaración de incapacidad se deben presentar ante el Juez competente, exponer los hechos y acompañar un (1) certificado médico o historia clínica si la hubiere, relativo al estado de salud mental del presunto incapaz y la exis"},{"n":660,"p":["Cuando no es posible acompañar dichos exámenes, el Juez debe requerir la opinión de un (1) facultativo especialista en la materia, dependiente de instituciones de salud pública, quien debe expedirse dentro de cuarenta y ocho (48) horas. A ese solo efecto y de acuerdo con las circunstancias del caso, el Juez puede ordenar la internación del presunto incapaz por igual plazo, si es indispensable para su examen."],"t":"Médicos especialistas","s":"Cuando no es posible acompañar dichos exámenes, el Juez debe requerir la opinión de un (1) facultativo especialista en la materia, dependiente de instituciones de salud pública, quien debe expedirse dentro de cuarenta y ocho (48) horas."},{"n":661,"p":["Presentada la demanda y en su caso luego del procedimiento preliminar señalado en el Artículo 660 el Juez ordena:","1) el traslado de la demanda al presunto incapaz por el término de cinco (5) días, en el que además se le hace saber del profesional que es designado en el carácter de curador provisional;","2) el nombramiento de un curador provisional, que debe recaer en un abogado de la matrícula. Sus funciones subsisten hasta que se discierna la curatela definitiva o se desestime la demanda;","3) la remisión de las actuaciones a un equipo interdisciplinario conformado por los siguientes profesionales: un (1) Médico Psiquiatra, un (1) Médico Legista, un (1) Licenciado en Psicología y un (1) Licenciado en Trabajo Social. Estos deben informar dentro del término fijado para la producción de las pruebas sobre el estado de las facultades mentales del presunto incapaz, como así también sobre su situación socio ambiental y psicológica en cuanto al gobierno de su persona y administración de sus bienes;","4) la intervención de un Asesor de Incapaces y de un representante del Ministerio Público Fiscal."],"t":"Trámite o sustanciación","s":"Presentada la demanda y en su caso luego del procedimiento preliminar señalado en el Artículo 660 el Juez ordena:"},{"n":662,"p":["Una vez notificada la demanda y vencido el plazo para su contestación, se fija el tiempo en el que se producen las pruebas ofrecidas el que no puede exceder de treinta (30) días. El equipo interdisciplinario debe informar al Juzgado la fecha en la que se debe realizar la revisión médica y psicológica.","Dentro del período de pruebas, el Juez señala una audiencia para tomar conocimiento personal y directo de la situación del presunto incapaz, citándolo y notificándolo personalmente o por cédula y en su caso, a través de radiograma u oficio policial. En el caso que el presunto incapaz se encuentre internado o no sea posible su comparecencia al Juzgado, el Juez se debe trasladar a su domicilio o lugar de internación.","El denunciante únicamente puede aportar pruebas que acreditan los hechos que invocó; y el presunto incapaz las que hacen a la defensa de su capacidad."],"t":"Prueba","s":"Una vez notificada la demanda y vencido el plazo para su contestación, se fija el tiempo en el que se producen las pruebas ofrecidas el que no puede exceder de treinta (30) días."},{"n":663,"p":["Cuando de la prueba presentada o de la preliminar que se realiza surge con notoriedad que el presunto incapaz no tiene habilidad para administrar sus bienes, se deben adoptar las medidas precautorias pertinentes a los fines de la conservación de los mismos, y deben además preverse los medios económicos necesarios para el tratamiento médico o psiquiátrico que sea menester."],"t":"Medidas precautorias","s":"Cuando de la prueba presentada o de la preliminar que se realiza surge con notoriedad que el presunto incapaz no tiene habilidad para administrar sus bienes, se deben adoptar las medidas precautorias pertinentes a los fines de la conservación de los mismos, y "},{"n":664,"p":["Cuando al tiempo de formularse la denuncia el presunto incapaz esté internado, el Juez debe tomar conocimiento directo de aquél y adoptar todas las medidas que considere necesarias para resolver si debe o no mantenerse la internación, y requerir para ello el informe del equipo interdisciplinario del nosocomio."],"t":"Internación","s":"Cuando al tiempo de formularse la denuncia el presunto incapaz esté internado, el Juez debe tomar conocimiento directo de aquél y adoptar todas las medidas que considere necesarias para resolver si debe o no mantenerse la internación, y requerir para ello el i"},{"n":665,"p":["El equipo interdisciplinario, dentro del plazo de producción de las pruebas y sin perjuicio de lo que el Juez considere necesario, debe informar sobre la situación del incapaz y expedirse sobre los siguientes puntos:","1) diagnóstico;","2) fecha aproximada en que la enfermedad se manifestó;","3) pronóstico;","4) régimen aconsejable para la protección y asistencia del presunto incapaz;","5) necesidad de su internación;","6) actos que se encuentra en condiciones de ejercer por sí mismo;","7) ambiente social y familiar en el que se desenvuelve, y la posibilidad de contención del presunto incapaz;","8) posibilidad o imposibilidad de administrar sus bienes."],"t":"Equipo interdisciplinario","s":"El equipo interdisciplinario, dentro del plazo de producción de las pruebas y sin perjuicio de lo que el Juez considere necesario, debe informar sobre la situación del incapaz y expedirse sobre los siguientes puntos: 1) diagnóstico;"},{"n":666,"p":["Producido el informe del equipo interdisciplinario y las demás pruebas, se debe dar traslado por cinco (5) días al denunciante, al presunto incapaz y al curador provisional y, con su resultado, se da vista al Asesor de Incapaces y al representante del Ministerio Público Fiscal."],"t":"Traslado","s":"Producido el informe del equipo interdisciplinario y las demás pruebas, se debe dar traslado por cinco (5) días al denunciante, al presunto incapaz y al curador provisional y, con su resultado, se da vista al Asesor de Incapaces y al representante del Minister"},{"n":667,"p":["La sentencia se debe dictar en el plazo de quince (15) días a partir de las vistas conferidas al Ministerio Público. Si no verifica una incapacidad total, pero de la prueba resulta inequívocamente que del ejercicio de la plena capacidad puede resultar riesgo para la persona o al patrimonio de quien presenta una disminución de sus facultades, el Juez puede resolver la restricción de la capacidad del mismo respecto de los actos que pueden afectar a su persona o a sus bienes.","En la sentencia se deben especificar las funciones y actos que se limitan, procurando que la afectación de la personalidad sea la mínima, cuando se trata de una restricción de la capacidad, designándose en el mismo acto al curador definitivo del incapaz.","Al momento de dictarse la sentencia o posteriormente, si los informes técnicos así lo sugieren, el Juez puede decretar la internación del incapaz, teniendo en cuenta las previsiones y recaudos establecidos en las leyes especiales sobre salud mental. Además dispone que el curador y el Asesor de Incapaces realicen una visita periódica del internado, presentando los informes pertinentes cada treinta (30) días."],"t":"Sentencia","s":"La sentencia se debe dictar en el plazo de quince (15) días a partir de las vistas conferidas al Ministerio Público."},{"n":668,"p":["El Juez debe determinar si corresponde extender, ampliar, disminuir, o cesar la incapacidad o restricción de la capacidad. Si se comprueba el restablecimiento total de la persona acompañado que sea el informe del equipo interdisciplinario, el Juez fija una audiencia con la persona declarada incapaz o restringida en su capacidad, con la presencia obligatoria del Asesor de Incapaces, luego de lo cual se da traslado al curador por el término de cinco (5) días. Cumplido el trámite determinado, previa vista a los representantes del Ministerio Público, se dicta sentencia dentro de los quince (15) días, decretando el cese de la incapacidad o restricción de la capacidad."],"t":"Verificación","s":"El Juez debe determinar si corresponde extender, ampliar, disminuir, o cesar la incapacidad o restricción de la capacidad."},{"n":669,"p":["La sentencia que declara la incapacidad o restricción de la capacidad, como así también la resolución que amplía o disminuye las funciones y facultades de la persona declarada incapaz o con restricción de la capacidad y la que decreta el cese de la incapacidad en su caso, son comunicadas al Registro del Estado Civil y Capacidad de las Personas, a los fines de su respectiva toma de razón."],"t":"Comunicación","s":"La sentencia que declara la incapacidad o restricción de la capacidad, como así también la resolución que amplía o disminuye las funciones y facultades de la persona declarada incapaz o con restricción de la capacidad y la que decreta el cese de la incapacidad"},{"n":670,"p":["La sentencia debe notificarse al incapaz o al restringido en su capacidad, mediante acta labrada por ante el actuario, a cuyo fin debe ser debidamente citado por el medio más idóneo, al denunciante y al curador provisional personalmente o por cédula y a los representantes del Ministerio Público en sus respectivos despachos."],"t":"Notificación","s":"La sentencia debe notificarse al incapaz o al restringido en su capacidad, mediante acta labrada por ante el actuario, a cuyo fin debe ser debidamente citado por el medio más idóneo, al denunciante y al curador provisional personalmente o por cédula y a los re"},{"n":671,"p":["Se puede apelar la sentencia dentro del quinto día de su notificación y el recurso se concede libremente y con efecto devolutivo; en función al carácter cautelar de las medidas dispuestas en la sentencia en salvaguarda de la persona y de los bienes del declarado incapaz o con restricción de la capacidad.","En los procesos en que se declara la incapacidad del sujeto, si la sentencia que la decreta no es apelada se debe elevar en consulta. La Cámara resuelve en el plazo de diez (10) días previa vista al Asesor de Menores e Incapaces, sin otra sustanciación."],"t":"Apelación","s":"Se puede apelar la sentencia dentro del quinto día de su notificación y el recurso se concede libremente y con efecto devolutivo; en función al carácter cautelar de las medidas dispuestas en la sentencia en salvaguarda de la persona y de los bienes del declara"},{"n":672,"p":["Los gastos causídicos se imponen a la persona declarada incapaz o con restricción de la capacidad. Sin perjuicio de ello, si el Juez considera inexcusable el error en que incurrió el denunciante o decreta la malicia del mismo al formular la denuncia, se le imponen a éste las costas y gastos del juicio."],"t":"Costas","s":"Los gastos causídicos se imponen a la persona declarada incapaz o con restricción de la capacidad."},{"n":673,"p":["Las disposiciones de la presente sección rigen, en lo pertinente, para la declaración de incapacidad del sordomudo que no sabe darse a entender por escrito ni por otro medio y en su caso, para la cesación de esta incapacidad.","SECCIÓN 2.a DECLARACIÓN DE INHABILITACIÓN"],"t":"Declaración de sordomudez","s":"Las disposiciones de la presente sección rigen, en lo pertinente, para la declaración de incapacidad del sordomudo que no sabe darse a entender por escrito ni por otro medio y en su caso, para la cesación de esta incapacidad."},{"n":674,"p":["Disminuidos. Las disposiciones del Título II, Capítulo III rigen en lo pertinente a la declaración de inhabilitación de las personas que poseen disminución de sus facultades mentales por enfermedad o por el consumo habitual de estupefacientes o alcohol, como así también, respecto de quienes por la prodigalidad en la gestión de sus bienes exponen a su cónyuge, conviviente o a sus hijos menores de edad o con discapacidad a la pérdida del patrimonio. Se encuentran legitimados para promover la acción únicamente el o la cónyuge o conviviente, los ascendientes y descendientes.","A los fines de la declaración de la inhabilitación se sigue el mismo trámite especial establecido para la declaración de incapacidad o de restricción de la capacidad, con el nombramiento del curador respectivo, así como en su caso para el decreto de cesación de dicha inhabilitación."],"t":"Alcohólicos habituales. Toxicómanos","s":"Disminuidos."},{"n":675,"p":["En el caso del Artículo 48 del Código Civil y Comercial de la Nación, la causa tramita por proceso sumarísimo."],"t":"Pródigos","s":"En el caso del Artículo 48 del Código Civil y Comercial de la Nación, la causa tramita por proceso sumarísimo."},{"n":676,"p":["La sentencia de inhabilitación, además de los requisitos generales, debe determinar, cuando las circunstancias del caso lo exigen, los actos de administración cuyo otorgamiento le es limitado a quien se inhabilita.","La sentencia se inscribe en el Registro del Estado Civil y Capacidad de las Personas."],"t":"Sentencia. Limitación de actos","s":"La sentencia de inhabilitación, además de los requisitos generales, debe determinar, cuando las circunstancias del caso lo exigen, los actos de administración cuyo otorgamiento le es limitado a quien se inhabilita."},{"n":677,"p":["Todas las cuestiones que se suscitan entre el inhabilitado y el curador se sustancian por el trámite de los incidentes, con intervención del Asesor de Menores e Incapaces."],"t":"Divergencias entre el inhabilitado y el curador","s":"Todas las cuestiones que se suscitan entre el inhabilitado y el curador se sustancian por el trámite de los incidentes, con intervención del Asesor de Menores e Incapaces."},{"n":678,"p":["Para las situaciones previstas en el presente Capítulo, se aplica lo dispuesto en el Artículo 237 y siguientes si así correspondiera."],"t":"Protección de personas","s":"Para las situaciones previstas en el presente Capítulo, se aplica lo dispuesto en el Artículo 237 y siguientes si así correspondiera."},{"n":679,"p":["Son aplicables supletoriamente al presente Capítulo las reglas generales de procedimiento establecidas en el presente Código y aquellas provenientes de Convenios Internacionales ratificados por el Estado Nacional, pudiendo el Juez de acuerdo a las circunstancias del caso disponer el procedimiento más ágil que garantice el interés del menor."],"t":"Reglas aplicables","s":"Son aplicables supletoriamente al presente Capítulo las reglas generales de procedimiento establecidas en el presente Código y aquellas provenientes de Convenios Internacionales ratificados por el Estado Nacional, pudiendo el Juez de acuerdo a las circunstanci"},{"n":680,"p":["Es competente para entender en las causas sobre restitución de menores o restauración del régimen de comunicación el Juez de Familia y Violencia Familiar del lugar de residencia habitual del menor. La competencia del Juez del lugar de residencia habitual del menor es improrrogable, sin perjuicio de la competencia fijada a través de los Convenios Internacionales ratificados por el Estado Nacional."],"t":"Competencia","s":"Es competente para entender en las causas sobre restitución de menores o restauración del régimen de comunicación el Juez de Familia y Violencia Familiar del lugar de residencia habitual del menor."},{"n":681,"p":["Se encuentran legitimados para iniciar las acciones judiciales de restitución de menores o restauración del régimen de comunicación afectado, los padres, tutores, guardadores y las instituciones a quienes se atribuyó la custodia del menor, conforme la legislación vigente del lugar de residencia habitual del menor.","Es parte en el proceso de restitución de menores o restauración del régimen de comunicación afectado el Ministerio Público."],"t":"Legitimación","s":"Se encuentran legitimados para iniciar las acciones judiciales de restitución de menores o restauración del régimen de comunicación afectado, los padres, tutores, guardadores y las instituciones a quienes se atribuyó la custodia del menor, conforme la legislac"},{"n":682,"p":["Producida la retención o traslado ilícito de un menor en violación al derecho de guarda, de custodia o régimen de comunicación que ejerció una persona, institución u organismo, de manera separada o conjunta, con arreglo al derecho vigente en un Estado en el que el menor de edad tuvo su residencia habitual es procedente la demanda de restitución del mismo."],"t":"Procedencia","s":"Producida la retención o traslado ilícito de un menor en violación al derecho de guarda, de custodia o régimen de comunicación que ejerció una persona, institución u organismo, de manera separada o conjunta, con arreglo al derecho vigente en un Estado en el qu"},{"n":683,"p":["La demanda debe contener:","1) identificación y domicilio del demandante, del menor de edad y de la persona que se alega que sustrajo o retuvo al menor de edad;","2) la fecha de nacimiento del menor, cuando sea posible conocerla;","3) los hechos en que se funda el solicitante para reclamar la restitución del menor;","4) toda la información disponible relativa a la localización del menor y la identidad de las personas con la que se supone que está el menor;","5) la demanda puede ir acompañada por copia legalizada de toda decisión o acuerdo pertinente;","6) una certificación o declaración jurada expedida por Autoridad Central o del Estado donde el menor tiene su residencia habitual, referida a las decisiones judiciales o extrajudiciales o acuerdos sobre cuidado personal, custodia, régimen de comunicación, residencia habitual y cualquier otro documento pertinente."],"t":"Forma de la demanda","s":"La demanda debe contener: 1) identificación y domicilio del demandante, del menor de edad y de la persona que se alega que sustrajo o retuvo al menor de edad; 2) la fecha de nacimiento del menor, cuando sea posible conocerla;"},{"n":684,"p":["Presentada y admitida la demanda de restitución de menores o restauración del régimen de comunicación afectado, el Juez en virtud de la protección del niño, niña o adolescente debe aplicar las medidas urgentes que considera necesarias."],"t":"Trámite","s":"Presentada y admitida la demanda de restitución de menores o restauración del régimen de comunicación afectado, el Juez en virtud de la protección del niño, niña o adolescente debe aplicar las medidas urgentes que considera necesarias."},{"n":685,"p":["La ejecución de las medidas cautelares o de seguridad que se adoptan para la restitución de menores o restauración del régimen de comunicación afectado, son resueltas según las leyes del Estado requerido."],"t":"Cumplimiento de las resoluciones","s":"La ejecución de las medidas cautelares o de seguridad que se adoptan para la restitución de menores o restauración del régimen de comunicación afectado, son resueltas según las leyes del Estado requerido."},{"n":686,"p":["Se entiende por residencia habitual del menor y centro de vida al lugar donde transcurre la mayor parte de su existencia conforme a derecho."],"t":"Residencia habitual","s":"Se entiende por residencia habitual del menor y centro de vida al lugar donde transcurre la mayor parte de su existencia conforme a derecho."},{"n":687,"p":["Una vez agotada la vía administrativa la Autoridad Central es la encargada de remitir lo actuado al Juez competente del lugar de residencia habitual del menor.","El Juez competente puede requerir a la Autoridad Central la información necesaria con el fin de localizar al menor de edad."],"t":"Autoridad Central establecida por las convenciones internacionales sobre restitución de menores ratificadas por el Estado Nacional","s":"Una vez agotada la vía administrativa la Autoridad Central es la encargada de remitir lo actuado al Juez competente del lugar de residencia habitual del menor."},{"n":688,"p":["Es procedente la demanda cuando la Autoridad Central remite las actuaciones administrativas sin que se restituya voluntariamente al menor, o cuando se presenta directamente ante el Juez competente según donde se encuentre el menor.","Puede ser rechazada la demanda de restitución o suspendido el procedimiento, cuando el Juez competente tiene motivos fundados para creer que el menor fue trasladado a otro Estado."],"t":"Procedimiento. Admisión","s":"Es procedente la demanda cuando la Autoridad Central remite las actuaciones administrativas sin que se restituya voluntariamente al menor, o cuando se presenta directamente ante el Juez competente según donde se encuentre el menor."},{"n":689,"p":["Cuando la parte demandada se opone a la restitución del menor o restauración del régimen de comunicación afectado, el Juez competente debe disponer las pruebas que considera necesarias en vistas a proteger al menor de edad y privilegiar los mejores intereses del mismo.","El Juez considera el grado de integración del menor al nuevo centro de vida, su situación socio-económica; el riesgo grave por violencia de carácter físico o psíquico al que puede ser expuesto el menor de edad en caso de ser restituido, la resistencia del menor a la restitución cuando tiene la suficiente madurez para comprender la situación y el caso de consentimiento sobreviniente del demandante.","Acreditado cualquiera de estos presupuestos el Juez competente puede denegar la restitución del menor de edad o restauración del régimen de comunicación afectado."],"t":"Oposición. Prueba","s":"Cuando la parte demandada se opone a la restitución del menor o restauración del régimen de comunicación afectado, el Juez competente debe disponer las pruebas que considera necesarias en vistas a proteger al menor de edad y privilegiar los mejores intereses d"},{"n":690,"p":["Dentro de los sesenta (60) días corridos, el Juez competente debe dictar la resolución correspondiente."],"t":"Plazo","s":"Dentro de los sesenta (60) días corridos, el Juez competente debe dictar la resolución correspondiente."},{"n":691,"p":["La resolución que rechaza la restitución de menores o restauración del régimen de comunicación afectado admite recurso de apelación dentro del quinto día de su notificación."],"t":"Recurso","s":"La resolución que rechaza la restitución de menores o restauración del régimen de comunicación afectado admite recurso de apelación dentro del quinto día de su notificación."},{"n":692,"p":["Quien tiene derecho a solicitar la restitución del menor o restauración del régimen de comunicación puede presentarse ante el Juez competente y solicitar se garantice el ejercicio pacífico del régimen de comunicación."],"t":"Régimen de comunicación","s":"Quien tiene derecho a solicitar la restitución del menor o restauración del régimen de comunicación puede presentarse ante el Juez competente y solicitar se garantice el ejercicio pacífico del régimen de comunicación."},{"n":693,"p":["Previa comprobación del cumplimiento de los requisitos exigidos para otorgar la restitución del menor o restauración del régimen de comunicación, el Juez competente debe disponer sin demora la restitución del menor de edad al Estado de su residencia habitual.","El Juez debe garantizar que la restitución del menor o restauración del régimen de comunicación sea realizada dentro de un marco pacífico; si existe peligro real e inminente, denunciado o comprobado, de que se produzca un incumplimiento que ponga en peligro al menor de edad, el Juez debe adoptar de inmediato las medidas necesarias para impedir la salida del menor del territorio de su jurisdicción.","Producida la suspensión de la restitución del menor de edad el Juez competente debe tomar conocimiento personal de su situación y ordenar las medidas necesarias para asegurar su custodia o guarda provisional en las condiciones que aconsejan las circunstancias.","En el caso de la restitución del régimen de comunicación, adopta las medidas necesarias para eliminar los obstáculos para el ejercicio del derecho."],"t":"Medidas","s":"Previa comprobación del cumplimiento de los requisitos exigidos para otorgar la restitución del menor o restauración del régimen de comunicación, el Juez competente debe disponer sin demora la restitución del menor de edad al Estado de su residencia habitual."},{"n":694,"p":["Al ordenar la restitución de un menor o restauración del régimen de comunicación, el Juez competente puede disponer que quien trasladó o retuvo al menor de edad o quien impidió el ejercicio del régimen de comunicación, pague los gastos en que incurrió el demandante o que se realizaron en su nombre, incluidos los gastos de viajes, los pagos efectuados para localizar al menor, las costas de la representación judicial del demandante y los demás gastos para la restitución del menor."],"t":"Costas y gastos","s":"Al ordenar la restitución de un menor o restauración del régimen de comunicación, el Juez competente puede disponer que quien trasladó o retuvo al menor de edad o quien impidió el ejercicio del régimen de comunicación, pague los gastos en que incurrió el deman"},{"n":695,"p":["Los Estados Parte en las Convenciones y Convenios Internacionales ratificados por el Estado Nacional y las Autoridades Centrales actúan bajo el principio internacional de reciprocidad. Toda actuación de Tribunal Provincial en virtud de la restitución de menores así como la tramitación de los exhortos, comunicaciones o solicitudes contemplados en las Convenciones Internacionales, son gratuitas y están exentas de cualquier clase de impuesto, depósito o caución."],"t":"Principio de reciprocidad y gratuidad","s":"Los Estados Parte en las Convenciones y Convenios Internacionales ratificados por el Estado Nacional y las Autoridades Centrales actúan bajo el principio internacional de reciprocidad."},{"n":696,"p":["Los juicios de alimentos y litisexpensas se tramitan por las normas de los procesos especiales. La parte que promueve juicio de alimentos debe, en un mismo escrito:","1) acreditar el título en cuya virtud los solicita;","2) denunciar, siquiera aproximadamente, el caudal de quien debe suministrarlos;","3) acompañar toda la documentación que tiene en su poder y que hace a su derecho, de acuerdo con lo dispuesto en el Artículo 334;","4) ofrecer la prueba de que intenta valerse.","Si se ofrece prueba testimonial, los testigos deben declarar en primera audiencia."],"t":"Tipo de proceso. Recaudos","s":"Los juicios de alimentos y litisexpensas se tramitan por las normas de los procesos especiales. La parte que promueve juicio de alimentos debe, en un mismo escrito: 1) acreditar el título en cuya virtud los solicita;"},{"n":697,"p":["Desde la iniciación de la causa, el Juez puede, atento a las circunstancias del caso, establecer inaudita parte una cuota alimentaria provisoria, que rige hasta la sentencia. La misma es recurrible con efecto devolutivo."],"t":"Alimentos provisorios","s":"Desde la iniciación de la causa, el Juez puede, atento a las circunstancias del caso, establecer inaudita parte una cuota alimentaria provisoria, que rige hasta la sentencia. La misma es recurrible con efecto devolutivo."},{"n":698,"p":["El Juez, sin perjuicio de ordenar inmediatamente las medidas probatorias que son solicitadas, debe señalar una audiencia que tiene lugar dentro de los diez (10) días contados desde la fecha de la presentación.","En dicha audiencia, a la que deben comparecer las partes personalmente y el representante del Ministerio Pupilar, si corresponde, el Juez debe procurar que aquéllas lleguen a un acuerdo directo, en cuyo caso, lo homologa en ese mismo acto, y pone fin al juicio."],"t":"Audiencia preliminar","s":"El Juez, sin perjuicio de ordenar inmediatamente las medidas probatorias que son solicitadas, debe señalar una audiencia que tiene lugar dentro de los diez (10) días contados desde la fecha de la presentación."},{"n":699,"p":["Cuando, sin causa justificada, la persona a quien se le requiere alimentos no comparece a la audiencia prevista en el Artículo 698, en el mismo acto el Juez dispone:","1) la aplicación de una multa, a favor de la otra parte, de hasta un (1) salario mínimo, vital y móvil y cuyo importe debe depositarse dentro del tercer día contado desde la fecha en que se notificó la providencia que la impuso; y establecer una cuota alimentaria provisoria si aún no se estipuló;","2) la fijación de una nueva audiencia que tiene lugar dentro del quinto día, la que se notifica con habilitación de día y hora, bajo apercibimiento de establecer la cuota alimentaria definitiva."],"t":"Incomparecencia injustificada del alimentante. Efectos","s":"Cuando, sin causa justificada, la persona a quien se le requiere alimentos no comparece a la audiencia prevista en el Artículo 698, en el mismo acto el Juez dispone:"},{"n":700,"p":["Cuando quien no comparece sin causa justificada a la audiencia que prevé el Artículo 698 sea la parte actora, el Juez señala nueva audiencia, en la misma forma y plazo previstos en el Artículo 699 inciso 2), bajo apercibimiento de tenerla por desistida de su pretensión si no concurre."],"t":"Incomparecencia injustificada de la parte actora. Efectos","s":"Cuando quien no comparece sin causa justificada a la audiencia que prevé el Artículo 698 sea la parte actora, el Juez señala nueva audiencia, en la misma forma y plazo previstos en el Artículo 699 inciso 2), bajo apercibimiento de tenerla por desistida de su p"},{"n":701,"p":["A la parte actora y a la demandada se les admite la justificación de la incomparecencia por una (1) sola vez. Si la causa subsiste, aquéllas deben hacerse representar por apoderado, bajo apercibimiento de lo dispuesto en los Artículos 699 inciso 2) y 700, según el caso."],"t":"Incomparecencia justificada","s":"A la parte actora y a la demandada se les admite la justificación de la incomparecencia por una (1) sola vez."},{"n":702,"p":["Desde su notificación y hasta la celebración de la audiencia prevista en el Artículo 698, inclusive, el demandado, para demostrar la falta de título o derecho de quien pretende los alimentos, así como la situación patrimonial propia o de la parte actora, sólo puede:","1) acompañar prueba instrumental;","2) solicitar informes cuyo diligenciamiento no puede postergar, en ningún caso, el plazo fijado en el Artículo 698.","El Juez al sentenciar debe valorar esas pruebas para determinar el monto de la pensión, o para denegarla, en su caso."],"t":"Intervención de la parte demandada","s":"Desde su notificación y hasta la celebración de la audiencia prevista en el Artículo 698, inclusive, el demandado, para demostrar la falta de título o derecho de quien pretende los alimentos, así como la situación patrimonial propia o de la parte actora, sólo "},{"n":703,"p":["Cuando en la oportunidad prevista en el Artículo 698 no se llegue a un acuerdo, el Juez, sin necesidad de petición de parte, debe dictar sentencia dentro de cinco (5) días, contados desde que se produjo la prueba ofrecida por la parte actora. Admitida la pretensión, el Juez fija la suma que considera equitativa y la manda abonar por meses anticipados, desde la fecha de interposición de la demanda.","Las cuotas mensuales a que se refiere este artículo, como también las suplementarias previstas en el siguiente, devengan intereses desde la fecha fijada en la sentencia para el pago de cada una de ellas."],"t":"Sentencia","s":"Cuando en la oportunidad prevista en el Artículo 698 no se llegue a un acuerdo, el Juez, sin necesidad de petición de parte, debe dictar sentencia dentro de cinco (5) días, contados desde que se produjo la prueba ofrecida por la parte actora."},{"n":704,"p":["Respecto de los alimentos que se devengan durante la tramitación del juicio, el Juez fija una cuota suplementaria, de acuerdo con las disposiciones sobre inembargabilidad de sueldos, jubilaciones y pensiones, la que se debe abonar en forma independiente.","La inactividad procesal del alimentario crea la presunción, sujeta a prueba en contrario, de su falta de necesidad y, con arreglo a las circunstancias de la causa, puede determinar la caducidad del derecho a cobrar las cuotas atrasadas referidas al período correspondiente a la inactividad.","La caducidad no es aplicable a los beneficiarios menores de edad; tampoco, cuando la aparente inactividad del interesado es provocada por la inconducta del alimentante."],"t":"Alimentos atrasados","s":"Respecto de los alimentos que se devengan durante la tramitación del juicio, el Juez fija una cuota suplementaria, de acuerdo con las disposiciones sobre inembargabilidad de sueldos, jubilaciones y pensiones, la que se debe abonar en forma independiente."},{"n":705,"p":["Salvo acuerdo de partes, la cuota alimentaria se deposita en el banco de depósitos judiciales y se entrega al beneficiario a su sola presentación. Su apoderado únicamente puede percibirla cuando existe resolución fundada que así lo ordena."],"t":"Percepción","s":"Salvo acuerdo de partes, la cuota alimentaria se deposita en el banco de depósitos judiciales y se entrega al beneficiario a su sola presentación. Su apoderado únicamente puede percibirla cuando existe resolución fundada que así lo ordena."},{"n":706,"p":["La sentencia que deniega los alimentos es apelable en ambos efectos. Si los admite, el recurso se concede en efecto devolutivo. En este último supuesto, una vez deducida la apelación, se expide testimonio de la sentencia, el que se reserva en el Juzgado para su ejecución, remitiéndose inmediatamente las actuaciones a la Cámara."],"t":"Recursos","s":"La sentencia que deniega los alimentos es apelable en ambos efectos. Si los admite, el recurso se concede en efecto devolutivo."},{"n":707,"p":["Si dentro de quinto día de intimado el pago, la parte vencida no lo hace efectivo, sin otra sustanciación, se procede al embargo y se decreta la venta de los bienes necesarios para cubrir el importe de la deuda."],"t":"Cumplimiento de la sentencia","s":"Si dentro de quinto día de intimado el pago, la parte vencida no lo hace efectivo, sin otra sustanciación, se procede al embargo y se decreta la venta de los bienes necesarios para cubrir el importe de la deuda."},{"n":708,"p":["Cuando se trata de alimentos fijados a favor de uno de los cónyuges durante la sustanciación del juicio de divorcio vincular o separación personal, y recae sentencia definitiva decretándolo por culpa de aquél o de ambos, la obligación del alimentante cesa de pleno derecho, sin perjuicio de lo dispuesto en el Artículo 209 del Código Civil."],"t":"Divorcio decretado por culpa de uno o de ambos cónyuges","s":"Cuando se trata de alimentos fijados a favor de uno de los cónyuges durante la sustanciación del juicio de divorcio vincular o separación personal, y recae sentencia definitiva decretándolo por culpa de aquél o de ambos, la obligación del alimentante cesa de p"},{"n":709,"p":["Toda petición de aumento, disminución o coparticipación en los alimentos, se debe sustanciar por las normas de los incidentes en el proceso en que son solicitados. Este trámite no interrumpe la percepción de las cuotas ya fijadas, a excepción de la cesación de cuota alimentaria, la cual se produce ipso iure cumplidos los veintiún (21) años de edad del alimentado.","En el incidente de aumento de la cuota alimentaria, la nueva cantidad fijada rige desde la notificación del pedido."],"t":"Trámite para la modificación y cesación de los alimentos","s":"Toda petición de aumento, disminución o coparticipación en los alimentos, se debe sustanciar por las normas de los incidentes en el proceso en que son solicitados."},{"n":710,"p":["La demanda por litisexpensas se sustancia de acuerdo con las normas de este Capítulo."],"t":"Litisexpensas","s":"La demanda por litisexpensas se sustancia de acuerdo con las normas de este Capítulo."},{"n":711,"p":["El pedido de autorización para contraer matrimonio tramita en juicio verbal, privado y meramente informativo, con intervención del interesado, de quien debe darla y del representante del Ministerio Público.","La licencia judicial para el matrimonio de los menores o incapaces sin padres, tutores o curadores, es solicitada y sustanciada en la misma forma."],"t":"Trámite","s":"El pedido de autorización para contraer matrimonio tramita en juicio verbal, privado y meramente informativo, con intervención del interesado, de quien debe darla y del representante del Ministerio Público."},{"n":712,"p":["La resolución es apelable dentro de quinto día. El tribunal de alzada debe pronunciarse, sin sustanciación alguna, en el plazo de diez (10) días."],"t":"Apelación","s":"La resolución es apelable dentro de quinto día. El tribunal de alzada debe pronunciarse, sin sustanciación alguna, en el plazo de diez (10) días."},{"n":713,"p":["El nombramiento de tutor o curador y la confirmación del que efectuaron los padres, se hace a solicitud del interesado o del Ministerio Público, sin forma de juicio, a menos que alguien pretenda tener derecho a ser nombrado. Si se promueve cuestión, se sustancia en juicio sumarísimo. La resolución es apelable en los términos del","Artículo 712."],"t":"Trámite","s":"El nombramiento de tutor o curador y la confirmación del que efectuaron los padres, se hace a solicitud del interesado o del Ministerio Público, sin forma de juicio, a menos que alguien pretenda tener derecho a ser nombrado."},{"n":714,"p":["Confirmado o hecho el nombramiento, se procede al discernimiento del cargo, extendiéndose acta en que conste el juramento o promesa de desempeñarlo fiel y legalmente y la autorización judicial para ejercerlo."],"t":"Acta","s":"Confirmado o hecho el nombramiento, se procede al discernimiento del cargo, extendiéndose acta en que conste el juramento o promesa de desempeñarlo fiel y legalmente y la autorización judicial para ejercerlo."},{"n":715,"p":["Los jueces deben: en los juicios de divorcio y de nulidad de matrimonio, en la providencia que ordena el traslado de la demanda, fijar una audiencia a la que deben comparecer personalmente las partes y el representante del Ministerio Público, en su caso. En ella el Juez trata de reconciliar a las partes y de avenirlas sobre las cuestiones relacionadas con el cuidado personal de hijos, régimen de comunicación y contacto y atribución de la vivienda familiar."],"t":"Deber de los jueces","s":"Los jueces deben: en los juicios de divorcio y de nulidad de matrimonio, en la providencia que ordena el traslado de la demanda, fijar una audiencia a la que deben comparecer personalmente las partes y el representante del Ministerio Público, en su caso."},{"n":716,"p":["En los juicios de divorcio y nulidad de matrimonio sólo se da vista a los representantes del Ministerio Público en los siguientes casos:","1) luego de contestada la demanda o la reconvención;","2) una vez vencido el plazo de presentación de los alegatos;","3) cuando se plantee alguna cuestión vinculada a la representación que ejercen. En este caso, la vista es conferida por resolución fundada del Juez."],"t":"Vista","s":"En los juicios de divorcio y nulidad de matrimonio sólo se da vista a los representantes del Ministerio Público en los siguientes casos: 1) luego de contestada la demanda o la reconvención; 2) una vez vencido el plazo de presentación de los alegatos;"},{"n":717,"p":["Quien solicita la apertura del proceso sucesorio, debe justificar, prima facie, su carácter de parte legítima y acompañar la partida de defunción del causante.","Si éste hizo testamento y el solicitante conoce su existencia, debe presentarlo, cuando esté en su poder, o indicar el lugar donde se encuentra, si lo sabe.","Cuando el causante falleció sin haber testado, debe denunciarse el nombre y domicilio de los herederos o representantes legales conocidos."],"t":"Requisitos de la iniciación","s":"Quien solicita la apertura del proceso sucesorio, debe justificar, prima facie, su carácter de parte legítima y acompañar la partida de defunción del causante."},{"n":718,"p":["El Juez debe hacer lugar o denegar la apertura del proceso, previo examen de su competencia y recepción de la prueba que resulta necesaria.","Dentro del tercer día de iniciado el procedimiento, el presentante debe comunicarlo al Registro de Juicios Universales, en la forma y con los recaudos que establece la reglamentación respectiva.","A petición de parte interesada, o de oficio, en su caso, el Juez debe disponer las medidas que considera convenientes para la seguridad de los bienes y documentación del causante.","El dinero, los títulos, acciones y alhajas se deben depositar en el banco de depósitos judiciales. Respecto de las alhajas se adopta la misma medida, salvo que los herederos decidan que queden bajo su custodia."],"t":"Medidas preliminares y de seguridad","s":"El Juez debe hacer lugar o denegar la apertura del proceso, previo examen de su competencia y recepción de la prueba que resulta necesaria."},{"n":719,"p":["Cuando en el proceso sucesorio el Juez advierte que la comparecencia personal de las partes y de sus letrados puede ser beneficiosa para la concentración y simplificación de los actos procesales que deben cumplirse, de oficio o a pedido de parte, debe señalar una audiencia a la que aquellos deben concurrir personalmente, bajo apercibimiento de imponer una multa de hasta el veinticinco por ciento (25%) de un (1) salario mínimo, vital y móvil, en caso de inasistencia injustificada.","En dicha audiencia el Juez debe procurar que las partes establezcan lo necesario para la más rápida tramitación del proceso.","Todas las multas que imponen los tribunales de la Provincia y que no tienen otro destino, una vez firmes y consentidas deben ser depositadas en la cuenta especial “Fondo de Justicia”, y deben ser ingresadas dentro de los cinco (5) días de intimadas personalmente o por cédula."],"t":"Simplificación de los procedimientos","s":"Cuando en el proceso sucesorio el Juez advierte que la comparecencia personal de las partes y de sus letrados puede ser beneficiosa para la concentración y simplificación de los actos procesales que deben cumplirse, de oficio o a pedido de parte, debe señalar "},{"n":720,"p":["A pedido de parte, el Juez puede fijar una audiencia para designar administrador provisional. El nombramiento recae en el cónyuge supérstite o en el heredero que, prima facie, acredita mayor aptitud para el desempeño del cargo. El Juez sólo puede nombrar a un tercero cuando no concurren estas circunstancias."],"t":"Administrador provisional","s":"A pedido de parte, el Juez puede fijar una audiencia para designar administrador provisional. El nombramiento recae en el cónyuge supérstite o en el heredero que, prima facie, acredita mayor aptitud para el desempeño del cargo."},{"n":721,"p":["La actuación de las personas y funcionarios que pueden promover el proceso sucesorio o intervenir en él, tiene las siguientes limitaciones:","1) el Ministerio Público cesa de intervenir una vez aprobado el testamento, dictada la declaratoria de herederos, o reputada vacante la herencia;","2) los tutores ad litem cesan de intervenir cuando a sus pupilos se les designa representante legal definitivo, o desaparece la incapacidad o la oposición de intereses que dio motivo a su designación;","3) la autoridad encargada de recibir la herencia vacante debe ser notificada por cédula de los procesos en los que puede llegar a tener intervención. Las actuaciones sólo se le remiten cuando se reputa vacante la herencia. Su intervención cesa una vez aprobado el testamento o dictada la declaratoria de herederos."],"t":"Intervención de interesados","s":"La actuación de las personas y funcionarios que pueden promover el proceso sucesorio o intervenir en él, tiene las siguientes limitaciones:"},{"n":722,"p":["Sin perjuicio de lo dispuesto en el Artículo 2289 del Código Civil y Comercial de la Nación, los acreedores sólo pueden iniciar el proceso sucesorio después de transcurridos cuatro (4) meses desde el fallecimiento del causante. Sin embargo, el Juez puede ampliar o reducir ese plazo cuando las circunstancias así lo aconsejan. Su intervención cesa cuando se presenta al juicio algún heredero o se provee a su representación en forma legal, salvo inacción manifiesta de éstos, en cuyo supuesto los acreedores pueden activar el procedimiento."],"t":"Intervención de los acreedores","s":"Sin perjuicio de lo dispuesto en el Artículo 2289 del Código Civil y Comercial de la Nación, los acreedores sólo pueden iniciar el proceso sucesorio después de transcurridos cuatro (4) meses desde el fallecimiento del causante."},{"n":723,"p":["Si fallece un heredero o presunto heredero, dejando sucesores, éstos deben acreditar ese carácter y comparecer, bajo una sola representación, dentro del plazo que el Juez fija. Se aplica en lo pertinente, lo dispuesto en el Artículo 54."],"t":"Fallecimiento de herederos","s":"Si fallece un heredero o presunto heredero, dejando sucesores, éstos deben acreditar ese carácter y comparecer, bajo una sola representación, dentro del plazo que el Juez fija. Se aplica en lo pertinente, lo dispuesto en el Artículo 54."},{"n":724,"p":["Cuando se iniciaron dos (2) juicios sucesorios, uno testamentario y otro ab intestato, para su acumulación prevalece, en principio, el primero. Queda a criterio del Juez la aplicación de esta regla, teniendo en cuenta el grado de adelanto de los trámites realizados y las medidas útiles cumplidas en cada caso, siempre que la promoción del proceso o su sustanciación no revelen el propósito de obtener una prioridad indebida. El mismo criterio se aplica en caso de coexistencia de juicios testamentarios o ab intestato."],"t":"Acumulación","s":"Cuando se iniciaron dos (2) juicios sucesorios, uno testamentario y otro ab intestato, para su acumulación prevalece, en principio, el primero."},{"n":725,"p":["Dictada la declaratoria de herederos o declarado válido el testamento, el Juez convoca a audiencia que se notifica por cédula a los herederos y legatarios de parte alícuota, en su caso, y a los funcionarios que corresponda, con el objeto de efectuar las designaciones de administrador definitivo, inventariador, tasador y las demás que sean procedentes."],"t":"Audiencia","s":"Dictada la declaratoria de herederos o declarado válido el testamento, el Juez convoca a audiencia que se notifica por cédula a los herederos y legatarios de parte alícuota, en su caso, y a los funcionarios que corresponda, con el objeto de efectuar las design"},{"n":726,"p":["Aprobado el testamento o dictada la declaratoria de herederos, en su caso, si todos los herederos son capaces y, a juicio del Juez, no media disconformidad fundada en razones atendibles, los ulteriores trámites del procedimiento sucesorio continúan extrajudicialmente a cargo del o de los profesionales intervinientes.","En este supuesto, las operaciones de inventario, avalúo, partición y adjudicación, deben efectuarse con la intervención y conformidad de los organismos administrativos que correspondan.","Cumplidos estos recaudos los letrados pueden solicitar directamente la inscripción de los bienes registrables y entregar las hijuelas a los herederos.","Si durante la tramitación extrajudicial se suscitan desinteligencias entre los herederos, o entre éstos y los organismos administrativos, aquéllas deben someterse a la decisión del Juez del proceso sucesorio.","El monto de los honorarios por los trabajos efectuados es el que correspondería si aquéllos se realizaran judicialmente. No se regulan dichos honorarios hasta tanto los profesionales que tenían a su cargo el trámite extrajudicial presenten al Juzgado copia de las actuaciones cumplidas, para su agregación al expediente.","Tampoco pueden inscribirse los bienes registrables sin el certificado expedido por el Secretario en el que consta que se agregaron las copias a que se refiere el párrafo anterior."],"t":"Sucesión extrajudicial","s":"Aprobado el testamento o dictada la declaratoria de herederos, en su caso, si todos los herederos son capaces y, a juicio del Juez, no media disconformidad fundada en razones atendibles, los ulteriores trámites del procedimiento sucesorio continúan extrajudici"},{"n":727,"p":["Cuando el causante no testó o el testamento no contiene institución de heredero, en la providencia de apertura del proceso sucesorio, el Juez debe disponer la citación de todos los que se consideran con derecho a los bienes dejados por el causante, para que dentro del plazo de treinta (30) días lo acrediten.","A tal efecto debe ordenar:","1) la notificación por cédula, oficio o exhorto a los herederos denunciados en el expediente que tienen domicilio conocido en el país;","2) la publicación de edictos por tres (3) días en el Boletín Oficial y en otro diario del lugar del juicio, salvo que el monto del haber hereditario no exceda, prima facie, de la cantidad máxima que corresponde para la inscripción del bien de familia, en cuyo caso sólo se publican en el Boletín Oficial. Si el haber sobrepasa, en definitiva, la suma precedentemente indicada, se deben ordenar las publicaciones que corresponden.","El plazo fijado por el Artículo 2340 del Código Civil y Comercial de la Nación comienza a correr desde el día siguiente al de la última publicación y se computa en días corridos, salvo los que corresponden a ferias judiciales."],"t":"Providencia de apertura y citación a los interesados","s":"Cuando el causante no testó o el testamento no contiene institución de heredero, en la providencia de apertura del proceso sucesorio, el Juez debe disponer la citación de todos los que se consideran con derecho a los bienes dejados por el causante, para que de"},{"n":728,"p":["Cumplidos el plazo y los trámites a que se refiere el Artículo 727, y acreditado el derecho de los sucesores, el Juez dicta declaratoria de herederos.","Si no se justifica el vínculo de alguno de los presuntos herederos, previa vista a la autoridad encargada de recibir la herencia vacante, se difiere la declaratoria por el plazo que el Juez fija para que, durante su transcurso, se produzca la prueba correspondiente. Vencido dicho plazo, el Juez debe dictar declaratoria a favor de quienes acreditaron el vínculo, o reputa vacante la herencia."],"t":"Declaratoria de herederos","s":"Cumplidos el plazo y los trámites a que se refiere el Artículo 727, y acreditado el derecho de los sucesores, el Juez dicta declaratoria de herederos."},{"n":729,"p":["Los herederos mayores de edad que han acreditado el vínculo conforme a derecho, pueden, por unanimidad, admitir coherederos que no lo hubiesen justificado, sin que ello importe reconocimiento del estado de familia. Los herederos declarados pueden, en iguales condiciones, reconocer acreedores del causante."],"t":"Admisión de herederos","s":"Los herederos mayores de edad que han acreditado el vínculo conforme a derecho, pueden, por unanimidad, admitir coherederos que no lo hubiesen justificado, sin que ello importe reconocimiento del estado de familia."},{"n":730,"p":["La declaratoria de herederos se dicta sin perjuicio de terceros.","Cualquier pretendiente puede promover demanda impugnando su validez o exactitud, para excluir al heredero declarado, o para ser reconocido con él.","Aún sin decisión expresa, la declaratoria de herederos otorga la posesión de la herencia a quienes no la tienen por el solo hecho de la muerte del causante."],"t":"Efectos de la declaratoria. Posesión de la herencia","s":"La declaratoria de herederos se dicta sin perjuicio de terceros. Cualquier pretendiente puede promover demanda impugnando su validez o exactitud, para excluir al heredero declarado, o para ser reconocido con él."},{"n":731,"p":["La declaratoria de herederos puede ser ampliada por el Juez en cualquier estado del proceso, a petición de parte legítima, si corresponde."],"t":"Ampliación de la declaratoria","s":"La declaratoria de herederos puede ser ampliada por el Juez en cualquier estado del proceso, a petición de parte legítima, si corresponde."},{"n":732,"p":["Quien presenta testamento ológrafo debe ofrecer dos (2) testigos para que reconozcan la firma y letra del testador.","El Juez debe señalar audiencia a la que cita a los beneficiarios y a los presuntos herederos cuyos domicilios son conocidos, y al escribano y testigos, si se trata de testamento cerrado.","Si el testamento ológrafo se acompaña en sobre cerrado, el Juez lo abre en dicha audiencia en presencia del Secretario."],"t":"Testamentos ológrafos y cerrados","s":"Quien presenta testamento ológrafo debe ofrecer dos (2) testigos para que reconozcan la firma y letra del testador."},{"n":733,"p":["Si los testigos reconocen la letra y firma del testador, el Juez debe rubricar el principio y fin de cada una de las páginas del testamento y designar un escribano para que lo protocolice."],"t":"Protocolización","s":"Si los testigos reconocen la letra y firma del testador, el Juez debe rubricar el principio y fin de cada una de las páginas del testamento y designar un escribano para que lo protocolice."},{"n":734,"p":["Si reconocida la letra y la firma del testador por los testigos, se formulan objeciones sobre el cumplimiento de las formalidades prescriptas, o reclamos que no se refieren a la validez del testamento, la cuestión se sustancia por el trámite de los incidentes.","SECCIÓN 2.a DISPOSICIONES ESPECIALES"],"t":"Oposición a la protocolización","s":"Si reconocida la letra y la firma del testador por los testigos, se formulan objeciones sobre el cumplimiento de las formalidades prescriptas, o reclamos que no se refieren a la validez del testamento, la cuestión se sustancia por el trámite de los incidentes."},{"n":735,"p":["Presentado el testamento, o protocolizado en su caso, el Juez debe disponer la notificación personal de los herederos instituidos, de los demás beneficiarios y del albacea, para que se presenten dentro de treinta (30) días.","Si se ignora el domicilio de las personas mencionadas en el apartado anterior, se procede en la forma dispuesta en el Artículo 147."],"t":"Citación","s":"Presentado el testamento, o protocolizado en su caso, el Juez debe disponer la notificación personal de los herederos instituidos, de los demás beneficiarios y del albacea, para que se presenten dentro de treinta (30) días."},{"n":736,"p":["En la providencia a que se refiere el Artículo 735, el Juez se debe pronunciar sobre la validez del testamento, cualquiera sea su forma. Ello importa otorgar la posesión de la herencia a los herederos que no la tienen de pleno derecho."],"t":"Aprobación del testamento","s":"En la providencia a que se refiere el Artículo 735, el Juez se debe pronunciar sobre la validez del testamento, cualquiera sea su forma. Ello importa otorgar la posesión de la herencia a los herederos que no la tienen de pleno derecho."},{"n":737,"p":["Si no media acuerdo entre los herederos para la designación del administrador, el Juez nombra al cónyuge supérstite, y a falta, renuncia o inidoneidad de éste, al propuesto por la mayoría salvo que se invoquen motivos especiales que, a criterio del Juez, sean aceptables para no efectuar ese nombramiento."],"t":"Designación de administrador","s":"Si no media acuerdo entre los herederos para la designación del administrador, el Juez nombra al cónyuge supérstite, y a falta, renuncia o inidoneidad de éste, al propuesto por la mayoría salvo que se invoquen motivos especiales que, a criterio del Juez, sean "},{"n":738,"p":["El administrador acepta el cargo ante el Secretario y debe ser puesto en posesión de los bienes de la herencia por intermedio del Oficial de Justicia. Se le expide testimonio de su nombramiento."],"t":"Aceptación del cargo","s":"El administrador acepta el cargo ante el Secretario y debe ser puesto en posesión de los bienes de la herencia por intermedio del Oficial de Justicia. Se le expide testimonio de su nombramiento."},{"n":739,"p":["Las actuaciones relacionadas con la administración tramitan en expediente separado, cuando la complejidad e importancia de aquélla así lo aconsejen."],"t":"Expedientes de administración","s":"Las actuaciones relacionadas con la administración tramitan en expediente separado, cuando la complejidad e importancia de aquélla así lo aconsejen."},{"n":740,"p":["El administrador de la sucesión sólo puede realizar actos conservatorios de los bienes administrados.","Sólo puede retener fondos o disponer de ellos con el objeto de pagar los gastos normales de la administración. En cuanto a los gastos extraordinarios se está a lo dispuesto en el Artículo 228, inciso 5).","No puede arrendar inmuebles sin el consentimiento de todos los herederos.","Cuando no media acuerdo entre los herederos, el administrador puede ser autorizado por el Juez para promover, proseguir o contestar las demandas de la sucesión. Si existen razones de urgencia, puede prescindir de dicha autorización, pero debe dar cuenta al Juzgado de esa circunstancia en forma inmediata."],"t":"Facultades del administrador","s":"El administrador de la sucesión sólo puede realizar actos conservatorios de los bienes administrados. Sólo puede retener fondos o disponer de ellos con el objeto de pagar los gastos normales de la administración."},{"n":741,"p":["El administrador de la sucesión debe rendir cuentas trimestralmente, salvo que la mayoría de los herederos acuerden fijar otro plazo. Al terminar sus funciones debe rendir una cuenta final.","Tanto las rendiciones de cuentas parciales como la final se ponen en Secretaría a disposición de los interesados durante cinco (5) y diez (10) días, respectivamente, notificándoseles por cédula. Si no son observadas, el Juez las aprueba, si corresponde. Cuando median observaciones, se sustancian por el trámite de los incidentes."],"t":"Rendición de cuentas","s":"El administrador de la sucesión debe rendir cuentas trimestralmente, salvo que la mayoría de los herederos acuerden fijar otro plazo. Al terminar sus funciones debe rendir una cuenta final."},{"n":742,"p":["La sustitución del administrador se hace de acuerdo con las reglas contenidas en el Artículo 737.","Puede ser removido, de oficio o a pedido de parte, cuando su actuación importa mal desempeño del cargo. La remoción se sustancia por el trámite de los incidentes.","Si las causas invocadas son graves y están prima facie acreditadas, el Juez puede disponer su suspensión y reemplazo por otro administrador. En este último supuesto, el nombramiento se rige por lo dispuesto en el Artículo 737."],"t":"Sustitución y remoción","s":"La sustitución del administrador se hace de acuerdo con las reglas contenidas en el Artículo 737. Puede ser removido, de oficio o a pedido de parte, cuando su actuación importa mal desempeño del cargo. La remoción se sustancia por el trámite de los incidentes."},{"n":743,"p":["El administrador no puede percibir honorarios con carácter definitivo hasta que sea rendida y aprobada la cuenta final de la administración. Cuando ésta excede de seis (6) meses, el administrador puede ser autorizado a percibir periódicamente sumas, con carácter de anticipos provisionales, las que deben guardar proporción con el monto aproximado del honorario total."],"t":"Honorarios","s":"El administrador no puede percibir honorarios con carácter definitivo hasta que sea rendida y aprobada la cuenta final de la administración."},{"n":744,"p":["El inventario y avalúo deben hacerse judicialmente:","1) a pedido de un heredero que no perdió o renunció el beneficio de inventario;","2) cuando se nombró curador de la herencia;","3) cuando lo solicitan los acreedores de la herencia o de los herederos;","4) cuando corresponde por otra disposición de la ley.","No tratándose de alguno de los casos previstos en los incisos anteriores, las partes pueden sustituir el inventario por la denuncia de bienes, previa conformidad del Ministerio Pupilar si existen incapaces."],"t":"Inventario y avalúo judiciales","s":"El inventario y avalúo deben hacerse judicialmente: 1) a pedido de un heredero que no perdió o renunció el beneficio de inventario; 2) cuando se nombró curador de la herencia; 3) cuando lo solicitan los acreedores de la herencia o de los herederos;"},{"n":745,"p":["El inventario se practica en cualquier estado del proceso, siempre que lo solicite alguno de los interesados. El que se realiza antes de dictarse la declaratoria de herederos o aprobarse el testamento, tiene carácter provisional."],"t":"Inventario provisional","s":"El inventario se practica en cualquier estado del proceso, siempre que lo solicite alguno de los interesados. El que se realiza antes de dictarse la declaratoria de herederos o aprobarse el testamento, tiene carácter provisional."},{"n":746,"p":["Dictada la declaratoria de herederos o declarado válido el testamento, se hace el inventario definitivo. Sin embargo, con la conformidad de las partes, puede asignarse ese carácter al inventario provisional, o admitirse el que presentan los interesados, a menos que en este último caso, existan incapaces o ausentes."],"t":"Inventario definitivo","s":"Dictada la declaratoria de herederos o declarado válido el testamento, se hace el inventario definitivo."},{"n":747,"p":["Sin perjuicio de lo dispuesto en el","Artículo 744, último párrafo, el inventario es efectuado por un escribano que se propone en la audiencia prevista en el Artículo 725, o en otra, si en aquélla nada se acordó al respecto.","Para la designación basta la conformidad de la mayoría de los herederos presentes en el acto. En su defecto, el inventariador es nombrado por el Juez."],"t":"Nombramiento del inventariador","s":"Sin perjuicio de lo dispuesto en el Artículo 744, último párrafo, el inventario es efectuado por un escribano que se propone en la audiencia prevista en el Artículo 725, o en otra, si en aquélla nada se acordó al respecto."},{"n":748,"p":["Para el inventario de bienes existentes fuera del lugar donde tramita el proceso sucesorio, se comisiona al Juez de la localidad donde se encuentran."],"t":"Bienes fuera de la jurisdicción","s":"Para el inventario de bienes existentes fuera del lugar donde tramita el proceso sucesorio, se comisiona al Juez de la localidad donde se encuentran."},{"n":749,"p":["Las partes, los acreedores y legatarios son citados para la formación del inventario, notificándoselos por cédula, en la que se les hace saber el lugar, día y hora de la realización de la diligencia.","El inventario se hace con intervención de las partes que concurran.","El acta de la diligencia debe contener la especificación de los bienes, con indicación de la persona que efectúa la denuncia. Si hay título de propiedad, sólo se hace una relación sucinta de su contenido.","Se deja constancia de las observaciones o impugnaciones que formulan los interesados.","Los comparecientes deben firmar el acta. Si se niegan se deja también constancia, sin que ello afecte la validez de la diligencia."],"t":"Citaciones. Inventario","s":"Las partes, los acreedores y legatarios son citados para la formación del inventario, notificándoselos por cédula, en la que se les hace saber el lugar, día y hora de la realización de la diligencia."},{"n":750,"p":["Sólo son valuados los bienes que fueron inventariados, y siempre que sea posible, las diligencias de inventario y avalúo se realizan simultáneamente.","El o los peritos son designados de conformidad con lo establecido en el Artículo 747.","Pueden ser recusados por las causas establecidas para los peritos."],"t":"Avalúo","s":"Sólo son valuados los bienes que fueron inventariados, y siempre que sea posible, las diligencias de inventario y avalúo se realizan simultáneamente. El o los peritos son designados de conformidad con lo establecido en el Artículo 747."},{"n":751,"p":["Si hay conformidad partes, se puede tomar para los inmuebles la valuación fiscal y para los títulos y acciones, la cotización del mercado de valores.","Si se trata de los bienes de la casa-habitación del causante, la valuación por peritos puede ser sustituida por declaración jurada de los interesados."],"t":"Otros valores","s":"Si hay conformidad partes, se puede tomar para los inmuebles la valuación fiscal y para los títulos y acciones, la cotización del mercado de valores."},{"n":752,"p":["Agregados al proceso el inventario y el avalúo, se los pone de manifiesto en la Secretaría por cinco (5) días. Las partes deben ser notificadas por cédula.","Vencido el plazo sin deducirse oposición, se deben aprobar ambas operaciones sin más trámite."],"t":"Impugnación al inventario o al avalúo","s":"Agregados al proceso el inventario y el avalúo, se los pone de manifiesto en la Secretaría por cinco (5) días. Las partes deben ser notificadas por cédula. Vencido el plazo sin deducirse oposición, se deben aprobar ambas operaciones sin más trámite."},{"n":753,"p":["Las reclamaciones de los herederos o de terceros sobre inclusión o exclusión de bienes en el inventario se sustancian por el trámite de los incidentes.","Si las reclamaciones versan sobre el avalúo, se debe convocar a audiencia a los interesados y al perito para que se expidan sobre la cuestión promovida, resolviendo el Juez lo que corresponde.","Si no comparece quien dedujo la oposición, se lo tiene por desistido, con costas. En caso de inasistencia del perito, éste pierde el derecho a cobrar honorarios por los trabajos practicados, cualquiera sea la resolución que se dicte respecto de las impugnaciones.","Si las observaciones formuladas requieren, por su naturaleza, sustanciación más amplia, la cuestión debe tramitar por juicio ordinario o por incidente. La resolución del Juez no es recurrible."],"t":"Reclamaciones","s":"Las reclamaciones de los herederos o de terceros sobre inclusión o exclusión de bienes en el inventario se sustancian por el trámite de los incidentes."},{"n":754,"p":["Una vez aprobadas las operaciones de inventario y avalúo, si todos los herederos capaces están de acuerdo, pueden formular la partición y presentarla al Juez para su aprobación.","Pueden igualmente solicitar que se inscriban la declaratoria de herederos o el testamento.","En ambos casos, previamente se paga el impuesto de justicia, gastos causídicos y honorarios, de conformidad con lo establecido en este Código y en las leyes impositivas y de aranceles.","No procede la inscripción si media oposición de acreedores o legatarios."],"t":"Partición privada","s":"Una vez aprobadas las operaciones de inventario y avalúo, si todos los herederos capaces están de acuerdo, pueden formular la partición y presentarla al Juez para su aprobación."},{"n":755,"p":["El partidor, que debe tener título de abogado, es nombrado en la forma dispuesta para el inventariador."],"t":"Partidor","s":"El partidor, que debe tener título de abogado, es nombrado en la forma dispuesta para el inventariador."},{"n":756,"p":["El partidor debe presentar la partición dentro del plazo que el Juez fija, bajo apercibimiento de remoción. El plazo puede ser prorrogado si media pedido fundado del partidor o de los herederos."],"t":"Plazo","s":"El partidor debe presentar la partición dentro del plazo que el Juez fija, bajo apercibimiento de remoción. El plazo puede ser prorrogado si media pedido fundado del partidor o de los herederos."},{"n":757,"p":["Para hacer las adjudicaciones, el perito, si las circunstancias lo requieren, debe oír a los interesados a fin de obrar de conformidad con ellos en todo lo que acuerden, o de conciliar, en lo posible, sus pretensiones.","Las omisiones en que incurren deben ser salvadas a su costa."],"t":"Desempeño del cargo","s":"Para hacer las adjudicaciones, el perito, si las circunstancias lo requieren, debe oír a los interesados a fin de obrar de conformidad con ellos en todo lo que acuerden, o de conciliar, en lo posible, sus pretensiones."},{"n":758,"p":["Antes de ordenarse la inscripción en el Registro de la Propiedad Inmueble de las hijuelas, declaratoria de herederos o testamento en su caso, debe solicitarse certificación acerca del estado jurídico, de los inmuebles según las constancias registrales y la de hallarse libre de deuda por impuestos, tasas y contribuciones por mejoras.","Si se trata de bienes situados en otra jurisdicción, en el exhorto u oficio se debe expresar que la inscripción queda supeditada al cumplimiento de las disposiciones establecidas en las leyes registrales."],"t":"Certificados","s":"Antes de ordenarse la inscripción en el Registro de la Propiedad Inmueble de las hijuelas, declaratoria de herederos o testamento en su caso, debe solicitarse certificación acerca del estado jurídico, de los inmuebles según las constancias registrales y la de "},{"n":759,"p":["Presentada la partición, el Juez la debe poner de manifiesto en la Secretaría por diez (10) días. Los interesados deben ser notificados por cédula.","Vencido el plazo sin que se formule oposición, el Juez, previa vista al Ministerio Pupilar, si corresponde, debe aprobar la cuenta particionaria, sin recurso, salvo que viole normas sobre división de la herencia o existan incapaces que puedan resultar perjudicados.","Sólo es apelable la resolución que rechaza la cuenta."],"t":"Presentación de la cuenta particionaria","s":"Presentada la partición, el Juez la debe poner de manifiesto en la Secretaría por diez (10) días. Los interesados deben ser notificados por cédula."},{"n":760,"p":["Si se deduce oposición el Juez debe citar a audiencia a las partes, al Ministerio Pupilar, en su caso, y al partidor, para procurar el arreglo de las diferencias. La audiencia tiene lugar cualquiera sea el número de interesados que asiste. Si quien impugnó la cuenta particionaria deja de concurrir, se lo tiene por desistido, con costas. En caso de inasistencia del perito, pierde su derecho a los honorarios.","Si los interesados no pueden ponerse de acuerdo, el Juez debe resolver dentro de los diez (10) días de celebrada la audiencia."],"t":"Trámite de la oposición","s":"Si se deduce oposición el Juez debe citar a audiencia a las partes, al Ministerio Pupilar, en su caso, y al partidor, para procurar el arreglo de las diferencias. La audiencia tiene lugar cualquiera sea el número de interesados que asiste."},{"n":761,"p":["Vencido el plazo establecido en el Artículo 727 o, en su caso, la ampliación que prevé el Artículo 728, si no se presentaron herederos o los presentados no acreditaron su calidad de tales, la sucesión se reputa vacante y se designa curador al representante de la autoridad encargada de recibir las herencias vacantes, quien desde ese momento es parte."],"t":"Reputación de vacancia. Curador","s":"Vencido el plazo establecido en el Artículo 727 o, en su caso, la ampliación que prevé el Artículo 728, si no se presentaron herederos o los presentados no acreditaron su calidad de tales, la sucesión se reputa vacante y se designa curador al representante de "},{"n":762,"p":["El inventario y el avalúo se practican por peritos designados a propuesta de la autoridad encargada de recibir las herencias vacantes; se realizan en la forma dispuesta en el Libro VI, Título I Capítulo V."],"t":"Inventario y avalúo","s":"El inventario y el avalúo se practican por peritos designados a propuesta de la autoridad encargada de recibir las herencias vacantes; se realizan en la forma dispuesta en el Libro VI, Título I Capítulo V."},{"n":763,"p":["Los derechos y obligaciones del curador, la liquidación de los bienes y la declaración de vacancia y sus efectos se rigen por el Código Civil y Comercial de la Nación, aplicándose supletoriamente las disposiciones sobre administración de la herencia contenida en el Capítulo IV."],"t":"Trámites posteriores","s":"Los derechos y obligaciones del curador, la liquidación de los bienes y la declaración de vacancia y sus efectos se rigen por el Código Civil y Comercial de la Nación, aplicándose supletoriamente las disposiciones sobre administración de la herencia contenida "},{"n":764,"p":["Toda cuestión entre partes, excepto las mencionadas en el Artículo 765, puede ser sometida a la decisión de jueces árbitros, antes o después de deducida en juicio y cualquiera sea el estado de éste.","La sujeción a juicio arbitral puede ser convenida en el contrato o en un acto posterior."],"t":"Objeto del juicio","s":"Toda cuestión entre partes, excepto las mencionadas en el Artículo 765, puede ser sometida a la decisión de jueces árbitros, antes o después de deducida en juicio y cualquiera sea el estado de éste."},{"n":765,"p":["No pueden comprometerse en árbitros, bajo pena de nulidad, las cuestiones que no pueden ser objeto de transacción."],"t":"Cuestiones excluidas","s":"No pueden comprometerse en árbitros, bajo pena de nulidad, las cuestiones que no pueden ser objeto de transacción."},{"n":766,"p":["Las personas que no pueden transigir no pueden comprometer en árbitros.","Cuando la ley exige autorización judicial para realizar actos de disposición, también aquélla es necesaria para celebrar el compromiso. Otorgada la autorización, no se requiere la aprobación judicial del laudo."],"t":"Capacidad","s":"Las personas que no pueden transigir no pueden comprometer en árbitros. Cuando la ley exige autorización judicial para realizar actos de disposición, también aquélla es necesaria para celebrar el compromiso."},{"n":767,"p":["El compromiso debe formalizarse por escritura pública o instrumento privado, o por acta extendida ante el Juez de la causa, o ante aquél a quien corresponde su conocimiento."],"t":"Forma del compromiso","s":"El compromiso debe formalizarse por escritura pública o instrumento privado, o por acta extendida ante el Juez de la causa, o ante aquél a quien corresponde su conocimiento."},{"n":768,"p":["El compromiso debe contener, bajo pena de nulidad:","1) fecha, nombre y domicilio de los otorgantes;","2) nombre y domicilio de los árbitros, excepto en el caso del Artículo 771;","3) las cuestiones que se someten al juicio arbitral, con expresión de sus circunstancias;","4) la estipulación de una multa que debe pagar, a la otra parte, la que deja de cumplir los actos indispensables para la realización del compromiso."],"t":"Contenido","s":"El compromiso debe contener, bajo pena de nulidad: 1) fecha, nombre y domicilio de los otorgantes; 2) nombre y domicilio de los árbitros, excepto en el caso del Artículo 771;"},{"n":769,"p":["Se puede convenir, asimismo, en el compromiso:","1) el procedimiento aplicable y el lugar en que los árbitros hayan de conocer y fallar. Si no se indica el lugar, es el de otorgamiento del compromiso;","2) el plazo en que los árbitros deben pronunciar el laudo;","3) la designación de un Secretario, sin perjuicio de lo dispuesto en el Artículo 777;","4) una multa que debe pagar la parte que recurra del laudo, a la que lo consienta, para poder ser oído, si no media la renuncia que se menciona en el inciso siguiente;","5) la renuncia del recurso de apelación y del de nulidad, salvo los casos determinados en el Artículo 788."],"t":"Cláusulas facultativas","s":"Se puede convenir, asimismo, en el compromiso: 1) el procedimiento aplicable y el lugar en que los árbitros hayan de conocer y fallar. Si no se indica el lugar, es el de otorgamiento del compromiso; 2) el plazo en que los árbitros deben pronunciar el laudo;"},{"n":770,"p":["Puede demandarse la constitución de tribunal arbitral, cuando una o más cuestiones deben ser decididas por árbitros.","Presentada la demanda con los requisitos del Artículo 332, en lo pertinente, ante el Juez que fue competente para conocer en la causa, se confiere traslado al demandado por diez (10) días y se designa audiencia para que las partes concurran a formalizar el compromiso.","Si existe resistencia infundada, el Juez d
