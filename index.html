btener el levantamiento del embargo dando garantía suficiente de responder al crédito del embargante por capital, intereses y costas en caso de que no pruebe que los bienes embargados le pertenecen."],"t":"Efectos sobre el principal de la tercería de dominio","s":"Si la tercería es de dominio, consentida o ejecutoriada la orden de venta de los bienes, se suspende el procedimiento principal, a menos que se trate de bienes sujetos a desvalorización o desaparición o que irroguen excesivos gastos de conservación, en cuyo ca"},{"n":100,"p":["Si la tercería es de mejor derecho, previa citación del tercerista, el Juez puede disponer la venta de los bienes, suspendiendo el pago hasta que se decida sobre la preferencia, salvo si se otorga fianza para responder a las resultas de la tercería.","El tercerista es parte de las actuaciones relativas al remate de los bienes."],"t":"Efectos sobre el principal de la tercería de mejor derecho","s":"Si la tercería es de mejor derecho, previa citación del tercerista, el Juez puede disponer la venta de los bienes, suspendiendo el pago hasta que se decida sobre la preferencia, salvo si se otorga fianza para responder a las resultas de la tercería."},{"n":101,"p":["Allanamiento. La demanda por tercería debe deducirse contra las partes del proceso principal y se sustancia por el trámite del juicio ordinario o incidente, según lo determina el Juez atendiendo a las circunstancias.","El allanamiento y los actos de admisión realizados por el embargado no pueden ser invocados en perjuicio del embargante."],"t":"Demanda. Sustanciación","s":"Allanamiento. La demanda por tercería debe deducirse contra las partes del proceso principal y se sustancia por el trámite del juicio ordinario o incidente, según lo determina el Juez atendiendo a las circunstancias."},{"n":102,"p":["Deducida la tercería, el embargante puede pedir que se amplíe o mejore el embargo, o que se adopten otras medidas precautorias necesarias."],"t":"Ampliación o mejora del embargo","s":"Deducida la tercería, el embargante puede pedir que se amplíe o mejore el embargo, o que se adopten otras medidas precautorias necesarias."},{"n":103,"p":["Cuando resulta probada la connivencia del tercerista con el embargado, el Juez debe ordenar, sin más trámite, la remisión de los antecedentes a la justicia penal e imponer al tercerista, al embargado o a los profesionales que los representan o patrocinan, o a todos ellos, las sanciones disciplinarias que correspondan. Asimismo puede disponer la detención del tercerista y del embargado hasta el momento en que comienza a actuar el Juez en lo penal."],"t":"Connivencia entre tercerista y embargado","s":"Cuando resulta probada la connivencia del tercerista con el embargado, el Juez debe ordenar, sin más trámite, la remisión de los antecedentes a la justicia penal e imponer al tercerista, al embargado o a los profesionales que los representan o patrocinan, o a "},{"n":104,"p":["El tercero perjudicado por un embargo puede pedir su levantamiento sin promover tercería, acompañando el título de dominio u ofreciendo sumaria información sobre su posesión, según la naturaleza de los bienes.","Del pedido se debe dar traslado al embargante.","La resolución es recurrible cuando hace lugar al desembargo. Si lo deniega, el interesado puede deducir directamente la tercería, cumpliendo los requisitos exigidos por el Artículo 98."],"t":"Levantamiento del embargo sin tercería","s":"El tercero perjudicado por un embargo puede pedir su levantamiento sin promover tercería, acompañando el título de dominio u ofreciendo sumaria información sobre su posesión, según la naturaleza de los bienes. Del pedido se debe dar traslado al embargante."},{"n":105,"p":["Tanto el actor como el demandado pueden pedir la citación de evicción; el primero, al deducir la demanda; el segundo, dentro del plazo fijado para la contestación de la demanda.","La resolución se debe dictar sin sustanciación previa. Sólo se debe hacer lugar a la citación si es manifiestamente procedente.","La denegatoria es recurrible en efecto devolutivo."],"t":"Oportunidad","s":"Tanto el actor como el demandado pueden pedir la citación de evicción; el primero, al deducir la demanda; el segundo, dentro del plazo fijado para la contestación de la demanda. La resolución se debe dictar sin sustanciación previa."},{"n":106,"p":["El citado debe ser notificado en la misma forma y plazo establecidos para el demandado. No puede invocar la improcedencia de la citación, y debe limitarse a asumir o no la defensa. Si no la ejerce, su responsabilidad se debe establecer en el juicio que corresponda."],"t":"Notificación","s":"El citado debe ser notificado en la misma forma y plazo establecidos para el demandado. No puede invocar la improcedencia de la citación, y debe limitarse a asumir o no la defensa."},{"n":107,"p":["La citación solicitada oportunamente suspende el curso del proceso durante el plazo que el Juez fija. Es carga del citante activar las diligencias necesarias para el conocimiento del citado."],"t":"Efectos","s":"La citación solicitada oportunamente suspende el curso del proceso durante el plazo que el Juez fija. Es carga del citante activar las diligencias necesarias para el conocimiento del citado."},{"n":108,"p":["Si el citado no comparece o habiendo comparecido se resiste a asumir la defensa, el juicio prosigue con quien pidió la citación, salvo los derechos de éste contra aquél.","Durante la sustanciación del juicio, las dos (2) partes pueden proseguir las diligencias para obtener la comparecencia del citado. Si éste se presenta, toma la causa en el estado en que se encuentra."],"t":"Abstención y tardanza del citado","s":"Si el citado no comparece o habiendo comparecido se resiste a asumir la defensa, el juicio prosigue con quien pidió la citación, salvo los derechos de éste contra aquél."},{"n":109,"p":["Si el citado asume la defensa puede obrar conjunta o separadamente con la parte que solicita la citación, en el carácter de litisconsorte."],"t":"Defensa por el citado","s":"Si el citado asume la defensa puede obrar conjunta o separadamente con la parte que solicita la citación, en el carácter de litisconsorte."},{"n":110,"p":["Si el citado pretende, a su vez, citar a su causante, puede hacerlo en los primeros cinco (5) días de haber sido notificado, sin perjuicio de la carga de proseguir el proceso por sí. En las mismas condiciones, cada uno de los causantes puede requerir la citación de su respectivo antecesor.","Es admisible el pedido de citación simultánea de dos (2) o más causantes.","Es ineficaz la citación que se hace sin la antelación necesaria para que el citado pueda comparecer antes de la sentencia de primera instancia."],"t":"Citación de otros causantes","s":"Si el citado pretende, a su vez, citar a su causante, puede hacerlo en los primeros cinco (5) días de haber sido notificado, sin perjuicio de la carga de proseguir el proceso por sí."},{"n":111,"p":["El ejercicio de la acción subrogatoria que prevén los Artículos 739, 740, 741 y 742 del Código Civil y Comercial de la Nación, no requiere autorización judicial previa y se ajusta al trámite que prescriben los artículos siguientes."],"t":"Procedencia","s":"El ejercicio de la acción subrogatoria que prevén los Artículos 739, 740, 741 y 742 del Código Civil y Comercial de la Nación, no requiere autorización judicial previa y se ajusta al trámite que prescriben los artículos siguientes."},{"n":112,"p":["Antes de conferirse traslado al demandado, se debe citar al deudor por el plazo de diez (10) días, durante el cual éste puede:","1) formular oposición, fundada en que ya interpuso la demanda o en la manifiesta improcedencia de la subrogación;","2) interponer la demanda, en cuyo caso se lo debe considerar como actor y el juicio prosigue con el demandado.","En este último supuesto, así como cuando el deudor hubiese ejercido la acción con anterioridad, el acreedor puede intervenir en el proceso en la calidad prescripta por el primer apartado del Artículo 91."],"t":"Citación","s":"Antes de conferirse traslado al demandado, se debe citar al deudor por el plazo de diez (10) días, durante el cual éste puede: 1) formular oposición, fundada en que ya interpuso la demanda o en la manifiesta improcedencia de la subrogación;"},{"n":113,"p":["Aunque el deudor al ser citado no ejerza ninguno de los derechos acordados en el Artículo 112, puede intervenir en el proceso en la calidad prescripta por el segundo apartado del Artículo 91.","En todos los casos, el deudor puede ser llamado a reconocer documentos."],"t":"Intervención del deudor","s":"Aunque el deudor al ser citado no ejerza ninguno de los derechos acordados en el Artículo 112, puede intervenir en el proceso en la calidad prescripta por el segundo apartado del Artículo 91."},{"n":114,"p":["La sentencia hace cosa juzgada en favor o en contra del deudor citado, haya o no comparecido."],"t":"Efectos de la sentencia","s":"La sentencia hace cosa juzgada en favor o en contra del deudor citado, haya o no comparecido."},{"n":115,"p":["En todos los actos del proceso se debe utilizar el idioma nacional. Cuando éste no es conocido por la persona que debe prestar declaración, el Juez o Tribunal debe designar, por sorteo, un traductor público, salvo cuando el Juez o el Secretario poseen conocimientos del idioma del declarante que les permite entender y darse a entender claramente, pudiendo oficiar éstos de traductor con acuerdo de partes. Se nombra intérprete cuando debe interrogarse a sordos, mudos o sordomudos que sólo pueden darse a entender por lenguaje especializado, salvo cuando el Juez o el Secretario poseen conocimientos en la Lengua de Señas Argentina, en técnica labial u otro lenguaje especializado que les permite entender y darse a entender claramente, pudiendo oficiar éstos de traductor con acuerdo de partes."],"t":"Idioma. Designación de intérprete","s":"En todos los actos del proceso se debe utilizar el idioma nacional."},{"n":116,"p":["Cuando para dictar resolución se requiere informe o certificado previo del Secretario, el Juez debe ordenarlos verbalmente."],"t":"Informe o certificado previo","s":"Cuando para dictar resolución se requiere informe o certificado previo del Secretario, el Juez debe ordenarlos verbalmente."},{"n":117,"p":["Puede solicitarse la reiteración de oficios o exhortos, desglose de poderes o documentos, agregación de pruebas, entrega de edictos, y, en general, que se dicten providencias de mero trámite, mediante simple anotación en el expediente, firmada por el solicitante."],"t":"Anotación de peticiones","s":"Puede solicitarse la reiteración de oficios o exhortos, desglose de poderes o documentos, agregación de pruebas, entrega de edictos, y, en general, que se dicten providencias de mero trámite, mediante simple anotación en el expediente, firmada por el solicitan"},{"n":118,"p":["Para la redacción de los escritos rigen las normas del Reglamento para el Poder Judicial."],"t":"Redacción","s":"Para la redacción de los escritos rigen las normas del Reglamento para el Poder Judicial."},{"n":119,"p":["Se acepta el uso de la firma digital en los escritos presentados por vía electrónica en los términos que fija el Superior Tribunal de Justicia de conformidad a la Ley II – N.˚ 20 (Antes Ley 4449)."],"t":"Firma digital","s":"Se acepta el uso de la firma digital en los escritos presentados por vía electrónica en los términos que fija el Superior Tribunal de Justicia de conformidad a la Ley II – N.˚ 20 (Antes Ley 4449)."},{"n":120,"p":["Cuando un escrito o diligencia es firmado a ruego del interesado, el Secretario o el Oficial Primero debe certificar que el firmante, cuyo nombre deben expresar, fue autorizado para ello en su presencia o que la autorización fue ratificada ante él."],"t":"Escrito firmado a ruego","s":"Cuando un escrito o diligencia es firmado a ruego del interesado, el Secretario o el Oficial Primero debe certificar que el firmante, cuyo nombre deben expresar, fue autorizado para ello en su presencia o que la autorización fue ratificada ante él."},{"n":121,"p":["De todo escrito del que debe darse traslado y de sus contestaciones, de los que tienen por objeto ofrecer prueba, promover incidentes o constituir nuevo domicilio y de los documentos con ellos agregados, deben acompañarse tantas copias firmadas como partes intervienen, salvo que hayan unificado la representación.","Se tiene por no presentado el escrito o el documento, según el caso, y se debe devolver al presentante, sin más trámite ni recurso, salvo la petición ante el Juez que autoriza el Artículo 38, último párrafo, si dentro de los cinco (5) días siguientes a los de la notificación, por ministerio de la ley, de la providencia que exige el cumplimiento del requisito establecido en el párrafo anterior, no es suplida la omisión.","Las copias pueden ser firmadas, indistintamente, por las partes, sus apoderados o letrados que intervienen en el juicio. Deben glosarse al expediente, salvo que por su volumen, formato u otras características resulte dificultoso o inconveniente, en cuyo caso se conservan ordenadamente en la Secretaría. Sólo deben ser entregadas a la parte interesada, su apoderado o letrado que interviene en el juicio, con nota de recibo.","Cuando deben agregarse a cédulas, oficios o exhortos, las copias se deben desglosar dejando constancia de esa circunstancia.","La reglamentación de superintendencia debe establecer los plazos durante los cuales deben conservarse las copias glosadas al expediente o reservadas en la Secretaría.","Se puede establecer la exigencia de presentación y entrega de copias por vía electrónica firmadas digitalmente, lo que debe ser reglamentado por el Superior Tribunal de Justicia de la Provincia."],"t":"Copias","s":"De todo escrito del que debe darse traslado y de sus contestaciones, de los que tienen por objeto ofrecer prueba, promover incidentes o constituir nuevo domicilio y de los documentos con ellos agregados, deben acompañarse tantas copias firmadas como partes int"},{"n":122,"p":["No es obligatorio acompañar la copia de documentos cuya reproducción es dificultosa por su número, extensión, o cualquier otra razón atendible, siempre que así lo resuelva el Juez, a pedido formulado en el mismo escrito. En tal caso el Juez debe arbitrar las medidas necesarias para obviar a la otra u otras partes los inconvenientes derivados de la falta de copias.","Cuando con una cuenta se acompañan libros, recibos o comprobantes, basta que éstos se presenten numerados y se depositen en la Secretaría para que la parte o partes interesadas puedan consultarlos."],"t":"Copia de documentos de reproducción dificultosa","s":"No es obligatorio acompañar la copia de documentos cuya reproducción es dificultosa por su número, extensión, o cualquier otra razón atendible, siempre que así lo resuelva el Juez, a pedido formulado en el mismo escrito."},{"n":123,"p":["En el caso de acompañarse expedientes administrativos, debe ordenarse su agregación sin el requisito exigido en el Artículo 121."],"t":"Expedientes administrativos","s":"En el caso de acompañarse expedientes administrativos, debe ordenarse su agregación sin el requisito exigido en el Artículo 121."},{"n":124,"p":["Cuando se presentan documentos en idioma extranjero, debe acompañarse su traducción realizada por traductor público matriculado."],"t":"Documentos en idioma extranjero","s":"Cuando se presentan documentos en idioma extranjero, debe acompañarse su traducción realizada por traductor público matriculado."},{"n":125,"p":["El cargo puesto al pie de los escritos es autorizado por el Oficial Primero.","Si el Superior Tribunal de Justicia o las Cámaras disponen que la fecha y hora de presentación de los escritos se registre con fechador mecánico, el cargo queda integrado con la firma del Oficial Primero, a continuación de la constancia del fechador.","El escrito no presentado dentro del horario judicial del día en que vence un plazo, solo puede ser entregado válidamente en la Secretaría que corresponda, el día hábil inmediato y dentro de las dos (2) primeras horas del despacho."],"t":"Cargo","s":"El cargo puesto al pie de los escritos es autorizado por el Oficial Primero."},{"n":126,"p":["Las audiencias, salvo disposición expresa en contrario, se ajustan a las siguientes reglas:","1) son públicas, a menos que los jueces o tribunales, atendiendo a las circunstancias del caso dispongan lo contrario mediante resolución fundada;","2) son señaladas con anticipación no menor de tres (3) días, salvo por razones especiales que exijan mayor brevedad, lo que debe expresarse en la resolución. En este último caso, si la presencia del Juez o Tribunal no está impuesta bajo sanción de nulidad, puede ser requerida el día de la audiencia;","3) las convocatorias se consideran hechas bajo apercibimiento de celebrarse con cualquiera de las partes que concurren;","4) empiezan a la hora designada. Los citados solo tienen obligación de esperar treinta (30) minutos, transcurridos los cuales pueden retirarse dejando constancia en el libro de asistencia;","5) el Secretario debe levantar acta haciendo una relación abreviada de lo ocurrido y de lo expresado por las partes.","El acta debe ser firmada por el Secretario y las partes, salvo cuando alguna de ellas no quiera o no pueda firmar; en este caso, debe consignarse esa circunstancia.","El Juez debe firmar el acta cuando preside la audiencia."],"t":"Reglas generales","s":"Las audiencias, salvo disposición expresa en contrario, se ajustan a las siguientes reglas: 1) son públicas, a menos que los jueces o tribunales, atendiendo a las circunstancias del caso dispongan lo contrario mediante resolución fundada;"},{"n":127,"p":["A pedido de parte, a su costa y sin recurso alguno, puede ordenarse que se tome versión taquigráfica de lo ocurrido o que se lo registre por cualquier otro medio técnico, siempre que se solicite con anticipación suficiente. El Juez debe nombrar de oficio a los taquígrafos, o adoptar las medidas necesarias para asegurar la autenticidad del registro y su documentación. Las partes pueden pedir copia del acta."],"t":"Versión taquigráfica e impresión fonográfica","s":"A pedido de parte, a su costa y sin recurso alguno, puede ordenarse que se tome versión taquigráfica de lo ocurrido o que se lo registre por cualquier otro medio técnico, siempre que se solicite con anticipación suficiente."},{"n":128,"p":["Los expedientes únicamente pueden ser retirados de la Secretaría, bajo la responsabilidad de los abogados, apoderados, peritos o escribanos, en los casos siguientes:","1) para alegar de bien probado;","2) para practicar liquidaciones y pericias; partición de bienes sucesorios; operaciones de contabilidad; mensura y deslinde; división de bienes comunes; cotejo de documentos y redacción de escrituras públicas;","3) cuando el Juez lo dispone por resolución fundada.","En los casos previstos en los dos últimos incisos, el Juez debe fijar el plazo dentro del cual deben ser devueltos.","Pueden también retirar los expedientes para presentar memoriales y expresar o contestar agravios, quienes en los juicios actúen en representación del Estado."],"t":"Préstamo","s":"Los expedientes únicamente pueden ser retirados de la Secretaría, bajo la responsabilidad de los abogados, apoderados, peritos o escribanos, en los casos siguientes: 1) para alegar de bien probado;"},{"n":129,"p":["Si vencido el plazo no se devuelve el expediente, quien lo retiró es pasible de una multa que se fija en una suma que no puede exceder el valor de un salario mínimo, vital y móvil por cada día de retardo, salvo que manifieste haberlo perdido, en cuyo caso además se le debe aplicar lo dispuesto en el Artículo 131, si corresponde.","El Secretario debe intimar su inmediata devolución a quien lo retiene, y si ésta no se cumple, el Juez debe mandar a secuestrar el expediente con el auxilio de la fuerza pública sin perjuicio de remitir los antecedentes a la justicia penal."],"t":"Devolución","s":"Si vencido el plazo no se devuelve el expediente, quien lo retiró es pasible de una multa que se fija en una suma que no puede exceder el valor de un salario mínimo, vital y móvil por cada día de retardo, salvo que manifieste haberlo perdido, en cuyo caso adem"},{"n":130,"p":["Comprobada la pérdida de un expediente, el Juez debe ordenar su reconstrucción, la que se efectúa en la siguiente forma:","1) el nuevo expediente se debe iniciar con la providencia que disponga la reconstrucción;","2) el Juez debe intimar a la parte actora, o iniciadora de las actuaciones, en su caso, para que dentro del plazo de cinco (5) días presente las copias de los escritos, documentos y diligencias que se encuentran en su poder y corresponden a actuaciones cumplidas en el expediente perdido. De ellas se da traslado a la otra u otras partes, por el mismo plazo, a fin de que se expidan acerca de su autenticidad y presenten, a su vez, las que tienen en su poder. En este último supuesto también se da traslado a las demás partes por igual plazo;","3) el Secretario debe agregar copia de todas las resoluciones correspondientes al expediente extraviado que obran en los libros del Juzgado o Tribunal y recabar copias de los actos y diligencias que pueden obtenerse de las oficinas o archivos públicos;","4) las copias que se presentan u obtienen deben ser agregadas al expediente por orden cronológico;","5) el Juez puede ordenar, sin sustanciación ni recurso alguno, las medidas que considera necesarias. Cumplidos los trámites enunciados debe dictar resolución teniendo por reconstruido el expediente."],"t":"Procedimiento de reconstrucción","s":"Comprobada la pérdida de un expediente, el Juez debe ordenar su reconstrucción, la que se efectúa en la siguiente forma: 1) el nuevo expediente se debe iniciar con la providencia que disponga la reconstrucción;"},{"n":131,"p":["Si se comprueba que la pérdida del expediente es imputable a alguna de las partes o a un profesional, éstos son pasibles de una multa de hasta siete (7) veces el valor de un salario mínimo, vital y móvil, sin perjuicio de su responsabilidad civil o penal con comunicación a la asociación profesional que los nuclea."],"t":"Sanciones","s":"Si se comprueba que la pérdida del expediente es imputable a alguna de las partes o a un profesional, éstos son pasibles de una multa de hasta siete (7) veces el valor de un salario mínimo, vital y móvil, sin perjuicio de su responsabilidad civil o penal con c"},{"n":132,"p":["Toda comunicación dirigida a jueces provinciales por otros del mismo carácter, se hace mediante oficio. Las dirigidas a jueces de otra jurisdicción, por exhorto, salvo lo que establezcan los convenios sobre comunicaciones entre magistrados.","Pueden entregarse al interesado, bajo recibo en el expediente, o remitirse por correo. En los casos urgentes, pueden expedirse o anticiparse telegráficamente.","Se debe dejar copia fiel en el expediente de todo exhorto u oficio que se libra."],"t":"Oficios y exhortos dirigidos a Jueces de la República","s":"Toda comunicación dirigida a jueces provinciales por otros del mismo carácter, se hace mediante oficio. Las dirigidas a jueces de otra jurisdicción, por exhorto, salvo lo que establezcan los convenios sobre comunicaciones entre magistrados."},{"n":133,"p":["Las comunicaciones dirigidas a autoridades judiciales extranjeras se deben hacer mediante exhorto.","Se da cumplimiento a las medidas solicitadas por autoridades judiciales extranjeras, cuando de la comunicación que así lo requiere resulta que son dispuestas por tribunales competentes según las reglas argentinas de jurisdicción internacional y siempre que la resolución que las ordene no afecte principios de orden público del derecho argentino. En su caso, se deben aplicar los demás recaudos establecidos en los tratados y acuerdos internacionales, así como la reglamentación de superintendencia."],"t":"Comunicaciones a autoridades judiciales extranjeras o provenientes de éstas","s":"Las comunicaciones dirigidas a autoridades judiciales extranjeras se deben hacer mediante exhorto."},{"n":134,"p":["Salvo los casos en que procede la notificación por cédula y sin perjuicio de lo dispuesto en el Artículo 135, las resoluciones judiciales quedan notificadas en todas las instancias, los días martes y viernes, o el siguiente hábil, si alguno de ellos es feriado.","No se considera cumplida la notificación si el expediente no se encuentra en Secretaría y se hace constar esta circunstancia en el libro de asistencia, que debe llevarse a ese efecto.","Incurre en falta grave el Oficial Primero que no mantiene a disposición de los litigantes o profesionales el libro mencionado.","La notificación por cédula es bajo responsabilidad del profesional interviniente."],"t":"Principio general","s":"Salvo los casos en que procede la notificación por cédula y sin perjuicio de lo dispuesto en el Artículo 135, las resoluciones judiciales quedan notificadas en todas las instancias, los días martes y viernes, o el siguiente hábil, si alguno de ellos es feriado"},{"n":135,"p":["El retiro del expediente, de conformidad con lo establecido en el Artículo 128, importa la notificación de todas las resoluciones.","El retiro de las copias de escritos por la parte, o su apoderado, o su letrado, implica notificación personal del traslado, que respecto del contenido de aquéllos se confiere."],"t":"Notificación tácita","s":"El retiro del expediente, de conformidad con lo establecido en el Artículo 128, importa la notificación de todas las resoluciones."},{"n":136,"p":["Sólo son notificadas personalmente o por cédula las siguientes resoluciones:","1) la que dispone el traslado de la demanda, de la reconvención y de los documentos que se acompañan con sus contestaciones y del ofrecimiento de pruebas que en estas se formulan;","2) la que dispone correr traslado de las excepciones;","3) la que declara la cuestión de puro derecho y la que ordena la apertura a prueba;","4) las que se dictan entre el llamamiento para la sentencia y ésta;","5) las que ordenan intimaciones, o apercibimientos no establecidos directamente por la ley, o la reanudación de plazos suspendidos por tiempo indeterminado, aplican correcciones disciplinarias o hacen saber medidas precautorias o su modificación o levantamiento;","6) la providencia que hace saber la devolución del expediente, cuando no hubo notificación de la resolución de alzada o cuando tiene por objeto reanudar plazos suspendidos por tiempo indeterminado;","7) la primera providencia que se dicta después que un expediente vuelva del archivo de los tribunales, o esté paralizado o fuera de Secretaría más de tres (3) meses;","8) las que disponen traslado de liquidaciones;","9) la que ordena el traslado del pedido de levantamiento de embargo sin tercería;","10) la que dispone la citación de personas extrañas al proceso;","11) las que se dictan como consecuencia de un acto procesal realizado antes de la oportunidad que la ley señala para su cumplimiento;","12) las sentencias definitivas y las interlocutorias con fuerza de tales, con excepción de las que resuelven caducidad de la prueba por negligencia;","13) la providencia que deniega el recurso extraordinario;","14) la providencia que hace saber el Juez o Tribunal que va a conocer en caso de recusación, excusación o admisión de la excepción de incompetencia;","15) la que dispone el traslado del pedido de caducidad de la instancia;","16) la que dispone el traslado de la prescripción, en los supuestos del Artículo 347, párrafos 2 y 3;","17) las que disponen el traslado de las expresiones de agravios en los recursos de reposición y apelación, que no son deducidos en audiencia;","18) la que fija la audiencia preliminar;","19) las demás resoluciones de que se haga mención expresa en la ley o cuando excepcionalmente el Juez lo disponga por resolución fundada.","No se notifican por cédula las regulaciones de honorarios que están incluidas o son consecuencia de resoluciones no mencionadas en el presente artículo.","Los funcionarios judiciales quedan notificados el día de la recepción del expediente en su despacho. Deben devolverlo dentro del tercer día, bajo apercibimiento de las medidas disciplinarias a que haya lugar.","Exceptúase de las disposiciones contenidas en el párrafo precedente al Procurador General del Superior Tribunal de Justicia y a los Fiscales de Cámara, quienes son notificados personalmente en su despacho."],"t":"Notificación personal o por cédula","s":"Sólo son notificadas personalmente o por cédula las siguientes resoluciones: 1) la que dispone el traslado de la demanda, de la reconvención y de los documentos que se acompañan con sus contestaciones y del ofrecimiento de pruebas que en estas se formulan;"},{"n":137,"p":["En los casos en que este Código u otras leyes establecen la notificación por cédula, la misma puede ser realizada por medio de acta notarial; cuando la cédula debe notificarse en el domicilio procesal, también puede realizarse por medios electrónicos, a través de documentos firmados digitalmente, de acuerdo a como lo determina la reglamentación del Superior Tribunal de Justicia de la Provincia."],"t":"Medios de notificación","s":"En los casos en que este Código u otras leyes establecen la notificación por cédula, la misma puede ser realizada por medio de acta notarial; cuando la cédula debe notificarse en el domicilio procesal, también puede realizarse por medios electrónicos, a través"},{"n":138,"p":["Las notificaciones por cédula previstas en el Artículo 136, que deben practicarse en el domicilio procesal, pueden ser realizadas por medios digitales o informáticos en el domicilio electrónico constituido en los términos del Artículo 40, a través de documentos firmados digitalmente en función a lo que determina y reglamenta el Superior Tribunal de Justicia, de conformidad a las facultades que le son conferidas por el Artículo 24 de la Ley IV – N.° 55."],"t":"Notificación por medios digitales. Domicilio Electrónico Constituido","s":"Las notificaciones por cédula previstas en el Artículo 136, que deben practicarse en el domicilio procesal, pueden ser realizadas por medios digitales o informáticos en el domicilio electrónico constituido en los términos del Artículo 40, a través de documento"},{"n":139,"p":["La cédula de notificación debe contener:","1) nombre y apellido de la persona a notificar o designación que corresponda y su domicilio, con indicación del carácter de éste;","2) juicio en que se practica;","3) Juzgado, su domicilio y Secretaría en que tramita el juicio;","4) transcripción de la parte pertinente de la resolución;","5) objeto, claramente expresado, si no resulta de la resolución transcripta;","6) en aquellas circunscripciones en que se implementa el sistema de notificación por casilleros, la cédula debe contener además, el número de casillero al cual se dirige la notificación.","En el caso de acompañarse copias de escritos o documentos, la cédula debe contener detalle preciso de aquellas."],"t":"Contenido de la cédula","s":"La cédula de notificación debe contener: 1) nombre y apellido de la persona a notificar o designación que corresponda y su domicilio, con indicación del carácter de éste; 2) juicio en que se practica;"},{"n":140,"p":["La cédula debe ser suscripta por el letrado de la parte que tiene interés en la notificación, o por el síndico, tutor o curador ad lítem o auxiliares de justicia en su caso, quienes deben aclarar su firma con el sello correspondiente, sin necesidad de confronte judicial.","La cédula que se diligencie conteniendo errores formales o materiales, que haya afectado derechos o impedido defensas, trae aparejada la nulidad de la notificación y las sanciones por inconducta procesal encuadrándose la misma en los términos del Artículo 45, conducta que debe ser notificada a la asociación profesional que los nuclea."],"t":"Firma de la cédula","s":"La cédula debe ser suscripta por el letrado de la parte que tiene interés en la notificación, o por el síndico, tutor o curador ad lítem o auxiliares de justicia en su caso, quienes deben aclarar su firma con el sello correspondiente, sin necesidad de confront"},{"n":141,"p":["El letrado de la parte que tiene interés en la notificación, el síndico, tutor o curador ad litem o auxiliares de justicia, en su caso, deben entregar la cédula en forma directa en la oficina de notificaciones para su diligenciamiento quien debe devolver una copia sellada para su acreditación en autos, y diligenciar y devolver la cédula en la forma y en los plazos que dispone la reglamentación de superintendencia.","La presentación de la cédula en la oficina de notificaciones y mandamientos importa la notificación de la parte que la presentó.","Los defectos y/o errores que contienen las cédulas no facultan al Oficial de Justicia para su devolución sin diligenciar y deben ser evaluados por el Juzgado o Tribunal.","La demora en la agregación de las cédulas se considera falta grave del Oficial Primero."],"t":"Diligenciamiento","s":"El letrado de la parte que tiene interés en la notificación, el síndico, tutor o curador ad litem o auxiliares de justicia, en su caso, deben entregar la cédula en forma directa en la oficina de notificaciones para su diligenciamiento quien debe devolver una c"},{"n":142,"p":["Si la notificación se hace por cédula, el funcionario o empleado encargado de practicarla debe dejar al interesado copia de la cédula y hacer constar, con su firma, el día y la hora de la entrega.","El original se agrega al expediente con nota de lo actuado, lugar, día y hora de la diligencia, suscripta por el notificador y el interesado, salvo que éste se niegue o no pueda firmar, de lo cual se debe dejar constancia."],"t":"Entrega de la cédula al interesado","s":"Si la notificación se hace por cédula, el funcionario o empleado encargado de practicarla debe dejar al interesado copia de la cédula y hacer constar, con su firma, el día y la hora de la entrega."},{"n":143,"p":["Cuando el notificador no encuentra a la persona a quien va a notificar, debe entregar la cédula a otra persona de la casa, departamento u oficina, o al encargado del edificio, y proceder en la forma dispuesta en el Artículo 142. Si no puede entregarla, la debe fijar en la puerta de acceso correspondiente a esos lugares."],"t":"Entrega de la cédula a personas distintas","s":"Cuando el notificador no encuentra a la persona a quien va a notificar, debe entregar la cédula a otra persona de la casa, departamento u oficina, o al encargado del edificio, y proceder en la forma dispuesta en el Artículo 142."},{"n":144,"p":["La notificación personal se practica firmando el interesado en el expediente, al pie de la diligencia extendida por el Oficial Primero.","En oportunidad de examinar el expediente, el litigante que actúa sin representación o el profesional que interviene en el proceso como apoderado, están obligados a notificarse expresamente de las resoluciones mencionadas en el Artículo 136.","Si no lo hacen, previo requerimiento que les formula el Oficial Primero, o si el interesado no sabe o no puede firmar, vale como notificación la atestación acerca de tales circunstancias y la firma de dicho empleado y la del Secretario.","La notificación personal de una resolución implica la notificación de todas las resoluciones o providencias previas que se deben notificar personalmente o por cédula."],"t":"Forma de la notificación personal","s":"La notificación personal se practica firmando el interesado en el expediente, al pie de la diligencia extendida por el Oficial Primero."},{"n":145,"p":["Salvo el traslado de la demanda o de la reconvención y la sentencia, todas las demás resoluciones, a solicitud de parte, pueden ser notificadas por telegrama colacionado o recomendado, o por carta documentada.","Los gastos que demanda la notificación por estos medios quedan incluidos en la condena en costas."],"t":"Notificación por telegrama o carta documentada","s":"Salvo el traslado de la demanda o de la reconvención y la sentencia, todas las demás resoluciones, a solicitud de parte, pueden ser notificadas por telegrama colacionado o recomendado, o por carta documentada."},{"n":146,"p":["La notificación que se practica conforme al Artículo 145, debe contener las enunciaciones de la cédula, y debe realizarse sin confronte judicial, bajo las formas y responsabilidades determinadas en el Artículo 140.","La fecha de notificación es la de la constancia de la entrega al destinatario del telegrama o carta documentada.","El Superior Tribunal de Justicia puede disponer la adopción de textos uniformes para la redacción de estos medios de notificación."],"t":"Régimen de la notificación por telegrama o carta documentada","s":"La notificación que se practica conforme al Artículo 145, debe contener las enunciaciones de la cédula, y debe realizarse sin confronte judicial, bajo las formas y responsabilidades determinadas en el Artículo 140."},{"n":147,"p":["Además de los casos determinados por este Código, procede la notificación por edictos cuando se trata de personas inciertas o cuyo domicilio se ignora. En este último caso, la parte debe manifestar bajo juramento que realizó sin éxito las gestiones tendientes a conocer el domicilio de la persona a quien debe notificar.","Si resulta falsa la afirmación de la parte que dijo ignorar el domicilio, o que pudo conocerlo empleando la debida diligencia, se anula a su costa todo lo actuado con posterioridad y es condenada a pagar una multa equivalente a dos (2) salarios mínimos, vitales y móviles la que es destinada al Fondo de Justicia."],"t":"Notificación por edictos","s":"Además de los casos determinados por este Código, procede la notificación por edictos cuando se trata de personas inciertas o cuyo domicilio se ignora."},{"n":148,"p":["La publicación de los edictos se hace en el Boletín Oficial y en un diario de los de mayor circulación del lugar del último domicilio del citado, si es conocido o, en su defecto, del lugar del juicio, y se acredita mediante la agregación al expediente de un ejemplar de aquéllos y del recibo del pago efectuado. A falta de diarios en los lugares precedentemente mencionados, la publicación se debe hacer en la localidad más próxima que los tenga, y el edicto se fija, además, en la tablilla del Juzgado y en los sitios que aseguran su mayor difusión.","Salvo en el proceso sucesorio, cuando los gastos que demanda la publicación son desproporcionados con la cuantía del juicio, se prescinde de los edictos; la notificación se practica en la tablilla del Juzgado."],"t":"Publicación de los edictos","s":"La publicación de los edictos se hace en el Boletín Oficial y en un diario de los de mayor circulación del lugar del último domicilio del citado, si es conocido o, en su defecto, del lugar del juicio, y se acredita mediante la agregación al expediente de un ej"},{"n":149,"p":["Los edictos deben contener, en forma sintética, las mismas enunciaciones de las cédulas, con transcripción sumaria de la resolución.","El número de publicaciones es el que en cada caso determina este Código.","La resolución se tiene por notificada al día siguiente de la última publicación.","El Superior Tribunal de Justicia puede disponer la adopción de textos uniformes para la redacción de los edictos.","El Poder Ejecutivo puede establecer que, en el Boletín Oficial, los edictos a los que corresponda un mismo texto se publiquen en extracto, agrupados por juzgados y secretarías, encabezados por una fórmula común."],"t":"Formas de los edictos","s":"Los edictos deben contener, en forma sintética, las mismas enunciaciones de las cédulas, con transcripción sumaria de la resolución. El número de publicaciones es el que en cada caso determina este Código."},{"n":150,"p":["En todos los casos en que este Código autoriza la publicación de edictos, a pedido del interesado, el Juez puede ordenar que aquellos se anuncien por radiodifusión.","Las transmisiones se hacen por una emisora oficial y por las que determina la reglamentación de superintendencia y su número coincide con el de las publicaciones que este Código prevé en cada caso con respecto a la notificación por edictos. La diligencia se acredita agregando al expediente certificación emanada de la empresa radiodifusora, en la que debe constar el texto del anuncio, que debe ser el mismo que el de los edictos, y los días y horas en que se difundió.","La resolución se tiene por notificada al día siguiente de la última transmisión radiofónica.","Respecto de los gastos que irroga esta forma de notificación, rige lo dispuesto en el último párrafo del Artículo 145."],"t":"Notificación por radiodifusión","s":"En todos los casos en que este Código autoriza la publicación de edictos, a pedido del interesado, el Juez puede ordenar que aquellos se anuncien por radiodifusión."},{"n":151,"p":["Es nula la notificación que se hace en contravención a lo dispuesto en los artículos anteriores siempre que la irregularidad sea grave e impida al interesado cumplir oportunamente los actos procesales vinculados a la resolución que se notifica.","Cuando del expediente resulta que la parte ha tenido conocimiento de la resolución, la notificación surte sus efectos desde entonces.","El pedido de nulidad tramita por incidente, aplicándose las normas de los Artículos 173 y 174.","El funcionario o empleado que practicó la notificación declarada nula, incurre en falta grave cuando la irregularidad le es imputable."],"t":"Nulidad de la notificación","s":"Es nula la notificación que se hace en contravención a lo dispuesto en los artículos anteriores siempre que la irregularidad sea grave e impida al interesado cumplir oportunamente los actos procesales vinculados a la resolución que se notifica."},{"n":152,"p":["El plazo para contestar vistas y traslados, salvo disposición en contrario de la ley, es de cinco (5) días. Todo traslado o vista se considera decretado en calidad de autos, y debiendo el Juez o Tribunal dictar resolución sin más trámite.","La falta de contestación del traslado no importa consentimiento a las pretensiones de la contraria."],"t":"Plazo y carácter","s":"El plazo para contestar vistas y traslados, salvo disposición en contrario de la ley, es de cinco (5) días. Todo traslado o vista se considera decretado en calidad de autos, y debiendo el Juez o Tribunal dictar resolución sin más trámite."},{"n":153,"p":["Las actuaciones y diligencias judiciales se practican en días y horas hábiles, bajo pena de nulidad.","Son días hábiles todos los del año, con excepción de los que determina el Reglamento para el Poder Judicial.","Son horas hábiles las comprendidas dentro del horario establecido por el Superior Tribunal de Justicia para el funcionamiento de los tribunales; pero respecto de las diligencias que los jueces, funcionarios o empleados deben practicar fuera de la oficina, son horas hábiles las que median entre las siete (7) y las veinte (20).","Para la celebración de audiencias de prueba, las Cámaras de Apelaciones pueden declarar horas hábiles, con respecto a juzgados bajo su dependencia y cuando las circunstancias lo exigen, las que median entre la siete (7) y las diecisiete (17) o entre las nueve (9) y las diecinueve (19), según rija el horario matutino o vespertino."],"t":"Días y horas hábiles","s":"Las actuaciones y diligencias judiciales se practican en días y horas hábiles, bajo pena de nulidad. Son días hábiles todos los del año, con excepción de los que determina el Reglamento para el Poder Judicial."},{"n":154,"p":["A petición de parte o de oficio, los jueces y tribunales deben habilitar días y horas, cuando no es posible señalar las audiencias dentro del plazo establecido por este Código, o se trata de diligencias urgentes cuya demora puede tornarlas ineficaces u originar perjuicios evidentes a las partes. De la resolución sólo puede recurrirse por reposición, siempre que aquella sea denegatoria.","Incurre en falta grave el Juez que, reiteradamente, no adopta las medidas necesarias para señalar las audiencias dentro del plazo legal."],"t":"Habilitación expresa","s":"A petición de parte o de oficio, los jueces y tribunales deben habilitar días y horas, cuando no es posible señalar las audiencias dentro del plazo establecido por este Código, o se trata de diligencias urgentes cuya demora puede tornarlas ineficaces u origina"},{"n":155,"p":["La diligencia iniciada en día y hora hábil, puede llevarse hasta su fin en tiempo inhábil sin necesidad de que se decrete la habilitación. Si no puede terminarse en el día, continúa en el siguiente hábil, a la hora que en el mismo acto establece el Juez o Tribunal.","SECCIÓN 2.a PLAZOS"],"t":"Habilitación tácita","s":"La diligencia iniciada en día y hora hábil, puede llevarse hasta su fin en tiempo inhábil sin necesidad de que se decrete la habilitación."},{"n":156,"p":["Los plazos legales o judiciales son perentorios; pueden ser prorrogados por acuerdo de partes manifestado con relación a actos procesales determinados.","Cuando este Código no fija expresamente el plazo que corresponde para la realización de un acto, lo señala el Juez de conformidad con la naturaleza del proceso y la importancia de la diligencia."],"t":"Carácter","s":"Los plazos legales o judiciales son perentorios; pueden ser prorrogados por acuerdo de partes manifestado con relación a actos procesales determinados."},{"n":157,"p":["Los plazos empiezan a correr desde la notificación y si son comunes, desde la última.","No se cuenta el día en que se practica esa diligencia, ni los días inhábiles."],"t":"Comienzo","s":"Los plazos empiezan a correr desde la notificación y si son comunes, desde la última. No se cuenta el día en que se practica esa diligencia, ni los días inhábiles."},{"n":158,"p":["Los apoderados no pueden acordar una suspensión mayor de veinte (20) días sin acreditar ante el Juez o Tribunal la conformidad de sus mandantes.","Las partes pueden acordar la abreviación de un plazo mediante una manifestación expresa por escrito.","Los jueces y tribunales deben declarar la interrupción o suspensión de los plazos cuando circunstancias de fuerza mayor o causas graves hacen imposible la realización del acto pendiente."],"t":"Suspensión y abreviación convencional. Declaración de interrupción y suspensión","s":"Los apoderados no pueden acordar una suspensión mayor de veinte (20) días sin acreditar ante el Juez o Tribunal la conformidad de sus mandantes. Las partes pueden acordar la abreviación de un plazo mediante una manifestación expresa por escrito."},{"n":159,"p":["Para toda diligencia que debe practicarse dentro de la Provincia y fuera del lugar del asiento del Juzgado o Tribunal, quedan ampliados los plazos fijados por este Código a razón de un (1) día por cada doscientos (200) kilómetros o fracción que no baje de cien (100) kilómetros."],"t":"Ampliación","s":"Para toda diligencia que debe practicarse dentro de la Provincia y fuera del lugar del asiento del Juzgado o Tribunal, quedan ampliados los plazos fijados por este Código a razón de un (1) día por cada doscientos (200) kilómetros o fracción que no baje de cien"},{"n":160,"p":["El Ministerio Público y los funcionarios que a cualquier título intervienen en el proceso están sometidos a las reglas precedentes y deben expedirse o ejercer sus derechos dentro de los plazos fijados."],"t":"Extensión a los funcionarios públicos","s":"El Ministerio Público y los funcionarios que a cualquier título intervienen en el proceso están sometidos a las reglas precedentes y deben expedirse o ejercer sus derechos dentro de los plazos fijados."},{"n":161,"p":["Las providencias simples sólo tienden, sin sustanciación, al desarrollo del proceso u ordenan actos de mera ejecución. No requieren otras formalidades que su expresión por escrito, indicación de fecha y lugar, y la firma del Juez o Presidente del Tribunal, o del Secretario, en su caso."],"t":"Providencias simples","s":"Las providencias simples sólo tienden, sin sustanciación, al desarrollo del proceso u ordenan actos de mera ejecución."},{"n":162,"p":["Las sentencias interlocutorias resuelven cuestiones que requieren sustanciación, planteadas durante el curso del proceso. Además de los requisitos enunciados en el Artículo 161, deben contener:","1) los fundamentos;","2) la decisión expresa, positiva y precisa de las cuestiones planteadas;","3) el pronunciamiento sobre costas."],"t":"Sentencias interlocutorias","s":"Las sentencias interlocutorias resuelven cuestiones que requieren sustanciación, planteadas durante el curso del proceso. Además de los requisitos enunciados en el Artículo 161, deben contener: 1) los fundamentos;"},{"n":163,"p":["Las sentencias que recaen en los supuestos de los Artículos 307, 310 y 311, se dictan en la forma establecida en los Artículos 161 o 162, según que, respectivamente, homologuen o no el desistimiento, la transacción o la conciliación."],"t":"Sentencias homologatorias","s":"Las sentencias que recaen en los supuestos de los Artículos 307, 310 y 311, se dictan en la forma establecida en los Artículos 161 o 162, según que, respectivamente, homologuen o no el desistimiento, la transacción o la conciliación."},{"n":164,"p":["La sentencia definitiva de primera instancia debe contener:","1) la mención del lugar y fecha;","2) el nombre y apellido de las partes;","3) la relación sucinta de las cuestiones que constituyen el objeto del juicio;","4) la consideración, por separado, de las cuestiones a que se refiere el inciso 3);","5) los fundamentos y la aplicación de la ley. Las presunciones no establecidas por ley constituyen prueba cuando se fundan en hechos reales y probados y cuando por su número, precisión, gravedad y concordancia, producen convicción según la naturaleza del juicio, de conformidad con las reglas de la sana crítica. La conducta observada por las partes durante la sustanciación del proceso puede constituir un elemento de convicción corroborante de las pruebas, para juzgar la procedencia de las respectivas pretensiones;","6) la decisión expresa, positiva y precisa, de conformidad con las pretensiones deducidas en el juicio, calificadas según corresponda por ley, declarando el derecho de los litigantes y condenando o absolviendo de la demanda y reconvención, en su caso, en todo o en parte. La sentencia puede hacer mérito de los hechos constitutivos, modificativos o extintivos, producidos durante la sustanciación del juicio y debidamente probados, aunque no hayan sido invocados oportunamente como hechos nuevos;","7) el plazo que se otorga para su cumplimiento, si es susceptible de ejecución;","8) el pronunciamiento sobre costas y la regulación de honorarios en porcentaje en los casos previstos por la ley y, en su caso, la declaración de temeridad o malicia en los términos del Artículo 34, inciso 6);","9) la firma del Juez."],"t":"Sentencia definitiva de primera instancia","s":"La sentencia definitiva de primera instancia debe contener: 1) la mención del lugar y fecha; 2) el nombre y apellido de las partes; 3) la relación sucinta de las cuestiones que constituyen el objeto del juicio;"},{"n":165,"p":["La sentencia definitiva de segunda o ulterior instancia debe contener, en lo pertinente, las enunciaciones y requisitos establecidos en el Artículo 164 y se debe ajustar a lo dispuesto en el Artículo 274.","Las sentencias de cualquier instancia pueden ser dadas a publicidad salvo que, por la naturaleza del juicio, razones de decoro aconsejan su reserva, en cuyo caso así se debe declarar. Si afecta la intimidad de las partes o de terceros, los nombres de éstos deben ser eliminados de las copias para la publicidad."],"t":"Sentencia definitiva de segunda o ulterior instancia","s":"La sentencia definitiva de segunda o ulterior instancia debe contener, en lo pertinente, las enunciaciones y requisitos establecidos en el Artículo 164 y se debe ajustar a lo dispuesto en el Artículo 274."},{"n":166,"p":["Cuando la sentencia contiene condena al pago de frutos, intereses, daños y perjuicios, debe fijar su importe en cantidad líquida o establecer por lo menos las bases sobre las que ha de hacerse la liquidación.","Si por no haber hecho las partes estimación de los frutos o intereses, no es posible lo uno ni lo otro, se los determina en proceso sumarísimo.","La sentencia fija el importe del crédito o de los perjuicios reclamados, siempre que su existencia esté legalmente comprobada, aunque no resulte justificado su monto."],"t":"Monto de la condena al pago de frutos, intereses, daños y perjuicios","s":"Cuando la sentencia contiene condena al pago de frutos, intereses, daños y perjuicios, debe fijar su importe en cantidad líquida o establecer por lo menos las bases sobre las que ha de hacerse la liquidación."},{"n":167,"p":["Pronunciada la sentencia, concluye la competencia del Juez respecto del objeto del juicio y no puede sustituirla o modificarla.","Le corresponde, sin embargo:","1) ejercer de oficio, antes de la notificación de la sentencia, la facultad que le otorga el Artículo 36, inciso 5). Los errores puramente numéricos pueden ser corregidos aún durante el trámite de ejecución de sentencia;","2) corregir, a pedido de parte, formulado dentro de los tres (3) días de la notificación y sin sustanciación, cualquier error material; aclarar algún concepto oscuro, sin alterar lo sustancial de la decisión y suplir cualquier omisión en que incurrió sobre alguna de las pretensiones deducidas y discutidas en el litigio;","3) ordenar, a pedido de parte, las medidas precautorias que son pertinentes;","4) disponer las anotaciones establecidas por la ley y la entrega de testimonios;","5) proseguir la sustanciación y decidir los incidentes que tramitan por separado;","6) resolver acerca de la admisibilidad de los recursos y sustanciar los que se conceden en relación y, en su caso, decidir los pedidos de rectificación a que se refiere el Artículo 253;","7) ejecutar oportunamente la sentencia."],"t":"Actuación del Juez posterior a la sentencia","s":"Pronunciada la sentencia, concluye la competencia del Juez respecto del objeto del juicio y no puede sustituirla o modificarla. Le corresponde, sin embargo:"},{"n":168,"p":["Si la sentencia definitiva no puede ser pronunciada dentro del plazo establecido en el Artículo 34 u otra disposición legal, el Juez o Tribunal debe hacerlo saber a la Cámara de Apelaciones que corresponda o, en su caso, al Superior Tribunal de Justicia, con anticipación de diez (10) días al del vencimiento de aquél si se trata de juicio ordinario, y de cinco (5) días en los demás casos, expresando las razones que determinan la imposibilidad.","Si considera atendible la causa invocada, el superior señala el plazo en que la sentencia debe pronunciarse, por el mismo Juez o Tribunal, o por otro del mismo fuero cuando circunstancias excepcionales así lo aconsejan.","Al Juez que no remite oportunamente la comunicación a que se refiere el primer párrafo, o que habiéndolo hecho, sin causa justificada no pronuncia la sentencia dentro del plazo que se le fija, se le debe imponer una multa que no puede exceder del quince por ciento (15%) de su remuneración básica, y la causa puede ser remitida, para sentencia, a otro Juez del mismo fuero.","Si la demora injustificada es de una Cámara, el Superior Tribunal de Justicia debe imponer la multa al integrante que incurre en ella, quien puede ser separado del conocimiento de la causa, integrándose el Tribunal en la forma que corresponde. Si se produce una vacancia prolongada, la Cámara debe disponer la distribución de expedientes que estima pertinente."],"t":"Demora en pronunciar sentencia","s":"Si la sentencia definitiva no puede ser pronunciada dentro del plazo establecido en el Artículo 34 u otra disposición legal, el Juez o Tribunal debe hacerlo saber a la Cámara de Apelaciones que corresponda o, en su caso, al Superior Tribunal de Justicia, con a"},{"n":169,"p":["La imposición de la multa establecida en el Artículo 168 es sin perjuicio de la responsabilidad penal, o de la sujeción del Juez al Jurado de Enjuiciamiento si corresponde."],"t":"Responsabilidad","s":"La imposición de la multa establecida en el Artículo 168 es sin perjuicio de la responsabilidad penal, o de la sujeción del Juez al Jurado de Enjuiciamiento si corresponde."},{"n":170,"p":["Ningún acto procesal debe ser declarado nulo si la ley no prevé expresamente esa sanción.","Sin embargo, la nulidad procede cuando el acto carece de los requisitos indispensables para la obtención de su finalidad.","No se puede declarar la nulidad, aún en los casos mencionados en los párrafos precedentes, si el acto, no obstante su irregularidad, logra la finalidad a que está destinado."],"t":"Trascendencia de la nulidad","s":"Ningún acto procesal debe ser declarado nulo si la ley no prevé expresamente esa sanción. Sin embargo, la nulidad procede cuando el acto carece de los requisitos indispensables para la obtención de su finalidad."},{"n":171,"p":["La nulidad no puede ser declarada cuando el acto es consentido, aunque sea tácitamente, por la parte interesada en la declaración.","Se entiende que media consentimiento tácito cuando no se promueve incidente de nulidad dentro de los cinco (5) días subsiguientes al conocimiento del acto."],"t":"Subsanación","s":"La nulidad no puede ser declarada cuando el acto es consentido, aunque sea tácitamente, por la parte interesada en la declaración."},{"n":172,"p":["La parte que da lugar a la nulidad, no puede pedir la invalidez del acto realizado."],"t":"Inadmisibilidad","s":"La parte que da lugar a la nulidad, no puede pedir la invalidez del acto realizado."},{"n":173,"p":["La nulidad puede ser declarada a petición de parte o de oficio, siempre que el acto viciado no esté consentido.","Quien promueve el incidente debe expresar el perjuicio sufrido del que deriva el interés en obtener la declaración y mencionar, en su caso, las defensas que no pudo oponer.","Si la nulidad es manifiesta no se requiere sustanciación."],"t":"Iniciativa para la declaración. Requisitos","s":"La nulidad puede ser declarada a petición de parte o de oficio, siempre que el acto viciado no esté consentido."},{"n":174,"p":["Se desestima sin más trámite el pedido de nulidad si no se cumplen los requisitos establecidos en el segundo párrafo del Artículo 173 o cuando es manifiestamente improcedente."],"t":"Rechazo “in limine”","s":"Se desestima sin más trámite el pedido de nulidad si no se cumplen los requisitos establecidos en el segundo párrafo del Artículo 173 o cuando es manifiestamente improcedente."},{"n":175,"p":["La nulidad de un acto no importa la de los anteriores ni la de los sucesivos que son independientes de dicho acto.","La nulidad de una parte del acto no afecta a las demás partes que son independientes de aquélla."],"t":"Efectos","s":"La nulidad de un acto no importa la de los anteriores ni la de los sucesivos que son independientes de dicho acto. La nulidad de una parte del acto no afecta a las demás partes que son independientes de aquélla."},{"n":176,"p":["Toda cuestión que tiene relación con el objeto principal del pleito y no se halla sometida a un procedimiento especial, tramita en pieza separada, en la forma prevista por las disposiciones de este capítulo."],"t":"Principio general","s":"Toda cuestión que tiene relación con el objeto principal del pleito y no se halla sometida a un procedimiento especial, tramita en pieza separada, en la forma prevista por las disposiciones de este capítulo."},{"n":177,"p":["Los incidentes no suspenden la prosecución del proceso principal, a menos que este Código disponga lo contrario o que así lo resuelva el Juez cuando lo considere indispensable por la naturaleza de la cuestión planteada. La resolución es irrecurrible."],"t":"Suspensión del proceso principal","s":"Los incidentes no suspenden la prosecución del proceso principal, a menos que este Código disponga lo contrario o que así lo resuelva el Juez cuando lo considere indispensable por la naturaleza de la cuestión planteada. La resolución es irrecurrible."},{"n":178,"p":["El incidente se forma con el escrito en que se promueve y con copia de la resolución y de las demás piezas del principal que lo motivan y que indican las partes, señalando las fojas respectivas, cuya confrontación hace el Secretario o el Oficial Primero."],"t":"Formación del incidente","s":"El incidente se forma con el escrito en que se promueve y con copia de la resolución y de las demás piezas del principal que lo motivan y que indican las partes, señalando las fojas respectivas, cuya confrontación hace el Secretario o el Oficial Primero."},{"n":179,"p":["El escrito en que se plantea el incidente debe ser fundado clara y concretamente en los hechos y en el derecho, ofreciéndose en él toda la prueba."],"t":"Requisitos","s":"El escrito en que se plantea el incidente debe ser fundado clara y concretamente en los hechos y en el derecho, ofreciéndose en él toda la prueba."},{"n":180,"p":["Si el incidente promovido es manifiestamente improcedente, el Juez debe rechazarlo sin más trámite. La resolución es apelable en efecto devolutivo."],"t":"Rechazo \"in limine\"","s":"Si el incidente promovido es manifiestamente improcedente, el Juez debe rechazarlo sin más trámite. La resolución es apelable en efecto devolutivo."},{"n":181,"p":["Si el Juez resuelve admitir el incidente, da traslado por cinco (5) días a la otra parte, quien al contestarlo debe ofrecer la prueba.","El traslado se notifica personalmente o por cédula dentro del tercer día de dictada la providencia que lo ordena."],"t":"Traslado y contestación","s":"Si el Juez resuelve admitir el incidente, da traslado por cinco (5) días a la otra parte, quien al contestarlo debe ofrecer la prueba. El traslado se notifica personalmente o por cédula dentro del tercer día de dictada la providencia que lo ordena."},{"n":182,"p":["Si ha de producirse prueba que requiere audiencia, el Juez la debe señalar para una fecha que no puede exceder de diez (10) días desde que se contestó el traslado o venció el plazo para hacerlo; debe citar a los testigos que las partes no pueden hacer comparecer por sí y adoptar las medidas necesarias para el diligenciamiento de la prueba que no pueda recibirse en dicha audiencia. Si no resulta posible su agregación antes de la audiencia, sólo es tenida en cuenta si se incorpora antes de resolver el incidente, cualquiera sea la instancia en que éste se encuentre."],"t":"Recepción de la prueba","s":"Si ha de producirse prueba que requiere audiencia, el Juez la debe señalar para una fecha que no puede exceder de diez (10) días desde que se contestó el traslado o venció el plazo para hacerlo; debe citar a los testigos que las partes no pueden hacer comparec"},{"n":183,"p":["La audiencia puede postergarse o suspenderse una sola vez por un plazo no mayor de diez (10) días, cuando hay imposibilidad material de producir la prueba que debe recibirse en ella."],"t":"Prórroga o suspensión de la audiencia","s":"La audiencia puede postergarse o suspenderse una sola vez por un plazo no mayor de diez (10) días, cuando hay imposibilidad material de producir la prueba que debe recibirse en ella."},{"n":184,"p":["La prueba pericial, cuando procede, se debe llevar a cabo por un solo perito designado de oficio. No se admite la intervención de consultores técnicos.","No puede proponerse más de cinco (5) testigos por cada parte y las declaraciones no pueden recibirse fuera de la jurisdicción, cualquiera sea el domicilio de aquéllos."],"t":"Prueba pericial y testimonial","s":"La prueba pericial, cuando procede, se debe llevar a cabo por un solo perito designado de oficio. No se admite la intervención de consultores técnicos."},{"n":185,"p":["Las cuestiones que surgen en el curso de los incidentes y que no tienen entidad suficiente para constituir otro autónomo, se deciden en la interlocutoria que los resuelve."],"t":"Cuestiones accesorias","s":"Las cuestiones que surgen en el curso de los incidentes y que no tienen entidad suficiente para constituir otro autónomo, se deciden en la interlocutoria que los resuelve."},{"n":186,"p":["Contestado el traslado o vencido el plazo, si ninguna de las partes ofrece prueba o no se ordena de oficio, o recibida la prueba, en su caso, el Juez, sin más trámite, debe dictar resolución."],"t":"Resolución","s":"Contestado el traslado o vencido el plazo, si ninguna de las partes ofrece prueba o no se ordena de oficio, o recibida la prueba, en su caso, el Juez, sin más trámite, debe dictar resolución."},{"n":187,"p":["Todos los incidentes que por su naturaleza pueden paralizar el proceso, cuyas causas existen simultáneamente y son conocidas por quien los promueve, deben ser articulados en un mismo escrito, siempre que sea posible su tramitación conjunta. Se deben desestimar sin más trámite los que se entablan con posterioridad."],"t":"Tramitación conjunta","s":"Todos los incidentes que por su naturaleza pueden paralizar el proceso, cuyas causas existen simultáneamente y son conocidas por quien los promueve, deben ser articulados en un mismo escrito, siempre que sea posible su tramitación conjunta."},{"n":188,"p":["En el proceso sumarísimo rigen los plazos que fija el Juez, quien asimismo debe adoptar de oficio las medidas adecuadas para que el incidente no desnaturalice el procedimiento principal."],"t":"Incidentes en el proceso sumarísimo","s":"En el proceso sumarísimo rigen los plazos que fija el Juez, quien asimismo debe adoptar de oficio las medidas adecuadas para que el incidente no desnaturalice el procedimiento principal."},{"n":189,"p":["Procede la acumulación de procesos cuando es admisible la acumulación subjetiva de acciones de conformidad con lo prescripto en el Artículo 88 y, en general, siempre que la sentencia que haya de dictarse en uno de ellos pueda producir efectos de cosa juzgada en otro u otros.","Se requiere, además:","1) que los procesos se encuentren en la misma instancia;","2) que el Juez a quien corresponda entender en los procesos acumulados sea competente por razón de la materia. A los efectos de este inciso no se consideran distintas las materias civil y comercial;","3) que puedan sustanciarse por los mismos trámites. Sin embargo, pueden acumularse dos (2) o más procesos de conocimiento, o dos (2) o más procesos de ejecución sujetos a distintos trámites, cuando su acumulación resulta indispensable en razón de concurrir la circunstancia prevista en la última parte del primer párrafo. En tal caso, el Juez debe determinar el procedimiento que corresponde imprimir al juicio acumulado;","4) que el estado de las causas permita su sustanciación conjunta, sin producir demora perjudicial e injustificada en el trámite del o de los que estén más avanzados."],"t":"Procedencia","s":"Procede la acumulación de procesos cuando es admisible la acumulación subjetiva de acciones de conformidad con lo prescripto en el Artículo 88 y, en general, siempre que la sentencia que haya de dictarse en uno de ellos pueda producir efectos de cosa juzgada e"},{"n":190,"p":["La acumulación se hace sobre el expediente en el que primero se notifica la demanda. Si los jueces intervinientes en los procesos tienen distinta competencia por razón del monto, la acumulación se hace sobre el de mayor cuantía."],"t":"Principio de prevención","s":"La acumulación se hace sobre el expediente en el que primero se notifica la demanda. Si los jueces intervinientes en los procesos tienen distinta competencia por razón del monto, la acumulación se hace sobre el de mayor cuantía."},{"n":191,"p":["La acumulación se ordena de oficio, o a petición de parte formulada al contestar la demanda o, posteriormente, por incidente que puede promoverse en cualquier instancia o etapa del proceso, hasta el momento de quedar en estado de sentencia, siempre que sea admisible con arreglo a lo que dispone el Artículo 189 inciso 4)."],"t":"Modo y oportunidad de disponerse","s":"La acumulación se ordena de oficio, o a petición de parte formulada al contestar la demanda o, posteriormente, por incidente que puede promoverse en cualquier instancia o etapa del proceso, hasta el momento de quedar en estado de sentencia, siempre que sea adm"},{"n":192,"p":["El incidente puede plantearse ante el Juez que debe conocer en definitiva o ante el que debe remitir el expediente.","En el primer caso, el Juez debe conferir traslado a los otros litigantes, y si considera fundada la petición debe solicitar el otro u otros expedientes expresando los fundamentos de su pedido. Recibidos, dicta sin más trámite resolución, contra la cual no puede recurrirse y la hace conocer a los juzgados donde tramitaban los procesos.","En el segundo caso, debe dar traslado a los otros litigantes, y si considera procedente la acumulación remite el expediente al otro Juez, o bien le pide la remisión del que tiene en trámite, si entiende que la acumulación debe efectuarse sobre el que se sustancia ante su Juzgado, expresando los motivos en que se funda. En ambos supuestos la resolución es inapelable.","Si se declara improcedente el pedido, la resolución es apelable."],"t":"Resolución del incidente","s":"El incidente puede plantearse ante el Juez que debe conocer en definitiva o ante el que debe remitir el expediente."},{"n":193,"p":["Sea que la acumulación se disponga a pedido de parte o de oficio, si el Juez requerido no accede, debe elevar el expediente a la Cámara que constituye su alzada; ésta, sin sustanciación alguna, debe resolver en definitiva si la acumulación es procedente."],"t":"Conflicto de acumulación","s":"Sea que la acumulación se disponga a pedido de parte o de oficio, si el Juez requerido no accede, debe elevar el expediente a la Cámara que constituye su alzada; ésta, sin sustanciación alguna, debe resolver en definitiva si la acumulación es procedente."},{"n":194,"p":["El curso de todos los procesos se suspende, si tramitan ante un mismo Juez, desde que se promueve la cuestión. Si tramitan ante jueces distintos, desde que se comunica el pedido de acumulación al Juez respectivo. Exceptúanse las medidas o diligencias de cuya omisión puede resultar perjuicio."],"t":"Suspensión de trámites","s":"El curso de todos los procesos se suspende, si tramitan ante un mismo Juez, desde que se promueve la cuestión. Si tramitan ante jueces distintos, desde que se comunica el pedido de acumulación al Juez respectivo."},{"n":195,"p":["Los procesos acumulados se sustancian y fallan conjuntamente, pero si el trámite resulta dificultoso por la naturaleza de las cuestiones planteadas, puede el Juez disponer, sin recurso, que cada proceso se sustancie por separado, dictando una sola sentencia."],"t":"Sentencia única","s":"Los procesos acumulados se sustancian y fallan conjuntamente, pero si el trámite resulta dificultoso por la naturaleza de las cuestiones planteadas, puede el Juez disponer, sin recurso, que cada proceso se sustancie por separado, dictando una sola sentencia."},{"n":196,"p":["Las providencias cautelares pueden ser solicitadas antes o después de deducida la demanda, a menos que de la ley resulte que ésta debe entablarse previamente.","El escrito debe expresar el derecho que se pretende asegurar, la medida que se pide, la disposición de la ley en que se funda y el cumplimiento de los requisitos que corresponden, en particular, a la medida requerida."],"t":"Oportunidad y presupuesto","s":"Las providencias cautelares pueden ser solicitadas antes o después de deducida la demanda, a menos que de la ley resulte que ésta debe entablarse previamente."},{"n":197,"p":["No pueden ser objeto de medidas cautelares los fondos, rentas o créditos pertenecientes a la Provincia de Misiones, cualquiera sea su origen y destino,   quedando     comprendidos        la   Administración   centralizada,   organismos descentralizados, entidades autárquicas y empresas o sociedades que tienen garantía del Estado Provincial por ley de creación.","Asimismo, quedan alcanzados por esta prohibición los pertenecientes a los municipios de la Provincia, cuenten o no con Carta Orgánica Municipal.","Tampoco pueden decretarse medidas cautelares previstas en este capítulo, por las que se afecten, obstaculicen, comprometan, distraigan de su destino o de cualquier otro modo perturben los recursos presupuestarios del Estado."],"t":"Prohibición","s":"No pueden ser objeto de medidas cautelares los fondos, rentas o créditos pertenecientes a la Provincia de Misiones, cualquiera sea su origen y destino,   quedando     comprendidos        la   Administración   centralizada,   organismos descentralizados, entida"},{"n":198,"p":["No son susceptibles de embargo preventivo:","1) los bienes de la Provincia de Misiones, comprendiendo a los de:","a) la administración pública centralizada;","b) los organismos descentralizados;","c) las entidades autárquicas;","d) las empresas o sociedades, cualquiera sea su tipo, en las que la Provincia de Misiones posee participación mayoritaria en el capital o en la formación de sus decisiones y que tienen garantía del Estado Provincial.","2) los bienes de los municipios, cuenten o no con Carta Orgánica Municipal.","Los embargos preventivos que hubieran podido ser obtenidos con anterioridad son levantados de oficio o a pedido de parte."],"t":"Inembargabilidad de los bienes del estado","s":"No son susceptibles de embargo preventivo:"},{"n":199,"p":["Los jueces deben abstenerse de decretar medidas precautorias cuando el conocimiento de la causa no es de su competencia.","Sin embargo, la medida ordenada por un Juez incompetente es válida siempre que sea dispuesta de conformidad con las prescripciones de este Capítulo, pero no prorroga su competencia.","El Juez que decreta la medida, inmediatamente después de requerido remite las actuaciones al que es competente."],"t":"Medida decretada por Juez incompetente","s":"Los jueces deben abstenerse de decretar medidas precautorias cuando el conocimiento de la causa no es de su competencia."},{"n":200,"p":["La información sumaria para obtener medidas precautorias puede ofrecerse acompañando con el escrito en que se solicitan el interrogatorio de los testigos y la declaración de éstos, ajustada a los Artículos 420, 421 y 423 y firmada por ellos.","Los testigos deben ratificarse en el acto de ser presentado dicho escrito o en primera audiencia.","Si no se adopta el procedimiento que autoriza el primer párrafo de este artículo, las declaraciones se admiten sin más trámite, y puede el Juez encomendarlas al Secretario.","Las actuaciones permanecen reservadas hasta tanto se ejecutan las medidas. Tramitan por expediente separado, al cual se agregan, en su caso, las copias de las pertinentes actuaciones del principal."],"t":"Trámites previos","s":"La información sumaria para obtener medidas precautorias puede ofrecerse acompañando con el escrito en que se solicitan el interrogatorio de los testigos y la declaración de éstos, ajustada a los Artículos 420, 421 y 423 y firmada por ellos."},{"n":201,"p":["Las medidas precautorias se decretan y cumplen sin audiencia de la otra parte. Ningún incidente planteado por el destinatario de la medida puede detener su cumplimiento.","Si el afectado no toma conocimiento de las medidas con motivo de su ejecución, se le notifican personalmente o por cédula dentro de los tres (3) días. Quien obtiene la medida es responsable de los perjuicios que irroga la demora.","La providencia que admite o deniega una medida cautelar es recurrible por vía de reposición; también es admisible la apelación, subsidiaria o directa.","El recurso de apelación en caso de admitirse la medida, se concede en efecto devolutivo."],"t":"Cumplimiento y recursos","s":"Las medidas precautorias se decretan y cumplen sin audiencia de la otra parte. Ningún incidente planteado por el destinatario de la medida puede detener su cumplimiento."},{"n":202,"p":["La medida precautoria sólo puede decretarse bajo la responsabilidad de la parte que la solicita, quien debe dar caución por todas las costas y daños y perjuicios que puede ocasionar en los supuestos previstos en el primer párrafo del Artículo 211.","En los casos de los Artículos 213 incisos 2) y 3) y 215 incisos 2) y 3) la caución juratoria se entiende prestada en el pedido de medida cautelar.","El Juez gradúa la calidad y monto de la caución de acuerdo con la mayor o menor verosimilitud del derecho y las circunstancias del caso.","Puede ofrecerse la garantía de instituciones bancarias o de personas de acreditada responsabilidad económica."],"t":"Contracautela","s":"La medida precautoria sólo puede decretarse bajo la responsabilidad de la parte que la solicita, quien debe dar caución por todas las costas y daños y perjuicios que puede ocasionar en los supuestos previstos en el primer párrafo del Artículo 211."},{"n":203,"p":["No se exige caución si quien obtuvo la medida:","1) es la Nación, una Provincia, una de sus reparticiones, una municipalidad o persona que justifica ser reconocidamente abonada;","2) actúa con beneficio de litigar sin gastos."],"t":"Exención de la contracautela","s":"No se exige caución si quien obtuvo la medida: 1) es la Nación, una Provincia, una de sus reparticiones, una municipalidad o persona que justifica ser reconocidamente abonada; 2) actúa con beneficio de litigar sin gastos."},{"n":204,"p":["En cualquier estado del proceso, la parte contra quien se hace efectiva una medida cautelar puede pedir que se mejore la caución probando sumariamente que es insuficiente. El Juez resuelve previo traslado a la otra parte.","La resolución queda notificada por ministerio de la ley."],"t":"Mejora de la contracautela","s":"En cualquier estado del proceso, la parte contra quien se hace efectiva una medida cautelar puede pedir que se mejore la caución probando sumariamente que es insuficiente. El Juez resuelve previo traslado a la otra parte."},{"n":205,"p":["Las medidas cautelares subsisten mientras duran las circunstancias que las determinan. En cualquier momento en que éstas cesan se puede requerir su levantamiento."],"t":"Carácter provisional","s":"Las medidas cautelares subsisten mientras duran las circunstancias que las determinan. En cualquier momento en que éstas cesan se puede requerir su levantamiento."},{"n":206,"p":["El acreedor puede pedir la ampliación, mejora o sustitución de la medida cautelar decretada, justificando que ésta no cumple adecuadamente la función de garantía a que está destinada.","El deudor puede requerir la sustitución de una medida cautelar por otra que le resulta menos perjudicial, siempre que ésta garantice suficientemente el derecho del acreedor.","Puede, asimismo, pedir la sustitución por otros bienes del mismo valor, o la reducción del monto por el cual la medida precautoria es trabada, si corresponde.","La resolución se dicta previo traslado a la otra parte por el plazo de cinco (5) días, que el Juez puede abreviar según las circunstancias."],"t":"Modificación","s":"El acreedor puede pedir la ampliación, mejora o sustitución de la medida cautelar decretada, justificando que ésta no cumple adecuadamente la función de garantía a que está destinada."},{"n":207,"p":["El Juez, para evitar perjuicios o gravámenes innecesarios al titular de los bienes, puede disponer una medida precautoria distinta de la solicitada, o limitarla, teniendo en cuenta la importancia del derecho que se intenta proteger."],"t":"Facultades del Juez","s":"El Juez, para evitar perjuicios o gravámenes innecesarios al titular de los bienes, puede disponer una medida precautoria distinta de la solicitada, o limitarla, teniendo en cuenta la importancia del derecho que se intenta proteger."},{"n":208,"p":["Si hay peligro de pérdida o desvalorización de los bienes afectados o si su conservación es gravosa o difícil, a pedido de parte y previo traslado a la otra por un plazo breve que se fija según la urgencia del caso, el Juez puede ordenar la venta en la forma más conveniente, abreviando los trámites y habilitando días y horas."],"t":"Peligro de pérdida o desvalorización","s":"Si hay peligro de pérdida o desvalori
