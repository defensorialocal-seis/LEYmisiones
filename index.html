CIO DE AMIGABLES COMPONEDORES","part":"","par":107,"arts":[794,795,796,797,798,799,800]},{"lv":2,"kind":"Título","num":"III","name":"PERICIA ARBITRAL","part":"","par":107,"arts":[801]},{"lv":1,"kind":"Libro","num":"Octavo","name":"PROCESOS VOLUNTARIOS","part":"Parte Especial","par":-1,"arts":[]},{"lv":2,"kind":"Título","num":"I","name":"COPIA Y RENOVACIÓN DE TÍTULOS","part":"","par":111,"arts":[802,803]},{"lv":2,"kind":"Título","num":"II","name":"EXAMEN DE LOS LIBROS POR EL SOCIO","part":"","par":111,"arts":[804]},{"lv":2,"kind":"Título","num":"III","name":"RECONOCIMIENTO ADQUISICIÓN Y VENTA DE MERCADERÍAS","part":"","par":111,"arts":[805,806,807]},{"lv":1,"kind":"Libro","num":"Noveno","name":"PROCESO DE DECLARACIÓN DE INCONSTITUCIONALIDAD Y CONFLICTO DE PODERES","part":"Parte Especial","par":-1,"arts":[]},{"lv":2,"kind":"Título","num":"I","name":"DECLARACIÓN DE INCONSTITUCIONALIDAD","part":"","par":115,"arts":[808,809,810,811,812,813]},{"lv":2,"kind":"Título","num":"II","name":"CONFLICTO DE PODERES","part":"","par":115,"arts":[814,815]},{"lv":1,"kind":"Libro","num":"Décimo","name":"DISPOSICIONES ESPECIALES","part":"Parte Especial","par":-1,"arts":[]},{"lv":2,"kind":"Título","num":"ÚNICO","name":"","part":"","par":118,"arts":[816,817,818,819]}],"arts":[{"n":1,"p":["La competencia atribuida a los tribunales provinciales es improrrogable. Se exceptúa la competencia territorial en los asuntos exclusivamente patrimoniales que pueden ser prorrogados con conformidad de partes."],"t":"Carácter","s":"La competencia atribuida a los tribunales provinciales es improrrogable. Se exceptúa la competencia territorial en los asuntos exclusivamente patrimoniales que pueden ser prorrogados con conformidad de partes."},{"n":2,"p":["La prórroga opera si surge de convenio escrito mediante el cual los interesados manifiestan explícitamente su decisión de someterse a la competencia del Juez a quien acuden. Asimismo, para el actor, por el hecho de entablar la demanda; y respecto del demandado, cuando la contesta, deja de hacerlo u opone excepciones previas sin articular la declinatoria."],"t":"Prórroga expresa o tácita","s":"La prórroga opera si surge de convenio escrito mediante el cual los interesados manifiestan explícitamente su decisión de someterse a la competencia del Juez a quien acuden."},{"n":3,"p":["La competencia tampoco puede ser delegada, pero está permitido encomendar a los jueces de otras localidades la realización de diligencias determinadas.","Los jueces provinciales pueden cometer dichas diligencias, si fuere el caso a los jueces de paz u oficiales de justicia, conforme a la naturaleza de aquellas."],"t":"Indelegabilidad","s":"La competencia tampoco puede ser delegada, pero está permitido encomendar a los jueces de otras localidades la realización de diligencias determinadas."},{"n":4,"p":["Toda demanda debe interponerse ante Juez competente, y siempre que de la exposición de los hechos resulte no ser de la competencia del Juez ante quien se deduce, debe dicho Juez inhibirse de oficio.","Consentida o ejecutoriada la respectiva resolución, se remite la causa al Juez tenido por competente.","En los asuntos exclusivamente patrimoniales no procede la declaración de incompetencia de oficio fundada en razón del territorio."],"t":"Declaración de incompetencia","s":"Toda demanda debe interponerse ante Juez competente, y siempre que de la exposición de los hechos resulte no ser de la competencia del Juez ante quien se deduce, debe dicho Juez inhibirse de oficio."},{"n":5,"p":["La competencia se determina por la naturaleza de las pretensiones deducidas en la demanda y no por las defensas opuestas por el demandado.","Con excepción de los casos de prórroga expresa o tácita, cuando procede, y sin perjuicio de las reglas especiales contenidas en este Código o en otras leyes, es Juez competente:","1) cuando se ejercitan acciones reales sobre bienes inmuebles, el del lugar donde está situada la cosa litigiosa. Si éstas son varias, o una sola pero situada en diferentes jurisdicciones judiciales, el del lugar de cualquiera de ellas o de algunas de sus partes, siempre que allí tenga su domicilio el demandado. No concurriendo tal circunstancia, el del lugar en que está situada cualquiera de ellas, a elección del actor. La misma regla rige respecto de las acciones posesorias, interdictos, restricción y límites del dominio, medianería, declarativa de la prescripción adquisitiva, mensura y deslinde y división de condominio;","2) cuando se ejercitan acciones reales sobre bienes muebles, el del lugar en que se encuentran o el del domicilio del demandado, a elección del actor. Si la acción versa sobre bienes muebles e inmuebles conjuntamente, el del lugar donde están situados estos últimos;","3) cuando se ejercitan acciones personales, el del lugar en que debe cumplirse la obligación expresa o implícitamente establecido conforme a los elementos aportados en el juicio y, en su defecto, a elección del actor, el del domicilio del demandado o el del lugar del contrato, siempre que el demandado se encuentre en él, aunque sea accidentalmente, en el momento de la notificación. El que no tiene domicilio fijo puede ser demandado en el lugar en que se encuentra o en el de su última residencia;","4) en las acciones personales derivadas de delitos o cuasidelitos, el del lugar del hecho o el del domicilio del demandado, a elección del actor;","5) en las acciones personales, cuando son varios los demandados y se trata de obligaciones indivisibles o solidarias, el del domicilio de cualquiera de ellos, a elección del actor;","6) en las acciones sobre rendición de cuentas, el del lugar donde éstas deben presentarse, y no estando determinado, a elección del actor, el del domicilio de la administración o el del lugar en que se administra el principal de los bienes. En la demanda por aprobación de cuentas rige la misma regla, pero si no está especificado el lugar donde éstas deben presentarse, puede serlo también el del domicilio del acreedor de las cuentas, a elección del actor;","7) en las acciones fiscales por cobro de impuestos, tasas o multas y salvo disposición en contrario, el del lugar del bien o actividad gravados o sometidos a inspección, inscripción o fiscalización, el del lugar en que deben pagarse o el del domicilio del deudor, a elección del actor. La conexidad no modifica esta regla;","8) en las acciones de divorcio o nulidad de matrimonio, el del último domicilio conyugal efectivo o el del domicilio del cónyuge demandado a elección del cónyuge actor. Si uno de los cónyuges no tiene su domicilio en la República, la acción puede ser intentada ante el Juez del último domicilio que tuvo en ella, si el matrimonio se celebró en la República. No probado donde estuvo radicado el último domicilio conyugal, se aplican las reglas comunes sobre competencia. En los procesos por declaración de incapacidad y en el derivado del supuesto previsto en el Artículo 48 del Código Civil y Comercial de la Nación, el del domicilio del presunto incapaz o inhabilitado; en su defecto, el de su residencia. En los de rehabilitación, el que declaró la interdicción;","9) en los pedidos de segunda copia o de rectificación de errores de escrituras públicas, el del lugar donde se otorgan o protocolizan;","10) en la protocolización de testamentos, el del lugar donde debe iniciarse la sucesión;","11) en las acciones que derivan de las relaciones societarias, el del lugar del domicilio social inscripto. Si la sociedad no requiere inscripción, el del lugar del domicilio fijado en el contrato; en su defecto o tratándose de sociedad irregular o de hecho, el del lugar de la sede social;","12) en los procesos voluntarios, el del domicilio de la persona en cuyo interés se promueven, salvo en el proceso sucesorio o disposición en contrario;","13) si la Provincia es parte actora o demandada, el de la Primera Circunscripción Judicial de la Provincia que se halla en turno;","14) cuando se ejercita la acción por cobro de expensas comunes de inmuebles sujetos al régimen de propiedad horizontal o cualquier otra acción derivada de la aplicación de ese régimen, el del lugar de la unidad funcional de que se trata;","15) en las acciones que derivan de relaciones de consumo, el del domicilio real del consumidor."],"t":"Reglas generales","s":"La competencia se determina por la naturaleza de las pretensiones deducidas en la demanda y no por las defensas opuestas por el demandado."},{"n":6,"p":["A falta de otras disposiciones es Juez competente:","1) en los incidentes, tercerías, obligaciones de garantía, citación de evicción, cumplimiento de acuerdos de conciliación o transacción celebrados en juicio, ejecución de sentencia, regulación y ejecución de honorarios y costas devengadas en el proceso, y acciones accesorias en general, el del proceso principal;","2) en los juicios de separación de bienes y liquidación del régimen de comunidad de ganancias, el del juicio de divorcio o nulidad de matrimonio;","3) en la exclusión del cónyuge, cuidado personal de hijos, régimen de comunicación, alimentos y litisexpensas, el del juicio de divorcio o nulidad de matrimonio, mientras dura la tramitación de estos últimos. Si aquellos se iniciaron con anterioridad, pasan a tramitar ante el Juzgado donde queda radicado el juicio de divorcio o nulidad de matrimonio. No existiendo juicio de divorcio o nulidad de matrimonio en trámite, y no probado dónde estuvo radicado el último domicilio conyugal, se aplican las reglas comunes sobre competencia. Mediando juicio de inhabilitación, el pedido de alimentos contra el inhabilitado debe promoverse ante el Juzgado donde se sustancia aquél;","4) en las medidas preliminares y precautorias, el que debe conocer en el proceso principal;","5) en el pedido de beneficio de litigar sin gastos, el que debe conocer en el juicio en que aquél se hace valer;","6) en el juicio ordinario que se inicia como consecuencia del ejecutivo, el que entiende en éste;","7) en el pedido de determinación de la responsabilidad establecida en el Artículo 211, el que decreta las medidas cautelares; en el supuesto del Artículo 199, aquél cuya competencia para intervenir fue en definitiva fijada."],"t":"Reglas especiales","s":"A falta de otras disposiciones es Juez competente:"},{"n":7,"p":["Las cuestiones de competencia sólo pueden promoverse por vía de declinatoria, con excepción de las que se suscitan entre jueces de distintas circunscripciones judiciales, en las que también procede la inhibitoria.","En uno y otro caso, la cuestión sólo puede promoverse antes de haberse consentido la competencia de que se reclama.","Elegida una vía no puede en lo sucesivo usarse de otra."],"t":"Procedencia","s":"Las cuestiones de competencia sólo pueden promoverse por vía de declinatoria, con excepción de las que se suscitan entre jueces de distintas circunscripciones judiciales, en las que también procede la inhibitoria."},{"n":8,"p":["La declinatoria se sustancia como las demás excepciones previas y, declarada procedente, se remite la causa al Juez tenido por competente.","La inhibitoria puede plantearse hasta el momento de contestar la demanda."],"t":"Declinatoria e inhibitoria","s":"La declinatoria se sustancia como las demás excepciones previas y, declarada procedente, se remite la causa al Juez tenido por competente. La inhibitoria puede plantearse hasta el momento de contestar la demanda."},{"n":9,"p":["Si entablada la inhibitoria el Juez se declara competente, debe librar oficio o exhorto y acompañar testimonio del escrito en que se planteó la cuestión, de la resolución recaída y demás recaudos que estima necesarios para fundar su competencia.","Debe solicitar, asimismo, la remisión del expediente, o en su defecto, su elevación al tribunal competente para dirimir la contienda.","La resolución sólo es apelable si se declara incompetente."],"t":"Planteamiento y decisión de la inhibitoria","s":"Si entablada la inhibitoria el Juez se declara competente, debe librar oficio o exhorto y acompañar testimonio del escrito en que se planteó la cuestión, de la resolución recaída y demás recaudos que estima necesarios para fundar su competencia."},{"n":10,"p":["Recibido el oficio o exhorto, el Juez requerido debe pronunciarse aceptando o no la inhibición. Sólo en el primer caso su resolución es apelable. Una vez consentida o ejecutoriada, debe remitir la causa al tribunal requirente, y emplazar a las partes para que comparezcan ante él a usar de su derecho.","Si mantiene su competencia, debe enviar sin otra sustanciación las actuaciones al tribunal competente para dirimir la contienda y comunicarlo sin demora al tribunal requirente para que remita las suyas."],"t":"Trámite de la inhibitoria ante el Juez requerido","s":"Recibido el oficio o exhorto, el Juez requerido debe pronunciarse aceptando o no la inhibición. Sólo en el primer caso su resolución es apelable."},{"n":11,"p":["Dentro de los cinco (5) días de recibidas las actuaciones de ambos jueces, el tribunal superior debe resolver la contienda sin más sustanciación y devolverlas al que declara competente, informando al otro por oficio o exhorto.","Si el Juez que requirió la inhibitoria no remite las actuaciones dentro de un plazo prudencial a juicio del tribunal superior, éste lo debe intimar para que lo haga en un plazo de diez (10) a quince (15) días, según la distancia, bajo apercibimiento de tenerlo por desistido de su pretensión."],"t":"Trámite de la inhibitoria ante el tribunal superior","s":"Dentro de los cinco (5) días de recibidas las actuaciones de ambos jueces, el tribunal superior debe resolver la contienda sin más sustanciación y devolverlas al que declara competente, informando al otro por oficio o exhorto."},{"n":12,"p":["Las cuestiones de competencia deben sustanciarse por vía de incidente. No suspende el procedimiento, el que sigue su trámite por ante el Juez que previno hasta el llamado de autos para sentencia, salvo que se trate de cuestiones de competencia en razón del territorio."],"t":"Sustanciación","s":"Las cuestiones de competencia deben sustanciarse por vía de incidente."},{"n":13,"p":["En caso de contienda negativa o cuando dos (2) o más jueces se encuentran conociendo de un mismo proceso, cualquiera de ellos puede plantear la cuestión de acuerdo con el procedimiento establecido en los Artículos 9 a 12."],"t":"Contienda negativa y conocimiento simultáneo","s":"En caso de contienda negativa o cuando dos (2) o más jueces se encuentran conociendo de un mismo proceso, cualquiera de ellos puede plantear la cuestión de acuerdo con el procedimiento establecido en los Artículos 9 a 12."},{"n":14,"p":["Los jueces de primera instancia pueden ser recusados sin expresión de causa.","El actor puede ejercer esta facultad al entablar la demanda o en su primera presentación; el demandado, al oponer excepciones en el juicio ejecutivo o comparecer a la audiencia señalada como primer acto procesal o en su primera presentación, antes o al tiempo de contestar la demanda, si ejerce esta facultad, el actor puede, dentro del término de cinco (5) días, recusar sin expresión de causa al Juez subrogante.","Si el demandado no cumple esos actos, no puede ejercer en adelante la facultad que le confiere este artículo.","También puede ser recusado sin expresión de causa un Juez de las Cámaras de Apelaciones, al día siguiente de la notificación de la primera providencia que se dicta."],"t":"Recusación sin expresión de causa","s":"Los jueces de primera instancia pueden ser recusados sin expresión de causa."},{"n":15,"p":["La facultad de recusar sin expresión de causa puede usarse una vez en cada caso. Cuando son varios los actores o los demandados, sólo uno de ellos puede ejercerla."],"t":"Límites","s":"La facultad de recusar sin expresión de causa puede usarse una vez en cada caso. Cuando son varios los actores o los demandados, sólo uno de ellos puede ejercerla."},{"n":16,"p":["Deducida la recusación sin expresión de causa, el Juez recusado debe inhibirse y pasar las actuaciones, dentro del primer día hábil siguiente, al que le sigue en el orden del turno, sin que por ello se suspendan el trámite, los plazos, ni el cumplimiento de las diligencias ya ordenadas.","Si la primera presentación del demandado es posterior a los actos indicados en el segundo párrafo del Artículo 14, y en ella promueve la nulidad de los procedimientos y recusa sin expresión de causa, dicha nulidad debe ser resuelta por el Juez recusado."],"t":"Consecuencias","s":"Deducida la recusación sin expresión de causa, el Juez recusado debe inhibirse y pasar las actuaciones, dentro del primer día hábil siguiente, al que le sigue en el orden del turno, sin que por ello se suspendan el trámite, los plazos, ni el cumplimiento de la"},{"n":17,"p":["Son causas legales de recusación:","1) el parentesco por consanguinidad dentro del cuarto grado y segundo de afinidad con alguna de las partes, sus mandatarios o letrados;","2) tener el Juez o sus consanguíneos o afines dentro del grado expresado en el inciso anterior, interés en el pleito o en otro semejante, o sociedad o comunidad con alguno de los litigantes, procuradores o abogados, salvo que la sociedad sea anónima o cooperativa;","3) tener el Juez pleito pendiente con el recusante;","4) ser el Juez acreedor, deudor o fiador de alguna de las partes, con excepción de los bancos oficiales;","5) ser o haber sido el Juez autor de denuncia o querella contra el recusante, o denunciado o querellado por éste con anterioridad a la iniciación del pleito;","6) ser o haber sido el Juez denunciado por el recusante en los términos de la Ley IV – N.° 24 (Antes Ley 2818), siempre que el Jurado de Enjuiciamiento dispusiera dar curso a la denuncia;","7) haber sido el Juez defensor de algunos de los litigantes o emitido opinión o dictamen o dado recomendaciones acerca del pleito, antes o después de comenzado;","8) haber recibido el Juez beneficios de importancia de alguna de las partes;","9) tener el Juez con alguno de los litigantes amistad que se manifiesta por gran familiaridad o frecuencia en el trato;","10) tener contra el recusante enemistad, odio o resentimiento que se manifiesta por hechos conocidos. En ningún caso procede la recusación por ataques u ofensas inferidas al Juez después que comience a conocer del asunto."],"t":"Recusación con expresión de causa","s":"Son causas legales de recusación: 1) el parentesco por consanguinidad dentro del cuarto grado y segundo de afinidad con alguna de las partes, sus mandatarios o letrados;"},{"n":18,"p":["La recusación debe ser deducida por cualquiera de las partes en las oportunidades previstas en el Artículo 14. Si la causal es sobreviniente, sólo puede hacerse valer dentro de los cinco (5) días de haber llegado a conocimiento del recusante y antes de quedar el expediente en estado de sentencia."],"t":"Oportunidad","s":"La recusación debe ser deducida por cualquiera de las partes en las oportunidades previstas en el Artículo 14."},{"n":19,"p":["Cuando se recusa a uno o más jueces del Superior Tribunal de Justicia o de una Cámara de Apelaciones, conocen los que quedan hábiles, integrándose el tribunal, si procede, en la forma prescripta por la Ley Orgánica y el Reglamento para el Poder Judicial.","De la recusación de los jueces de primera instancia conoce la Cámara de Apelaciones respectiva."],"t":"Tribunal competente para conocer de la recusación","s":"Cuando se recusa a uno o más jueces del Superior Tribunal de Justicia o de una Cámara de Apelaciones, conocen los que quedan hábiles, integrándose el tribunal, si procede, en la forma prescripta por la Ley Orgánica y el Reglamento para el Poder Judicial."},{"n":20,"p":["La recusación se deduce ante el Juez recusado y ante el Superior Tribunal de Justicia o Cámara de Apelaciones, cuando lo sea de uno de sus miembros.","En el escrito correspondiente, se expresan las causas de la recusación, y se propone y acompaña, en su caso, toda la prueba de que el recusante intenta valerse."],"t":"Forma de deducirla","s":"La recusación se deduce ante el Juez recusado y ante el Superior Tribunal de Justicia o Cámara de Apelaciones, cuando lo sea de uno de sus miembros."},{"n":21,"p":["Si en el escrito mencionado en el Artículo 20 no se alega concretamente alguna de las causas contenidas en el Artículo 17, o la que se invoca es manifiestamente improcedente, o si se presenta fuera de las oportunidades previstas en los Artículos 14 y 18, la recusación debe ser desechada, sin darle curso, por el Tribunal competente para conocer de ella."],"t":"Rechazo \"in límine\"","s":"Si en el escrito mencionado en el Artículo 20 no se alega concretamente alguna de las causas contenidas en el Artículo 17, o la que se invoca es manifiestamente improcedente, o si se presenta fuera de las oportunidades previstas en los Artículos 14 y 18, la re"},{"n":22,"p":["Deducida la recusación en tiempo y con causa legal, si el recusado es un Juez del Superior Tribunal de Justicia o de Cámara, se le debe comunicar aquella, a fin de que informe sobre las causas alegadas."],"t":"Informe del magistrado recusado","s":"Deducida la recusación en tiempo y con causa legal, si el recusado es un Juez del Superior Tribunal de Justicia o de Cámara, se le debe comunicar aquella, a fin de que informe sobre las causas alegadas."},{"n":23,"p":["Si el recusado reconoce los hechos, se le tiene por separado de la causa.","Si los niega, con lo que exponga se debe formar incidente que tramita por expediente separado."],"t":"Consecuencia del contenido del informe","s":"Si el recusado reconoce los hechos, se le tiene por separado de la causa. Si los niega, con lo que exponga se debe formar incidente que tramita por expediente separado."},{"n":24,"p":["El Superior Tribunal de Justicia o Cámara de Apelaciones, integrados al efecto si procede, deben recibir el incidente a prueba por diez (10) días, si ha de producirse dentro de la ciudad donde tiene su asiento el Tribunal. El plazo se amplía en la forma dispuesta en el Artículo 159.","Cada parte no puede ofrecer más de tres (3) testigos."],"t":"Apertura a prueba","s":"El Superior Tribunal de Justicia o Cámara de Apelaciones, integrados al efecto si procede, deben recibir el incidente a prueba por diez (10) días, si ha de producirse dentro de la ciudad donde tiene su asiento el Tribunal."},{"n":25,"p":["Vencido el plazo de prueba y agregadas las producidas, se debe dar vista al Juez recusado y resolver el incidente dentro de cinco (5) días de contestada aquélla o vencido el plazo para hacerlo."],"t":"Resolución","s":"Vencido el plazo de prueba y agregadas las producidas, se debe dar vista al Juez recusado y resolver el incidente dentro de cinco (5) días de contestada aquélla o vencido el plazo para hacerlo."},{"n":26,"p":["Cuando el recusado es un Juez de primera instancia, debe remitir a la Cámara de Apelaciones dentro de los cinco (5) días el escrito de recusación con un informe sobre las causas alegadas, y pasar el expediente al Juez que sigue en el orden del turno o, donde no lo hay, al subrogante legal para que continúe su sustanciación. Igual procedimiento se debe observar en caso de nuevas recusaciones."],"t":"Informe de los jueces de primera instancia","s":"Cuando el recusado es un Juez de primera instancia, debe remitir a la Cámara de Apelaciones dentro de los cinco (5) días el escrito de recusación con un informe sobre las causas alegadas, y pasar el expediente al Juez que sigue en el orden del turno o, donde n"},{"n":27,"p":["Pasados los antecedentes, si la recusación se dedujo en tiempo y con causa legal, la Cámara de Apelaciones siempre que del informe elevado por el Juez resulte la exactitud de los hechos, lo tendrá por separado de la causa.","Si los niega, la cámara puede recibir el incidente a prueba, y se observa el procedimiento establecido en los Artículos 24 y 25."],"t":"Trámite de la recusación de los jueces de primera instancia","s":"Pasados los antecedentes, si la recusación se dedujo en tiempo y con causa legal, la Cámara de Apelaciones siempre que del informe elevado por el Juez resulte la exactitud de los hechos, lo tendrá por separado de la causa."},{"n":28,"p":["Si la recusación es desechada, se hace saber la resolución al Juez subrogante a fin de que devuelva los autos al Juez recusado.","Si es admitida, el expediente queda radicado ante el Juez subrogante con noticia al Juez recusado, aún cuando con posterioridad desaparezcan las causas que la originaron.","Cuando el recusado es uno de los jueces del Superior Tribunal de Justicia o de las Cámaras de Apelaciones, siguen conociendo en la causa él o los integrantes o sustitutos legales que resolvieron el incidente de recusación."],"t":"Efectos","s":"Si la recusación es desechada, se hace saber la resolución al Juez subrogante a fin de que devuelva los autos al Juez recusado."},{"n":29,"p":["Desestimada una recusación con causa, se deben aplicar las costas y una multa de hasta un (1) salario mínimo, vital y móvil que es destinada al Fondo de Justicia."],"t":"Recusación maliciosa","s":"Desestimada una recusación con causa, se deben aplicar las costas y una multa de hasta un (1) salario mínimo, vital y móvil que es destinada al Fondo de Justicia."},{"n":30,"p":["Todo Juez que se encuentra comprendido en alguna de las causas de recusación mencionadas en el Artículo 17 debe excusarse.","Asimismo puede hacerlo cuando existen otras causas que le imponen abstenerse de conocer en el juicio, fundadas en motivos graves de decoro o delicadeza.","No es motivo de excusación el parentesco con otros funcionarios que intervienen en cumplimiento de sus deberes."],"t":"Excusación","s":"Todo Juez que se encuentra comprendido en alguna de las causas de recusación mencionadas en el Artículo 17 debe excusarse."},{"n":31,"p":["Las partes no pueden oponerse a la excusación ni dispensar las causales invocadas. Si el Juez que sigue en el orden del turno entiende que la excusación no procede, se debe formar incidente que es remitido sin más trámite al tribunal de alzada, sin que por ello se paralice la sustanciación de la causa.","Aceptada la excusación, el expediente debe quedar radicado en el Juzgado que corresponde, aún cuando con posterioridad desaparezcan las causas que la originaron."],"t":"Oposición y efectos","s":"Las partes no pueden oponerse a la excusación ni dispensar las causales invocadas."},{"n":32,"p":["Incurre en la causal de \"mal desempeño\", en los términos de la ley de enjuiciamiento de magistrados, Ley IV – N.° 24 (Antes Ley 2818), el Juez a quien se prueba que está impedido de entender en el asunto y a sabiendas dicta en él resolución que no es de mero trámite."],"t":"Falta de excusación","s":"Incurre en la causal de \"mal desempeño\", en los términos de la ley de enjuiciamiento de magistrados, Ley IV – N.° 24 (Antes Ley 2818), el Juez a quien se prueba que está impedido de entender en el asunto y a sabiendas dicta en él resolución que no es de mero t"},{"n":33,"p":["Los funcionarios del Ministerio Público no pueden ser recusados. Si tienen algún motivo legítimo de excusación, deben manifestarlo al Juez o Tribunal y éstos pueden separarlos de la causa, dando intervención a quien debe subrogarlos."],"t":"Ministerio Público","s":"Los funcionarios del Ministerio Público no pueden ser recusados. Si tienen algún motivo legítimo de excusación, deben manifestarlo al Juez o Tribunal y éstos pueden separarlos de la causa, dando intervención a quien debe subrogarlos."},{"n":34,"p":["Son deberes de los jueces:","1) asistir a la audiencia preliminar y a las audiencias de prueba, bajo pena de nulidad en los supuestos en que la ley lo establece o cuando cualquiera de las partes lo pide con anticipación no menor de dos (2) días a su celebración, y realizar personalmente las demás diligencias que este Código u otras leyes ponen a su cargo, con excepción de aquellas en las que la delegación está autorizada;","2) decidir las causas, en lo posible, de acuerdo con el orden en que quedan en estado, salvo las preferencias establecidas en el Reglamento para el Poder Judicial;","3) dictar las resoluciones con sujeción a los siguientes plazos:","a) las providencias simples, dentro de los tres (3) días de presentadas las peticiones por las partes o del vencimiento del plazo conforme a lo prescripto en el Artículo 36 inciso 1), e inmediatamente, si deben ser dictadas en una audiencia o revisten carácter urgente;","b) las sentencias definitivas en juicio ordinario, salvo disposición en contrario, dentro de los cuarenta (40) o sesenta (60) días, según se trate de Juez unipersonal o de Tribunal colegiado. El plazo se computa, en el primer caso, desde que el llamamiento de autos para sentencias queda firme; en el segundo, desde la fecha de sorteo del expediente;","c) las sentencias definitivas en el juicio sumarísimo, dentro de los quince (15) o veinte (20) días de quedar el expediente a despacho en el caso del Artículo 323 inciso 1), y de los diez (10) o quince (15) días en los demás supuestos, según se trate de Juez unipersonal o de Tribunal colegiado;","d) las sentencias interlocutorias y las sentencias homologatorias, salvo disposición en contrario, dentro de los diez (10) o quince (15) días de quedar el expediente a despacho, según se trate de Juez unipersonal o de Tribunal colegiado. En todos los supuestos, si se ordena prueba de oficio, no se computan los días que requiere su cumplimiento;","4) fundar toda sentencia definitiva o interlocutoria, bajo pena de nulidad, respetando la jerarquía de las normas vigentes y el principio de congruencia;","5) dirigir el procedimiento, debiendo, dentro de los límites expresamente establecidos en este Código:","a) concentrar, en lo posible, en un mismo acto o audiencia todas las diligencias que es menester realizar;","b) señalar, antes de dar trámite a cualquier petición los defectos u omisiones de que adolece ordenando que se subsanen dentro del plazo que fija, y disponer de oficio toda diligencia que sea necesaria para evitar o sanear nulidades;","c) mantener la igualdad de las partes en el proceso;","d) prevenir y sancionar todo acto contrario al deber de lealtad, probidad y buena fe;","e) vigilar para que en la tramitación de la causa se procure la mayor economía procesal;","6) declarar, en oportunidad de dictar las sentencias definitivas, la temeridad o malicia en que incurren los litigantes o profesionales intervinientes."],"t":"Deberes","s":"Son deberes de los jueces:"},{"n":35,"p":["Para mantener el buen orden y decoro en los juicios, los jueces y tribunales pueden:","1) mandar que se teste toda frase injuriosa o redactada en términos indecorosos u ofensivos;","2) excluir de las audiencias a quienes perturban indebidamente su curso;","3) aplicar las correcciones disciplinarias autorizadas por este Código, Ley IV – N.º 15 (Antes Ley 1550) y el Reglamento para el Poder Judicial. El importe de las multas que no tienen destino especial establecido en este Código, se aplica al que fija el Superior Tribunal de Justicia. Hasta tanto dicho tribunal determine quienes deben ser los funcionarios que deben promover la ejecución de las multas, esa atribución corresponde a los representantes del Ministerio Público Fiscal ante las respectivas jurisdicciones. La falta de ejecución dentro de los treinta (30) días de quedar firme la resolución que las impuso, el retardo en el trámite o el abandono injustificado de éste, son considerados faltas graves."],"t":"Facultades disciplinarias","s":"Para mantener el buen orden y decoro en los juicios, los jueces y tribunales pueden: 1) mandar que se teste toda frase injuriosa o redactada en términos indecorosos u ofensivos; 2) excluir de las audiencias a quienes perturban indebidamente su curso;"},{"n":36,"p":["Aún sin requerimiento de parte, los jueces y tribunales pueden:","1) tomar medidas tendientes a evitar la paralización del proceso. A tal efecto, vencido un plazo, se ejerza o no la facultad que corresponda, se pasa a la etapa siguiente en el desarrollo procesal, disponiendo de oficio las medidas necesarias;","2) intentar una conciliación total o parcial del conflicto o incidente procesal, pudiendo proponer y promover que las partes deriven el litigio a otros medios alternativos de resolución de conflictos. En cualquier momento pueden disponer la comparecencia personal de las partes para intentar una conciliación, para interrogarlas libremente sobre los hechos lícitos y pertinentes respecto de los cuales no haya conformidad entre ellas o para invitarlas a reajustar sus pretensiones;","3) proponer a las partes fórmulas para simplificar y disminuir las cuestiones litigiosas surgidas en el proceso o respecto de la actividad probatoria. En todos los casos la mera proposición de fórmulas conciliatorias no importa prejuzgamiento, ni importa suspensión del procedimiento;","4) ordenar las diligencias necesarias para esclarecer la verdad de los hechos controvertidos, respetando el derecho de defensa de las partes. A este efecto, pueden:","a) disponer, en cualquier momento, la comparecencia personal de las partes para intentar una conciliación o requerir las explicaciones que estiman necesarias al objeto del pleito;","b) decidir en cualquier estado de la causa la comparecencia de testigos con arreglo a lo que dispone el Artículo 432, peritos y consultores técnicos, para interrogarlos acerca de lo que creen necesario;","c) mandar, con las formalidades prescriptas en este Código, que se agreguen documentos existentes en poder de las partes o de los terceros, en los términos de los Artículos 389 a 391;","d) ejercer las demás atribuciones que la ley le confiere;","5) corregir, en la oportunidad establecida en el Artículo 167, incisos 1) y 2), errores materiales, aclarar conceptos oscuros, suplir cualquier omisión de la sentencia acerca de las pretensiones discutidas en el litigio, siempre que la enmienda, aclaración o agregado no altere lo sustancial de la decisión."],"t":"Facultades ordenatorias e instructorias","s":"Aún sin requerimiento de parte, los jueces y tribunales pueden: 1) tomar medidas tendientes a evitar la paralización del proceso."},{"n":37,"p":["Los jueces y tribunales pueden imponer sanciones pecuniarias compulsivas y progresivas tendientes a que las partes cumplan sus mandatos, cuyo importe debe ser a favor del litigante perjudicado por el incumplimiento.","Pueden aplicarse sanciones conminatorias a terceros, en los casos en que la ley lo establece.","Las condenas se gradúan en proporción al caudal económico de quien debe satisfacerlas y pueden ser dejadas sin efecto, o ser objeto de reajuste, si aquél desiste de su resistencia y justifica total o parcialmente su proceder."],"t":"Sanciones conminatorias","s":"Los jueces y tribunales pueden imponer sanciones pecuniarias compulsivas y progresivas tendientes a que las partes cumplan sus mandatos, cuyo importe debe ser a favor del litigante perjudicado por el incumplimiento."},{"n":38,"p":["Además de los deberes que en otras disposiciones de este Código y en las leyes de organización judicial se imponen a los Secretarios, las funciones de éstos son:","1) comunicar a las partes y a los terceros las decisiones judiciales, mediante la firma de oficios, mandamientos, cédulas y edictos, sin perjuicio de las facultades que se acuerdan a los letrados respecto de las cédulas y oficios, y de lo que establecen los convenios sobre comunicaciones entre magistrados de distintas jurisdicciones. Las comunicaciones dirigidas al Gobernador, ministros-secretarios del Poder Ejecutivo y magistrados judiciales, son firmadas por el Juez;","2) extender certificados, testimonios y copias de actas;","3) conferir vistas y traslados;","4) firmar, sin perjuicio de las facultades que se confieren al oficial primero o jefe de despacho, las providencias de mero trámite, y observar, en cuanto al plazo, lo dispuesto en el Artículo 34, inciso 3, subinciso a). En la etapa probatoria debe firmar todas las providencias simples que no implican pronunciamiento sobre la admisibilidad o caducidad de la prueba;","5) devolver los escritos presentados fuera de plazo;","6) dirigir en forma personal las audiencias testimoniales que toma por delegación del Juez.","Además de los deberes que en otras disposiciones de este Código y en las leyes de organización judicial se imponen a los oficiales primeros o jefes de despacho, las funciones de éstos son:","1) firmar las providencias simples que disponen:","a) agregar partidas, exhortos, pericias, oficios, inventarios, tasaciones, división o partición de herencias, rendiciones de cuentas y, en general, documentos o actuaciones similares;","b) remitir las causas a los ministerios públicos, representantes del fisco y demás funcionarios que intervienen como parte;","2) devolver los escritos presentados sin copias.","Dentro del plazo de tres (3) días, las partes pueden requerir al Juez que deje sin efecto lo dispuesto por el Secretario o el Oficial Primero o Jefe de Despacho. Este pedido se debe resolver sin sustanciación. La resolución es inapelable."],"t":"Deberes","s":"Además de los deberes que en otras disposiciones de este Código y en las leyes de organización judicial se imponen a los Secretarios, las funciones de éstos son:"},{"n":39,"p":["Los Secretarios de primera instancia únicamente pueden ser recusados por las causas previstas en el Artículo 17.","Deducida la recusación, el Juez se informa sumariamente sobre el hecho en que se funda, y sin más trámite dicta resolución que tiene carácter de inapelable.","Los Secretarios del Superior Tribunal de Justicia y los de las Cámaras de Apelaciones no son recusables; pero deben manifestar toda causa de impedimento que tengan a fin de que el tribunal considere y resuelva lo que juzgue procedente.","En todos los casos son aplicables, en lo pertinente, las reglas establecidas para la recusación y excusación de los jueces."],"t":"Recusación","s":"Los Secretarios de primera instancia únicamente pueden ser recusados por las causas previstas en el Artículo 17."},{"n":40,"p":["Toda persona que litiga por propio derecho o en representación de tercero, debe constituir domicilio procesal dentro del perímetro determinado para la realización de diligencias sin provisión de movilidad, en cada ciudad que es asiento del respectivo Juzgado o Tribunal, conforme lo establece el Superior Tribunal de Justicia de la Provincia de Misiones.","Debe también constituir domicilio electrónico, de conformidad a la reglamentación que establezca el Superior Tribunal de Justicia de la Provincia de Misiones en uso de las atribuciones otorgadas por el Artículo 24 de la Ley IV – N.° 55.","Estos requisitos se deben cumplir en el primer escrito que presenta o audiencia que concurre, si es ésta la primera diligencia en que interviene. En las mismas oportunidades debe denunciarse el domicilio real de la persona patrocinada o representada.","Se deben diligenciar en el domicilio procesal o en el electrónico constituido todas las notificaciones por cédula que no deban serlo en el real.","El domicilio contractual constituido en el de la parte contraria no es eficaz para las notificaciones que deben ser realizadas en el domicilio del constituyente."],"t":"Domicilio procesal. Domicilio electrónico constituido","s":"Toda persona que litiga por propio derecho o en representación de tercero, debe constituir domicilio procesal dentro del perímetro determinado para la realización de diligencias sin provisión de movilidad, en cada ciudad que es asiento del respectivo Juzgado o"},{"n":41,"p":["Si no se cumple con lo establecido en la primera parte del Artículo 40, las sucesivas resoluciones se tienen por notificadas en la forma y oportunidad fijadas por el Artículo 134, salvo la sentencia.","Si la parte no denuncia su domicilio real, o su cambio, las resoluciones que deben notificarse en dicho domicilio se cumplen en el lugar en que se constituyó, y en defecto también de éste, se debe observar lo dispuesto en el primer párrafo."],"t":"Falta de constitución y de denuncia de domicilio","s":"Si no se cumple con lo establecido en la primera parte del Artículo 40, las sucesivas resoluciones se tienen por notificadas en la forma y oportunidad fijadas por el Artículo 134, salvo la sentencia."},{"n":42,"p":["Los domicilios a que se refieren los Artículos 40 y 41 subsisten para los efectos legales hasta la terminación del juicio o su archivo, mientras no se constituyen o denuncian otros.","Cuando no existen los edificios, quedan deshabitados o desaparecen, o se altera o suprime su numeración, y no se constituye o denuncia un nuevo domicilio, con el informe del notificador se debe observar lo dispuesto en la primera o segunda parte del Artículo 41, según se trate, respectivamente, del domicilio procesal o del real.","Todo cambio de domicilio debe notificarse personalmente o por cédula a la otra parte. Mientras esta diligencia no se cumple, se tiene por subsistente el anterior."],"t":"Subsistencia de los domicilios","s":"Los domicilios a que se refieren los Artículos 40 y 41 subsisten para los efectos legales hasta la terminación del juicio o su archivo, mientras no se constituyen o denuncian otros."},{"n":43,"p":["Cuando la parte que actúa personalmente fallece o se torna incapaz, comprobado el hecho, el Juez o Tribunal debe suspender la tramitación y citar a los herederos o al representante legal en la forma y bajo el apercibimiento dispuesto en el Artículo 53 inciso 5)."],"t":"Muerte o incapacidad","s":"Cuando la parte que actúa personalmente fallece o se torna incapaz, comprobado el hecho, el Juez o Tribunal debe suspender la tramitación y citar a los herederos o al representante legal en la forma y bajo el apercibimiento dispuesto en el Artículo 53 inciso 5"},{"n":44,"p":["Si durante la tramitación del proceso una de las partes enajena el bien objeto del litigio o cede el derecho reclamado, el adquirente no puede intervenir en él como parte principal sin la conformidad expresa del adversario. Puede hacerlo en la calidad prevista por los Artículos 90, inciso 1) y 91, primer párrafo."],"t":"Sustitución de parte","s":"Si durante la tramitación del proceso una de las partes enajena el bien objeto del litigio o cede el derecho reclamado, el adquirente no puede intervenir en él como parte principal sin la conformidad expresa del adversario."},{"n":45,"p":["Cuando se declara maliciosa o temeraria la conducta asumida en el pleito por alguna de las partes, el Juez impone a ella o a su letrado o a ambos conjuntamente, una multa valuada entre el cinco por ciento (5%) y el treinta por ciento (30%) del monto del objeto de la sentencia, o hasta el valor de veinte (20) salarios mínimos, vitales y móviles, si no hay monto determinado. El importe de la multa es a favor de la otra parte.","Si el pedido de sanción es promovido por una de las partes, se decide previo traslado a la contraria.","Sin perjuicio de considerar otras circunstancias que estime corresponder, el Juez debe ponderar la deducción de pretensiones, defensas, excepciones o interposición de recursos que resultan inadmisibles, o cuya falta de fundamento no se puede ignorar de acuerdo con una mínima pauta de razonabilidad o encuentra sustento en hechos ficticios o irreales o que manifiestamente conducen a dilatar el proceso."],"t":"Temeridad o malicia","s":"Cuando se declara maliciosa o temeraria la conducta asumida en el pleito por alguna de las partes, el Juez impone a ella o a su letrado o a ambos conjuntamente, una multa valuada entre el cinco por ciento (5%) y el treinta por ciento (30%) del monto del objeto"},{"n":46,"p":["La persona que se presenta en juicio por un derecho que no es propio, aunque le competa ejercerlo en virtud de una representación legal, debe acompañar con su primer escrito los documentos que acreditan el carácter que inviste.","Si se invoca la imposibilidad de presentar el documento, ya otorgado, que justifica la representación y el Juez considere atendibles las razones que se expresan, puede acordar un plazo de hasta veinte (20) días para que se acompañe dicho documento, bajo apercibimiento de tener por inexistente la representación invocada.","Los padres que comparecen en representación de sus hijos, no tienen obligación de presentar las partidas correspondientes, salvo que el Juez, a petición de parte o de oficio, los emplace a presentarlas, bajo apercibimiento del pago de las costas y perjuicios que ocasionan."],"t":"Justificación de la personería","s":"La persona que se presenta en juicio por un derecho que no es propio, aunque le competa ejercerlo en virtud de una representación legal, debe acompañar con su primer escrito los documentos que acreditan el carácter que inviste."},{"n":47,"p":["Los procuradores o apoderados deben acreditar su personalidad desde la primera gestión que hacen en nombre de sus poderdantes, con la pertinente escritura de poder. Sin embargo, cuando se invoca un poder general o especial para varios actos, se lo debe acreditar con la agregación de una copia íntegra firmada por el letrado patrocinante o por el apoderado. De oficio o a petición de parte, puede intimarse la presentación del testimonio original.","La representación en juicio de los que promueven demandas de alimentos y litis expensas, puede ser acreditada con carta poder con certificación de la firma por Juez de Paz o Secretario de Juzgado de primera instancia de cualquier fuero, o ratificada en sede judicial, previa justificación de la identidad del otorgante."],"t":"Presentación de poderes","s":"Los procuradores o apoderados deben acreditar su personalidad desde la primera gestión que hacen en nombre de sus poderdantes, con la pertinente escritura de poder."},{"n":48,"p":["Cuando deben realizarse actos procesales urgentes y existen hechos o circunstancias que impiden la actuación de la parte que ha de cumplirlos, puede ser admitida la comparecencia en juicio de quien no tiene representación conferida. Si dentro de los cuarenta (40) días hábiles, contados desde la primera presentación del gestor, no son acompañados los instrumentos que acreditan la personalidad o la parte no ratifica la gestión, es nulo todo lo actuado por el gestor y éste debe satisfacer el importe de las costas, sin perjuicio de su responsabilidad por el daño que produjo.","En su presentación el gestor, además de indicar la parte en cuyo beneficio pretende actuar, debe expresar las razones que justifican la seriedad del pedido. La nulidad, en su caso, se produce por el solo vencimiento del plazo sin que se requiera intimación previa.","La facultad acordada por este artículo sólo puede ejercerse una vez en el curso del proceso."],"t":"Gestor","s":"Cuando deben realizarse actos procesales urgentes y existen hechos o circunstancias que impiden la actuación de la parte que ha de cumplirlos, puede ser admitida la comparecencia en juicio de quien no tiene representación conferida."},{"n":49,"p":["Presentado el poder y admitida su personería, el apoderado asume todas las responsabilidades que las leyes le imponen y sus actos obligan al poderdante como si él personalmente los practica."],"t":"Efectos de la presentación del poder y admisión de la personería","s":"Presentado el poder y admitida su personería, el apoderado asume todas las responsabilidades que las leyes le imponen y sus actos obligan al poderdante como si él personalmente los practica."},{"n":50,"p":["El apoderado está obligado a seguir el juicio mientras no cesa legalmente en el cargo. Hasta entonces las citaciones y notificaciones que se hacen, incluso las de las sentencias definitivas, tienen la misma fuerza que si se hacen al poderdante, sin que le sea permitido pedir que se entiendan con éste. Exceptúanse los actos que por disposición de la ley deben ser notificados personalmente a la parte."],"t":"Obligaciones del apoderado","s":"El apoderado está obligado a seguir el juicio mientras no cesa legalmente en el cargo."},{"n":51,"p":["El poder conferido para un pleito determinado, cualesquiera sean sus términos, comprende la facultad de interponer los recursos legales y seguir todas las instancias del pleito.","También comprende la facultad de intervenir en los incidentes y de ejercitar todos los actos que ocurren durante la secuela de la litis, excepto aquellos para los cuales la ley requiere facultad especial, o se reservan expresamente en el poder."],"t":"Alcance del poder","s":"El poder conferido para un pleito determinado, cualesquiera sean sus términos, comprende la facultad de interponer los recursos legales y seguir todas las instancias del pleito."},{"n":52,"p":["Sin perjuicio de la responsabilidad civil o criminal por el ejercicio del mandato, el mandatario debe abonar a su poderdante las costas causadas por su exclusiva culpa o negligencia, cuando éstas son declaradas judicialmente.","El Juez puede, de acuerdo con las circunstancias, establecer la responsabilidad solidaria del mandatario con el letrado patrocinante."],"t":"Responsabilidad por las costas","s":"Sin perjuicio de la responsabilidad civil o criminal por el ejercicio del mandato, el mandatario debe abonar a su poderdante las costas causadas por su exclusiva culpa o negligencia, cuando éstas son declaradas judicialmente."},{"n":53,"p":["La representación de los apoderados cesa:","1) por revocación expresa del mandato en el expediente. En este caso, el poderdante debe comparecer por sí o constituir nuevo apoderado sin necesidad de emplazamiento o citación, so pena de continuarse el juicio en rebeldía. La sola presentación del mandante no revoca el poder;","2) por renuncia, en cuyo caso el apoderado debe, bajo pena de daños y perjuicios, continuar las gestiones hasta que venza el plazo que el Juez fija al poderdante para reemplazarlo o comparecer por sí. La fijación del plazo se hace bajo apercibimiento de continuarse el juicio en rebeldía. La resolución que así lo dispone debe notificarse por cédula en el domicilio real del mandante;","3) por haber cesado la personalidad con que litigaba el poderdante;","4) por haber concluido la causa para la cual se le otorga el poder;","5) por muerte o incapacidad del poderdante. En tales casos el apoderado debe continuar ejerciendo su personería hasta que los herederos o representante legal tomen la intervención que les corresponde en el proceso, o venza el plazo fijado en este mismo inciso. Mientras tanto, comprobado el deceso o la incapacidad, el Juez debe señalar un plazo para que los interesados concurran a estar a derecho, citándolos directamente si se conocen sus domicilios, o por edictos durante dos (2) días consecutivos, si no son conocidos, bajo apercibimiento de continuar el juicio en rebeldía en el primer caso y de nombrarles defensor en el segundo. Cuando el deceso o la incapacidad llegan a conocimiento del mandatario, éste debe hacerlo presente al Juez o Tribunal dentro del plazo de diez (10) días, bajo pena de perder el derecho a cobrar los honorarios que se devengan con posterioridad. En la misma sanción incurre el mandatario que omite denunciar el nombre y domicilio de los herederos, o del representante legal, si los conoce;","6) por muerte o inhabilidad del apoderado. Producido el caso, se debe suspender la tramitación del juicio y el Juez debe fijar al mandante un plazo para que comparezca por sí o por nuevo apoderado, citándolo en la forma dispuesta en el inciso 5) del presente artículo. Vencido el plazo fijado sin que el mandante satisfaga el requerimiento, se debe continuar el juicio en rebeldía."],"t":"Cesación de la representación","s":"La representación de los apoderados cesa: 1) por revocación expresa del mandato en el expediente."},{"n":54,"p":["Cuando actúan en el proceso diversos litigantes con un interés común, el Juez de oficio o a petición de parte y después de contestada la demanda, los intima a que unifiquen la representación siempre que haya compatibilidad en ella, que el derecho o el fundamento de la demanda sea el mismo o iguales las defensas. A ese efecto, debe fijar una audiencia dentro de los diez (10) días y si los interesados no concurren o no se avienen en el nombramiento de representante único, el Juez lo debe designar eligiendo entre los que intervienen en el proceso.","Producida la unificación, el representante único tiene, respecto de sus mandantes, todas las facultades inherentes al mandato."],"t":"Unificación de la personería","s":"Cuando actúan en el proceso diversos litigantes con un interés común, el Juez de oficio o a petición de parte y después de contestada la demanda, los intima a que unifiquen la representación siempre que haya compatibilidad en ella, que el derecho o el fundamen"},{"n":55,"p":["Una vez efectuado el nombramiento común, puede revocarse por acuerdo unánime de las mismas partes o por el Juez a petición de alguna de ellas, siempre que en este último caso haya motivo que lo justifique. La revocación no produce efectos mientras no tome intervención el nuevo mandatario.","La unificación se deja sin efecto cuando desaparecen los presupuestos mencionados en el primer párrafo del Artículo 54."],"t":"Revocación","s":"Una vez efectuado el nombramiento común, puede revocarse por acuerdo unánime de las mismas partes o por el Juez a petición de alguna de ellas, siempre que en este último caso haya motivo que lo justifique."},{"n":56,"p":["Los jueces no deben proveer ningún escrito de demanda o excepciones y sus contestaciones, alegatos o expresiones de agravios, ni aquellos en que se promueven incidentes o se pide nulidad de actuaciones y, en general, los que sustentan o controvierten derechos, ya sea en procesos de jurisdicción voluntaria o contenciosa, si no llevan firma del letrado.","No debe admitirse tampoco la presentación de interrogatorios que no llevan firma de letrado, ni la promoción de cuestiones, de cualquier naturaleza, en las audiencias, ni su contestación, si la parte que las promueve o contesta no está acompañada de letrado patrocinante."],"t":"Patrocinio obligatorio","s":"Los jueces no deben proveer ningún escrito de demanda o excepciones y sus contestaciones, alegatos o expresiones de agravios, ni aquellos en que se promueven incidentes o se pide nulidad de actuaciones y, en general, los que sustentan o controvierten derechos,"},{"n":57,"p":["Se tiene por no presentado y se devuelve al firmante, sin más trámite ni recursos, todo escrito que debe llevar firma de letrado y no la tiene, si dentro del segundo día de notificada por ministerio de la ley la providencia que exige el cumplimiento de ese requisito no es suplida la omisión.","Ello tiene lugar al suscribir un abogado el mismo escrito ante el Secretario o el Oficial Primero, quien certifica en el expediente esta circunstancia, o por la ratificación que por separado se hace con firma de letrado."],"t":"Falta de firma del letrado","s":"Se tiene por no presentado y se devuelve al firmante, sin más trámite ni recursos, todo escrito que debe llevar firma de letrado y no la tiene, si dentro del segundo día de notificada por ministerio de la ley la providencia que exige el cumplimiento de ese req"},{"n":58,"p":["En el desempeño de su profesión, el abogado debe ser asimilado a los magistrados en cuanto al respeto y consideración que debe guardársele."],"t":"Dignidad","s":"En el desempeño de su profesión, el abogado debe ser asimilado a los magistrados en cuanto al respeto y consideración que debe guardársele."},{"n":59,"p":["Incomparecencia del demandado no declarado rebelde. La parte con domicilio conocido, debidamente citada, que no comparece durante el plazo de la citación o abandona el juicio después de haber comparecido, debe ser declarada en rebeldía a pedido de la otra.","Esta resolución se notifica por cédula o, en su caso, por edictos durante dos (2) días. Las sucesivas resoluciones se tienen por notificadas por ministerio de la ley.","Si no se requiere que el incompareciente sea declarado rebelde, se debe aplicar las reglas sobre notificaciones establecidas en el primer párrafo del Artículo 41."],"t":"Rebeldía","s":"Incomparecencia del demandado no declarado rebelde. La parte con domicilio conocido, debidamente citada, que no comparece durante el plazo de la citación o abandona el juicio después de haber comparecido, debe ser declarada en rebeldía a pedido de la otra."},{"n":60,"p":["La rebeldía no altera la secuela regular del proceso. El rebelde puede oponer la prescripción en los términos del Artículo 347.","La sentencia debe ser pronunciada según el mérito de la causa y lo establecido en el Artículo 358 inciso 1). En caso de duda, la rebeldía declarada y firme constituye presunción de verdad de los hechos lícitos afirmados por quien obtiene la declaración.","Son a cargo del rebelde las costas causadas por su rebeldía."],"t":"Efectos","s":"La rebeldía no altera la secuela regular del proceso. El rebelde puede oponer la prescripción en los términos del Artículo 347. La sentencia debe ser pronunciada según el mérito de la causa y lo establecido en el Artículo 358 inciso 1)."},{"n":61,"p":["A pedido de parte, el Juez debe abrir la causa a prueba, o disponer su producción según corresponda conforme al tipo de proceso; en su caso, puede mandar practicar las medidas tendientes al esclarecimiento de la verdad de los hechos autorizadas por este Código."],"t":"Prueba","s":"A pedido de parte, el Juez debe abrir la causa a prueba, o disponer su producción según corresponda conforme al tipo de proceso; en su caso, puede mandar practicar las medidas tendientes al esclarecimiento de la verdad de los hechos autorizadas por este Código"},{"n":62,"p":["La sentencia se hace saber al rebelde en la forma prescrita para la notificación de la providencia que declara la rebeldía."],"t":"Notificación de la sentencia","s":"La sentencia se hace saber al rebelde en la forma prescrita para la notificación de la providencia que declara la rebeldía."},{"n":63,"p":["Desde el momento en que un litigante es declarado en rebeldía pueden decretarse, si la otra parte lo pide, las medidas precautorias necesarias para asegurar el objeto del juicio, o el pago de la suma que se estima en concepto de eventuales costas si el rebelde es el actor."],"t":"Medidas precautorias","s":"Desde el momento en que un litigante es declarado en rebeldía pueden decretarse, si la otra parte lo pide, las medidas precautorias necesarias para asegurar el objeto del juicio, o el pago de la suma que se estima en concepto de eventuales costas si el rebelde"},{"n":64,"p":["Si el rebelde comparece en cualquier estado del juicio, debe ser admitido como parte y, al cesar el procedimiento en rebeldía, se entiende con él la sustanciación, sin que ésta pueda en ningún caso retrogradar."],"t":"Comparecencia del rebelde","s":"Si el rebelde comparece en cualquier estado del juicio, debe ser admitido como parte y, al cesar el procedimiento en rebeldía, se entiende con él la sustanciación, sin que ésta pueda en ningún caso retrogradar."},{"n":65,"p":["Las medidas precautorias decretadas de conformidad con el Artículo 63, continúan hasta la terminación del juicio, a menos que el interesado justifique haber incurrido en rebeldía por causas que no estuvieron a su alcance vencer.","Son aplicables las normas sobre ampliación, sustitución o reducción de las medidas precautorias.","Las peticiones sobre procedencia o alcance de las medidas precautorias tramitan por incidente, sin detener el curso del proceso principal."],"t":"Subsistencia de las medidas precautorias","s":"Las medidas precautorias decretadas de conformidad con el Artículo 63, continúan hasta la terminación del juicio, a menos que el interesado justifique haber incurrido en rebeldía por causas que no estuvieron a su alcance vencer."},{"n":66,"p":["Si el rebelde comparece después de la oportunidad en que debe ofrecer la prueba y apela la sentencia, a su pedido se recibe la causa a prueba en segunda instancia, en los términos del Artículo 262 inciso 4) subinciso a).","Si como consecuencia de la prueba producida en segunda instancia la otra parte resulta vencida, para la distribución de las costas se tiene en cuenta la situación creada por el rebelde."],"t":"Prueba en segunda instancia","s":"Si el rebelde comparece después de la oportunidad en que debe ofrecer la prueba y apela la sentencia, a su pedido se recibe la causa a prueba en segunda instancia, en los términos del Artículo 262 inciso 4) subinciso a)."},{"n":67,"p":["Ejecutoriada la sentencia pronunciada en rebeldía, no se admite recurso alguno contra ella."],"t":"Inimpugnabilidad de la sentencia","s":"Ejecutoriada la sentencia pronunciada en rebeldía, no se admite recurso alguno contra ella."},{"n":68,"p":["La parte vencida en el juicio debe pagar todos los gastos de la contraria, aún cuando ésta no lo solicita.","Sin embargo, el Juez puede eximir total o parcialmente de esta responsabilidad al litigante vencido, siempre que encuentre mérito para ello, expresándolo en su pronunciamiento, bajo pena de nulidad."],"t":"Principio general","s":"La parte vencida en el juicio debe pagar todos los gastos de la contraria, aún cuando ésta no lo solicita."},{"n":69,"p":["En los incidentes también rige lo establecido en el Artículo 68.","No se deben sustanciar nuevos incidentes promovidos por quien es condenado al pago de las costas en otro anterior, mientras no satisfaga su importe o, en su caso, lo dé a embargo.","No están sujetas a este requisito de admisibilidad las incidencias promovidas en el curso de las audiencias.","Toda apelación sobre imposición de costas y regulación de honorarios se concede en efecto diferido, salvo cuando el expediente debe ser remitido a la Cámara como consecuencia del recurso deducido por alguna de las partes contra la resolución que decide el incidente."],"t":"Incidentes","s":"En los incidentes también rige lo establecido en el Artículo 68. No se deben sustanciar nuevos incidentes promovidos por quien es condenado al pago de las costas en otro anterior, mientras no satisfaga su importe o, en su caso, lo dé a embargo."},{"n":70,"p":["No se imponen costas al vencido:","1) cuando reconoce oportunamente como fundadas las pretensiones de su adversario allanándose a satisfacerlas, a menos que haya incurrido en mora o que por su culpa se haya dado lugar a la reclamación;","2) cuando se allana dentro del quinto día de tener conocimiento de los títulos e instrumentos tardíamente presentados.","Para que proceda la exención de costas, el allanamiento debe ser real, incondicionado, oportuno, total y efectivo.","Si de los antecedentes del proceso resulta que el demandado no dio motivo a la promoción del juicio y se allana dentro del plazo para contestar la demanda, cumpliendo su obligación, las costas se imponen al actor."],"t":"Allanamiento","s":"No se imponen costas al vencido: 1) cuando reconoce oportunamente como fundadas las pretensiones de su adversario allanándose a satisfacerlas, a menos que haya incurrido en mora o que por su culpa se haya dado lugar a la reclamación;"},{"n":71,"p":["Si el resultado del pleito o incidente es parcialmente favorable a ambos litigantes, las costas se compensan o se distribuyen prudencialmente por el Juez en proporción al éxito obtenido por cada uno de ellos."],"t":"Vencimiento parcial y mutuo","s":"Si el resultado del pleito o incidente es parcialmente favorable a ambos litigantes, las costas se compensan o se distribuyen prudencialmente por el Juez en proporción al éxito obtenido por cada uno de ellos."},{"n":72,"p":["El litigante que incurre en pluspetición inexcusable debe ser condenado en costas, si la otra parte admitió el monto hasta el límite establecido en la sentencia.","Si no existió dicha admisión o si ambas partes incurren en pluspetición, rige lo dispuesto en el Artículo 71.","No debe entenderse que hay pluspetición, a los efectos determinados en este artículo, cuando el valor de la condena depende legalmente del arbitrio judicial, de juicio pericial o de rendición de cuentas o cuando las pretensiones de la parte no son reducidas por la condena en más de un veinte por ciento (20%)."],"t":"Pluspetición inexcusable","s":"El litigante que incurre en pluspetición inexcusable debe ser condenado en costas, si la otra parte admitió el monto hasta el límite establecido en la sentencia."},{"n":73,"p":["Desistimiento. Caducidad de instancia. Si el juicio termina por transacción o conciliación, las costas son impuestas en el orden causado respecto de quienes celebren el avenimiento; en cuanto a las partes que no lo suscriben, se aplican las reglas generales.","Si el proceso se extingue por desistimiento, las costas son a cargo de quien desiste, salvo cuando se debe exclusivamente a cambios de legislación o jurisprudencia y se lleva a cabo sin demora injustificada.","Exceptúase, en todos los casos, lo que puedan acordar las partes en contrario.","Declarada la caducidad de la primera instancia, las costas del juicio deben ser impuestas al actor."],"t":"Transacción. Conciliación","s":"Desistimiento. Caducidad de instancia. Si el juicio termina por transacción o conciliación, las costas son impuestas en el orden causado respecto de quienes celebren el avenimiento; en cuanto a las partes que no lo suscriben, se aplican las reglas generales."},{"n":74,"p":["Si el procedimiento se anula por causa imputable a una de las partes, son a su cargo las costas producidas desde el acto o la omisión que da origen a la nulidad."],"t":"Nulidad","s":"Si el procedimiento se anula por causa imputable a una de las partes, son a su cargo las costas producidas desde el acto o la omisión que da origen a la nulidad."},{"n":75,"p":["En los casos de litisconsorcio, las costas se deben distribuir entre los litisconsortes, salvo que por la naturaleza de la obligación corresponda la condena solidaria.","Cuando el interés que cada uno de ellos representa en el juicio ofrece considerables diferencias, el Juez puede distribuir las costas en proporción a ese interés."],"t":"Litisconsorcio","s":"En los casos de litisconsorcio, las costas se deben distribuir entre los litisconsortes, salvo que por la naturaleza de la obligación corresponda la condena solidaria."},{"n":76,"p":["Si el actor se allana a la prescripción opuesta, las costas se deben distribuir en el orden causado."],"t":"Prescripción","s":"Si el actor se allana a la prescripción opuesta, las costas se deben distribuir en el orden causado."},{"n":77,"p":["La condena en costas comprende todos los gastos causados u ocasionados por la sustanciación del proceso y los que se realizaron para evitar el pleito, mediante el cumplimiento de la obligación.","Los correspondientes a pedidos desestimados son a cargo de la parte que los efectuó u originó, aunque la sentencia le sea favorable en lo principal.","No son objeto de reintegro los gastos superfluos o inútiles.","Si los gastos son excesivos, el Juez puede reducirlos prudencialmente."],"t":"Alcance de la condena en costas","s":"La condena en costas comprende todos los gastos causados u ocasionados por la sustanciación del proceso y los que se realizaron para evitar el pleito, mediante el cumplimiento de la obligación."},{"n":78,"p":["Los que carecen de recursos pueden solicitar antes de presentar la demanda o en cualquier estado del proceso, la concesión del beneficio de litigar sin gastos, con arreglo a las disposiciones contenidas en este capítulo.","No obsta a la concesión del beneficio la circunstancia de tener el peticionario lo indispensable para procurarse su subsistencia, cualquiera sea el origen de sus recursos."],"t":"Procedencia","s":"Los que carecen de recursos pueden solicitar antes de presentar la demanda o en cualquier estado del proceso, la concesión del beneficio de litigar sin gastos, con arreglo a las disposiciones contenidas en este capítulo."},{"n":79,"p":["La solicitud debe contener:","1) la mención de los hechos en que se funda; de la necesidad de reclamar o defender judicialmente derechos propios o del cónyuge o de hijos menores; así como la indicación del proceso que se ha de iniciar o en el que se debe intervenir;","2) el ofrecimiento de la prueba tendiente a demostrar la imposibilidad de obtener recursos."],"t":"Requisitos de la solicitud","s":"La solicitud debe contener:"},{"n":80,"p":["El Juez debe ordenar sin más trámite las diligencias necesarias para que la prueba ofrecida se produzca a la mayor brevedad y citar al litigante contrario o que haya de serlo, y al organismo de determinación y recaudación de la tasa de justicia, quienes pueden fiscalizarla y ofrecer otras pruebas. La producción de la prueba testimonial ofrecida solo es ordenada por el Juez cuando de la producción de las demás medidas probatorias no resultan elementos de convicción suficientes como para la concesión del beneficio."],"t":"Prueba","s":"El Juez debe ordenar sin más trámite las diligencias necesarias para que la prueba ofrecida se produzca a la mayor brevedad y citar al litigante contrario o que haya de serlo, y al organismo de determinación y recaudación de la tasa de justicia, quienes pueden"},{"n":81,"p":["Producida la prueba se debe dar traslado por cinco (5) días comunes al peticionario, a la otra parte, y al organismo de determinación y recaudación de la tasa de justicia. Contestado dicho traslado o vencido el plazo para hacerlo, el Juez debe resolver acordando el beneficio total o parcialmente, o denegándolo. En el primer caso la resolución es apelable al solo efecto devolutivo.","Si se comprueba la falsedad de los hechos alegados como fundamento de la petición del beneficio de litigar sin gastos, se debe imponer al peticionario una multa que se fija en el doble del importe de la tasa de justicia que corresponde abonar, no pudiendo ser esta suma inferior al valor de un salario mínimo, vital y móvil. El importe de la multa se destina al Fondo de Justicia."],"t":"Traslado y resolución","s":"Producida la prueba se debe dar traslado por cinco (5) días comunes al peticionario, a la otra parte, y al organismo de determinación y recaudación de la tasa de justicia."},{"n":82,"p":["La resolución que deniega o acuerda el beneficio no causa estado.","Si fuere denegatoria, el interesado puede ofrecer otras pruebas y solicitar una nueva resolución.","La que lo concede, puede ser dejada sin efecto a requerimiento de parte interesada, cuando se demuestra que la persona a cuyo favor se dictó no tiene ya derecho al beneficio.","La impugnación se debe sustanciar por el trámite de los incidentes."],"t":"Carácter de la resolución","s":"La resolución que deniega o acuerda el beneficio no causa estado. Si fuere denegatoria, el interesado puede ofrecer otras pruebas y solicitar una nueva resolución."},{"n":83,"p":["Hasta que se dicte resolución, la solicitud y presentaciones de ambas partes están exentas del pago de impuestos y sellado de actuación. Estos son satisfechos, así como las costas, en caso de denegación.","El trámite para obtener el beneficio no suspende el procedimiento, salvo que se solicite en el escrito de demanda."],"t":"Beneficio provisional. Efectos del pedido","s":"Hasta que se dicte resolución, la solicitud y presentaciones de ambas partes están exentas del pago de impuestos y sellado de actuación. Estos son satisfechos, así como las costas, en caso de denegación."},{"n":84,"p":["El que obtiene el beneficio está exento, total o parcialmente, del pago de las costas o gastos judiciales hasta que mejore de fortuna; si vence en el pleito, debe pagar las causadas en su defensa hasta la concurrencia máxima de la tercera parte de los valores que recibe.","Los profesionales pueden exigir el pago de sus honorarios a la parte condenada en costas, y a su cliente, en el caso y con la limitación señalada en este artículo."],"t":"Alcance","s":"El que obtiene el beneficio está exento, total o parcialmente, del pago de las costas o gastos judiciales hasta que mejore de fortuna; si vence en el pleito, debe pagar las causadas en su defensa hasta la concurrencia máxima de la tercera parte de los valores "},{"n":85,"p":["La representación y defensa del beneficiario debe ser asumida por el defensor oficial, salvo si aquél desea hacerse patrocinar o representar por abogado o procurador de la matrícula; en este último caso, cualquiera sea el monto del asunto, el mandato que confiere puede hacerse por acta labrada ante el Oficial Primero."],"t":"Defensa del beneficiario","s":"La representación y defensa del beneficiario debe ser asumida por el defensor oficial, salvo si aquél desea hacerse patrocinar o representar por abogado o procurador de la matrícula; en este último caso, cualquiera sea el monto del asunto, el mandato que confi"},{"n":86,"p":["A pedido del interesado, el beneficio puede hacerse extensivo para litigar contra otra persona en el mismo juicio, si corresponde, con citación de ésta."],"t":"Extensión a otra parte","s":"A pedido del interesado, el beneficio puede hacerse extensivo para litigar contra otra persona en el mismo juicio, si corresponde, con citación de ésta."},{"n":87,"p":["Antes de la notificación de la demanda el actor puede acumular todas las acciones que tenga contra una misma parte, siempre que:","1) no sean contrarias entre sí, de modo que por la elección de una quede excluida la otra;","2) correspondan a la competencia del mismo Juez;","3) puedan sustanciarse por los mismos trámites."],"t":"Acumulación objetiva de acciones","s":"Antes de la notificación de la demanda el actor puede acumular todas las acciones que tenga contra una misma parte, siempre que: 1) no sean contrarias entre sí, de modo que por la elección de una quede excluida la otra;"},{"n":88,"p":["Pueden varias partes demandar o ser demandadas en un mismo proceso cuando las acciones son conexas por el título, o por el objeto, o por ambos elementos a la vez."],"t":"Litisconsorcio facultativo","s":"Pueden varias partes demandar o ser demandadas en un mismo proceso cuando las acciones son conexas por el título, o por el objeto, o por ambos elementos a la vez."},{"n":89,"p":["Cuando la sentencia no puede pronunciarse útilmente más que con relación a varias partes, éstas han de demandar o ser demandadas en un mismo proceso.","Si así no sucede, el Juez, de oficio o a solicitud de cualquiera de las partes debe ordenar, antes de dictar la providencia de apertura a prueba, la integración de la litis dentro de un plazo que señala, quedando en suspenso el desarrollo del proceso mientras se cita al litigante o litigantes omitidos."],"t":"Litisconsorcio necesario","s":"Cuando la sentencia no puede pronunciarse útilmente más que con relación a varias partes, éstas han de demandar o ser demandadas en un mismo proceso."},{"n":90,"p":["Puede intervenir en un juicio pendiente en calidad de parte, cualquiera sea la etapa o la instancia en que éste se encuentre, quien:","1) acredita sumariamente que la sentencia puede afectar su interés propio;","2) según las normas del derecho sustancial, está legitimado para demandar o ser demandado en el juicio."],"t":"Intervención voluntaria","s":"Puede intervenir en un juicio pendiente en calidad de parte, cualquiera sea la etapa o la instancia en que éste se encuentre, quien: 1) acredita sumariamente que la sentencia puede afectar su interés propio;"},{"n":91,"p":["En el caso del Artículo 90, inciso 1), la actuación del interviniente es accesoria y subordinada a la de la parte a quien apoya, no pudiendo alegar ni probar lo que esté prohibido a ésta.","En el caso del inciso 2) del Artículo 90, el interviniente actúa como litisconsorte de la parte principal y tiene sus mismas facultades procesales."],"t":"Calidad procesal de los intervinientes","s":"En el caso del Artículo 90, inciso 1), la actuación del interviniente es accesoria y subordinada a la de la parte a quien apoya, no pudiendo alegar ni probar lo que esté prohibido a ésta."},{"n":92,"p":["El pedido de intervención se formula por escrito, con los requisitos de la demanda, en lo pertinente. Con aquél se deben presentar los documentos y ofrecer las demás pruebas de los hechos en que se funda la solicitud. Se debe conferir traslado a las partes y, si hay oposición, se la debe sustanciar en una sola audiencia. La resolución se debe dictar dentro de los diez (10) días."],"t":"Procedimiento previo","s":"El pedido de intervención se formula por escrito, con los requisitos de la demanda, en lo pertinente. Con aquél se deben presentar los documentos y ofrecer las demás pruebas de los hechos en que se funda la solicitud."},{"n":93,"p":["En ningún caso la intervención del tercero retrograda el juicio ni suspende su curso."],"t":"Efectos","s":"En ningún caso la intervención del tercero retrograda el juicio ni suspende su curso."},{"n":94,"p":["El actor en el escrito de demanda, y el demandado dentro del plazo para contestar la demanda, pueden solicitar la citación de aquél a cuyo respecto consideran que la controversia es común. La citación se debe hacer en la forma dispuesta por los Artículos 340 y siguientes."],"t":"Intervención obligada","s":"El actor en el escrito de demanda, y el demandado dentro del plazo para contestar la demanda, pueden solicitar la citación de aquél a cuyo respecto consideran que la controversia es común."},{"n":95,"p":["La citación de un tercero suspende el procedimiento hasta su comparecencia o hasta el vencimiento del plazo que se le señala para comparecer."],"t":"Efecto de la citación","s":"La citación de un tercero suspende el procedimiento hasta su comparecencia o hasta el vencimiento del plazo que se le señala para comparecer."},{"n":96,"p":["Es inapelable la resolución que admite la intervención de terceros. La que la deniega es apelable en efecto devolutivo.","En todos los supuestos, la sentencia dictada después de la intervención del tercero, o de su citación, en su caso, lo afecta como a los litigantes principales."],"t":"Recursos. Alcance de la sentencia","s":"Es inapelable la resolución que admite la intervención de terceros. La que la deniega es apelable en efecto devolutivo."},{"n":97,"p":["Las tercerías deben fundarse en el dominio de los bienes embargados o en el derecho que el tercero tiene a ser pagado con preferencia al embargante.","La de dominio debe deducirse antes de que se otorgue la posesión de los bienes; la de mejor derecho, antes de que se pague al acreedor.","Si el tercerista deduce la demanda después de diez (10) días desde que tuvo o debió tener conocimiento del embargo o desde que se rechazó el levantamiento sin tercería, debe abonar las costas que origina su presentación extemporánea, aunque corresponda imponer las del proceso a la otra parte por declararse procedente la tercería."],"t":"Fundamento y oportunidad","s":"Las tercerías deben fundarse en el dominio de los bienes embargados o en el derecho que el tercero tiene a ser pagado con preferencia al embargante."},{"n":98,"p":["Reiteración. No se debe dar curso a la tercería si quien la deduce no prueba, con instrumentos fehacientes o en forma sumaria, la verosimilitud del derecho en que se funda. No obstante, aún no cumplido dicho requisito, la tercería es admisible si quien la promueve da fianza para responder de los perjuicios que puede producir la suspensión del proceso principal.","Desestimada la tercería, no es admisible su reiteración si se funda en título que poseyó y conoció el tercerista al tiempo de entablar la primera. No se aplica esta regla si la tercería no fue admitida sólo por falta de ofrecimiento o constitución de la fianza."],"t":"Admisibilidad. Requisitos","s":"Reiteración. No se debe dar curso a la tercería si quien la deduce no prueba, con instrumentos fehacientes o en forma sumaria, la verosimilitud del derecho en que se funda."},{"n":99,"p":["Si la tercería es de dominio, consentida o ejecutoriada la orden de venta de los bienes, se suspende el procedimiento principal, a menos que se trate de bienes sujetos a desvalorización o desaparición o que irroguen excesivos gastos de conservación, en cuyo caso, el producto de la venta queda afectado a las resultas de la tercería.","El tercerista puede, en cualquier momento, o
